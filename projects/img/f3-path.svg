<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" role="img" aria-label="DAC, 소자, 전류 측정, 기준 전압, ADC, ESP32 사이의 전압·전류 경로">
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- 디지털 영역 -->
  <rect x="10" y="10" width="200" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="22" y="32" fill="#6b7280">디지털 (숫자)</text>
  <rect x="40" y="120" width="140" height="70" rx="8" fill="#eef2fb" stroke="#2b59c3"/>
  <text x="110" y="150" text-anchor="middle" fill="#1f2937" font-weight="600">ESP32</text>
  <text x="110" y="170" text-anchor="middle" fill="#6b7280" font-size="12">I²C: SDA 21, SCL 22</text>
  <!-- 아날로그 -->
  <text x="230" y="32" fill="#6b7280">아날로그 (전압·전류)</text>
  <rect x="240" y="60" width="110" height="50" rx="8" fill="#fff" stroke="#1f2937"/>
  <text x="295" y="82" text-anchor="middle" fill="#1f2937" font-weight="600">DAC</text>
  <text x="295" y="100" text-anchor="middle" fill="#6b7280" font-size="12">MCP4725 0–3.3 V</text>
  <rect x="240" y="220" width="110" height="50" rx="8" fill="#fff" stroke="#1f2937"/>
  <text x="295" y="242" text-anchor="middle" fill="#1f2937" font-weight="600">ADC</text>
  <text x="295" y="260" text-anchor="middle" fill="#6b7280" font-size="12">ADS1115 A0–A3</text>
  <line x1="180" y1="140" x2="240" y2="85" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="180" y1="170" x2="240" y2="245" stroke="#6b7280" stroke-width="1.5"/>
  <text x="196" y="105" fill="#6b7280" font-size="12">I²C</text>
  <!-- 소자 경로 -->
  <line x1="350" y1="85" x2="420" y2="85" stroke="#2b59c3" stroke-width="2.5"/>
  <rect x="420" y="70" width="40" height="30" fill="#fde68a" stroke="#a16207"/>
  <text x="440" y="90" text-anchor="middle" font-size="11" fill="#1f2937">R_lim</text>
  <line x1="460" y1="85" x2="490" y2="85" stroke="#2b59c3" stroke-width="2.5"/>
  <text x="474" y="70" font-size="11" fill="#b45309">J1</text>
  <rect x="490" y="62" width="90" height="46" rx="6" fill="#eef2fb" stroke="#2b59c3" stroke-width="2"/>
  <text x="535" y="82" text-anchor="middle" fill="#1f2937" font-weight="600">소자</text>
  <text x="535" y="98" text-anchor="middle" fill="#6b7280" font-size="11">① 위 · ② 아래</text>
  <line x1="580" y1="85" x2="640" y2="85" stroke="#2b59c3" stroke-width="2.5"/>
  <rect x="610" y="120" width="130" height="56" rx="8" fill="#fff" stroke="#1f2937"/>
  <text x="675" y="143" text-anchor="middle" fill="#1f2937" font-weight="600">전류 측정</text>
  <text x="675" y="162" text-anchor="middle" fill="#6b7280" font-size="12">션트 또는 TIA</text>
  <line x1="640" y1="85" x2="675" y2="85" stroke="#2b59c3" stroke-width="2.5"/><line x1="675" y1="85" x2="675" y2="120" stroke="#2b59c3" stroke-width="2.5"/>
  <rect x="610" y="220" width="130" height="50" rx="8" fill="#fff" stroke="#1f2937"/>
  <text x="675" y="242" text-anchor="middle" fill="#1f2937" font-weight="600">기준 전압 V_ref</text>
  <text x="675" y="260" text-anchor="middle" fill="#6b7280" font-size="12">≈1.65 V op-amp 버퍼</text>
  <line x1="675" y1="176" x2="675" y2="220" stroke="#2b59c3" stroke-width="2.5"/>
  <!-- 전류 방향 -->
  <polygon points="395,80 405,85 395,90" fill="#2b59c3"/>
  <text x="372" y="122" fill="#2b59c3" font-size="12">전류 I (+V일 때)</text>
  <!-- ADC 측정점 -->
  <g stroke="#7c3aed" stroke-dasharray="3 3" fill="none">
    <path d="M485,85 L485,140 L380,140 L380,232 L350,232"/>
    <path d="M600,195 L380,195 L380,250 L350,250"/>
  </g>
  <text x="388" y="214" fill="#7c3aed" font-size="12">A0·A1: 소자 전압, A2·A3: 전류 신호</text>
  <text x="20" y="300" fill="#1f2937" font-size="12.5">소자 전압 ≈ V_DAC − V_ref → DAC 0 V일 때 −1.65 V, 3.3 V일 때 +1.65 V (이상적인 끝값, 실제 사용 범위는 더 좁음)</text>
  <text x="240" y="322" fill="#6b7280" font-size="12">개념도. 실제 핀 연결은 그림 ④. J1 = 소자를 나중에 연결하는 점퍼, R_lim = 최대 전류를 묶는 저항</text>
</svg>
