<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" role="img" aria-label="쓰기-쉬기-읽기 전압 파형과 읽기 전류의 가능한 모양">
  <rect width="760" height="400" fill="#ffffff"/>
  <!-- 위: 전압 -->
  <text x="20" y="24" fill="#1f2937" font-weight="600">걸어 주는 전압 V(t)</text>
  <line x1="70" y1="120" x2="730" y2="120" stroke="#9ca3af"/>
  <line x1="70" y1="40" x2="70" y2="160" stroke="#9ca3af"/>
  <text x="30" y="124" fill="#6b7280">0 V</text>
  <polyline fill="none" stroke="#2b59c3" stroke-width="2.5" points="70,120 110,120 110,55 230,55 230,120 470,120 470,105 640,105 640,120 730,120"/>
  <text x="128" y="48" fill="#2b59c3">쓰기 +V_w, t_w</text>
  <text x="300" y="112" fill="#6b7280">쉬기 0 V, Δt</text>
  <text x="482" y="98" fill="#2b59c3">읽기 V_r (작게)</text>
  <text x="680" y="140" fill="#6b7280">시간 t [s]</text>
  <!-- 아래: 전류 -->
  <text x="20" y="190" fill="#1f2937" font-weight="600">읽기 구간의 전류 I(t) — 생길 수 있는 세 가지 모양 (가상의 예)</text>
  <line x1="470" y1="350" x2="730" y2="350" stroke="#9ca3af"/>
  <line x1="470" y1="205" x2="470" y2="350" stroke="#9ca3af"/>
  <text x="430" y="300" fill="#6b7280" font-size="12">I</text>
  <text x="640" y="368" fill="#6b7280" font-size="12">읽기 구간 시간 →</text>
  <line x1="470" y1="300" x2="730" y2="300" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="650" y="296" fill="#9ca3af" font-size="12">처음 상태의 읽기 전류</text>
  <path d="M470,250 C500,252 520,253 730,254" fill="none" stroke="#2b59c3" stroke-width="2.5"/>
  <path d="M470,215 C478,280 490,296 510,299 L730,300" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <path d="M470,270 C540,262 620,248 730,232" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g font-size="12.5">
    <rect x="20" y="215" width="12" height="4" fill="#2b59c3"/><text x="40" y="221" fill="#1f2937">ⓐ 차이가 읽기 내내 유지됨</text>
    <text x="40" y="238" fill="#6b7280">→ 쓰기가 남긴 상태 변화 후보. 기작은 아직 모름</text>
    <rect x="20" y="258" width="12" height="4" fill="#b45309"/><text x="40" y="264" fill="#1f2937">ⓑ 처음에만 튀고 곧 같아짐</text>
    <text x="40" y="281" fill="#6b7280">→ 충·방전(용량성) 과도 응답 후보. 이것도 계산에 쓸 수 있음</text>
    <rect x="20" y="301" width="12" height="4" fill="#7c3aed"/><text x="40" y="307" fill="#1f2937">ⓒ 계속 한쪽으로 흘러감</text>
    <text x="40" y="324" fill="#6b7280">→ 반응·열화·습도 변화·읽기 자체의 영향 후보</text>
  </g>
  <text x="20" y="384" fill="#6b7280" font-size="12">개념 예시 · 실측 아님. 한 번의 모양으로 원인을 정하지 않는다 — Δt·V_r·극성을 바꾸고, 저항·RC·단층 소자와 비교해 후보를 줄인다.</text>
</svg>
