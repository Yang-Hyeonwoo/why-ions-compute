<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f2521"/></marker></defs>
<rect x="0" y="0" width="720" height="250" fill="#fff"/>
<text x="360" y="28" font-size="14" fill="#2f2521" text-anchor="middle" font-weight="bold">ADC = 전압을 자로 재서 눈금 번호(숫자)로 적는 부품</text>
<rect x="70" y="86" width="550" height="26" rx="4" fill="#e6f0e4" stroke="#4f7f5d" stroke-width="1.2"/>
<text x="60" y="104" font-size="13" fill="#2f2521" text-anchor="end" font-weight="bold">전압</text>
<line x1="70.0" y1="112" x2="70.0" y2="118" stroke="#2f2521" stroke-width="1"/>
<line x1="222.77777777777777" y1="112" x2="222.77777777777777" y2="118" stroke="#2f2521" stroke-width="1"/>
<line x1="375.55555555555554" y1="112" x2="375.55555555555554" y2="118" stroke="#2f2521" stroke-width="1"/>
<line x1="528.3333333333333" y1="112" x2="528.3333333333333" y2="118" stroke="#2f2521" stroke-width="1"/>
<rect x="70" y="122" width="550" height="26" rx="4" fill="#e5e9f4" stroke="#2c3f7a" stroke-width="1.2"/>
<text x="60" y="140" font-size="13" fill="#2f2521" text-anchor="end" font-weight="bold">숫자</text>
<line x1="70.0" y1="86" x2="70.0" y2="148" stroke="#2f2521" stroke-width="1.1"/>
<text x="70.0" y="78" font-size="13" fill="#2f2521" text-anchor="middle" font-weight="bold">0 V</text>
<text x="70.0" y="166" font-size="13" fill="#2f2521" text-anchor="middle" font-weight="bold">0</text>
<line x1="322.0833333333333" y1="86" x2="322.0833333333333" y2="148" stroke="#2f2521" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="322.0833333333333" y="78" font-size="13" fill="#2f2521" text-anchor="middle" font-weight="bold">1.65 V</text>
<text x="322.0833333333333" y="166" font-size="13" fill="#2f2521" text-anchor="middle" font-weight="bold">1877</text>
<line x1="574.1666666666666" y1="86" x2="574.1666666666666" y2="148" stroke="#c0521c" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="574.1666666666666" y="78" font-size="13" fill="#c0521c" text-anchor="middle" font-weight="bold">3.3 V</text>
<text x="574.1666666666666" y="166" font-size="13" fill="#c0521c" text-anchor="middle" font-weight="bold">3754</text>
<line x1="620.0" y1="86" x2="620.0" y2="148" stroke="#2f2521" stroke-width="1.1"/>
<text x="628.0" y="104" font-size="13" fill="#2f2521" text-anchor="start" font-weight="bold">3.6 V</text>
<text x="628.0" y="140" font-size="13" fill="#2f2521" text-anchor="start" font-weight="bold">4095</text>
<text x="574.1666666666666" y="184" font-size="12" fill="#c0521c" text-anchor="middle" font-weight="normal">보드 전원 끝</text>
<text x="70" y="214" font-size="12.5" fill="#2f2521" text-anchor="start" font-weight="normal">12 bit = 눈금 4,096칸.  기본 설정의 자 길이는 0–3.6 V라서 한 칸(LSB) = 3.6 V ÷ 4,096 ≈ 0.88 mV.</text>
<text x="70" y="234" font-size="12.5" fill="#2f2521" text-anchor="start" font-weight="normal">보드 핀에는 3.3 V까지만 들어오므로, 실제로 보는 숫자는 0–약 3,754 사이입니다.</text>
</svg>