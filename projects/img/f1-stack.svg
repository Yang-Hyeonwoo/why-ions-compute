<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" role="img" aria-label="소자 단면과 전하 정의 개념도">
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- 층 -->
  <rect x="60" y="30" width="400" height="22" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="70" y="46" fill="#374151">유리 (위)</text>
  <rect x="60" y="52" width="440" height="8" fill="#93c5fd" stroke="#2b59c3"/>
  <text x="508" y="60" fill="#2b59c3">ITO ① → 소스미터 HI</text>
  <rect x="100" y="60" width="320" height="70" fill="#eef2fb" stroke="#2b59c3"/>
  <text x="110" y="78" fill="#1f2937" font-weight="600">EMIMSPA 층 (사용자 표기)</text>
  <text x="110" y="96" fill="#374151">고정(추정): 사슬의 SO₃⁻ (음전하)</text>
  <text x="110" y="114" fill="#374151">이동(추정): EMIM⁺ (양이온)</text>
  <g fill="#2b59c3"><circle cx="350" cy="88" r="4"/><circle cx="380" cy="104" r="4"/><circle cx="330" cy="116" r="4"/></g>
  <g fill="#b45309"><rect x="362" y="80" width="7" height="7"/><rect x="398" y="92" width="7" height="7"/></g>
  <line x1="100" y1="130" x2="420" y2="130" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="134" fill="#1f2937">접합면</text>
  <rect x="100" y="130" width="320" height="70" fill="#fdf2e9" stroke="#b45309"/>
  <text x="110" y="149" fill="#1f2937" font-weight="600">METMAT·X 층 (사용자 표기 "METMATFSI")</text>
  <text x="110" y="167" fill="#374151">고정(추정): 사슬의 암모늄 N⁺ (양전하)</text>
  <text x="110" y="185" fill="#374151">이동(추정): X⁻ — FSI⁻인지 TFSI⁻인지 미확인</text>
  <rect x="60" y="200" width="440" height="8" fill="#93c5fd" stroke="#2b59c3"/>
  <text x="508" y="208" fill="#2b59c3">ITO ② → 소스미터 LO</text>
  <rect x="100" y="208" width="400" height="22" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="110" y="224" fill="#374151">유리 (아래)</text>
  <!-- 스페이서 -->
  <rect x="80" y="60" width="20" height="140" fill="#fde68a" stroke="#a16207"/>
  <rect x="420" y="60" width="20" height="140" fill="#fde68a" stroke="#a16207"/>
  <text x="60" y="250" fill="#a16207">노란색: 구멍 뚫린 절연 테이프 → 고분자가 닿는 면적을 고정</text>
  <!-- 확인 필요 표시 -->
  <rect x="512" y="230" width="236" height="62" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="522" y="250" fill="#c2410c" font-weight="700">확인 필요 · 가설</text>
  <text x="522" y="268" fill="#7c2d12" font-size="12">고정 전하·이동 이온·X⁻ 종류는 이름에서</text>
  <text x="522" y="284" fill="#7c2d12" font-size="12">추정한 것. 합성 자료로 확인 전까지 가설</text>
  <!-- 범례 -->
  <g transform="translate(520,90)">
    <text x="0" y="0" fill="#1f2937" font-weight="600">기호</text>
    <circle cx="6" cy="18" r="4" fill="#2b59c3"/><text x="16" y="22" fill="#374151">이동 양이온</text>
    <rect x="2" y="32" width="7" height="7" fill="#b45309"/><text x="16" y="40" fill="#374151">이동 음이온</text>
  </g>
  <text x="60" y="278" fill="#1f2937">극성 약속: <tspan font-weight="600">HI → ITO ①, +V = ①이 높은 전위</tspan></text><text x="60" y="296" fill="#1f2937" font-size="12.5">모든 설정 파일의 device.polarity에 같이 기록</text>
  <text x="60" y="318" fill="#6b7280" font-size="12">개념도 · 축척 아님 · 이온의 위치는 설명용. 이 구조가 정류·기억을 보이는지는 아직 측정되지 않았다.</text>
</svg>
