<circle cx="506" cy="130" r="10" fill="#c0521c" stroke="none"/>
<text x="506" y="134.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="524" y="134" font-size="12" fill="#2f2521" text-anchor="start" font-weight="bold">op-amp 회로가 전류를 전압으로 바꾸고</text>
<text x="524" y="151" font-size="10.5" fill="#6f5f55" text-anchor="start" font-weight="normal">ADC가 숫자로 읽는다 (소스미터의 '전류 재기')</text>
<circle cx="506" cy="182" r="10" fill="#c0521c" stroke="none"/>
<text x="506" y="186.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="524" y="186" font-size="12" fill="#2f2521" text-anchor="start" font-weight="bold">보드가 저장된 가중치로 판단한다</text>
<text x="524" y="203" font-size="10.5" fill="#6f5f55" text-anchor="start" font-weight="normal">PC 없이 보드 혼자</text>
<circle cx="506" cy="234" r="10" fill="#c0521c" stroke="none"/>
<text x="506" y="238.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="524" y="238" font-size="12" fill="#2f2521" text-anchor="start" font-weight="bold">화면·소리·휴대폰으로 알린다</text>
<text x="524" y="255" font-size="10.5" fill="#6f5f55" text-anchor="start" font-weight="normal">OLED, 부저, 블루투스</text>
<text x="360" y="292" font-size="11.5" fill="#6f5f55" text-anchor="middle" font-weight="normal">P3.1–P3.3은 저항·간단한 모듈로 보드 다루기를 익히고, 소자는 P3.5부터 연결합니다. (개념도)</text>
