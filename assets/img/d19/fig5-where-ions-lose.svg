<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >이온이 이기기 어려운 축과, 그 판정이 바뀌는 조건</text>
<text x='20.0' y='52.0' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >축</text>
<text x='132.0' y='52.0' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >숫자로 본 차이</text>
<text x='380.0' y='52.0' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >판정이 바뀌는 조건</text>
<rect x='14.0' y='62.0' width='612.0' height='46.0' rx='4' fill='#fff' stroke='none' stroke-width='1.2' />
<text x='20.0' y='82.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >속도</text>
<text x='132.0' y='82.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >쓰기 10⁻⁹ s(ECRAM) vs 10⁻³ s부터(이온)</text>
<text x='380.0' y='82.0' font-size='10.3' fill='#13936b' text-anchor='start' font-weight='normal' >과제의 시간척도가 ms–s이면 결점이 아니다</text>
<text x='132.0' y='99.0' font-size='9.3' fill='#999' text-anchor='start' font-weight='normal' >Aluru 2026 Table 1, p.598; Liang 2024, p.198</text>
<rect x='14.0' y='114.0' width='612.0' height='46.0' rx='4' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20.0' y='134.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >정밀도·상태 수</text>
<text x='132.0' y='134.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >2¹¹ vs 2⁶–2⁸ 상태, 잡음이 상태 충실도를 제한</text>
<text x='380.0' y='134.0' font-size='10.3' fill='#13936b' text-anchor='start' font-weight='normal' >readout이 잡음을 견디는 과제·평균화</text>
<text x='132.0' y='151.0' font-size='9.3' fill='#999' text-anchor='start' font-weight='normal' >Aluru 2026, p.595, 598</text>
<rect x='14.0' y='166.0' width='612.0' height='46.0' rx='4' fill='#fff' stroke='none' stroke-width='1.2' />
<text x='20.0' y='186.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >집적 밀도</text>
<text x='132.0' y='186.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >칩당 수십억(예: M1 160억) vs 겔 10×10(4 cm 각)</text>
<text x='380.0' y='186.0' font-size='10.3' fill='#13936b' text-anchor='start' font-weight='normal' >셀 수보다 셀당 상태·시간상수가 중요한 과제</text>
<text x='132.0' y='203.0' font-size='9.3' fill='#999' text-anchor='start' font-weight='normal' >Guo 2026, p.7; Roadmap 2026, p.8124</text>
<rect x='14.0' y='218.0' width='612.0' height='46.0' rx='4' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20.0' y='238.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >내구·안정성</text>
<text x='132.0' y='238.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >10⁹–10¹² vs 10² 회, 탈수·누출</text>
<text x='380.0' y='238.0' font-size='10.3' fill='#13936b' text-anchor='start' font-weight='normal' >봉지·비휘발 이온액체·짧은 사용 기간</text>
<text x='132.0' y='255.0' font-size='9.3' fill='#999' text-anchor='start' font-weight='normal' >Aluru 2026, p.598; Guo 2026, p.7</text>
<rect x='14.0' y='270.0' width='612.0' height='46.0' rx='4' fill='#fff' stroke='none' stroke-width='1.2' />
<text x='20.0' y='290.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >이온–전자 변환</text>
<text x='132.0' y='290.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >ns vs µs–s 불일치: 지연·손실·왜곡</text>
<text x='380.0' y='290.0' font-size='10.3' fill='#13936b' text-anchor='start' font-weight='normal' >센서 쪽에서 처리를 끝내 변환 횟수를 줄일 때</text>
<text x='132.0' y='307.0' font-size='9.3' fill='#999' text-anchor='start' font-weight='normal' >Roadmap 2026, p.8126</text>
<text x='320.0' y='344.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >조건 열이 비는 축이 '절대' 지는 축이다. 다섯 축 모두 조건이 있지만, 그 조건이 내 응용에서 성립하는지는 따로 확인한다. [해석]</text>
</svg>
