<line x1='350.0' y1='160.0' x2='350.0' y2='206.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='150.0' y='210.0' width='400.0' height='50.0' rx='8' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='350.0' y='231.0' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >④ 전자 소자(MCU·디지털 필터 등)가 그 칸을</text>
<text x='350.0' y='249.0' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >더 싸게 채우지 못하는 이유는?</text>
<line x1='250.0' y1='262.0' x2='175.0' y2='290.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<line x1='450.0' y1='262.0' x2='525.0' y2='290.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='30.0' y='292.0' width='290.0' height='48.0' rx='8' fill='#eef6f2' stroke='#13936b' stroke-width='1.4' />
<text x='175.0' y='312.0' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >이유를 숫자로 적을 수 있다</text>
<text x='175.0' y='330.0' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >→ 그 응용에서의 조건부 답</text>
<rect x='380.0' y='292.0' width='290.0' height='48.0' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.4' />
<text x='525.0' y='312.0' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >빈칸으로 남는다</text>
<text x='525.0' y='330.0' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >→ 답 없음. 빈칸이 병목 장부의 한 줄(Day 49–52)</text>
<text x='350.0' y='355.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >본문 5구간의 문장 틀을 그림으로 옮긴 것. 칸의 숫자는 내 응용·내 소재로 채운다. (Claude가 그림, 모식도)</text>
