<text x='545.0' y='66.0' font-size='12.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >② 이온 메커니즘 Y가 허용하는 사양</text>
<text x='438.0' y='94.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >시간척도:</text>
