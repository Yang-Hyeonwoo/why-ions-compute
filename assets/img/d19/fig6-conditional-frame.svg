<text x='350.0' y='108.0' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >③ 겹치는 칸</text>
<text x='350.0' y='128.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >①과 ②가 둘 다</text>
<text x='350.0' y='144.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >만족되는 조건</text>
