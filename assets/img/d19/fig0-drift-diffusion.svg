<text x='20.0' y='362.0' font-size='10.5' fill='#999' text-anchor='start' font-weight='bold' >움직이게 하는 것</text>
<text x='170.0' y='362.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >농도 차 + 열운동(무작위)</text>
<text x='430.0' y='362.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >전기장이 전하에 주는 힘</text>
<text x='20.0' y='383.0' font-size='10.5' fill='#999' text-anchor='start' font-weight='bold' >방향</text>
<text x='170.0' y='383.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >많은 곳 → 적은 곳(전하 부호와 무관)</text>
<text x='430.0' y='383.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >양이온은 E 방향, 음이온·전자는 반대</text>
<text x='20.0' y='404.0' font-size='10.5' fill='#999' text-anchor='start' font-weight='bold' >거리와 시간</text>
<text x='170.0' y='404.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >거리 ∝ √t (100배 기다려도 10배)</text>
<text x='430.0' y='404.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >거리 ∝ t (일정 속도 v = µE)</text>
<text x='20.0' y='425.0' font-size='10.5' fill='#999' text-anchor='start' font-weight='bold' >재는 숫자</text>
<text x='170.0' y='425.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >확산계수 D [m²/s]</text>
<text x='430.0' y='425.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >이동도 µ [m²/(V·s)]</text>
<text x='350.0' y='458.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >둘은 같은 마찰 f를 겪으므로 D = µ·kT/q로 이어진다. 경로 모양은 보기용, 숫자는 코드 계산. (Claude가 계산해 그림, 모식도)</text>
</svg>
