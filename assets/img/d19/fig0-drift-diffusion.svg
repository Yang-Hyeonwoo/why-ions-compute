<text x='446.0' y='254.0' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >마찰 f·v</text>
<text x='520.0' y='276.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >qE = f·v  →  v = (q/f)·E = µE</text>
<text x='520.0' y='294.0' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >1 cm에 1 V(E = 100 V/m): 물속 K⁺ 7.7 µm/s, 결정 Si 전자 14 m/s</text>
<text x='520.0' y='309.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(전자는 음전하라 Cl⁻처럼 (+)극 쪽으로 간다)</text>
<line x1='20.0' y1='328.0' x2='680.0' y2='328.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='170.0' y='342.0' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >확산</text>
