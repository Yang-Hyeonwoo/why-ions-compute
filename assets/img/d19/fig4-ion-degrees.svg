<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 300' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >전자 하나에는 없고 이온에는 있는 자유도 (이해를 위한 분류, 서로 겹친다)</text>
<rect x='20.0' y='46.0' width='290.0' height='88.0' rx='8' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='32.0' y='70.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >① 종(種)이 여럿이다</text>
<text x='32.0' y='94.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >같은 겔에서 K⁺·Ca²⁺·Fe³⁺의 문턱이 5·40·60 mV로 갈린다</text>
<text x='32.0' y='116.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >Chen 2023, p.561 (Fig. 2E,F)</text>
<rect x='330.0' y='46.0' width='290.0' height='88.0' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='342.0' y='70.0' font-size='13' fill='#3d6fb4' text-anchor='start' font-weight='bold' >② 질량·수화 껍질이 있다</text>
<text x='342.0' y='94.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >탈수화 장벽 → 선택성 / 용매 흐름과 결합 → 압전이온</text>
<text x='342.0' y='116.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >Chen 2023, p.560; Dobashi 2022, p.502</text>
<rect x='20.0' y='150.0' width='290.0' height='88.0' rx='8' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='32.0' y='174.0' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >③ 화학 상태를 바꾼다</text>
<text x='32.0' y='198.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >도핑·침전·착물화: 끈 뒤에도 남는 상태 (35 aJ 보고)</text>
<text x='32.0' y='220.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >Aluru 2026, p.597; Han 2023, p.3</text>
<rect x='330.0' y='150.0' width='290.0' height='88.0' rx='8' fill='#fff' stroke='#7a5fb0' stroke-width='1.2' />
<text x='342.0' y='174.0' font-size='13' fill='#7a5fb0' text-anchor='start' font-weight='bold' >④ 연성·수계 매질과 같다</text>
<text x='342.0' y='198.0' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >탄성률 10⁵–10⁹ Pa (신경 조직은 1–100 kPa)</text>
<text x='342.0' y='220.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >Zhu 2025, p.9</text>
<text x='320.0' y='266.0' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >각 자유도는 '상태변수가 하나 더 있다'는 뜻이지 '계산이 더 잘 된다'는 뜻은 아직 아니다.</text>
<text x='320.0' y='286.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >그 상태가 읽히고, 과제에 필요한 차이를 보존하며, 단순 기준선보다 나은지는 따로 재야 한다. [해석]</text>
</svg>
