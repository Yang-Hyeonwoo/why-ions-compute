<text x='620.0' y='298.0' font-size='10.5' fill='#13936b' text-anchor='end' font-weight='normal' >물속 이온: 1 mm 13 s, 1 µm 13 µs</text>
<text x='620.0' y='313.0' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' >Si 전자: 1 µm 7 ps</text>
<text x='620.0' y='343.0' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >같은 전압이면 t는 L²에 비례: L이 10배 줄면 100배 빨라진다</text>
