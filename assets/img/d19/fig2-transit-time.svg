<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 352' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >1 V를 걸었을 때 운반자가 길이 L을 건너는 시간 t = L²/(µV)</text>
<text x='320.0' y='40.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >(드리프트만, 균일 전기장 E = V/L 가정. 두 축 모두 로그 눈금: 세로 한 칸 1000배, 가로 한 칸 10배)</text>
