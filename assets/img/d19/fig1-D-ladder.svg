<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >확산계수 D의 사다리 (로그 눈금: 한 칸이 100배, 300 K)</text>
