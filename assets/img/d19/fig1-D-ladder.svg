<text x='199.3' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹²</text>
<line x1='274.0' y1='59.0' x2='274.0' y2='69.0' stroke='#444' stroke-width='1'/>
<text x='274.0' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹⁰</text>
<line x1='348.7' y1='59.0' x2='348.7' y2='69.0' stroke='#444' stroke-width='1'/>
<text x='348.7' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁸</text>
<line x1='423.3' y1='59.0' x2='423.3' y2='69.0' stroke='#444' stroke-width='1'/>
<text x='423.3' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁶</text>
<line x1='498.0' y1='59.0' x2='498.0' y2='69.0' stroke='#444' stroke-width='1'/>
<text x='498.0' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁴</text>
<line x1='572.7' y1='59.0' x2='572.7' y2='69.0' stroke='#444' stroke-width='1'/>
<text x='572.7' y='83.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >10⁻²</text>
<text x='610.0' y='98.0' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >D (m²/s)</text>
<circle cx='556.2' cy='112.0' r='6' fill='#3d6fb4' stroke='none'/>
<line x1='556.2' y1='70.0' x2='556.2' y2='104.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='2 3'/>
<text x='544.2' y='110.0' font-size='11.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' >전자 in 결정 Si</text>
<text x='544.2' y='125.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >µ = 1400 cm²/(V·s) → D = µkT/q ≈ 3.6×10⁻³ [Ioffe, 300 K]</text>
<rect x='274.0' y='152.0' width='74.7' height='12.0' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<line x1='274.0' y1='70.0' x2='274.0' y2='150.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='2 3'/>
<text x='360.7' y='156.0' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >이온 in 물·하이드로겔</text>
<text x='360.7' y='171.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >10⁻¹⁰–10⁻⁸ [Wang 2025 (Chem. Soc. Rev.), p.315]</text>
<circle cx='322.6' cy='204.0' r='6' fill='#13936b' stroke='none'/>
<line x1='322.6' y1='70.0' x2='322.6' y2='196.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='2 3'/>
<text x='334.6' y='202.0' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >K⁺·Cl⁻ in 묽은 수용액</text>
<text x='334.6' y='217.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >2×10⁻⁹ [Zhang 2024 (ACS Nano), p.15029의 가정값]</text>
<rect x='103.3' y='244.0' width='112.0' height='12.0' rx='3' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<line x1='103.3' y1='70.0' x2='103.3' y2='242.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='2 3'/>
<text x='227.3' y='248.0' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >이온 in 무용매 폴리전해질·이온성 탄성체 (전도도에서 환산)</text>
<text x='227.3' y='263.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >σ = 10⁻⁵–10⁻² S/m [Zhu 2025, p.10] → D ≈ 2.7×10⁻¹⁵–2.7×10⁻¹²</text>
<text x='227.3' y='277.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(1 mol/L의 1가 이온 한 종이 모두 움직인다고 가정한 환산) [해석]</text>
<text x='320.0' y='300.0' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >결정 Si의 전자와 묽은 수용액 이온의 D 비 ≈ 1.8×10⁶ (코드 계산).</text>
<text x='320.0' y='318.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >용매 없는 고분자 속으로 가면 이온은 3–6자릿수 더 느려질 수 있다. 환산값은 운반자 농도 가정에 달려 있다.</text>
</svg>
