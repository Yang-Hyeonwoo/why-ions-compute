<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 262' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >'이온은 느리다'는 '이온 device의 전기 신호가 느리다'와 다른 말이다 (ionic cable, 모식도)</text>
<rect x='60.0' y='60.0' width='300.0' height='16.0' rx='3' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<rect x='60.0' y='86.0' width='300.0' height='10.0' rx='2' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<rect x='60.0' y='106.0' width='300.0' height='16.0' rx='3' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='370.0' y='72.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >이온 전도체 (LiCl 하이드로겔)</text>
<text x='370.0' y='95.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >유전체 (탄성체 필름)</text>
<text x='370.0' y='118.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >이온 전도체</text>
<line x1='70.0' y1='52.0' x2='340.0' y2='52.0' stroke='#c8553d' stroke-width='2' marker-end='url(#arr)'/>
<text x='200.0' y='46.0' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >전압 파형은 '저항 + 축전기'가 이어진 선을 따라 퍼진다</text>
<circle cx='120.0' cy='114.0' r='5' fill='#13936b' stroke='none'/>
<line x1='126.0' y1='114.0' x2='146.0' y2='114.0' stroke='#13936b' stroke-width='1.5' marker-end='url(#arr)'/>
<text x='120.0' y='140.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >초록 점(이온 하나): 유전체 표면의 얇은 층을 충전할 만큼만 조금 움직인다</text>
<text x='60.0' y='166.0' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >같은 10 cm를 '건너는' 시간 (t = L²/D로 어림):</text>
<text x='80.0' y='182.0' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>신호: D</tspan><tspan dy='3.3' font-size='8.8'>신호</tspan><tspan dy='-3.3' font-size='1'>​</tspan><tspan> ≈ 10⁷ m²/s → t ≈ 10⁻⁹ s   [Wang 2025 (Chem. Soc. Rev.), p.315]</tspan></text>
<text x='80.0' y='202.0' font-size='11' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>이온: D</tspan><tspan dy='3.3' font-size='8.8'>이온</tspan><tspan dy='-3.3' font-size='1'>​</tspan><tspan> ≈ 2×10⁻⁹ m²/s → t ≈ 5.0×10⁶ s (≈ 58일)</tspan></text>
<text x='80.0' y='222.0' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >원 논문: 100 MHz 신호를 10 cm 전송, 신호 확산계수는 이온보다 약 16자릿수 크다 [Yang 2015, p.59]</text>
<text x='320.0' y='250.0' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >이온 device에서 느린 것은 주로 '상태(농도 분포·도핑)를 바꾸는 과정'이다. [해석]</text>
</svg>
