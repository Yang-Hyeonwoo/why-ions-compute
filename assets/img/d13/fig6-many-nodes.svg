<text x='300.0' y='306.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >모든 노드: x ← a·x + (1−a)·u, 각 노드에 독립 잡음 표준편차 0.01(예시 가정). 상한은 노드 수 4다.</text>
<text x='300.0' y='323.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >노드가 많아도 기억의 시간척도가 서로 다르지 않으면 MC는 거의 늘지 않는다.</text>
