<text x='430.0' y='271.0' font-size='9' fill='#999' text-anchor='start' font-weight='normal' >k = 2 열은 k = 1 열을 한 줄 내린 것(1줄의 위는 버린 0줄)</text>
<text x='20.0' y='330.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' ><tspan>④ k마다 따로 직선 readout ŷ = w</tspan><tspan dy='4' font-size='9'>0</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> + w</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>·x를 최소제곱으로 맞추고  ⑤ 목표와 ŷ의 상관²으로 채점한다</tspan></text>
<text x='40.0' y='352.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >k = 1:  ŷ = 1.64·x + 0.01</text>
<text x='260.0' y='352.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>→ 상관² = MC</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.75</tspan></text>
<rect x='420.0' y='343.0' width='112.6' height='10.0' rx='1' fill='#33cc99' stroke='none' stroke-width='1.2' />
<text x='580.0' y='352.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(이론값 0.75)</text>
<text x='40.0' y='371.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >k = 2:  ŷ = 0.83·x + 0.01</text>
<text x='260.0' y='371.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>→ 상관² = MC</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.19</tspan></text>
<rect x='420.0' y='362.0' width='29.0' height='10.0' rx='1' fill='#33cc99' stroke='none' stroke-width='1.2' />
<text x='580.0' y='371.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(이론값 0.19)</text>
<text x='40.0' y='390.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >k = 3:  ŷ = 0.17·x − 0.25</text>
<text x='260.0' y='390.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>→ 상관² = MC</tspan><tspan dy='4' font-size='9'>3</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.01</tspan></text>
<rect x='420.0' y='381.0' width='1.3' height='10.0' rx='1' fill='#33cc99' stroke='none' stroke-width='1.2' />
<text x='580.0' y='390.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(이론값 0.05)</text>
<text x='20.0' y='418.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' ><tspan>⑥ MC = MC</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> + MC</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> + MC</tspan><tspan dy='4' font-size='9'>3</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> + …  (노드 하나라 상한은 1. 아주 작은 값은 잡음으로 보고 끊는다)</tspan></text>
<text x='20.0' y='436.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >실제 측정은 수천 단계를 쓰고, 앞부분으로 맞춘 readout을 학습에 쓰지 않은 뒷부분(새 데이터)에서 채점한다.</text>
<text x='350.0' y='456.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >8줄뿐이라 여기서는 같은 줄에서 맞추고 채점했다. k = 1은 '방금 들어온 입력'. 입력은 계산을 쉽게 ±1로 했다. (Claude가 계산해 그림)</text>
</svg>
