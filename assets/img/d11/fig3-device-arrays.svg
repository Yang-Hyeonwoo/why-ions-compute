<rect x='515' y='60' width='135' height='200' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='523' y='78' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >소자 i의 규칙</text>
<text x='523' y='96' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >x ← (1 − a)·x</text>
<text x='523' y='110' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >  + a·tanh(g·u + c)</text>
<text x='523' y='132' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >같은 소자: a = 0.3,</text>
<text x='523' y='145' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >g = 1, c = 0 모두 같음</text>
<text x='523' y='164' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >시간상수: a를 0.05–1</text>
<text x='523' y='177' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >사이 난수로</text>
<text x='523' y='196' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >+ 감도 g 0.3–2,</text>
<text x='523' y='209' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >치우침 c −0.5–0.5</text>
<text x='523' y='230' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >연결 reservoir: ρ = 0.9,</text>
<text x='523' y='243' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >입력 0.3 (그림 2)</text>
<text x='330' y='318' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >Claude의 시뮬레이션(tools/esn.py --ipc). 소자끼리 연결 없음, 같은 입력을 동시에 받음, 상태 읽기 잡음 0.001.</text>
<text x='330' y='334' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >소자 규칙은 설명용 가상 모형이며 특정 이온 소자를 흉내 낸 것이 아니다.</text>
