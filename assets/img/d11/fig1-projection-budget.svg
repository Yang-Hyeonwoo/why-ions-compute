<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='10' markerHeight='10' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c3d6fb4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='10' markerHeight='10' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='arr-ce08a3c' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='10' markerHeight='10' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='arr-c13936b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='10' markerHeight='10' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker></defs>
<text x='330' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >서로 수직인 목표 세 개를 2차원 평면(노드 2개가 만들 수 있는 출력)에 비추면: 그림자² 합 = 2</text>
<polygon points='170.0,210.0 308.0,210.0 257.0,133.5 119.0,133.5' fill='#e8f0fa' stroke='#3d6fb4' stroke-width='1' opacity='0.8'/>
<text x='200' y='292' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >파란 평면 = 노드 2개로 만들 수 있는 출력</text>
<text x='132.0' y='159.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >목표 2·3의 그림자</text>
<text x='132.0' y='171.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >(같은 점)</text>
<line x1='170.0' y1='210.0' x2='290.0' y2='210.0' stroke='#3d6fb4' stroke-width='2.2' marker-end='url(#arr-c3d6fb4)'/>
<text x='286.0' y='228.0' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >목표 1 = u(t−1)</text>
<line x1='170.0' y1='210.0' x2='110.0' y2='234.0' stroke='#e08a3c' stroke-width='2.2' marker-end='url(#arr-ce08a3c)'/>
<line x1='110.0' y1='234.0' x2='140.0' y2='165.0' stroke='#999' stroke-width='1' stroke-dasharray='3,2'/>
<circle cx='140.0' cy='165.0' r='3.5' fill='#e08a3c' stroke='#e08a3c' stroke-width='1.4'/>
<text x='114.0' y='252.0' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >목표 2 = u(t−2)</text>
<line x1='170.0' y1='210.0' x2='170.0' y2='96.0' stroke='#13936b' stroke-width='2.2' marker-end='url(#arr-c13936b)'/>
<line x1='170.0' y1='96.0' x2='140.0' y2='165.0' stroke='#999' stroke-width='1' stroke-dasharray='3,2'/>
<circle cx='140.0' cy='165.0' r='3.5' fill='#13936b' stroke='#13936b' stroke-width='1.4'/>
<text x='176.0' y='92.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >목표 3 = u(t−1)·u(t−2)</text>
<rect x='385' y='50' width='265' height='230' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='397' y='72' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >그림자 길이의 제곱 = 그 목표의 용량</text>
<text x='397' y='96' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='normal' >목표 1 (1, 0, 0): 그림자² = 1.00</text>
<text x='397' y='116' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='normal' >목표 2 (0, 1, 0): 그림자² = 0.50</text>
<text x='397' y='136' font-size='11' fill='#13936b' text-anchor='start' font-weight='normal' >목표 3 (0, 0, 1): 그림자² = 0.50</text>
<text x='397' y='160' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >합 = 2.00 = 평면의 차원(노드 수)</text>
<text x='397' y='188' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >평면을 어떻게 기울여도 합은 2다.</text>
<text x='397' y='206' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >예: 바닥 평면이면 1 + 1 + 0 = 2.</text>
<text x='397' y='230' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >목표 1을 완벽히(1.0) 되살리면,</text>
<text x='397' y='248' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >나머지 둘은 합쳐서 1만 남는다.</text>
<text x='330' y='316' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 축 셋은 서로 겹치지 않는(수직인) 목표 함수, 파란 평면은 노드 2개의 상태를 섞어 만들 수 있는 모든 readout 출력. 숫자는 코드가 계산했다.</text>
</svg>
