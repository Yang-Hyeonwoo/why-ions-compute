<text x='500' y='420' font-size='11' fill='#c8553d' text-anchor='end' font-weight='bold' >합</text>
<text x='565' y='420' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >1.00</text>
<text x='648' y='420' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >1.00</text>
<text x='14' y='420' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >노드 A = 1.00·① + 0.50·② + 0.00·③</text>
<text x='14' y='438' font-size='10' fill='#7a5bb5' text-anchor='start' font-weight='normal' >노드 B = 0.62 + 0.24·① + 0.24·② − 0.14·③</text>
<text x='350' y='462' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >용량 = 그 조각이 노드의 흔들림(분산)에서 차지하는 몫 = 계수² ÷ 분산. 예: 노드 A의 ① = 1.00² ÷ 1.25 = 0.80.</text>
<text x='350' y='479' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >네 이력은 같은 비율로 나온다고 둔 교육용 예(입력은 ±1 동전 던지기). 숫자는 코드가 계산했다. (Claude가 계산해 그림)</text>
</svg>
