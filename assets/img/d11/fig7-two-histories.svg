<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 488' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<text x='350' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >입력 ±1 두 개의 이력 네 가지: 노드 상태를 목표 조각(기저 함수)으로 나누면 용량이 보인다</text>
<text x='355' y='46' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >이력 (u(t−1), u(t−2))</text>
<text x='250' y='64' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >① (+1, +1)</text>
<text x='320' y='64' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >② (+1, −1)</text>
<text x='390' y='64' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >③ (−1, +1)</text>
<text x='460' y='64' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >④ (−1, −1)</text>
