<text x='14' y='196' font-size='11' fill='#7a5bb5' text-anchor='start' font-weight='bold' >노드 B (tanh, Day 17–18)</text>
<text x='14' y='211' font-size='9.5' fill='#7a5bb5' text-anchor='start' font-weight='normal' >tanh(0.5·(u(t−1) + u(t−2)) + 1)</text>
