<text x='190' y='202' font-size='10.5' fill='#444' text-anchor='end' font-weight='normal' >심전도(ECG)의 시간상수</text>
<circle cx='502.72727272727275' cy='198' r='6' fill='#e08a3c'/>
<text x='496.72727272727275' y='186' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >Liang p.196: 1 s</text>
<text x='300' y='282' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >이온 이동(µs–s)은 생체·센서 신호(ms–s)와 겹치고, 전자 device(ns)는 초음파 쪽과 겹친다.</text>
<text x='300' y='298' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >겹치지 않으면 시간 동역학은 자원이 아니라 지연이다. 막대는 리뷰가 적은 범위이고 특정 device의 측정값이 아니다.</text>
<text x='300' y='313' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >'>1 ms'는 Liang 2024가 센서 안·곁에서 쓰는 노드에 든 기준이며 상한은 과제에 따라 다르다(그림은 10 s까지).</text>
</svg>
