<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 334' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >네 가지 '축'은 서로 독립이다: 한 시스템은 축마다 따로 자리를 가진다</text>
<text x='60' y='70' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >표현</text>
<rect x='110' y='50' width='190' height='40' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='205' y='67' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >디지털</text>
<text x='205' y='83' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >값을 0/1의 묶음으로</text>
<line x1='300' y1='70' x2='340' y2='70' stroke='#999' stroke-width='1.2'/>
<rect x='340' y='50' width='240' height='40' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='460' y='67' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >아날로그</text>
<text x='460' y='83' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >값을 연속량(전압·전하)으로</text>
<text x='60' y='126' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >동작 방식</text>
<rect x='110' y='106' width='190' height='40' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.4' />
<text x='205' y='123' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >동기</text>
<text x='205' y='139' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >공통 박자(클록)에 맞춰</text>
<line x1='300' y1='126' x2='340' y2='126' stroke='#999' stroke-width='1.2'/>
<rect x='340' y='106' width='240' height='40' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.4' />
<text x='460' y='123' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >비동기</text>
<text x='460' y='139' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >준비되면 각자 움직임</text>
<text x='60' y='182' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >동시 처리</text>
<rect x='110' y='162' width='190' height='40' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.4' />
<text x='205' y='179' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >직렬</text>
<text x='205' y='195' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >한 번에 하나씩</text>
<line x1='300' y1='182' x2='340' y2='182' stroke='#999' stroke-width='1.2'/>
<rect x='340' y='162' width='240' height='40' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.4' />
<text x='460' y='179' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >병렬</text>
<text x='460' y='195' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >여러 개가 동시에</text>
<text x='60' y='238' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >입력 처리</text>
<rect x='110' y='218' width='190' height='40' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.4' />
<text x='205' y='235' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >항시</text>
<text x='205' y='251' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >입력이 없어도 매 박자 계산</text>
<line x1='300' y1='238' x2='340' y2='238' stroke='#999' stroke-width='1.2'/>
<rect x='340' y='218' width='240' height='40' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.4' />
<text x='460' y='235' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >사건 구동</text>
<text x='460' y='251' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >사건(문턱 넘음)이 올 때만</text>
<text x='300' y='288' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >예: 보통 컴퓨터의 CPU = 디지털·동기·병렬(코어 안에서)·항시.  Loihi 2 칩 = 디지털·비동기·병렬·사건 구동.</text>
<text x='300' y='304' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >뇌 = 아날로그에 가까움·비동기·병렬·사건 구동. '디지털이면 동기', '아날로그면 사건 구동' 같은 묶음은 없다.</text>
<text x='300' y='320' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(Loihi 2의 분류는 Intel 기술 요약 기준으로 Day 1–2에서 확인한 범위. 모식도)</text>
</svg>
