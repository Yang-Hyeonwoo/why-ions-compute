<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 254' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >'왜 하필 뇌인가'의 정산표: 원리 → 비용 → 조건 → 대가</text>
<text x='14' y='46' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >원리</text>
<text x='112' y='46' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >줄이는 비용</text>
<text x='262' y='46' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >성립 조건</text>
<text x='430' y='46' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >대신 생기는 비용·위험</text>
<line x1='14' y1='52' x2='586' y2='52' stroke='#d9d9d9' stroke-width='1'/>
<text x='14' y='74' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >co-location</text>
<text x='112' y='74' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >가중치 이동</text>
<text x='262' y='74' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >재사용 적은 실시간 계산</text>
<text x='430' y='74' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >ADC·보정, 중간 결과 이동</text>
<line x1='14' y1='84' x2='586' y2='84' stroke='#f0f0f0' stroke-width='1'/>
<text x='14' y='104' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >event-driven</text>
<text x='112' y='104' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >유닛 활동률·클록</text>
<text x='262' y='104' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >희소 입력, 작은 대기 전력</text>
<text x='430' y='104' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >감지·통신 비용, 학습의 미성숙</text>
<line x1='14' y1='114' x2='586' y2='114' stroke='#f0f0f0' stroke-width='1'/>
<text x='14' y='134' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >analog</text>
<text x='112' y='134' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >정밀도 비용</text>
<text x='262' y='134' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >근사를 견디는 과제</text>
<text x='430' y='134' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >잡음·편차, 재현성</text>
<line x1='14' y1='144' x2='586' y2='144' stroke='#f0f0f0' stroke-width='1'/>
<text x='14' y='164' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >시간 동역학</text>
<text x='112' y='164' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >과거 입력 저장</text>
<text x='262' y='164' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >τ ≈ 신호 시간척도</text>
<text x='430' y='164' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >τ가 안 맞으면 지연·망각</text>
<line x1='14' y1='174' x2='586' y2='174' stroke='#f0f0f0' stroke-width='1'/>
<text x='14' y='194' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >가소성</text>
<text x='112' y='194' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >재학습 왕복</text>
<text x='262' y='194' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >선형·대칭 update, endurance</text>
<text x='430' y='194' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >on-chip training 요구 높음</text>
<line x1='14' y1='204' x2='586' y2='204' stroke='#f0f0f0' stroke-width='1'/>
<text x='300' y='240' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >'뇌가 20 W'는 이 표의 어느 칸도 채우지 않는다. 각 칸의 근거는 본문의 쪽수 표기를 따른다.</text>
</svg>
