<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 256' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >두 종류의 인공 신경망: 값을 보내는가, '지금 사건이 있다'는 신호(스파이크)를 보내는가</text>
<text x='150' y='48' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >값을 보내는 신경망 (ANN)</text>
<circle cx='50' cy='80' r='12' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<line x1='62' y1='80' x2='190' y2='120' stroke='#3d6fb4' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='50' cy='120' r='12' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<line x1='62' y1='120' x2='190' y2='120' stroke='#3d6fb4' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='50' cy='160' r='12' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<line x1='62' y1='160' x2='190' y2='120' stroke='#3d6fb4' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='202' cy='120' r='14' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<text x='50' y='84' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >0.8</text>
<text x='50' y='124' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >0.1</text>
<text x='50' y='164' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >0.5</text>
<text x='120' y='70' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >매 단계 모든 선에 숫자가 간다</text>
<text x='202' y='160' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >가중합 → 출력값 0.62</text>
<text x='150' y='190' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >0.8×0.5 + 0.1×0.2 + 0.5×0.4 = 0.62</text>
<text x='150' y='206' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(가중치 0.5, 0.2, 0.4는 예시)</text>
<text x='450' y='48' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >스파이크를 보내는 신경망 (SNN)</text>
<circle cx='350' cy='80' r='12' fill='#fff' stroke='#13936b' stroke-width='1.5'/>
<line x1='362' y1='80' x2='490' y2='120' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='350' cy='120' r='12' fill='#fff' stroke='#13936b' stroke-width='1.5'/>
<line x1='362' y1='120' x2='490' y2='120' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='350' cy='160' r='12' fill='#fff' stroke='#13936b' stroke-width='1.5'/>
<line x1='362' y1='160' x2='490' y2='120' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<circle cx='502' cy='120' r='14' fill='#fff' stroke='#13936b' stroke-width='1.5'/>
<line x1='290' y1='100' x2='332' y2='100' stroke='#d9d9d9' stroke-width='1'/>
<line x1='292.0' y1='100' x2='292.0' y2='88' stroke='#13936b' stroke-width='2'/>
<line x1='306.4' y1='100' x2='306.4' y2='88' stroke='#13936b' stroke-width='2'/>
<line x1='328.0' y1='100' x2='328.0' y2='88' stroke='#13936b' stroke-width='2'/>
<line x1='290' y1='140' x2='332' y2='140' stroke='#d9d9d9' stroke-width='1'/>
<line x1='290' y1='180' x2='332' y2='180' stroke='#d9d9d9' stroke-width='1'/>
<line x1='313.6' y1='180' x2='313.6' y2='168' stroke='#13936b' stroke-width='2'/>
<text x='420' y='70' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >사건이 있는 선에만 펄스가 간다</text>
<text x='502' y='160' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >쌓고(적분) 새고(누설) 문턱 넘으면 펄스</text>
<text x='450' y='190' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >둘째 입력은 이번에 사건이 없어 아무것도 안 보냄</text>
<text x='450' y='206' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >→ 선이 '조용'하면 그 선의 계산·통신이 생략된다</text>
<text x='300' y='240' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >둘 다 '입력 × 가중치를 더한다'는 뼈대는 같다. 다른 것은 신호의 형태(값 vs 펄스)와 시간(단계 vs 실제 시각)이다. 모식도.</text>
</svg>
