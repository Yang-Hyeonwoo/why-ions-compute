<circle cx='366' cy='118' r='14' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='366' y='122.14' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >4</text>
<circle cx='410' cy='118' r='14' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='410' y='122.14' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >5</text>
<circle cx='454' cy='118' r='14' fill='#e08a3c' stroke='#e08a3c' stroke-width='1.3'/><text x='454' y='122.14' font-size='11.5' fill='#fff' text-anchor='middle' font-weight='bold' >6</text>
<circle cx='498' cy='118' r='14' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='498' y='122.14' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >7</text>
<text x='560' y='122' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >8개 중 2개 발화: 3번, 6번</text>
<text x='380' y='156' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >A와 B는 '몇 개'(둘 다 2개)가 아니라 '어느 유닛들'이 켜졌는지로 구별된다 → 희소 + 분산 + 부호화</text>
<text x='380' y='178' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>8개 중 2개를 고르는 조합 = 8×7÷2 = 28가지 · 하나만 켜기(one-hot) = 8가지 · 각자 켜고 끄기 = 2</tspan><tspan dy='-6' font-size='9'>8</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> = 256가지(평균 4개 발화)</tspan></text>
