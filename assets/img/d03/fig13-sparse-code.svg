<circle cx='350' cy='252' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='350' y='255.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >7</text>
<circle cx='196.0' cy='336' r='14' fill='#f1f5fb' stroke='#3d6fb4' stroke-width='1.5'/>
<text x='196.0' y='340' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >받음</text>
<text x='20' y='372' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >선이 있는 것은 3개(0, 3, 6번)뿐. 나머지 5개는 선도,</text>
<text x='20' y='388' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >그 선의 가중치를 담을 저장 칸도 없다 (면적·배선이 준다).</text>
<text x='392' y='218' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >활성 희소성: 연결은 다 있고, 지금 2개만 활동</text>
