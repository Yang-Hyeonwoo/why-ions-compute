<circle cx='410' cy='70' r='14' fill='#e08a3c' stroke='#e08a3c' stroke-width='1.3'/><text x='410' y='74.14' font-size='11.5' fill='#fff' text-anchor='middle' font-weight='bold' >5</text>
<circle cx='454' cy='70' r='14' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='454' y='74.14' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >6</text>
