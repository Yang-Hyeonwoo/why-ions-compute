<text x='392' y='372' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >선은 8개 모두 있지만 지금 신호가 지나가는 선은 2개</text>
<text x='392' y='388' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >(패턴 B). 사건 구동이 줄이는 것은 이쪽이다.</text>
