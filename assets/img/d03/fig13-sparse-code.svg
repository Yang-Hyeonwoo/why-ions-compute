<text x='560' y='74' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >8개 중 2개 발화: 1번, 5번</text>
<text x='20' y='116' font-size='12.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >패턴 B</text>
<text x='20' y='132' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >가스 B가 들어옴</text>
<circle cx='190' cy='118' r='14' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='190' y='122.14' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >0</text>
