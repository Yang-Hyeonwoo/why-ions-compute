<text x='380' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >같은 유닛 8개로 보는 희소 분산 부호화, 그리고 두 종류의 희소성 (예시)</text>
<text x='20' y='68' font-size='12.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >패턴 A</text>
<text x='20' y='84' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >가스 A가 들어옴</text>
