<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 438' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='aR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='aB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='aM' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='aO' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='aG' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='380' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >AER: 3번이 발화하면 '011'이라는 주소만 보낸다 (유닛 8개, 7.3 s의 장면, 예시)</text>
<rect x='14' y='44' width='230' height='300' rx='10' fill='#fafafa' stroke='#999' stroke-width='1.2' />
<text x='26' y='64' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >보내는 칩</text>
<circle cx='48' cy='90' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='93.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >0</text>
<text x='68' y='94' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >000</text>
<circle cx='48' cy='120' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='123.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='68' y='124' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >001</text>
<circle cx='48' cy='150' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='153.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >2</text>
<text x='68' y='154' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >010</text>
<circle cx='48' cy='180' r='11' fill='#e08a3c' stroke='#e08a3c' stroke-width='1.3'/><text x='48' y='183.78' font-size='10.5' fill='#fff' text-anchor='middle' font-weight='bold' >3</text>
<text x='68' y='184' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='bold' >011</text>
<circle cx='48' cy='210' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='213.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >4</text>
<text x='68' y='214' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >100</text>
<circle cx='48' cy='240' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='243.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >5</text>
<text x='68' y='244' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >101</text>
<circle cx='48' cy='270' r='11' fill='#e08a3c' stroke='#e08a3c' stroke-width='1.3'/><text x='48' y='273.78' font-size='10.5' fill='#fff' text-anchor='middle' font-weight='bold' >6</text>
<text x='68' y='274' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='bold' >110</text>
<circle cx='48' cy='300' r='11' fill='#fff' stroke='#999' stroke-width='1.3'/><text x='48' y='303.78' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >7</text>
<text x='68' y='304' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >111</text>
<text x='26' y='336' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >번호 옆 숫자 = 그 유닛의 주소(3 bit)</text>
<rect x='110' y='112' width='124' height='58' rx='6' fill='#fdf0e6' stroke='#e08a3c' stroke-width='1.2' />
<text x='172' y='132' font-size='10.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >② 중재(arbiter)</text>
<text x='172' y='148' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >동시 발화 → 순서</text>
<text x='172' y='162' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >3번 먼저, 6번 다음</text>
<rect x='110' y='196' width='124' height='58' rx='6' fill='#e8f0fb' stroke='#3d6fb4' stroke-width='1.2' />
<text x='172' y='216' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >③ 부호기(encoder)</text>
<text x='172' y='232' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >번호 → 주소</text>
<text x='172' y='246' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >3 → 011</text>
<line x1='60' y1='180' x2='108' y2='150' stroke='#e08a3c' stroke-width='1.4' marker-end='url(#aO)'/>
<line x1='60' y1='270' x2='108' y2='150' stroke='#e08a3c' stroke-width='1.4' marker-end='url(#aO)'/>
<text x='112' y='104' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >① 3·6번이 함께 발화</text>
<line x1='172' y1='170' x2='172' y2='194' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<line x1='244' y1='196' x2='520' y2='196' stroke='#444' stroke-width='1.6'/>
<line x1='244' y1='210' x2='520' y2='210' stroke='#444' stroke-width='1.6'/>
<line x1='244' y1='224' x2='520' y2='224' stroke='#444' stroke-width='1.6'/>
<line x1='244' y1='246' x2='520' y2='246' stroke='#999' stroke-width='1.2' stroke-dasharray='4 3'/>
<line x1='234' y1='225' x2='244' y2='210' stroke='#444' stroke-width='1.2'/>
<text x='382.0' y='180' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >공용 통로: 주소선 3가닥</text>
<text x='382.0' y='262' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >+ 요청·확인 신호선 (기초 2의 악수)</text>
<rect x='414' y='200' width='52' height='20' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.8' />
<text x='440' y='215' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >011</text>
<text x='440' y='292' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >먼저 도착 (3번)</text>
<line x1='440' y1='222' x2='440' y2='280' stroke='#e6c9ad' stroke-width='1' stroke-dasharray='2 2'/>
<rect x='294' y='200' width='52' height='20' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.8' />
<text x='320' y='215' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >110</text>
<text x='320' y='292' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >중재로 조금 늦게 (6번)</text>
<line x1='320' y1='222' x2='320' y2='280' stroke='#e6c9ad' stroke-width='1' stroke-dasharray='2 2'/>
<line x1='330' y1='150' x2='470' y2='150' stroke='#999' stroke-width='1.3' marker-end='url(#aG)'/>
<text x='400' y='142' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >주소 사건이 가는 방향</text>
<rect x='530' y='44' width='216' height='300' rx='10' fill='#fafafa' stroke='#999' stroke-width='1.2' />
<text x='542' y='64' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >받는 칩</text>
<rect x='542' y='186' width='192' height='48' rx='6' fill='#e8f0fb' stroke='#3d6fb4' stroke-width='1.2' />
<text x='638' y='206' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >④ 해독: 011 → 3번</text>
<text x='638' y='222' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >'3번이 지금 발화했다'</text>
<line x1='520' y1='210' x2='542' y2='210' stroke='#444' stroke-width='1.2'/>
<text x='542' y='90' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >자기 쪽에 저장된 연결표</text>
<rect x='542' y='94' width='192' height='20' rx='0' fill='#fff' stroke='#dcdcdc' stroke-width='1' />
<text x='550' y='108' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >3번 →</text>
<text x='600' y='108' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >받는 유닛 a</text>
<text x='726' y='108' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >+w₁</text>
<rect x='542' y='116' width='192' height='20' rx='0' fill='#fff' stroke='#dcdcdc' stroke-width='1' />
<text x='550' y='130' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >3번 →</text>
<text x='600' y='130' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >받는 유닛 b</text>
<text x='726' y='130' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >+w₂</text>
<rect x='542' y='138' width='192' height='20' rx='0' fill='#fff' stroke='#dcdcdc' stroke-width='1' />
<text x='550' y='152' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >6번 →</text>
<text x='600' y='152' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >받는 유닛 a</text>
<text x='726' y='152' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >+w₃</text>
<line x1='638' y1='186' x2='638' y2='172' stroke='#3d6fb4' stroke-width='1.2' marker-end='url(#aB)'/>
<text x='542' y='258' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >3번 줄을 찾아 받는 유닛의 상태에</text>
<text x='542' y='274' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >가중치만큼 더한다. 가중치는 여기에</text>
<text x='542' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >저장돼 있고 통로로 오지 않는다.</text>
<text x='20' y='368' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >전달되는 것: 발화한 유닛의 주소(3 bit)와 악수 신호.</text>
<text x='20' y='386' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >전달되지 않는 것: 펄스의 모양·높이, 유닛 안의 상태값, 가중치, 발화하지 않은 유닛(주소가 오지 않는 것 자체가 '조용함').</text>
<text x='20' y='404' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >시각: 고전적 AER는 즉시 보내므로 도착 시각이 곧 발화 시각이다(중재로 기다리면 조금 밀림). 타임스탬프를 따로 붙이는 구현도 있다.</text>
<text x='380' y='426' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >연결표의 받는 유닛·가중치 기호는 예시다. (Claude가 그림, 모식도)</text>
</svg>
