<text x='380' y='418' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >시각·횟수는 예시이고 코드가 셌다. 무엇이 '계속 돌아가는지'는 실제 회로 설계에 따라 다르다. (Claude가 그림, 모식도)</text>
