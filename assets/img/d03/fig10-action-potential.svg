<text x='222.45999999999998' y='220.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >약 1 ms</text>
<text x='424' y='60' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >① 입력이 모여 문턱까지</text>
<text x='426' y='76' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >시냅스 입력으로 막전위가 조금씩 오른다.</text>
<text x='426' y='90' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >문턱에 못 미치면 새는 통로로 다시 −70.</text>
<text x='424' y='122' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>② 오름: Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>가 들어온다</tspan></text>
<text x='426' y='138' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>문턱에서 전압 의존 Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 통로가 열린다.</tspan></text>
<text x='426' y='152' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >농도 차 + 음전위 쪽 끌림 → 안으로.</text>
<rect x='664' y='120' width='32' height='8' rx='0' fill='#f3ead9' stroke='#d9c7a3' stroke-width='0.8' />
<text x='700' y='116' font-size='8.5' fill='#999' text-anchor='start' font-weight='normal' >밖</text>
<text x='700' y='144' font-size='8.5' fill='#999' text-anchor='start' font-weight='normal' >안</text>
<line x1='680' y1='104' x2='680' y2='146' stroke='#c8553d' stroke-width='1.8' marker-end='url(#aR)'/>
<text x='424' y='184' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>③ 내림: K</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>가 나간다</tspan></text>
<text x='426' y='200' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 통로는 닫히고 K</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 통로가 열린다.</tspan></text>
<text x='426' y='214' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>많던 안쪽 K</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>가 밖으로 → 다시 음전위.</tspan></text>
<rect x='664' y='182' width='32' height='8' rx='0' fill='#f3ead9' stroke='#d9c7a3' stroke-width='0.8' />
<text x='700' y='178' font-size='8.5' fill='#999' text-anchor='start' font-weight='normal' >밖</text>
<text x='700' y='206' font-size='8.5' fill='#999' text-anchor='start' font-weight='normal' >안</text>
<line x1='680' y1='208' x2='680' y2='166' stroke='#3d6fb4' stroke-width='1.8' marker-end='url(#aB)'/>
<text x='424' y='246' font-size='11' fill='#777' text-anchor='start' font-weight='bold' >④ 잠깐 더 내려갔다 복귀</text>
<text x='426' y='262' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>K</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 통로가 늦게 닫혀 −70 아래로.</tspan></text>
<text x='426' y='276' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >이 동안 새 스파이크 어려움(불응기).</text>
<text x='424' y='304' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>그 뒤 펌프가 들어온 Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>를 내보내고 나간 K</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>를 들인다.</tspan></text>
<text x='424' y='318' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >한 번에 드나드는 이온은 세포 안팎 전체에 비해</text>
<text x='424' y='332' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >아주 적어서 농도 차는 거의 그대로다.</text>
<text x='360' y='372' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >값은 교재 대표값(휴지 −70, 문턱 −55, 정점 +30 mV)이고 곡선 모양은 손으로 정한 모식이다. 세포마다 다르다. (Claude가 그림, 모식도)</text>
