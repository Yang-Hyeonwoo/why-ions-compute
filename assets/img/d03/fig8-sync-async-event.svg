<text x='760' y='386' font-size='12' fill='#999' text-anchor='end' font-weight='normal' >시간 →</text>
<text x='450' y='404' font-size='12.5' fill='#444' text-anchor='middle' font-weight='normal' >셋은 '언제 일을 시작하나'의 차이일 뿐, 셋 다 디지털 회로로 만들 수 있다(디지털/아날로그는 다른 축).</text>
<text x='450' y='426' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >시각·길이는 설명용으로 정한 예시이고 일한 횟수는 코드가 셌다 (Claude가 그림, 모식도)</text>
