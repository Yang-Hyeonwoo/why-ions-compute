<text x='20' y='128' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >박자(세로선)마다 값을 한 걸음씩 넘긴다: 깨어난 횟수 10번. 입력이 없어도 박자는 계속 온다</text>
