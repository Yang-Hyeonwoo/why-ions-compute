<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 316' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >뇌의 원리 하나 ↔ 줄이는 비용 하나 ↔ 성립 조건 (이해용 지도, 서로 겹친다)</text>
<text x='70' y='48' font-size='11.5' fill='#999' text-anchor='middle' font-weight='bold' >원리</text>
<text x='235' y='48' font-size='11.5' fill='#999' text-anchor='middle' font-weight='bold' >줄이는 비용 (D2의 벽)</text>
<text x='455' y='48' font-size='11.5' fill='#999' text-anchor='middle' font-weight='bold' >성립 조건</text>
<rect x='14' y='62' width='112' height='34' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='70' y='84' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >co-location</text>
<line x1='126' y1='79' x2='146' y2='79' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='148' y='62' width='174' height='34' rx='6' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='235' y='84' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >가중치 이동 (벽 ①)</text>
<line x1='322' y1='79' x2='342' y2='79' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='76' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >가중치가 재사용되지 않을 때. ADC·보정 비용</text>
<text x='345' y='91' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >제외 시</text>
<rect x='14' y='108' width='112' height='34' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='70' y='130' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >event-driven</text>
<line x1='126' y1='125' x2='146' y2='125' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='148' y='108' width='174' height='34' rx='6' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='235' y='130' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >활동률 α·클록 분배 (벽 ②)</text>
<line x1='322' y1='125' x2='342' y2='125' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='130' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >입력이 희소할 때. 대기 전력이 작을 때</text>
<rect x='14' y='154' width='112' height='34' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='70' y='176' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >analog</text>
<line x1='126' y1='171' x2='146' y2='171' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='148' y='154' width='174' height='34' rx='6' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='235' y='176' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >비트 수만큼의 회로·변환 (벽 ③)</text>
<line x1='322' y1='171' x2='342' y2='171' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='168' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >과제가 근사·편차를 견딜 때. 다음 단계가</text>
<text x='345' y='183' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아날로그일 때</text>
<rect x='14' y='200' width='112' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='70' y='222' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >시간 동역학</text>
<line x1='126' y1='217' x2='146' y2='217' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='148' y='200' width='174' height='34' rx='6' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='235' y='222' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >과거 입력의 저장·갱신 (벽 ①)</text>
<line x1='322' y1='217' x2='342' y2='217' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='222' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >소자 τ가 신호 시간척도와 맞을 때</text>
<rect x='14' y='246' width='112' height='34' rx='6' fill='#fff' stroke='#999' stroke-width='1.5' />
<text x='70' y='268' font-size='12' fill='#999' text-anchor='middle' font-weight='bold' >가소성</text>
<line x1='126' y1='263' x2='146' y2='263' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='148' y='246' width='174' height='34' rx='6' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='235' y='268' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >재학습의 데이터 왕복 (벽 ①·②)</text>
<line x1='322' y1='263' x2='342' y2='263' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='268' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >갱신 선형성·대칭성·내구성을 소자가 줄 때</text>
<text x='300' y='302' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >조건이 깨지면 그 원리는 비용을 줄이지 않거나 다른 비용을 만든다. 어느 칸도 '항상'이 아니다.</text>
</svg>
