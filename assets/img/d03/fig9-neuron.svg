<text x='250' y='442' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 적음</tspan></text>
<text x='24' y='466' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >안의 전위가 밖보다 약 70 mV 낮다 → 휴지 전위 약 −70 mV</text>
<text x='24' y='482' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >농도 차는 새는 통로로 조금씩 줄고, 펌프가 ATP를 써서 되돌린다</text>
<text x='24' y='496' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >= 아무 신호가 없어도 드는 유지 비용 (생물 쪽 '대기 전력')</text>
