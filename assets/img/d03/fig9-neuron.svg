<text x='560' y='206' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >시냅스 (synapse)</text>
<text x='560' y='221' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >다음 세포와 좁은 틈을 두고 연결</text>
