<text x='56' y='206' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >가지돌기 (dendrite)</text>
<text x='56' y='221' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >다른 세포의 신호를 받는다</text>
