<text x='396' y='456' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>① 스파이크가 말단에 오면 Ca</tspan><tspan dy='-6' font-size='8'>2+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 통로가 열려 Ca</tspan><tspan dy='-6' font-size='8'>2+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>가 들어온다</tspan></text>
<text x='396' y='471' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >② 그 신호로 소포(작은 주머니)가 막과 합쳐져 신경전달물질을 내보낸다</text>
<text x='396' y='486' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >③ 분자가 틈을 건너 받는 쪽 수용체에 붙는다</text>
<text x='396' y='501' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>④ 수용체 통로가 열려 Na</tspan><tspan dy='-6' font-size='8'>+</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>가 들어오고 받는 세포의 membrane potential이 조금 오른다</tspan></text>
<text x='380' y='528' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >농도 비·전위는 포유류 신경세포의 교재 대표값이며 세포마다 다르다. 크기 비율은 무시했다. (Claude가 그림, 모식도)</text>
