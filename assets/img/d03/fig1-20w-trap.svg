<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 248' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >전력(W)만 보면 틀리는 이유: 작업당 에너지 = 전력 ÷ 처리율 (가상 예시)</text>
<rect x='40' y='44' width='250' height='128' rx='8' fill='#fff' stroke='#13936b' stroke-width='1.6' />
<text x='52' y='66' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >가상 시스템 A</text>
<text x='52' y='90' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >전력 P = 20 W</text>
<text x='52' y='110' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >처리율 = 10 작업/s</text>
<text x='52' y='134' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >작업당 에너지 E = P ÷ 처리율</text>
<text x='52' y='156' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >= 2 J/작업</text>
<rect x='340' y='44' width='250' height='128' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='352' y='66' font-size='13' fill='#3d6fb4' text-anchor='start' font-weight='bold' >가상 시스템 B</text>
<text x='352' y='90' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >전력 P = 300 W</text>
<text x='352' y='110' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >처리율 = 1000 작업/s</text>
<text x='352' y='134' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >작업당 에너지 E = P ÷ 처리율</text>
<text x='352' y='156' font-size='13' fill='#3d6fb4' text-anchor='start' font-weight='bold' >= 0.3 J/작업</text>
<text x='300' y='196' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >A의 전력은 B의 15분의 1이지만, 작업당 에너지는 A가 B의 6.7배 (느리므로).</text>
<text x='300' y='216' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >'20 W'는 P다. E를 말하려면 (1) 같은 작업 (2) 처리율 (3) 무엇까지 포함했나(대기 전력, 변환, 냉각)를 맞춰야 한다.</text>
<text x='300' y='234' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >숫자는 설명용 가상값이며 뇌·GPU의 실제 처리율을 뜻하지 않는다. 뇌 20 W는 폴더 밖 문헌의 뇌 전체 대사 전력이다.</text>
</svg>
