<text x='89' y='168' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >기억 없는 장치</text>
<text x='89' y='188' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >y(t) = g(u(t))</text>
<rect x='14' y='228' width='150' height='72' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='89' y='258' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >흔적이 남는 노드</text>
<text x='89' y='278' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >x(t) = 0.5·x(t−1) + u(t)</text>
<text x='245' y='42' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >이력 A: 1, 0  (정답: 예)</text>
