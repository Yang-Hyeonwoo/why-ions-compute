<text x='615' y='172' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >t = 2: g(0) = g(0)</text>
<text x='615' y='188' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >같다 → 못 가름</text>
<text x='615' y='262' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >t = 2: 0.5 ≠ 0</text>
<text x='615' y='278' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >다르다 → 가를 수 있음</text>
<text x='350.0' y='322' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >g는 어떤 곡선이어도 된다. 노드의 줄어드는 비율 d = 0.5, 처음 상태 0. 숫자는 코드가 계산했다.</text>
