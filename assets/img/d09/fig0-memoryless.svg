<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350.0' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >"한 단계 전에 1이 왔었나?": 지금 입력이 같은 두 이력을 가를 수 있나</text>
<rect x='14' y='48' width='150' height='72' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='89' y='78' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >입력 u(t)</text>
