<text x='320' y='318' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실선은 출발점 +0.8, 점선은 −0.8. 두 노드에 같은 난수 입력을 넣었다. 가로축은 시간 단계 0–39. 모형 x(t+1) = tanh(d·x(t) + u(t)).</text>
<text x='320' y='334' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >d = 1.1은 입력이 작으면 두 갈래로 남고(ESP 깨짐), 입력이 크면 다시 모인다. 숫자는 코드가 계산했다.</text>
