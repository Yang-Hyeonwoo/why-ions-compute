<text x='24' y='150.0' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' transform='rotate(-90 24 150.0)'>되살리는 정도 (corr²)</text>
<rect x='465' y='50' width='160' height='200' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='475' y='72' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >d = 0.1</text>
<text x='475' y='88' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >k=0,1,2: 0.99, 0.010, 0.000</text>
<text x='475' y='103' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >합(k = 0…∞) = 1.000</text>
<text x='475' y='130' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >d = 0.5</text>
<text x='475' y='146' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >k=0,1,2: 0.75, 0.188, 0.047</text>
<text x='475' y='161' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >합(k = 0…∞) = 1.000</text>
<text x='475' y='188' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >d = 0.9</text>
<text x='475' y='204' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >k=0,1,2: 0.19, 0.154, 0.125</text>
<text x='475' y='219' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >합(k = 0…∞) = 1.000</text>
<text x='320' y='306' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모형: x(t) = d·x(t−1) + u(t), u는 서로 독립인 난수, 잡음 없음. 되살리는 정도 = corr²(x(t), u(t−k)) = d²ᵏ(1 − d²).</text>
<text x='320' y='323' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >식과 숫자는 코드가 계산했다. 노드가 많아지면 이 '예산'이 노드 수만큼 늘 수 있다(D11).</text>
