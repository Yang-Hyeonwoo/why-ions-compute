<text x='320' y='318' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모형: x(t+1) = d·x(t) + u(t) (선형) 또는 tanh(d·x(t) + u(t)). 숫자는 코드가 계산했다.</text>
<text x='320' y='336' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >tanh가 있으면 d = 1.1도 폭발하지 않지만 0으로 돌아가지 않고 약 0.50에 머문다(잊지 않는다).</text>
