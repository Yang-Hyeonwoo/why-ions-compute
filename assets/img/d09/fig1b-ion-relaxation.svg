<text x='488' y='52' font-size='13' fill='#444' text-anchor='start' font-weight='bold' >(b)</text>
<text x='498' y='78' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >식 x(t+1) = d·x(t) + u(t)로 읽기</text>
<text x='498' y='100' font-size='10' fill='#444' text-anchor='start' font-weight='bold' ><tspan>x = (g − g</tspan><tspan dy='4' font-size='9'>rest</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>) ÷ Δg</tspan></text>
<text x='498' y='118' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >  늘어난 전도도(쌓인 여분의 이온)</text>
<text x='498' y='136' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >u = 그 차례의 쓰기 펄스(1 또는 0)</text>
<text x='498' y='154' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >  펄스 하나가 Δg = 2 µS를 더함</text>
<text x='498' y='176' font-size='10' fill='#444' text-anchor='start' font-weight='bold' ><tspan>d = e</tspan><tspan dy='-6' font-size='9'>−Δt/τ</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> = e</tspan><tspan dy='-6' font-size='9'>−4/38</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> = 0.90</tspan></text>
<text x='498' y='194' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >  다음 차례까지 남는 몫</text>
<text x='498' y='212' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >τ = 38 ms: 소자의 이완 시간상수</text>
<text x='498' y='230' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >Δt = 4 ms: 실험자가 정한 펄스 간격</text>
<text x='498' y='248' font-size='10' fill='#444' text-anchor='start' font-weight='bold' ><tspan>읽기 전류 I = g·V</tspan><tspan dy='4' font-size='9'>read</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='498' y='266' font-size='10' fill='#999' text-anchor='start' font-weight='normal' ><tspan>  V</tspan><tspan dy='4' font-size='9'>read</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.1 V: 1.20 → 1.38 → 1.34 µA</tspan></text>
<text x='350.0' y='340' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >교육용 모형: 펄스마다 같은 Δg가 더해지고, 펄스 사이에는 시간상수 τ = 38 ms 하나짜리 지수함수로 이완한다고 가정했다.</text>
<text x='350.0' y='357' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실제 소자는 포화(비선형), 여러 시간척도, 드리프트가 있을 수 있다. 숫자는 코드가 계산했다.</text>
