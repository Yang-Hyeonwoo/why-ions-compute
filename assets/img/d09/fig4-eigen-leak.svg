<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >행렬 W = [[0.6, 0.3], [0.3, 0.6]]을 반복해서 곱하면: 방향마다 줄어드는 배율이 다르다</text>
<line x1='50' y1='175' x2='320' y2='175' stroke='#d9d9d9' stroke-width='1'/>
<line x1='180' y1='305' x2='180' y2='45' stroke='#d9d9d9' stroke-width='1'/>
<line x1='72.0' y1='283.0' x2='306.0' y2='49.0' stroke='#13936b' stroke-width='1.2' stroke-dasharray='5,3'/>
<text x='300.0' y='45.39999999999998' font-size='11' fill='#13936b' text-anchor='middle' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >방향 (1, 1): 배율 0.9</text>
<line x1='72.0' y1='67.0' x2='294.0' y2='289.0' stroke='#e08a3c' stroke-width='1.2' stroke-dasharray='5,3'/>
<text x='254.4' y='292.6' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >방향 (1, −1): 배율 0.3</text>
<circle cx='300.0' cy='175.0' r='4.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<text x='306.0' y='191.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >x(0)</text>
<circle cx='252.0' cy='139.0' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<text x='260.0' y='151.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >x(1)</text>
<circle cx='234.0' cy='131.8' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<text x='242.0' y='143.8' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >x(2)</text>
<circle cx='225.35999999999999' cy='132.88' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<circle cx='219.852' cy='136.12' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<circle cx='215.5752' cy='139.71640000000002' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<circle cx='211.93019999999999' cy='143.15728000000001' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<circle cx='208.710936' cy='146.31530800000002' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<circle cx='205.8319692' cy='149.175904' r='3.5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<text x='197.8319692' y='163.175904' font-size='10' fill='#3d6fb4' text-anchor='end' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >x(8)</text>
<polyline points='300.0,175.0 252.0,139.0 234.0,131.8 225.4,132.9 219.9,136.1 215.6,139.7 211.9,143.2 208.7,146.3 205.8,149.2' fill='none' stroke='#3d6fb4' stroke-width='1.2' stroke-dasharray='2,2' stroke-linejoin='round'/>
<rect x='360' y='45' width='265' height='250' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='372' y='64' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >손 계산</text>
<text x='372' y='84' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >(0.6 − λ)² − 0.3² = 0 → λ = 0.9 또는 0.3</text>
<text x='372' y='101' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >W·(1, 1) = (0.6+0.3, 0.3+0.6) = 0.9·(1, 1)</text>
<text x='372' y='118' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >W·(1, −1) = (0.6−0.3, 0.3−0.6) = 0.3·(1, −1)</text>
<text x='372' y='135' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >→ 고윳값 0.9와 0.3, spectral radius ρ = 0.9</text>
<text x='372' y='157' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >x(0) = (1, 0) = 0.5·(1, 1) + 0.5·(1, −1)</text>
<text x='372' y='174' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>x(t) = 0.5·0.9</tspan><tspan dy='-6' font-size='9'>t</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>·(1, 1) + 0.5·0.3</tspan><tspan dy='-6' font-size='9'>t</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>·(1, −1)</tspan></text>
<text x='372' y='191' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >x(1) = (0.60, 0.30), x(2) = (0.45, 0.36), …</text>
<text x='372' y='207' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >x(8) = (0.215, 0.215): (1, 1) 방향만 남음</text>
<text x='372' y='229' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >leak a를 넣으면 배율 = (1 − a) + a·λ</text>
<text x='372' y='247' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >a = 1.0: 배율 0.90, 절반이 되는 데 6.6단계</text>
<text x='372' y='264' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >a = 0.5: 배율 0.95, 절반이 되는 데 13.5단계</text>
<text x='372' y='281' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >a = 0.1: 배율 0.99, 절반이 되는 데 69.0단계</text>
<text x='320' y='318' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >입력 없이(u = 0) 선형으로만 곱한 경우. 파란 점이 x(0)부터 x(8)까지. 숫자는 코드가 계산했다. (Claude가 계산해 그림)</text>
</svg>
