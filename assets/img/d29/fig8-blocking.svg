<text x='24' y='390.2' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='normal' >가교의 효과, 묶음(날) 차이, 오후의 습도 변화가</text>
<text x='24' y='408.4' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='normal' >한 숫자에 섞여 떼어 낼 수 없다.</text>
<text x='514' y='372.0' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='normal' >묶음마다 두 조건이 다 있어, 묶음 안에서 차이를 구하면</text>
<text x='514' y='390.2' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='normal' >묶음(날) 차이가 빠진다(블록). 자리와 측정 순서는 난수로</text>
<text x='514' y='408.4' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='normal' >섞어 오후의 습도 변화가 한 조건에 몰리지 않게 한다(무작위화).</text>
