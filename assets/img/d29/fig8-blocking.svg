<text x='500.0' y='470' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >NIST의 요약: 막을 수 있는 것은 블록으로 묶고, 막을 수 없는 것은 무작위화한다.</text>
<text x='500.0' y='492' font-size='12.5' fill='#999' text-anchor='middle' font-weight='normal' >무작위 순서는 난수 seed 3로 만든 한 예다.</text>
