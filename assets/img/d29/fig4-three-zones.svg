<text x='20' y='386' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >가로축: 기준선 NMSE − 결과 NMSE (클수록 좋음). 막대 = 차이의 95% 구간(Welch t).</text>
<text x='20' y='410' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >기준선 자체의 95% 구간은 0.363–0.437 (t, n = 5).</text>
<text x='20' y='434' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >지지: 하한 &gt; 0 이고 차이 ≥ 문턱 · 기각: 상한 &lt; 문턱 · 그 밖은 모호.</text>
<text x='20' y='458' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >규칙은 결과를 보기 전에 정한다.</text>
