<text x='661.4303787768661' y='164' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >[0.072, 0.148]  지지 → 다음 단으로</text>
<line x1='437.0' y1='214.0' x2='803.0' y2='214.0' stroke='#e08a3c' stroke-width='3'/>
