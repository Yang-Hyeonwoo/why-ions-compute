<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 430' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='430' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >같은 drift 실험(예시 A), 원인을 가르는 측정 하나의 차이 (모식도)</text>
<rect x='20' y='48' width='470' height='50' rx='10' fill='#fff' stroke='#999' stroke-width='1.8' />
<text x='255.0' y='79' font-size='14' fill='#999' text-anchor='middle' font-weight='bold' >실험 ①: 24 h 동안 응답 크기만 잰다</text>
<line x1='255.0' y1='100.0' x2='135.0' y2='168.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<text x='95' y='140' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >성공</text>
<rect x='20' y='172' width='230' height='96' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='135' y='200' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >비휘발 겔의 drift가</text>
<text x='135' y='225' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >10배 이상 줄었다</text>
<text x='135' y='250' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >→ 설계(3단)로 간다</text>
<line x1='255.0' y1='100.0' x2='375.0' y2='168.0' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr)'/>
<text x='415' y='140' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >실패</text>
<rect x='260' y='172' width='230' height='96' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.2' />
<text x='375' y='200' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >drift가 줄지 않았다</text>
<text x='375' y='225' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >왜인지 모른다</text>
<text x='375' y='250' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >→ '잘 안 됐다'만 남음</text>
<rect x='510' y='48' width='470' height='50' rx='10' fill='#fff' stroke='#3d6fb4' stroke-width='1.8' />
<text x='745.0' y='79' font-size='14' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >실험 ②: 응답 크기 + 시료 무게(용매량)를 함께 잰다</text>
<line x1='745.0' y1='100.0' x2='625.0' y2='168.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<text x='585' y='140' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >성공</text>
<rect x='510' y='172' width='230' height='96' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='625' y='200' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >무게와 응답이 함께 변하고</text>
<text x='625' y='225' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >비휘발 겔은 drift 10배 감소</text>
<text x='625' y='250' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >→ '증발이 주원인' 지지</text>
<line x1='745.0' y1='100.0' x2='865.0' y2='168.0' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr)'/>
<text x='905' y='140' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >실패</text>
<rect x='750' y='172' width='230' height='96' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.2' />
<text x='865' y='200' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >무게는 그대로인데 응답 변화</text>
<text x='865' y='225' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >→ 원인은 증발이 아니다</text>
<text x='865' y='250' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >→ 전극·계면, 또는 회로 보정</text>
<text x='255.0' y='300' font-size='14' fill='#999' text-anchor='middle' font-weight='bold' >실패하면 배우는 것이 거의 없다</text>
<text x='745.0' y='300' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >두 결과 모두 다음 행동을 정해 준다</text>
<line x1='20.0' y1='322.0' x2='980.0' y2='322.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='20' y='352' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >실험을 설계할 때 묻는다: 실패한다면 그 이유를 가를 측정(무게, 두께, 전극 상태, 기준 조건의 값)이 하나 들어 있나?</text>
<text x='20' y='378' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >성공·실패 칸은 실험 전에 채운다. 두 칸이 같으면 지금 결정을 위한 실험이 아니다(앞 Day의 '결정을 바꾸나').</text>
<text x='20' y='404' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >숫자(10배, 24 h)는 4구간 표의 예시 값이다.</text>
</svg>
