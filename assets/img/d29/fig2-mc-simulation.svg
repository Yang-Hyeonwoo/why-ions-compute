<text x='90' y='520' font-size='14' fill='#999' text-anchor='start' font-weight='normal' ><tspan font-size='14'>노드: x</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'>(t+1) = d</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'>·x</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'>(t) + (1 − d</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'>)·u(t),  d</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'> = exp(−1/τ</tspan><tspan dy='5' font-size='13'>i</tspan><tspan dy='-5' font-size='14'>) = 한 단계에 남는 비율,  가운데 τ = 4단계.</tspan></text>
<text x='90' y='544' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >훈련 2,000 / 시험 1,000단계, ridge readout. 선형 노드라 비선형 과제는 다루지 않는다.</text>
