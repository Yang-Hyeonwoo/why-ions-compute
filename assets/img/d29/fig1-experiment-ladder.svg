<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 700' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='700' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28' font-size='17' fill='#444' text-anchor='middle' font-weight='bold' >실험 비용의 사다리: 아래 단에서 죽일 수 있는 가설은 아래에서 죽인다</text>
<text x='500.0' y='50' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' >(모식도, 기간은 가정)</text>
<text x='60' y='84' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >단</text>
<text x='250' y='84' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' >실험</text>
<text x='500' y='84' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' >기간[가정]</text>
<text x='580' y='84' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >여기서 죽일 수 있는 가설</text>
<text x='810' y='84' font-size='14' fill='#c8553d' text-anchor='start' font-weight='bold' >여기서는 확인 못 하는 것</text>
<rect x='50' y='564' width='500' height='66' rx='8' fill='rgb(248,251,254)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='64' y='604.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >0</text>
<text x='92' y='602.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >문헌·내 옛 데이터 다시 보기</text>
<text x='500' y='602.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >수일</text>
<text x='580' y='592.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >이미 답이 나온 가설,</text>
<text x='580' y='611.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >이미 반례가 있는 가설</text>
<text x='810' y='602.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >내 재료에서의 값</text>
<rect x='62' y='486' width='488' height='66' rx='8' fill='rgb(239,242,245)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='76' y='526.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >1</text>
<text x='104' y='514.5' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >계산·시뮬레이션</text>
<text x='104' y='533.4' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(측정값을 넣은 모형)</text>
<text x='500' y='524.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >1–2주</text>
<text x='580' y='514.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >이상적 조건에서도</text>
<text x='580' y='533.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >이득이 없는 가설</text>
<text x='810' y='514.5' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >잡음·편차·drift가</text>
<text x='810' y='533.4' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >있는 실제</text>
<rect x='74' y='408' width='476' height='66' rx='8' fill='rgb(230,233,236)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='88' y='448.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >2</text>
<text x='116' y='446.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >기존 device로 새 측정</text>
<text x='500' y='446.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >2–4주</text>
<text x='580' y='436.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >메커니즘·시간척도가</text>
<text x='580' y='455.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >맞지 않는 가설</text>
<text x='810' y='446.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >새 화학의 효과</text>
<rect x='86' y='330' width='464' height='66' rx='8' fill='rgb(221,224,227)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='100' y='370.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >3</text>
<text x='128' y='358.5' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >새 device 한 종</text>
<text x='128' y='377.4' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(화학 하나만 바꾼 2–3 수준)</text>
<text x='500' y='368.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >1–3개월</text>
<text x='580' y='358.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >손잡이가 효과를</text>
<text x='580' y='377.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >내지 않는 가설</text>
<text x='810' y='368.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >device 간 재현성</text>
<rect x='98' y='252' width='452' height='66' rx='8' fill='rgb(212,215,218)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='112' y='292.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >4</text>
<text x='140' y='280.5' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >여러 device·여러 제작 묶음</text>
<text x='140' y='299.4' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >+ 대조군</text>
<text x='500' y='290.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >3–6개월</text>
<text x='580' y='290.0' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >편차에 묻히는 효과</text>
<text x='810' y='290.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >배열·회로에서의 동작</text>
<rect x='110' y='174' width='440' height='66' rx='8' fill='rgb(203,206,209)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='124' y='214.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >5</text>
<text x='152' y='202.5' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >배열·회로</text>
<text x='152' y='221.4' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(상태 읽기, readout)</text>
<text x='500' y='212.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >6–12개월</text>
<text x='580' y='202.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >엮었을 때</text>
<text x='580' y='221.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >사라지는 효과</text>
<text x='810' y='212.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >응용 시스템의 비용</text>
<rect x='122' y='96' width='428' height='66' rx='8' fill='rgb(194,197,200)' stroke='#b9c2d0' stroke-width='1.2' />
<text x='136' y='136.0' font-size='19' fill='#3d6fb4' text-anchor='start' font-weight='bold' >6</text>
<text x='164' y='134.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >시스템·응용 시연</text>
<text x='500' y='134.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >1년 이상</text>
<text x='580' y='124.5' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >시스템 이득이</text>
<text x='580' y='143.4' font-size='14' fill='#13936b' text-anchor='start' font-weight='normal' >없는 가설</text>
<text x='810' y='134.0' font-size='14' fill='#c8553d' text-anchor='start' font-weight='normal' >—</text>
<line x1='28.0' y1='630.0' x2='28.0' y2='104.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='20' y='369.0' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' transform='rotate(-90 20 369.0)'>비용·시간 증가</text>
<text x='500.0' y='662' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >규칙: 가설을 죽일 수 있는 가장 낮은 단을 찾는다.</text>
<text x='500.0' y='684' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >위 단의 결과(예: 시스템 이득)는 아래 단만으로는 확인할 수 없다.</text>
</svg>
