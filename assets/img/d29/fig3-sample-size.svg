<circle cx='203.3' cy='291.1' r='6' fill='#fff' stroke='#c8553d' stroke-width='2.4'/>
<text x='215.33333333333331' y='281.1283841817391' font-size='14' fill='#c8553d' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >CV 20%, Δ 30% → n = 7</text>
<text x='640' y='92' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >어림식</text>
<text x='640' y='117' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >n ≈ 2 × (1.96 + 0.84)² × (CV ÷ Δ)²</text>
<text x='640' y='142' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >1.96: 우연을 차이로 착각할 확률 5%</text>
<text x='640' y='167' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >0.84: 진짜 차이를 놓칠 확률 20%</text>
<text x='640' y='192' font-size='14' fill='#444' text-anchor='start' font-weight='normal' ></text>
<text x='640' y='217' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >풀이 (CV 20%, Δ 30%)</text>
<text x='640' y='242' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >(1.96 + 0.84)² = 7.85</text>
<text x='640' y='267' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >2 × 7.85 × (0.2/0.3)² = 6.98</text>
<text x='640' y='292' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >→ 올림해서 7개씩, 두 조건이면 14개</text>
<text x='640' y='317' font-size='14' fill='#444' text-anchor='start' font-weight='normal' ></text>
<text x='640' y='342' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >주의</text>
<text x='640' y='367' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >한 소자를 10번 잰 것은 소자 10개가 아니다.</text>
<text x='640' y='392' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >반복 측정은 측정 잡음만,</text>
<text x='640' y='417' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >소자 수는 제작 편차를 본다.</text>
