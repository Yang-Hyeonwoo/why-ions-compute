<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 540' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='540' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28' font-size='17' fill='#444' text-anchor='middle' font-weight='bold' >새 device가 꼭 필요한가: 네 질문 (모식도)</text>
<rect x='20' y='52' width='560' height='86' rx='10' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='34' y='82' font-size='18' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q1</text>
<text x='76' y='80.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >논문·내 옛 데이터로 이미 답이 나오나?</text>
<text x='76' y='126' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >아니요 → 아래 질문으로</text>
<line x1='580.0' y1='95.0' x2='620.0' y2='95.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<rect x='626' y='60' width='368' height='70' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='640' y='91.0' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >예 → 정리해서 끝</text>
<text x='640' y='110.5' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >(또는 가설을 고친다)</text>
<line x1='50.0' y1='138.0' x2='50.0' y2='160.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='20' y='162' width='560' height='86' rx='10' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='34' y='192' font-size='18' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q2</text>
<text x='76' y='190.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >측정한 응답을 넣은 계산으로</text>
<text x='76' y='209.5' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >'이상적 상한'을 볼 수 있나?</text>
<text x='76' y='236' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >아니요 → 아래 질문으로</text>
<line x1='580.0' y1='205.0' x2='620.0' y2='205.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<rect x='626' y='170' width='368' height='70' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='640' y='201.0' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >예 → 계산 먼저. 상한도</text>
<text x='640' y='220.5' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >기각이면 합성 전에 접는다</text>
<line x1='50.0' y1='248.0' x2='50.0' y2='270.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='20' y='272' width='560' height='86' rx='10' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='34' y='302' font-size='18' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q3</text>
<text x='76' y='300.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >이미 있는 device(재료)로</text>
<text x='76' y='319.5' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >새 측정만 하면 시험되나?</text>
<text x='76' y='346' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >아니요 → 아래 질문으로</text>
<line x1='580.0' y1='315.0' x2='620.0' y2='315.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<rect x='626' y='280' width='368' height='70' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='640' y='321.0' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >예 → 기존 device로 측정</text>
<line x1='50.0' y1='358.0' x2='50.0' y2='380.0' stroke='#999' stroke-width='1.6' marker-end='url(#arr)'/>
<rect x='20' y='382' width='560' height='86' rx='10' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='34' y='412' font-size='18' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q4</text>
<text x='76' y='410.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >가설이 '새 화학의 효과' 자체를 묻나?</text>
<text x='76' y='456' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >아니요 → 새 device가 필요 없다(Q1–Q3로 돌아가 가설을 고친다)</text>
<line x1='580.0' y1='425.0' x2='620.0' y2='425.0' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr)'/>
<rect x='626' y='390' width='368' height='70' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='640' y='421.0' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >예 → 새 device: 하나만 바꾼</text>
<text x='640' y='440.5' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >계열 + 대조군</text>
<text x='500.0' y='498' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >Q2의 규칙: 이상적 계산(잡음·편차 없음)에서도 기각이면 실제 device에서도 대개 기각이다.</text>
<text x='500.0' y='522' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >계산에서 성공해도 실제 성공은 아니다. [해석]</text>
</svg>
