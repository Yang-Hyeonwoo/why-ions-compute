<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 412' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300.0' y='20.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >같은 1 nF를 담는 두 방식: 칩 위 평행판(MIM)과 전기이중층 (모식도 + 계산)</text>
<text x='30.0' y='50.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >a. 금속–절연체–금속(MIM) 커패시터 단면</text>
<rect x='30.0' y='64.0' width='250.0' height='26.0' rx='0' fill='#c9d3e0' stroke='#444' stroke-width='1.2' />
<text x='155.0' y='81.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >위 금속판</text>
<rect x='30.0' y='90.0' width='250.0' height='22.0' rx='0' fill='#fff3c4' stroke='#444' stroke-width='1.2' />
<text x='155.0' y='105.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >절연막 (예: 이산화규소)</text>
<rect x='30.0' y='112.0' width='250.0' height='26.0' rx='0' fill='#c9d3e0' stroke='#444' stroke-width='1.2' />
<text x='155.0' y='129.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >아래 금속판</text>
<line x1='292.0' y1='90.0' x2='292.0' y2='112.0' stroke='#444' stroke-width='1.2'/>
<text x='297.0' y='105.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >h</text>
<text x='30.0' y='160.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>C/A = ε</tspan><tspan dy='4' font-size='8'>0</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>ε</tspan><tspan dy='4' font-size='8'>r</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>/h  (평행판: 넓을수록, 얇을수록 크다)</tspan></text>
<text x='30.0' y='178.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>이산화규소(ε</tspan><tspan dy='4' font-size='8'>r</tspan><tspan dy='-4' font-size='1'> </tspan><tspan> = 3.9), h = 35 nm → 0.99 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='30.0' y='196.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>전통적 MIM의 대표값 1–2 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan><tspan> (질화규소 막)</tspan></text>
<text x='330.0' y='50.0' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >b. 전기이중층 (전극 | 전해질)</text>
<rect x='330.0' y='64.0' width='60.0' height='74.0' rx='0' fill='#c9d3e0' stroke='#444' stroke-width='1.2' />
<text x='360.0' y='150.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >전극</text>
<text x='382.0' y='77.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >−</text>
