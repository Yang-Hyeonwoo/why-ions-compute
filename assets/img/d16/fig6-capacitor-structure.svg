<text x='496.0' y='150.0' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >전해질 (멀리서는 중성)</text>
<line x1='382.0' y1='160.0' x2='404.0' y2='160.0' stroke='#444' stroke-width='1.2'/>
<line x1='382.0' y1='155.0' x2='382.0' y2='165.0' stroke='#444' stroke-width='1.2'/>
<line x1='404.0' y1='155.0' x2='404.0' y2='165.0' stroke='#444' stroke-width='1.2'/>
<text x='412.0' y='164.0' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >전극 전하 ↔ 이온층: ≈ 1 nm 안팎 (Day 7–8, Day 37–38)</text>
<text x='330.0' y='186.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >간격이 MIM보다 수십 배 좁다 → 면적당 C가 크다</text>
<text x='330.0' y='204.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>어림 가정 10 µF/cm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan><tspan> = 100 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan></text>
<line x1='14.0' y1='224.0' x2='586.0' y2='224.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='30.0' y='242.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >c. 1 nF에 필요한 면적 (정사각형, 같은 축척)</text>
<rect x='60.0' y='256.0' width='130.0' height='130.0' rx='0' fill='#e3eaf5' stroke='#3d6fb4' stroke-width='1.2' />
<text x='202.0' y='294.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>MIM 0.99 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='202.0' y='312.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>→ 1.0 mm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan><tspan> (한 변 1.0 mm)</tspan></text>
<rect x='380.0' y='373.1' width='12.9' height='12.9' rx='0' fill='#dff5ec' stroke='#13936b' stroke-width='1.2' />
<text x='402.9' y='370.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>전기이중층 100 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='402.9' y='386.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>→ 0.01 mm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan><tspan> (한 변 0.1 mm)</tspan></text>
<text x='360.0' y='284.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >고유전율 막·여러 층을 쌓은 최신 MIM은</text>
<text x='360.0' y='298.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>100 fF/µm</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'> </tspan><tspan>를 넘는 예도 있어(IEEE 개요),</tspan></text>
<text x='360.0' y='312.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >어느 공정과 견주느냐에 따라 이 차이가 줄어든다</text>
<text x='300.0' y='404.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >두께는 축척이 아니다. 면적 정사각형만 축척. 숫자는 코드가 계산. (Claude가 그림)</text>
