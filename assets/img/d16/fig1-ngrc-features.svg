<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 392' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300.0' y='20.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >NG-RC의 특징: 지연된 입력과 그 곱을 늘어놓고, 직선(readout)만 학습한다</text>
<rect x='20.0' y='50.0' width='120.0' height='64.0' rx='6' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='80.0' y='72.0' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >지금 u(t) = 0.5</text>
<text x='80.0' y='92.0' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >한 칸 전 u(t−1) = −1</text>
<text x='80.0' y='108.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(지연 k = 2개)</text>
<line x1='140.0' y1='82.0' x2='172.0' y2='82.0' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
