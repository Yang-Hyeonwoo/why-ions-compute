<text x='24.0' y='312.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>① 전류가 전하를 실어 나른다:  C·dV</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>/dt = (V</tspan><tspan dy='4' font-size='8'>in</tspan><tspan dy='-4' font-size='1'> </tspan><tspan> − V</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>)/R   →   dV</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>/dt = (V</tspan><tspan dy='4' font-size='8'>in</tspan><tspan dy='-4' font-size='1'> </tspan><tspan> − V</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>)/τ,  τ = RC</tspan></text>
<text x='24.0' y='336.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>② Δt 동안 입력이 일정하면:  V</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>(t+Δt) = a·V</tspan><tspan dy='4' font-size='8'>out</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>(t) + (1−a)·V</tspan><tspan dy='4' font-size='8'>in</tspan><tspan dy='-4' font-size='1'> </tspan><tspan>,   a = e</tspan><tspan dy='-6' font-size='9'>−Δt/τ</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='24.0' y='360.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >③ 예: Δt = 0.02 s, τ = 0.1 s → a = 0.82.  이것은 D15의 누설 노드 x ← a·x + (1−a)·u,</text>
<text x='24.0' y='378.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>    a는 D9의 줄어드는 비율 d와 같은 e</tspan><tspan dy='-6' font-size='9'>−Δt/τ</tspan><tspan dy='6' font-size='1'> </tspan><tspan>. (Claude가 그림, 모식도 + 계산)</tspan></text>
