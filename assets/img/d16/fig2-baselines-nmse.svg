<text x='300.0' y='421.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모든 모형이 같은 ridge readout을 쓰고, 규제 세기와 (해당하면) 설정은 검증 구간으로만 골랐다.</text>
