<text x='20.0' y='84.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >③ 시스템 (센서에서 판정까지, 대기·초기화·보정 포함)</text>
<text x='14.0' y='318.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>• ①은 E</tspan><tspan dy='3.0' font-size='8.8'>res</tspan><tspan dy='-3.0' font-size='1'>​</tspan><tspan> = ∫V·I dt로 잰 소자의 에너지. 논문이 흔히 적는 'fJ·nJ/펄스'는 대부분 이 경계다.</tspan></text>
<text x='14.0' y='336.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >• 전극·증폭·필터·무선은 소자를 쓰든 안 쓰든 필요하다: 비교할 때 양쪽에 똑같이 넣는다.</text>
<text x='14.0' y='354.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >• 이 장치의 신호 처리 전체를 디지털로 하면 '증폭+필터 → ADC → MCU'가 된다(Day 9의 센서 노드).</text>
<text x='14.0' y='373.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >실제 장치마다 순서와 부품은 다르다. 상자 크기는 비용의 크기가 아니다. (Claude가 그림, 모식도)</text>
