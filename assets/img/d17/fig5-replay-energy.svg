<text x='20.0' y='236.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >저장한 기록을 다시 넣으므로 전극·증폭+필터·무선은 넣지 않았다. TIA 10채널(채널당 1 µW)과 MCU 대기(2 µW)는</text>
<text x='20.0' y='252.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >지연 내내 켜져 있다고 가정. 실시간 예산 그림과 같은 축척. 부품 값은 본문 3-2절 표의 가정. (Claude가 계산해 그림)</text>
