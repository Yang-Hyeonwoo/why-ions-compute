<text x='484.0' y='68.0' font-size='10' fill='#444' text-anchor='end' font-weight='normal' >경계 위: 오진 비용이 큰 병원 장비라면</text>
<text x='196.0' y='172.0' font-size='12' fill='#13936b' text-anchor='start' font-weight='bold' >Y (93%, 5 µJ)</text>
<text x='196.0' y='156.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >경계 위: 배터리가 작은 패치라면</text>
<text x='258.4' y='230.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >Z (92%, 8 µJ): Y에 지배됨 → 탈락</text>
<text x='92.0' y='118.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >X와 Z: X는 정확도가, Z는 에너지가 낫다 → 서로 지배하지 않는다.</text>
<text x='92.0' y='132.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >그래서 Z를 떨어뜨린 것은 X가 아니라 Y다.</text>
<text x='320.0' y='322.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >초록 점선이 파레토 경계. 숫자는 본문 1구간의 가상 예(실제 device 아님). (Claude가 그림, 모식도)</text>
