<text x='270.0' y='196.0' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >색칠한 칸: 두께 v × 1 s</text>
<text x='392.0' y='104.0' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >1. 이온 속력 v = µE (µ: 이동도)</text>
<text x='392.0' y='126.0' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >2. 1초에 지나는 수 = 칸 안의 수 = n·A·v</text>
<text x='392.0' y='148.0' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >3. 전류 I = n·A·v × |z|e = n|z|eµ·E·A</text>
<text x='392.0' y='170.0' font-size='10.8' fill='#444' text-anchor='start' font-weight='bold' >4. σ = (I/A) ÷ E = n·|z|e·µ</text>
<text x='392.0' y='190.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >A와 E가 약분되어 재료의 값만 남는다</text>
<text x='30.0' y='222.0' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >숫자(10 mM의 K⁺, E = 1 V/m): v = 76 nm/s → 단면 1 m²를 1초에 4.6×10¹⁷개 → × 1.60×10⁻¹⁹ C = 0.074 A/m² → K⁺ 몫 0.074 S/m</text>
<text x='30.0' y='241.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >음이온(−)은 왼쪽으로 가지만 전하도 반대라 같은 방향의 전류를 보탠다(그래서 전하는 크기 |z|e로 넣는다).</text>
<line x1='20.0' y1='256.0' x2='660.0' y2='256.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='30.0' y='280.0' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >(b) σ는 재료의 값, G는 device의 값: G = σA/L (모두 같은 10 mM KCl, σ = 0.150 S/m)</text>
<rect x='50.0' y='318.0' width='110.0' height='44.0' rx='3' fill='#e6f5ef' stroke='#13936b' stroke-width='1.4' />
<line x1='50.0' y1='310.0' x2='160.0' y2='310.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<line x1='160.0' y1='310.0' x2='50.0' y2='310.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<text x='105.0' y='306.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >L</text>
<text x='44.0' y='344.0' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >A</text>
<text x='105.0' y='410.0' font-size='10.3' fill='#444' text-anchor='middle' font-weight='normal' >기준: L = 100 µm, A = 1 mm²</text>
<text x='105.0' y='428.0' font-size='10.8' fill='#13936b' text-anchor='middle' font-weight='bold' >G = 1.5 mS (R = 667 Ω)</text>
<text x='105.0' y='446.0' font-size='10.3' fill='#999' text-anchor='middle' font-weight='normal' >σ = 0.150 S/m</text>
<rect x='225.0' y='318.0' width='220.0' height='44.0' rx='3' fill='#e6f5ef' stroke='#13936b' stroke-width='1.4' />
<line x1='225.0' y1='310.0' x2='445.0' y2='310.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<line x1='445.0' y1='310.0' x2='225.0' y2='310.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<text x='335.0' y='306.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >2L</text>
<text x='219.0' y='344.0' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >A</text>
<text x='335.0' y='410.0' font-size='10.3' fill='#444' text-anchor='middle' font-weight='normal' >길이 L만 2배</text>
<text x='335.0' y='428.0' font-size='10.8' fill='#13936b' text-anchor='middle' font-weight='bold' >G = 0.75 mS (절반)</text>
<text x='335.0' y='446.0' font-size='10.3' fill='#999' text-anchor='middle' font-weight='normal' >σ 그대로</text>
<rect x='510.0' y='296.0' width='110.0' height='88.0' rx='3' fill='#e6f5ef' stroke='#13936b' stroke-width='1.4' />
<line x1='510.0' y1='288.0' x2='620.0' y2='288.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<line x1='620.0' y1='288.0' x2='510.0' y2='288.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
<text x='565.0' y='284.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >L</text>
<text x='504.0' y='344.0' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >2A</text>
<text x='565.0' y='410.0' font-size='10.3' fill='#444' text-anchor='middle' font-weight='normal' >단면 A만 2배</text>
<text x='565.0' y='428.0' font-size='10.8' fill='#13936b' text-anchor='middle' font-weight='bold' >G = 3.0 mS (2배)</text>
<text x='565.0' y='446.0' font-size='10.3' fill='#999' text-anchor='middle' font-weight='normal' >σ 그대로</text>
<text x='340.0' y='470.0' font-size='9.6' fill='#999' text-anchor='middle' font-weight='normal' >device의 전류·전력은 G가 정한다: 1 V에서 I = GV = 1.5 mA, P = GV² = 1.5 mW(2구간). 막대 크기는 비율만 맞춘 모식도. (Claude가 계산해 그림)</text>
</svg>
