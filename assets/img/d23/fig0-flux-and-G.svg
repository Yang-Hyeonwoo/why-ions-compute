<text x='340.0' y='22.0' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >σ = n·|z|e·µ는 어디서 나오나, 그리고 σ(재료의 값)와 G(device의 값)는 어떻게 다른가</text>
<text x='30.0' y='52.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(a) 왜 곱인가: 1초 동안 단면 A를 지나는 이온을 센다 (양이온 한 종만 그림)</text>
