<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 300' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='330.0' y='22.0' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >전도도가 같아도 기억 시간은 100배 다를 수 있다 (같은 σ = n·|z|e·µ, 다른 n과 D, 코드 계산)</text>
<rect x='30.0' y='46.0' width='290.0' height='200.0' rx='8' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='175.0' y='70.0' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >재료 A: 느린 이온이 많다</text>
<text x='46.0' y='98.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >움직이는 이온 1 M,  D = 10⁻¹¹ m²/s</text>
<text x='46.0' y='122.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >σ ≈ 0.0376 S/m (같음)</text>
<text x='46.0' y='146.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >G = σA/L ≈ 0.38 mS → 1 V에서 0.38 mA (같음)</text>
<text x='46.0' y='176.0' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='bold' >덩어리 확산(기억) L²/D ≈ 1000 s</text>
<text x='46.0' y='200.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>디바이 길이 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan> ≈ 0.43 nm</tspan></text>
<text x='46.0' y='222.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>계면 충전 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>·L/D ≈ 4.30 ms</tspan></text>
<rect x='350.0' y='46.0' width='290.0' height='200.0' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='495.0' y='70.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >재료 B: 빠른 이온이 적다</text>
<text x='366.0' y='98.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >움직이는 이온 10 mM,  D = 10⁻⁹ m²/s</text>
<text x='366.0' y='122.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >σ ≈ 0.0376 S/m (같음)</text>
<text x='366.0' y='146.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >G = σA/L ≈ 0.38 mS → 1 V에서 0.38 mA (같음)</text>
<text x='366.0' y='176.0' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >덩어리 확산(기억) L²/D ≈ 10 s</text>
<text x='366.0' y='200.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>디바이 길이 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan> ≈ 4.30 nm</tspan></text>
<text x='366.0' y='222.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>계면 충전 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>·L/D ≈ 0.43 ms</tspan></text>
<text x='330.0' y='268.0' font-size='10.8' fill='#444' text-anchor='middle' font-weight='normal' >전도도·컨덕턴스·전류는 같지만, 상태가 다시 고르게 되는 시간(기억)과 계면 충전 시간은 다르다.</text>
<text x='330.0' y='288.0' font-size='9.6' fill='#999' text-anchor='middle' font-weight='normal' >L = 100 µm, A = 1 mm², 1가 이온 한 종만 움직이고 반대 전하는 고정(그 이온만 전하를 가림)이라 가정. (Claude가 계산해 그림)</text>
</svg>
