<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 318' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='330.0' y='22.0' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >이온전도도 σ = Σ n·|z|e·µ: 이온 수 × 전하의 크기 × 이동도(양수) (10 mM KCl, 이상 용액)</text>
<text x='40.0' y='64.0' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >이온</text>
<text x='110.0' y='64.0' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >n (개/m³)</text>
<text x='240.0' y='64.0' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >|z|e (C)</text>
<text x='340.0' y='64.0' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >µ (m²/(V·s))</text>
<text x='480.0' y='64.0' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >n·|z|e·µ (S/m)</text>
<text x='40.0' y='92.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >K⁺</text>
<text x='110.0' y='92.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >6.0×10²⁴</text>
<text x='240.0' y='92.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >1.60×10⁻¹⁹</text>
<text x='340.0' y='92.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >7.63×10⁻⁸</text>
<text x='480.0' y='92.0' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >0.074</text>
<text x='40.0' y='122.0' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Cl⁻</text>
<text x='110.0' y='122.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >6.0×10²⁴</text>
<text x='240.0' y='122.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >1.60×10⁻¹⁹</text>
<text x='340.0' y='122.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >7.90×10⁻⁸</text>
<text x='480.0' y='122.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >0.076</text>
<line x1='40.0' y1='150.0' x2='620.0' y2='150.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='40.0' y='172.0' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >합계</text>
<text x='480.0' y='172.0' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >σ ≈ 0.150 S/m</text>
<text x='40.0' y='200.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >100 mM이면 n이 10배라 σ ≈ 1.50 S/m (이상 용액 = 이온마다 따로 움직인다는 독립 운반자 근사).</text>
<text x='40.0' y='220.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >측정(25 °C KCl 교정 표준액): 10 mM 0.141, 100 mM 1.29 S/m. 이 근사가 약 6%, 16% 크다 — 묽을수록 맞는다.</text>
<text x='40.0' y='242.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >무용매 폴리전해질·이온성 탄성체: 10⁻⁵–10⁻² S/m [Zhu 2025, p.10] — 10 mM 소금물보다 10–10⁴배 낮다.</text>
<text x='40.0' y='268.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' ><tspan>µ는 D19의 아인슈타인 관계 µ = D/(k</tspan><tspan dy='2.9' font-size='8.8'>B</tspan><tspan dy='-2.9' font-size='1'>​</tspan><tspan>T/e)(1가 이온)로 CRC 물성표 확산계수(25 °C 무한 희석: K⁺ 1.96, Cl⁻ 2.03 ×10⁻⁹ m²/s)에서 구했다.</tspan></text>
<text x='40.0' y='286.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >Cl⁻는 반대 방향으로 움직이지만 전하도 반대라 전류는 같은 방향: 두 항은 상쇄되지 않고 더해진다.</text>
<text x='40.0' y='304.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >한쪽 이온이 고분자에 묶여 있으면(폴리전해질) 그 항은 0에 가깝다. (Claude가 계산해 그림)</text>
</svg>
