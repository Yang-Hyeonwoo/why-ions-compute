<text x='330.0' y='286.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >확산계수 D (m²/s) — 같은 n이면 conductance σ도 같은 비율로 커진다</text>
<text x='44.0' y='152.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' transform='rotate(-90 44 152.0)'>MC₅ (되살리는 정도)</text>
<text x='564.0' y='68.0' font-size='10' fill='#13936b' text-anchor='end' font-weight='normal' >초록: 5개 전 입력의 몫 MC₅</text>
<text x='98.0' y='68.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(방금 입력의 몫 MC₁은 D가 클수록 1에 가까워진다)</text>
<text x='330.0' y='308.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>L = 100 µm, 입력 간격 T</tspan><tspan dy='2.9' font-size='8.8'>sym</tspan><tspan dy='-2.9' font-size='1'>​</tspan><tspan> = 1 s, τ = L²/D, 남는 비율 d = exp(−T</tspan><tspan dy='2.9' font-size='8.8'>sym</tspan><tspan dy='-2.9' font-size='1'>​</tspan><tspan>/τ), MC</tspan><tspan dy='2.9' font-size='8.8'>k</tspan><tspan dy='-2.9' font-size='1'>​</tspan><tspan> = (1−d²)d</tspan><tspan dy='-3.9' font-size='8.8'>2(k−1)</tspan><tspan dy='3.9' font-size='1'>​</tspan><tspan> (Day 23–24 식). 잡음 없음.</tspan></text>
<text x='330.0' y='325.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >소문자 d(남는 비율, 무차원)는 가로축의 확산계수 D(m²/s)와 다른 양이다. 최적점에서 MC₅ ≈ 0.082.</text>
<text x='330.0' y='342.0' font-size='9.6' fill='#999' text-anchor='middle' font-weight='normal' >D가 너무 크면 빨리 잊고, 너무 작으면 새 입력이 상태를 거의 못 움직여 몫이 먼 과거로 퍼진다. (Claude가 계산해 그림)</text>
</svg>
