<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 629 464' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c999' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='314.5' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >학습형 계산의 사다리: 각 단까지 오면 말할 수 있는 것</text>
<text x='182' y='48' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >이 단에서 보여야 하는 것 (회색: 펄스 간격 예제에서)</text>
<text x='418' y='48' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >말할 수 있는 것</text>
<rect x='20' y='60' width='144' height='40' rx='7' fill='#fff' stroke='#999' stroke-width='1.6' />
<text x='92.0' y='80.0' font-size='12' fill='#999' text-anchor='middle' font-weight='bold' dominant-baseline='central'>0. 현상 재현</text>
<text x='182' y='71.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>PPF·STP/LTP 곡선이 나온다</text>
<text x='182' y='90.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: 간격이 짧을수록 I₂가 크다</text>
<line x1='394' y1='80.0' x2='410' y2='80.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='80.0' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' dominant-baseline='central'>device에 기억이 '있다'</text>
<line x1='92.0' y1='100' x2='92.0' y2='114' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='114' width='144' height='40' rx='7' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='92.0' y='134.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' dominant-baseline='central'>1. task 정의</text>
<text x='182' y='125.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>입력·정답·metric이 정해져 있다</text>
<text x='182' y='144.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: 100 ms보다 짧은가 / test accuracy</text>
<line x1='394' y1='134.0' x2='410' y2='134.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='134.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' dominant-baseline='central'>무엇을 계산하는지 말할 수 있다</text>
<line x1='92.0' y1='154' x2='92.0' y2='168' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='168' width='144' height='40' rx='7' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='92.0' y='188.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' dominant-baseline='central'>2. 읽을 수 있는 state</text>
<text x='182' y='179.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>입력마다 다르고, 다시 재도 같다</text>
<text x='182' y='198.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: 간격마다 다른 x (반복은 가정)</text>
<line x1='394' y1='188.0' x2='410' y2='188.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='188.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' dominant-baseline='central'>task에 필요한 차이가 state에 남는다</text>
<line x1='92.0' y1='208' x2='92.0' y2='222' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='222' width='144' height='40' rx='7' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='92.0' y='242.0' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' dominant-baseline='central'>3. 학습한 readout</text>
<text x='182' y='233.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>training sample로 θ 같은 숫자를 정한다</text>
<text x='182' y='252.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: θ = 1.34 µA</text>
<line x1='394' y1='242.0' x2='410' y2='242.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='242.0' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' dominant-baseline='central'>state에서 답을 꺼낼 수 있다</text>
<line x1='92.0' y1='262' x2='92.0' y2='276' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='276' width='144' height='40' rx='7' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='92.0' y='296.0' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' dominant-baseline='central'>4. held-out 성능</text>
<text x='182' y='287.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>training에 안 쓴 test sample로 채점</text>
<text x='182' y='306.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: training 100% → test 75%</text>
<line x1='394' y1='296.0' x2='410' y2='296.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='296.0' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' dominant-baseline='central'>외운 게 아니라 새 데이터도 맞힌다</text>
<line x1='92.0' y1='316' x2='92.0' y2='330' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='330' width='144' height='40' rx='7' fill='#fff' stroke='#c8553d' stroke-width='1.6' />
<text x='92.0' y='350.0' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' dominant-baseline='central'>5. baseline 비교</text>
<text x='182' y='341.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>device를 뺀 방법과 점수 비교</text>
<text x='182' y='360.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: raw input 75%, static device 50%</text>
<line x1='394' y1='350.0' x2='410' y2='350.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='350.0' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' dominant-baseline='central'>device가 기여했다</text>
<line x1='92.0' y1='370' x2='92.0' y2='384' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='20' y='384' width='144' height='40' rx='7' fill='#fff' stroke='#c8553d' stroke-width='1.6' />
<text x='92.0' y='404.0' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' dominant-baseline='central'>6. 시스템 비용</text>
<text x='182' y='395.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' dominant-baseline='central'>변환 회로·readout·대기 전력까지</text>
<text x='182' y='414.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' dominant-baseline='central'>예제: 계산하지 않음</text>
<line x1='394' y1='404.0' x2='410' y2='404.0' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<text x='418' y='404.0' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' dominant-baseline='central'>시스템으로 쓸 만하다</text>
<text x='314.5' y='448' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0단은 1–6단의 어느 것도 증명하지 않는다. 사람이 문턱을 미리 정한 계산에는 3·4단이 필요 없다.</text>
</svg>
