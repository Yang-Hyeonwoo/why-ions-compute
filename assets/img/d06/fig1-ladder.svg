<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 402' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >readout을 학습하는 계산(RC식)의 사다리: 각 단이 증명하는 것</text>
<text x='178' y='44' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >이 단에서 보이는 것 (회색: 펄스 간격 예제에서)</text>
<text x='462' y='44' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >증명하는 것</text>
<rect x='20' y='54' width='146' height='32' rx='6' fill='#fff' stroke='#999' stroke-width='1.5' />
<text x='30' y='75' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >0. 현상 재현</text>
<text x='178' y='67' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >PPF·STP/LTP 곡선이 나온다</text>
<text x='178' y='82' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 간격이 짧을수록 I₂가 크다</text>
<line x1='440' y1='70' x2='456' y2='70' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='75' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >device에 기억(시간상수)이 '있다'</text>
<line x1='93' y1='86' x2='93' y2='98' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='98' width='146' height='32' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='30' y='119' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >1. 과제 정의</text>
<text x='178' y='111' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >입력·정답·채점 방법(척도)이 있다</text>
<text x='178' y='126' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 100 ms보다 짧은가 / 시험 정확도</text>
<line x1='440' y1='114' x2='456' y2='114' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='119' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >무엇을 계산하는지 말할 수 있다</text>
<line x1='93' y1='130' x2='93' y2='142' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='142' width='146' height='32' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='30' y='163' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >2. 읽을 수 있는 상태</text>
<text x='178' y='155' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >입력마다 구별되고, 반복해도 같은 상태</text>
<text x='178' y='170' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 간격마다 다른 x (반복은 가정)</text>
<line x1='440' y1='158' x2='456' y2='158' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='163' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >과제에 필요한 차이가 상태에 남는다</text>
<line x1='93' y1='174' x2='93' y2='186' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='186' width='146' height='32' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='30' y='207' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >3. 학습한 readout</text>
<text x='178' y='199' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >훈련 표본으로 readout의 숫자를 정한다</text>
<text x='178' y='214' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: θ = 1.34 µA</text>
<line x1='440' y1='202' x2='456' y2='202' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='207' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >상태에서 답을 꺼낼 수 있다</text>
<line x1='93' y1='218' x2='93' y2='230' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='230' width='146' height='32' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='30' y='251' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >4. held-out 성능</text>
<text x='178' y='243' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >훈련에 안 쓴 시험 표본으로 채점한다</text>
<text x='178' y='258' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 훈련 100% → 시험 75%</text>
<line x1='440' y1='246' x2='456' y2='246' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='251' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >외운 것이 아니라 일반화했다</text>
<line x1='93' y1='262' x2='93' y2='274' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='274' width='146' height='32' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='30' y='295' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >5. 기준선 비교</text>
<text x='178' y='287' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >device를 뺀 비교(원시 입력·정적 device 등)</text>
<text x='178' y='302' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 원시 입력 75%, 정적 device 50%</text>
<line x1='440' y1='290' x2='456' y2='290' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='295' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >device가 기여했다</text>
<line x1='93' y1='306' x2='93' y2='318' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='318' width='146' height='32' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='30' y='339' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >6. 시스템 비용</text>
<text x='178' y='331' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >변환 회로·readout·대기 전력까지</text>
<text x='178' y='346' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예제: 계산하지 않음</text>
<line x1='440' y1='334' x2='456' y2='334' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='462' y='339' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >시스템으로 쓸 만하다</text>
<text x='320' y='370' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0단은 1–6단의 어느 것도 증명하지 않는다. 폴더 사례들이 어느 단까지 왔는지는 4구간에서 본다.</text>
<text x='320' y='388' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >해독 규칙을 미리 정해 둔 계산(예: 1구간의 고정 문턱 1.5)에는 3·4단이 그대로 적용되지 않는다.</text>
</svg>
