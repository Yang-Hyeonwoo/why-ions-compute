<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 366' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >readout을 학습하는 계산(RC식)의 사다리: 각 단이 증명하는 것</text>
<rect x='20' y='40' width='140' height='30' rx='6' fill='#fff' stroke='#999' stroke-width='1.5' />
<text x='30' y='60' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >0. 현상 재현</text>
<text x='172' y='60' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >PPF·STP/LTP 곡선이 나온다</text>
<line x1='400' y1='55' x2='416' y2='55' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='60' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >소자에 기억(시간상수)이 '있다'</text>
<line x1='90' y1='70' x2='90' y2='80' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='80' width='140' height='30' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='30' y='100' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >1. 과제 정의</text>
<text x='172' y='100' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >입력·정답·평가 척도가 있다</text>
<line x1='400' y1='95' x2='416' y2='95' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='100' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >무엇을 계산하는지 말할 수 있다</text>
<line x1='90' y1='110' x2='90' y2='120' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='120' width='140' height='30' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='30' y='140' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >2. 읽을 수 있는 상태</text>
<text x='172' y='140' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >반복 가능하고 구별되는 상태</text>
<line x1='400' y1='135' x2='416' y2='135' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='140' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >과제에 필요한 차이가 상태에 남는다</text>
<line x1='90' y1='150' x2='90' y2='160' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='160' width='140' height='30' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='30' y='180' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >3. 학습한 readout</text>
<text x='172' y='180' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >훈련 데이터로 출력층을 맞춘다</text>
<line x1='400' y1='175' x2='416' y2='175' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='180' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >상태에서 답을 꺼낼 수 있다</text>
<line x1='90' y1='190' x2='90' y2='200' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='200' width='140' height='30' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='30' y='220' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >4. held-out 성능</text>
<text x='172' y='220' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >안 본 데이터에서 성능이 유지된다</text>
<line x1='400' y1='215' x2='416' y2='215' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='220' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >암기가 아니라 일반화다</text>
<line x1='90' y1='230' x2='90' y2='240' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='240' width='140' height='30' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='30' y='260' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >5. 기준선 비교</text>
<text x='172' y='260' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >raw 입력·정적 소자·디지털 RC와 같은 readout</text>
<line x1='400' y1='255' x2='416' y2='255' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='260' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >소자가 기여했다</text>
<line x1='90' y1='270' x2='90' y2='280' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='280' width='140' height='30' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='30' y='300' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >6. 시스템 비용</text>
<text x='172' y='300' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >변환·readout·대기 전력 포함</text>
<line x1='400' y1='295' x2='416' y2='295' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='420' y='300' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >쓸 만하다</text>
<text x='300' y='334' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0단은 1–6단의 어느 것도 증명하지 않는다. 폴더 사례들이 어느 단까지 왔는지는 4구간에서 본다.</text>
<text x='300' y='352' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >해독 규칙을 미리 정해 둔 계산(예: 고정 문턱)에는 3·4단이 그대로 적용되지 않는다.</text>
</svg>
