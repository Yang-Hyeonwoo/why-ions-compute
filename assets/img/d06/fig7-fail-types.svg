<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 286' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c999' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='330' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >'계산한다'는 주장이 무너지는 세 가지 길</text>
<rect x='16' y='38' width='200' height='214' rx='10' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='30' y='62' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >(a) 문제와 연결이 없다</text>
<rect x='230' y='38' width='200' height='214' rx='10' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='244' y='62' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >(b) 해독 단계가 일을 다 한다</text>
<rect x='444' y='38' width='200' height='214' rx='10' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='458' y='62' font-size='11.5' fill='#7a5ea8' text-anchor='start' font-weight='bold' >(c) 맞은 입력만 골라 보였다</text>
<rect x='46' y='80' width='140' height='34' rx='6' fill='#f4f7fb' stroke='#999' stroke-width='1.2' stroke-dasharray='4 3'/>
<text x='116' y='102' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >문제·답: 정의 없음</text>
<text x='116' y='136' font-size='16' fill='#c8553d' text-anchor='middle' font-weight='bold' >?</text>
<rect x='46' y='150' width='140' height='34' rx='6' fill='#f3faf6' stroke='#13936b' stroke-width='1.2' />
<text x='116' y='172' font-size='11' fill='#13936b' text-anchor='middle' font-weight='normal' >device 전류가 변함</text>
<text x='116' y='210' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >변화는 있지만 무엇의</text>
<text x='116' y='226' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >답인지 정해 두지 않았다</text>
<rect x='250' y='90' width='46' height='30' rx='12' fill='#f3faf6' stroke='#13936b' stroke-width='1.2' />
<text x='273' y='110' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >돌</text>
<line x1='298' y1='105' x2='314' y2='105' stroke='#999' stroke-width='1.3' marker-end='url(#arr-c999)'/>
<rect x='316' y='80' width='96' height='52' rx='6' fill='#fff4ea' stroke='#e08a3c' stroke-width='1.5' />
<text x='364' y='101' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='bold' >해석표</text>
<text x='364' y='118' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='normal' >(다른 컴퓨터)</text>
<line x1='364' y1='134' x2='364' y2='154' stroke='#999' stroke-width='1.3' marker-end='url(#arr-c999)'/>
<text x='364' y='172' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >7 × 8 = 56</text>
<text x='330' y='210' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >56을 이미 알아야 표를</text>
<text x='330' y='226' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >만든다. 돌은 한 일이 없다</text>
<rect x='464.0' y='128' width='70.0269949773159' height='16' rx='0' fill='#e7f5ef' stroke='none' stroke-width='1.2' />
<rect x='534.0269949773159' y='128' width='9.973005022684106' height='16' rx='0' fill='#fbe3dd' stroke='none' stroke-width='1.2' />
<rect x='544.0' y='128' width='80.0' height='16' rx='0' fill='#e7f5ef' stroke='none' stroke-width='1.2' />
<line x1='464' y1='144' x2='624' y2='144' stroke='#999' stroke-width='1'/>
<line x1='482.51025705278073' y1='144' x2='482.51025705278073' y2='148' stroke='#999' stroke-width='1'/>
<text x='482.51025705278073' y='161' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10</text>
<line x1='544.0' y1='144' x2='544.0' y2='148' stroke='#999' stroke-width='1'/>
<text x='544.0' y='161' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >100</text>
<line x1='605.4897429472193' y1='144' x2='605.4897429472193' y2='148' stroke='#999' stroke-width='1'/>
<text x='605.4897429472193' y='161' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >1000</text>
<text x='624' y='176' font-size='11' fill='#999' text-anchor='end' font-weight='normal' >간격 Δt (ms, 로그)</text>
<text x='539.013497488658' y='122' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >69–99 ms: 틀림</text>
<circle cx='482.5' cy='136' r='5' fill='#3d6fb4'/>
<circle cx='605.5' cy='136' r='5' fill='#3d6fb4'/>
<text x='544' y='88' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >● 잰 입력: 10 ms, 1 s</text>
<text x='544' y='210' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >두 점만 재면 닫히지 않는</text>
<text x='544' y='226' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >구간을 모른 채 넘어간다</text>
<text x='330' y='274' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >(b)가 오늘의 핵심: 해독 규칙(readout)이 크고 복잡해 일을 다 하면 device는 계산한 것이 아니다.</text>
</svg>
