<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 340' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='330' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >폴더 사례: 'device 성능'과 '기준선'을 나란히 놓으면 (정확도 %, 논문이 적은 값)</text>
<text x='246' y='60' font-size='10.5' fill='#444' text-anchor='end' font-weight='bold' >Lee 2025 (npj UC), N-MNIST</text>
<text x='246' y='76' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >기준선: 원시 4프레임 + 같은 방식의 readout</text>
<rect x='256' y='50' width='180.84520000000003' height='12' rx='2' fill='#c8553d' stroke='none' stroke-width='1.2' />
<text x='441.84520000000003' y='60' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >device 90.01</text>
<rect x='256' y='66' width='186.76639999999995' height='12' rx='2' fill='#ccc' stroke='none' stroke-width='1.2' />
<text x='447.7664' y='76' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >기준선 91.32</text>
<text x='600' y='68' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >device &lt; 기준선</text>
<text x='246' y='116' font-size='10.5' fill='#444' text-anchor='end' font-weight='bold' >Zhong 2022 (Nat. Electron.), 부정맥</text>
<text x='246' y='132' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >기준선: 완전 디지털 RC (device 제거 아님)</text>
<rect x='256' y='106' width='210.63199999999998' height='12' rx='2' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<text x='471.63199999999995' y='116' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >device 96.6</text>
<rect x='256' y='122' width='217.864' height='12' rx='2' fill='#ccc' stroke='none' stroke-width='1.2' />
<text x='478.86400000000003' y='132' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >기준선 98.2</text>
<text x='600' y='124' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >device &lt; 디지털 RC</text>
<text x='246' y='172' font-size='10.5' fill='#444' text-anchor='end' font-weight='bold' >Koh 2022 (Sci. Rep., 폴더 밖), MNIST</text>
<text x='246' y='188' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >기준선: 입력 픽셀 직접 readout; 저자: device가 더 낮음</text>
<rect x='256' y='162' width='181.704' height='12' rx='2' fill='#999' stroke='none' stroke-width='1.2' />
<text x='442.704' y='172' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >device 90.2</text>
<text x='260' y='188' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >기준선 수치는 원문 그림에만 있음(미확인)</text>
<text x='600' y='180' font-size='10' fill='#999' text-anchor='middle' font-weight='bold' >수치 미확인</text>
<text x='246' y='228' font-size='10.5' fill='#444' text-anchor='end' font-weight='bold' >Chen 2025 (Adv. Mater.), MNIST</text>
<text x='246' y='244' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >기준선: SVM (입력 조건 불명)</text>
<rect x='256' y='218' width='171.76' height='12' rx='2' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='432.76' y='228' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >device 88</text>
<rect x='256' y='234' width='49.72' height='12' rx='2' fill='#ccc' stroke='none' stroke-width='1.2' />
<text x='310.72' y='244' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >기준선 61</text>
<text x='600' y='236' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >device &gt; 기준선?</text>
<line x1='256' y1='274' x2='482' y2='274' stroke='#999' stroke-width='1'/>
<text x='256.0' y='288' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >50</text>
<text x='369.0' y='288' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >75</text>
<text x='482.0' y='288' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >100</text>
<text x='330' y='310' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >Chen 2025의 SVM 수치(≈61%)는 Fig. 4g에서 눈으로 읽은 값이고 본문에 숫자가 없다. SVM 입력이 원시 픽셀인지 불명.</text>
<text x='330' y='326' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >기준선 종류가 다르면 막대 길이를 비교할 수 없다. 원시 입력 기준선의 수치까지 확인되는 사례는 Lee 2025뿐.</text>
</svg>
