<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 388' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='310' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >Phase 1의 주장 사슬: 어디가 가장 약한가 (내 답에서 고를 것)</text>
<rect x='14' y='42' width='72' height='40' rx='6' fill='#fff' stroke='#7a5ea8' stroke-width='1.5' />
<text x='50' y='67' font-size='12' fill='#7a5ea8' text-anchor='middle' font-weight='bold' >Day 1–2</text>
<text x='96' y='59' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >'뉴로모픽'은 여러 줄기를 덮는 우산 이름이고, 이온 device</text>
<text x='96' y='74' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >논문 상당수는 (마) 회색지대(시냅스 현상 재현)에 있다</text>
<text x='600' y='67' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >리뷰 정의 인용 + [해석]</text>
<line x1='50' y1='82' x2='50' y2='96' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='14' y='96' width='72' height='40' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='50' y='121' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >Day 3–4</text>
<text x='96' y='113' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >기다릴 수 없는 입력·칩 안에 못 두는 weight가 겹치는</text>
<text x='96' y='128' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >계산에서 기존 컴퓨터는 이동·전력·정밀도 벽에 막힐 수 있다</text>
<text x='600' y='121' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >[해석] + 수치 대부분 [미확인]</text>
<line x1='50' y1='136' x2='50' y2='150' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='14' y='150' width='72' height='40' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='50' y='175' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >Day 5–6</text>
<text x='96' y='167' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >뇌의 원리는 조건이 맞을 때 그 비용을 줄일 수 있다는</text>
<text x='96' y='182' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >조건부 존재 증명이다</text>
<text x='600' y='175' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >리뷰 인용; '20 W'는 공개 문헌 [확인]</text>
<line x1='50' y1='190' x2='50' y2='204' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='14' y='204' width='72' height='40' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='50' y='229' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >Day 7–8</text>
<text x='96' y='221' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >crossbar·LIF·시냅스 device의 spec은</text>
<text x='96' y='236' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >응용(inference/학습/RC 노드)마다 다르다</text>
<text x='600' y='229' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >리뷰 인용; 내 device 수치 없음</text>
<line x1='50' y1='244' x2='50' y2='258' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='14' y='258' width='72' height='40' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='50' y='283' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >Day 9</text>
<text x='96' y='275' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >적합한 자리는 좁고, 경쟁자는</text>
<text x='96' y='290' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >MCU + 작은 신경망이다</text>
<text x='600' y='283' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >MCU 비교가 폴더에 없음 [가설]</text>
<line x1='50' y1='298' x2='50' y2='312' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='14' y='312' width='72' height='40' rx='6' fill='#fff' stroke='#444' stroke-width='1.5' />
<text x='50' y='337' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >Day 10</text>
<text x='96' y='329' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >현상 재현은 계산이 아니다. 학습형(RC식) 계산의</text>
<text x='96' y='344' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >검증 조건은 사다리 1–6단이다</text>
<text x='600' y='337' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >Stepney·Singh·Liang 인용</text>
<text x='310' y='374' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >오른쪽 열이 각 고리의 근거 상태다. [가설]과 [미확인]이 몰린 곳이 '가장 약한 고리' 후보다.</text>
</svg>
