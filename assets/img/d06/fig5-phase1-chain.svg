<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 336' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >Phase 1의 주장 사슬: 어디가 가장 약한가 (내 답에서 고를 것)</text>
<rect x='20' y='42' width='50' height='40' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='45' y='67' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >D2</text>
<text x='82' y='59' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >배치 1·실시간·재사용 없는 계산에서</text>
<text x='82' y='74' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >기존 컴퓨터는 이동·전력·정밀도 벽에 막힌다</text>
<text x='580' y='67' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >[해석] + 수치 대부분 [미확인]</text>
<line x1='45' y1='82' x2='45' y2='96' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='96' width='50' height='40' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='45' y='121' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >D3</text>
<text x='82' y='113' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >뇌의 원리는 조건부로 그 비용을 줄이는</text>
<text x='82' y='128' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >존재 증명이다</text>
<text x='580' y='121' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >리뷰 인용; '20 W'는 공개 문헌 [확인]</text>
<line x1='45' y1='136' x2='45' y2='150' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='150' width='50' height='40' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='45' y='175' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >D4</text>
<text x='82' y='167' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >crossbar·LIF·시냅스 소자의 사양은</text>
<text x='82' y='182' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >용도(추론/학습/RC 노드)마다 다르다</text>
<text x='580' y='175' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >리뷰 인용; 내 소자 수치 없음</text>
<line x1='45' y1='190' x2='45' y2='204' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='204' width='50' height='40' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='45' y='229' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >D5</text>
<text x='82' y='221' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >적합한 자리는 좁고, 경쟁자는</text>
<text x='82' y='236' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >MCU + 작은 NN이다</text>
<text x='580' y='229' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >MCU 비교가 폴더에 없음 [가설]</text>
<line x1='45' y1='244' x2='45' y2='258' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='20' y='258' width='50' height='40' rx='6' fill='#fff' stroke='#444' stroke-width='1.5' />
<text x='45' y='283' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >D6</text>
<text x='82' y='275' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >현상 재현은 계산이 아니다. 학습형(RC식)</text>
<text x='82' y='290' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >계산의 검증 조건은 1–6단이다</text>
<text x='580' y='283' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >Stepney·Singh·Liang 인용</text>
<text x='300' y='322' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >오른쪽 열이 각 고리의 근거 상태다. [가설]과 [미확인]이 몰린 곳이 '가장 약한 고리' 후보다.</text>
</svg>
