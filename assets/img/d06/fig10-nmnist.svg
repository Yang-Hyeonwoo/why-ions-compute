<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 338' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c999' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='340.0' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >Lee 2025의 N-MNIST: device를 거친 길과 device를 뺀 길(raw input baseline)</text>
<text x='20' y='59' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >숫자 하나</text>
<rect x='112' y='46' width='42' height='42' rx='3' fill='#fff' stroke='#999' stroke-width='1.2' />
<rect x='136' y='60' width='8' height='8' rx='1' fill='#fff' stroke='#444' stroke-width='0.8' />
<text x='133' y='102' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >프레임 1</text>
<text x='140' y='69.5' font-size='9' fill='#444' text-anchor='middle' font-weight='bold' >0</text>
