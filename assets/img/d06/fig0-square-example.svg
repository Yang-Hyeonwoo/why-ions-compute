<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 308' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='18' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >기초 1의 사각형을 작은 문제에 적용: '두 펄스 사이 간격이 100 ms보다 짧았나?'</text>
<rect x='10' y='28' width='680' height='116' rx='8' fill='#f4f7fb' stroke='none' stroke-width='1.2' />
<rect x='10' y='160' width='680' height='116' rx='8' fill='#f3faf6' stroke='none' stroke-width='1.2' />
<text x='22' y='46' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >추상 세계 (문제·숫자·답)</text>
<text x='22' y='268' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >물리 세계 (device·전압·이온)</text>
<rect x='40' y='58' width='200' height='52' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='140' y='78' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >문제의 입력</text>
<text x='140' y='98' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >간격 Δt = 10 ms</text>
<rect x='430' y='58' width='220' height='52' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='540' y='78' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >추상 세계의 답</text>
<text x='540' y='98' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 (100 ms보다 짧다)</text>
<line x1='242' y1='86' x2='426' y2='86' stroke='#3d6fb4' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='334' y='78' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >사람이 직접 판단: 10 &lt; 100</text>
<rect x='40' y='184' width='200' height='52' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.4' />
<text x='140' y='204' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >물리 입력</text>
<text x='140' y='224' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >펄스 2개, 10 ms 간격</text>
<rect x='430' y='184' width='220' height='52' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.4' />
<text x='540' y='204' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >측정한 물리 상태</text>
<text x='540' y='224' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >I₂ = 1.88 µA (I₁ = 1.00 µA)</text>
<line x1='242' y1='210' x2='426' y2='210' stroke='#13936b' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='334' y='230' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >② device가 물리 법칙대로 변한다</text>
<line x1='140' y1='112' x2='140' y2='182' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='150' y='140' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >① 부호화</text>
<text x='150' y='156' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >Δt를 펄스 두 개로</text>
<line x1='540' y1='182' x2='540' y2='112' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='530' y='140' font-size='10.5' fill='#444' text-anchor='end' font-weight='bold' >③ 해독</text>
<text x='530' y='156' font-size='10' fill='#444' text-anchor='end' font-weight='normal' >1.88 ÷ 1.00 = 1.88 &gt; 1.5 → 1</text>
<text x='552' y='140' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='bold' >④ 비교</text>
<text x='552' y='156' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >1 = 1 → 사각형이 닫힌다</text>
<text x='350' y='296' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >I₂는 모형 device의 가상 측정값. 간격 1 s면 I₂ = 1.05 µA → 비 1.05 &lt; 1.5 → 0('길다')으로 해독되어 이때도 닫힌다.</text>
</svg>
