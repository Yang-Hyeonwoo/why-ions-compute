<rect x='127.4' y='171.5' width='9' height='9' fill='#fff' stroke='#e08a3c' stroke-width='1.8' transform='rotate(45 131.9 176)'/>
<text x='140.89473684210532' y='180' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >600 ms</text>
<text x='70' y='130' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >← 0('길다')로 답</text>
<text x='560' y='130' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >1('짧다')로 답 →</text>
<text x='12' y='216' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >(b) 원시 입력 기준선: device 없이 Δt 숫자로 답하기 (가로축 로그)</text>
<line x1='70' y1='266' x2='560' y2='266' stroke='#444' stroke-width='1.2'/>
<line x1='126.68766222414098' y1='263' x2='126.68766222414098' y2='269' stroke='#444' stroke-width='1'/>
<text x='126.68766222414098' y='296' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >10 ms</text>
<line x1='315.0' y1='263' x2='315.0' y2='269' stroke='#444' stroke-width='1'/>
<text x='315.0' y='296' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >100 ms</text>
<line x1='503.31233777585896' y1='263' x2='503.31233777585896' y2='269' stroke='#444' stroke-width='1'/>
<text x='503.31233777585896' y='296' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1 s</text>
