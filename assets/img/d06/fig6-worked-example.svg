<text x='371.49274225886614' y='234' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='bold' >θ = 190 ms (훈련 표본으로 정함)</text>
<text x='70' y='234' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >← 1('짧다')로 답</text>
