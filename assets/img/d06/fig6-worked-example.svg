<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 440' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c999' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='300' y='18' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >처음부터 끝까지: '펄스 간격이 100 ms보다 짧았나?'를 맞히는 예제 (모형 device, 가상 측정값)</text>
<rect x='12' y='30' width='102' height='40' rx='6' fill='#fff' stroke='#999' stroke-width='1.4' />
<text x='63' y='46' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >입력</text>
<text x='63' y='62' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >펄스 2개, 간격 Δt</text>
<line x1='115' y1='50' x2='128' y2='50' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='130' y='30' width='102' height='40' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.4' />
<text x='181' y='46' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >device</text>
<text x='181' y='62' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >기억이 있는 이온 device</text>
<line x1='233' y1='50' x2='246' y2='50' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
