<circle cx='503.3' cy='254' r='5' fill='#e08a3c'/>
<rect x='122.2' y='273.5' width='9' height='9' fill='#fff' stroke='#3d6fb4' stroke-width='1.8' transform='rotate(45 126.7 278)'/>
<rect x='253.8' y='273.5' width='9' height='9' fill='#fff' stroke='#3d6fb4' stroke-width='1.8' transform='rotate(45 258.3 278)'/>
<rect x='325.4' y='273.5' width='9' height='9' fill='#fff' stroke='#c8553d' stroke-width='2.4' transform='rotate(45 329.9 278)'/>
<text x='320.9108055512337' y='282' font-size='9.5' fill='#c8553d' text-anchor='end' font-weight='bold' >틀림</text>
<rect x='457.0' y='273.5' width='9' height='9' fill='#fff' stroke='#e08a3c' stroke-width='1.8' transform='rotate(45 461.5 278)'/>
<text x='12' y='314' font-size='11.5' fill='#999' text-anchor='start' font-weight='bold' >(c) 정적 device 기준선: 기억 없는 저항이면</text>
<line x1='70' y1='336' x2='300' y2='336' stroke='#444' stroke-width='1.2'/>
<circle cx='70.0' cy='326' r='5' fill='#999'/>
<line x1='70.0' y1='333' x2='70.0' y2='339' stroke='#444' stroke-width='1'/>
<text x='70.0' y='352' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1.0 µA</text>
<text x='90' y='330' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >8개 표본이 모두 x = 1.00 µA (간격과 무관) → 어떤 θ로도 가를 수 없다</text>
<rect x='12' y='360' width='576' height='46' rx='6' fill='#f7f7f7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='22' y='376' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >시험 정확도: (a) device 3/4 = 75%   (b) 원시 입력 3/4 = 75%   (c) 정적 device 2/4 = 50%</text>
<text x='22' y='394' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >훈련 정확도는 (a)·(b) 모두 4/4 = 100%. 훈련 표본을 외우기만 한 readout: 훈련 4/4, 시험 0/4(표에 없는 x값).</text>
<circle cx='20' cy='426' r='5' fill='#444'/>
<text x='30' y='430' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >훈련 표본</text>
