<text x='12' y='102' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >(a) device 상태 x로 답하기</text>
<line x1='70' y1='164' x2='560' y2='164' stroke='#444' stroke-width='1.2'/>
<line x1='70.0' y1='161' x2='70.0' y2='167' stroke='#444' stroke-width='1'/>
