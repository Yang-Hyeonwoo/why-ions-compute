<text x='299' y='62' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >둘째 펄스 전류(µA)</text>
<line x1='351' y1='50' x2='364' y2='50' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
<rect x='366' y='30' width='102' height='40' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.4' />
