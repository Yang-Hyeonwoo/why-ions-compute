<text x='173.15789473684208' y='194' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1.2</text>
<line x1='276.31578947368416' y1='161' x2='276.31578947368416' y2='167' stroke='#444' stroke-width='1'/>
<text x='276.31578947368416' y='194' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1.4</text>
<line x1='379.47368421052636' y1='161' x2='379.47368421052636' y2='167' stroke='#444' stroke-width='1'/>
<text x='379.47368421052636' y='194' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1.6</text>
<line x1='482.63157894736844' y1='161' x2='482.63157894736844' y2='167' stroke='#444' stroke-width='1'/>
