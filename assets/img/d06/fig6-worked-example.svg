<text x='241.36842105263165' y='114' font-size='10' fill='#e08a3c' text-anchor='end' font-weight='bold' >θ = 1.34 (훈련 표본으로 정함)</text>
<line x1='281.4736842105263' y1='118' x2='281.4736842105263' y2='164' stroke='#999' stroke-width='1' stroke-dasharray='2 2'/>
<text x='285.4736842105263' y='114' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >실제 경계 100 ms = 1.41</text>
