<circle cx='210' cy='426' r='5' fill='#3d6fb4'/>
<text x='220' y='430' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >정답 1(짧다)</text>
<circle cx='296' cy='426' r='5' fill='#e08a3c'/>
<text x='306' y='430' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >정답 0(길다)</text>
<text x='380' y='430' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >빨간 테두리 = 틀린 답</text>
