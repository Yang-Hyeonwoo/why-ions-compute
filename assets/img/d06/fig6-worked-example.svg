<text x='417' y='62' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >x &gt; θ 이면 1('짧다')</text>
<line x1='469' y1='50' x2='482' y2='50' stroke='#999' stroke-width='1.2' marker-end='url(#arr-c999)'/>
