<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 272' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >PPF 곡선 하나가 말해 주는 것: 시간상수 두 개. 말해 주지 않는 것: 과제 성능 (계산)</text>
<rect x='70' y='44' width='230' height='156' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<polyline points='70.0,60.0 72.9,60.2 75.8,60.4 78.6,60.7 81.5,61.0 84.4,61.4 87.2,61.7 90.1,62.2 93.0,62.6 95.9,63.2 98.8,63.8 101.6,64.4 104.5,65.1 107.4,66.0 110.2,66.9 113.1,67.9 116.0,69.0 118.9,70.2 121.8,71.6 124.6,73.1 127.5,74.7 130.4,76.5 133.2,78.5 136.1,80.7 139.0,83.1 141.9,85.6 144.8,88.4 147.6,91.4 150.5,94.6 153.4,98.0 156.2,101.5 159.1,105.3 162.0,109.2 164.9,113.3 167.8,117.5 170.6,121.7 173.5,125.9 176.4,130.1 179.2,134.2 182.1,138.2 185.0,142.0 187.9,145.7 190.8,149.0 193.6,152.2 196.5,155.1 199.4,157.8 202.2,160.4 205.1,162.8 208.0,165.1 210.9,167.4 213.8,169.7 216.6,172.0 219.5,174.4 222.4,176.8 225.2,179.2 228.1,181.6 231.0,183.9 233.9,186.2 236.8,188.4 239.6,190.5 242.5,192.3 245.4,194.0 248.2,195.4 251.1,196.6 254.0,197.6 256.9,198.4 259.8,199.0 262.6,199.4 265.5,199.6 268.4,199.8 271.2,199.9 274.1,200.0 277.0,200.0 279.9,200.0 282.8,200.0 285.6,200.0 288.5,200.0 291.4,200.0 294.2,200.0 297.1,200.0 300.0,200.0' fill='none' stroke='#13936b' stroke-width='2.2' stroke-linejoin='round'/>
<text x='70.0' y='214' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1 ms</text>
<text x='127.5' y='214' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >10 ms</text>
<text x='185.0' y='214' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0.1 s</text>
<text x='242.5' y='214' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1 s</text>
<text x='300.0' y='214' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >10 s</text>
<text x='185.0' y='230' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >펄스 간격 Δt (로그)</text>
<text x='64' y='54' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >PPF (%)</text>
<text x='64' y='204.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >100</text>
<line x1='70' y1='200.0' x2='300' y2='200.0' stroke='#f0f0f0' stroke-width='1'/>
<text x='64' y='133.0909090909091' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >150</text>
<line x1='70' y1='129.0909090909091' x2='300' y2='129.0909090909091' stroke='#f0f0f0' stroke-width='1'/>
<text x='64' y='62.18181818181819' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >200</text>
<line x1='70' y1='58.18181818181819' x2='300' y2='58.18181818181819' stroke='#f0f0f0' stroke-width='1'/>
<text x='97.4344721463806' y='53.47647154504429' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >τ₁ = 50 ms, τ₂ = 0.5 s</text>
<text x='330' y='60' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >이 곡선에서 알 수 있는 것</text>
<text x='330' y='80' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 최근 입력의 영향이 남는다 (기억)</text>
<text x='330' y='96' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 그 영향이 사라지는 시간: 시간상수 두 개</text>
<text x='330' y='124' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >이 곡선만으로는 알 수 없는 것</text>
<text x='330' y='144' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 누적이 비선형인가 (선형 회로도 PPF를 낸다)</text>
<text x='330' y='160' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 서로 다른 입력열이 다른 상태로 끝나는가</text>
<text x='330' y='176' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 그 상태가 반복 측정에서 재현되는가</text>
<text x='330' y='192' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• readout이 안 본 데이터에서 답을 맞히는가</text>
<text x='330' y='208' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 원시 입력 + 같은 readout보다 나은가</text>
<text x='330' y='224' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• ADC·readout을 넣은 시스템 비용</text>
<text x='300' y='258' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>PPF = 두 번째 응답 ÷ 첫 번째 응답 × 100. 곡선은 100·(1 + 0.6·e</tspan><tspan dy='-6' font-size='8'>−Δt/τ₁</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> + 0.4·e</tspan><tspan dy='-6' font-size='8'>−Δt/τ₂</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>)의 모형이며 특정 소자의 측정값이 아니다.</tspan></text>
</svg>
