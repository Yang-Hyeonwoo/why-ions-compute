<text x='185.0' y='246' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >펄스 간격 Δt (로그 축: 한 칸에 10배)</text>
<text x='8' y='50' font-size='13' fill='#444' text-anchor='start' font-weight='bold' >(a)</text>
<text x='40' y='50' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >PPF 지수 (%)</text>
<text x='64' y='220.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >100</text>
