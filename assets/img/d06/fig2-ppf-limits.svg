<text x='64' y='78.18181818181819' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >200</text>
<circle cx='127.5' cy='90.7' r='4' fill='#3d6fb4'/>
<text x='133.5' y='82.7294584523267' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >188% (Δt = 10 ms)</text>
<circle cx='242.5' cy='208.3' r='4' fill='#e08a3c'/>
<text x='298.5' y='188.32279830282855' font-size='9.5' fill='#e08a3c' text-anchor='end' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >105% (Δt = 1 s)</text>
<text x='74.55292164773842' y='206' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >τ₁ = 50 ms, τ₂ = 0.5 s</text>
<text x='324' y='50' font-size='13' fill='#444' text-anchor='start' font-weight='bold' >(b)</text>
<text x='352' y='74' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >이 곡선에서 알 수 있는 것</text>
<text x='352' y='94' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 최근 입력의 영향이 남는다 (기억)</text>
<text x='352' y='110' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 그 영향이 사라지는 시간: 시간상수 두 개</text>
<text x='352' y='138' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' >이 곡선만으로는 알 수 없는 것</text>
<text x='352' y='158' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 누적이 비선형인가 (선형 회로도 PPF를 낸다)</text>
<text x='352' y='174' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 서로 다른 입력열이 다른 state로 끝나는가</text>
<text x='352' y='190' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• 그 state가 반복 측정에서 재현되는가</text>
<text x='352' y='206' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• readout이 안 본 데이터에서 답을 맞히는가</text>
<text x='352' y='222' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• raw input + 같은 readout보다 나은가</text>
<text x='352' y='238' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >• ADC·readout을 넣은 시스템 비용</text>
<text x='300' y='274' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >PPF 지수 = 두 번째 응답 ÷ 첫 번째 응답 × 100. 모형 곡선이며 특정 device의 측정값이 아니다.</text>
</svg>
