<text x='300' y='246' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >p = 30일 때 훈련 R² = 0.74, held-out R² ≤ −1.00 (seed 7, 20회 평균).</text>
<text x='300' y='262' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >상태 수가 표본 수에 가까워지면 아무 정보 없는 상태로도 훈련은 맞는다.</text>
<text x='300' y='278' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >그래서 증거는 held-out 성능이고, 상태 수·표본 수·readout 크기를 함께 적는다.</text>
