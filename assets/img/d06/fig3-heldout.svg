<text x='261.75' y='140.57690358446067' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >held-out sample에서 잰 R²</text>
