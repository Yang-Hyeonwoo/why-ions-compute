<text x='300' y='306' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >p = 30: training R² = 0.74, held-out R² = −2.65 (seed 7, 20회 평균).</text>
<text x='300' y='322' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >state 수 p가 sample 수 n에 가까워지면, 아무 정보 없는 state로도 training은 맞는다.</text>
<text x='300' y='338' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >그래서 증거는 held-out 성능이고, state 수·sample 수·readout 크기를 함께 적는다.</text>
