<text x='26.0' y='270.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >막대: 1을 기준으로 오른쪽은 늘어남, 왼쪽은 줄어듦(로그 눈금). 초록은 바라는 쪽, 빨강은 손해 쪽.</text>
<text x='26.0' y='290.0' font-size='11' fill='#999' text-anchor='start' font-weight='normal' ><tspan>가정: 염이 Tg를 10 K 올림, 해리도 같음, VFT B = 1000 K. 계면 충전 시간 = λ</tspan><tspan dy='3.3' font-size='8.8'>D</tspan><tspan dy='-3.3' font-size='1'>​</tspan><tspan>L/D, λ</tspan><tspan dy='3.3' font-size='8.8'>D</tspan><tspan dy='-3.3' font-size='1'>​</tspan><tspan> ×0.71. (Claude가 계산해 그림)</tspan></text>
