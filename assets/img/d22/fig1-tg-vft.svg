<text x='345.0' y='208.9' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >10⁻⁴</text>
<line x1='350.0' y1='147.7' x2='640.0' y2='147.7' stroke='#eeeeee' stroke-width='1'/>
<text x='345.0' y='151.7' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >10⁻²</text>
<line x1='350.0' y1='90.6' x2='640.0' y2='90.6' stroke='#eeeeee' stroke-width='1'/>
<text x='345.0' y='94.6' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >1</text>
<line x1='350.0' y1='262.0' x2='350.0' y2='266.0' stroke='#999' stroke-width='1'/>
<text x='350.0' y='278.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >200</text>
<line x1='446.7' y1='262.0' x2='446.7' y2='266.0' stroke='#999' stroke-width='1'/>
<text x='446.7' y='278.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >250</text>
<line x1='543.3' y1='262.0' x2='543.3' y2='266.0' stroke='#999' stroke-width='1'/>
<text x='543.3' y='278.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >300</text>
<line x1='640.0' y1='262.0' x2='640.0' y2='266.0' stroke='#999' stroke-width='1'/>
<text x='640.0' y='278.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >350</text>
<text x='495.0' y='293.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >온도 T (K)</text>
<line x1='539.8' y1='62.0' x2='539.8' y2='262.0' stroke='#999' stroke-width='1' stroke-dasharray='4 3'/>
<text x='536.8' y='256.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >25 °C</text>
<line x1='563.0' y1='62.0' x2='563.0' y2='262.0' stroke='#999' stroke-width='1' stroke-dasharray='4 3'/>
<text x='566.0' y='256.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >37 °C</text>
