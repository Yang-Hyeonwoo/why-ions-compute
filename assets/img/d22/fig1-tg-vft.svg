<text x='521.8' y='121.5' font-size='10' fill='#444' text-anchor='end' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >약 77배</text>
<text x='340.0' y='322.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >예시 매개변수(B = 1000 K, T₀ = Tg − 50 K): 25 °C의 두 재료 비 ≈ 77배, 25 → 37 °C에 Tg가 높은 쪽 4.3배·낮은 쪽 1.8배.</text>
<text x='340.0' y='340.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >식 σ = A·exp[−B/(T − T₀)]의 모양을 보이는 계산이며 특정 재료의 측정값이 아니다. 곡선은 Tg(빈 원)부터 그렸다. (Claude가 계산해 그림)</text>
