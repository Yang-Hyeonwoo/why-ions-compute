<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 350' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='340.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >사슬이 덜 굳을수록(Tg가 낮을수록) 무용매 고분자 속 이온이 잘 움직인다 (VFT 예시 계산)</text>
<rect x='20.0' y='50.0' width='230.0' height='116.0' rx='6' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='135.0' y='70.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >T &lt; Tg: 유리 상태</text>
<text x='135.0' y='90.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >사슬 분절이 거의 얼어 있다</text>
<text x='135.0' y='108.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >→ 이온이 옮겨 갈 빈자리가 드물다</text>
<text x='135.0' y='126.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >(남는 길: 자리 뛰기 hopping)</text>
<text x='135.0' y='152.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(냉동실의 고무줄: 딱딱하고 잘 부러짐)</text>
<rect x='20.0' y='178.0' width='230.0' height='116.0' rx='6' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='135.0' y='198.0' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >T &gt; Tg: 고무 상태</text>
<text x='135.0' y='218.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >사슬 분절이 꿈틀거린다</text>
<text x='135.0' y='236.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >→ 이온이 분절을 따라 자리를 옮긴다</text>
<text x='135.0' y='254.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >→ 이 영역의 온도 의존이 VFT 식</text>
<text x='135.0' y='280.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(T가 Tg에서 멀수록 빨라진다)</text>
<text x='310.0' y='46.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >상대 전도도(로그 눈금, 25 °C의 Tg −60 °C 재료 = 1)</text>
<rect x='350.0' y='62.0' width='290.0' height='200.0' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
