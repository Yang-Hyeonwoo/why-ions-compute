<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >이온–고분자 결합은 '세게'가 아니라 '어디에 얼마나'가 문제다 (모식도)</text>
<rect x='110.0' y='50.0' width='300.0' height='220.0' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<rect x='110.0' y='50.0' width='150.0' height='110.0' rx='0' fill='#eef9f4' stroke='none' stroke-width='1.2' />
<line x1='110.0' y1='160.0' x2='410.0' y2='160.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='4 3'/>
<line x1='260.0' y1='50.0' x2='260.0' y2='270.0' stroke='#d9d9d9' stroke-width='1' stroke-dasharray='4 3'/>
<line x1='110.0' y1='270.0' x2='420.0' y2='270.0' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<line x1='110.0' y1='270.0' x2='110.0' y2='40.0' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='260.0' y='290.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >출발지(이온을 내놓는 고분자)와의 결합 →</text>
<text x='98.0' y='160.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' transform='rotate(-90 98 160.0)'>도착지(이온이 머무는 층)와의 결합 →</text>
<text x='185.0' y='68.0' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >잘 떠나고 잘 머문다</text>
<text x='185.0' y='83.0' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >= 바뀌기 쉽고 오래 남음</text>
<text x='335.0' y='68.0' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >떠나기 어렵다</text>
<text x='335.0' y='83.0' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 상태를 바꾸기 어려움</text>
<text x='185.0' y='240.0' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >잘 떠나지만 곧 돌아온다</text>
<text x='185.0' y='256.0' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >= 휘발성</text>
<text x='335.0' y='240.0' font-size='10' fill='#999' text-anchor='middle' font-weight='bold' >떠나기 어렵고 가도 못 머문다</text>
<text x='335.0' y='256.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >= 쓰기도 유지도 나쁨</text>
<circle cx='200.0' cy='111.6' r='6' fill='#13936b' stroke='none'/>
<text x='209.0' y='115.6' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >TFSI⁻</text>
<circle cx='164.0' cy='142.4' r='6' fill='#e08a3c' stroke='none'/>
<text x='173.0' y='146.4' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >FSI⁻</text>
<circle cx='236.0' cy='215.0' r='6' fill='#3d6fb4' stroke='none'/>
<text x='245.0' y='219.0' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >DCN⁻</text>
<circle cx='350.0' cy='94.0' r='6' fill='#c8553d' stroke='none'/>
<text x='359.0' y='98.0' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >Br⁻</text>
<text x='440.0' y='64.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >예: Zheng 2025 이온탄성체</text>
<text x='440.0' y='84.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >같은 폴리양이온 사슬, 음이온만 교환</text>
<text x='440.0' y='102.0' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >· Br⁻: 사슬에 강하게 붙어 전환 어려움</text>
<text x='440.0' y='120.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >· TFSI⁻: 잘 떠나고 P3HT에 머묾</text>
<text x='440.0' y='138.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >  → 히스테리시스·유지 가장 큼</text>
<text x='440.0' y='156.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >· DCN⁻: P3HT와 약해 유지 나쁨</text>
<text x='440.0' y='180.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >[Zheng 2025, p.2, 5]</text>
<text x='440.0' y='214.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >점의 위치는 저자의 DFT 순위와</text>
<text x='440.0' y='230.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >해석을 옮긴 개념 배치이며</text>
<text x='440.0' y='246.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >결합에너지 값이 아니다.</text>
<text x='320.0' y='318.0' font-size='9.8' fill='#999' text-anchor='middle' font-weight='normal' >같은 원리가 cation–π(Zhou 2025), zwitterion(Lee 2025), 곁사슬 포획(Sung 2024)에도 쓰인다. (Claude가 그림, 모식도)</text>
</svg>
