<text x='40.0' y='146.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >Δ/σ = 4: 문턱까지 2σ → 틀릴 확률 2.3%</text>
<text x='40.0' y='236.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >파랑 = 입력 A를 반복해 넣었을 때 상태의 분포, 주황 = 입력 B.</text>
<text x='40.0' y='250.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >점선 = readout의 문턱. 색칠한 꼬리 = 문턱을 넘어가 틀리는 몫.</text>
<text x='360.0' y='62.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >Δ/σ</text>
<text x='410.0' y='62.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >문턱까지</text>
<text x='485.0' y='62.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >틀릴 확률</text>
<text x='360.0' y='86.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >0.5</text>
<text x='410.0' y='86.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >0.25σ</text>
<text x='485.0' y='86.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >40.13%</text>
<text x='360.0' y='110.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >1</text>
<text x='410.0' y='110.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >0.5σ</text>
<text x='485.0' y='110.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >30.85%</text>
<text x='360.0' y='134.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >2</text>
<text x='410.0' y='134.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >1σ</text>
<text x='485.0' y='134.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >15.87%</text>
<text x='360.0' y='158.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >4</text>
<text x='410.0' y='158.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >2σ</text>
<text x='485.0' y='158.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >2.28%</text>
<text x='360.0' y='182.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >6</text>
<text x='410.0' y='182.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >3σ</text>
<text x='485.0' y='182.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >0.13%</text>
<text x='360.0' y='216.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >같은 측정을 n번 평균하면 σ가 √n분의 1로</text>
<text x='360.0' y='231.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >줄어 Δ/σ가 √n배가 된다(4번 → 2배).</text>
<text x='360.0' y='246.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >대신 시간·에너지가 n배 든다.</text>
<text x='300.0' y='280.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >두 상태의 반복 흔들림이 같은 크기의 종 모양(정규분포)이고 문턱을 가운데에 둔다고 가정한 계산이다. (Claude가 계산해 그림)</text>
</svg>
