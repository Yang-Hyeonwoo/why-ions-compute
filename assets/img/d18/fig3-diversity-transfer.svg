<text x='300.0' y='334.0' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >② 빨강·파랑은 칩 20쌍의 중앙값, 초록은 평균. 측정 잡음 표준편차 0.005(예시 가정).</text>
