<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300.0' y='20.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >주장의 세 수준과 각 수준에 필요한 증거 (Singh 2026 p.19의 구분을 그림으로)</text>
<rect x='40.0' y='52.0' width='520.0' height='68.0' rx='8' fill='#fff' stroke='#13936b' stroke-width='1.6' />
<text x='54.0' y='74.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >① 기능 시연</text>
<text x='190.0' y='74.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >주장: 이 소자로 reservoir 계산이 된다</text>
<text x='54.0' y='96.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >필요한 증거: 재현 가능한 상태 + 계산 지표(MCₖ 등) + held-out 성능</text>
<text x='54.0' y='112.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >이 교재에서 다룬 날: D13·D14</text>
<rect x='70.0' y='134.0' width='490.0' height='68.0' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='84.0' y='156.0' font-size='13' fill='#3d6fb4' text-anchor='start' font-weight='bold' >② 물리 기판에 귀속</text>
<text x='220.0' y='156.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >주장: 그 성능이 소자의 동역학에서 나온다</text>
<text x='84.0' y='178.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >필요한 증거: ①에 더해: 원시 입력·정적 소자·같은 readout 대조, 특징 수 곡선</text>
<text x='84.0' y='194.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >이 교재에서 다룬 날: D15·D16</text>
<rect x='100.0' y='216.0' width='460.0' height='68.0' rx='8' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='114.0' y='238.0' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >③ 배치 가능성</text>
<text x='250.0' y='238.0' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >주장: 실제로 쓸 수 있다</text>
<text x='114.0' y='260.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >필요한 증거: ②에 더해: 작동 범위, 편차·drift, 환경, 보정, 지연, 에너지 경계</text>
<text x='114.0' y='276.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >이 교재에서 다룬 날: D17·D18</text>
<text x='300.0' y='312.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모든 원리 증명 논문이 ③까지 갈 필요는 없다. 주장의 강도가 제시한 증거의 수준과 맞으면 된다. (Claude가 그림, 모식도)</text>
</svg>
