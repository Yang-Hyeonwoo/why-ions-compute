<text x='300.0' y='304.0' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >그림 3과 같은 가상 모형, 명목 칩 하나. drift 방향(모든 노드가 같은 쪽으로)과 하루 1%는 예시 가정이다.</text>
