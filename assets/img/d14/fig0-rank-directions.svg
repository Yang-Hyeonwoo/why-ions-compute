<text x='275.0' y='232.0' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >방향 2개</text>
<text x='40.0' y='258.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >노드가 둘인 상태를 화살표로 그렸다. (2, 4)는 (1, 2)를 2배로 늘렸을 뿐이라</text>
<text x='40.0' y='273.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >같은 직선 위에 있다. (2, 1)은 그 직선을 벗어난다.</text>
<text x='480.0' y='50.0' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >노드 3개, 상태 3개</text>
<text x='468.0' y='76.0' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >s₁</text>
<text x='514.0' y='76.0' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >s₂</text>
