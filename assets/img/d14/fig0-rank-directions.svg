<text x='300.0' y='20.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >상태들이 펼치는 '진짜로 다른 방향'의 수 (손 계산)</text>
<text x='110.0' y='50.0' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >같은 방향 두 개</text>
<line x1='60.0' y1='205.0' x2='200.0' y2='205.0' stroke='#999' stroke-width='1' marker-end='url(#arr)'/>
