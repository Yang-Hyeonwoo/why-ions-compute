<text x='439.0' y='152.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >노드 3</text>
<rect x='448.0' y='136.0' width='40.0' height='22.0' rx='3' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='468.0' y='153.0' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >3</text>
<rect x='494.0' y='136.0' width='40.0' height='22.0' rx='3' fill='#fff' stroke='#c8553d' stroke-width='1.2' />
<text x='514.0' y='153.0' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >6</text>
<rect x='540.0' y='136.0' width='40.0' height='22.0' rx='3' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='560.0' y='153.0' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >1</text>
<text x='395.0' y='180.0' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >s₂ = 2 × s₁ → 새 방향을 더하지 않는다</text>
<text x='395.0' y='196.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >s₃는 s₁의 몇 배로도 못 만든다 → 새 방향</text>
<text x='395.0' y='212.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >s₄ = s₁ + s₃ = (2, 2, 4) → 역시 새 방향 아님</text>
<text x='395.0' y='236.0' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >진짜로 다른 방향 = 2개</text>
<text x='395.0' y='254.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >→ 이 수를 이 표(행렬)의 rank라 한다</text>
<text x='395.0' y='276.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >방향별 크기(특이값): 8.44, 0.92, 0.00</text>
<text x='300.0' y='305.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >세는 순서: 상태를 하나씩 보며, 앞에서 모은 방향들을 몇 배씩 더해 만들 수 있으면 건너뛰고,</text>
<text x='300.0' y='322.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >못 만들면 새 방향으로 하나 센다. 세로줄 하나 = 상태 하나, 가로줄 하나 = 노드 하나. (Claude가 계산해 그림)</text>
