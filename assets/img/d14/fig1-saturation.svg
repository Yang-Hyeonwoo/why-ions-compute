<text x='385.0' y='238.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >입력 0.8과 1.0의 응답 차는 g = 20에서</text>
<text x='385.0' y='254.0' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >거의 0 → readout이 둘을 못 가른다.</text>
<text x='300.0' y='304.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >입력 다섯 개(0.2, 0.4, …, 1.0)를 같은 곡선에 넣은 값. 잡음이 0.001만 있어도 g = 20의 0.8과 1.0은 섞인다.</text>
<text x='300.0' y='321.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >곡선의 기울기가 '입력 차이 → 응답 차이'의 배율이고, 포화된 곳에서는 그 배율이 0에 가깝다.</text>
<text x='300.0' y='337.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >tanh는 포화형 응답의 대표 함수로 쓴 예시다. (Claude가 계산해 그림)</text>
