<text x='443.0' y='110.0' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >u(t)·u(t−1) 만들기</text>
<line x1='415.0' y1='126.0' x2='437.0' y2='126.0' stroke='#3d6fb4' stroke-width='2.2'/>
<text x='443.0' y='130.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='bold' >계산 용량</text>
<text x='443.0' y='144.0' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >u(t−2) 되살리기</text>
<text x='415.0' y='182.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='bold' >곱셈 용량 최대: g = 3에서 0.52</text>
<text x='415.0' y='198.0' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >g = 30: 전기적 비선형 0.62(최대)</text>
<text x='415.0' y='213.0' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >인데 곱셈 용량은 0.33로 다시 줄고</text>
<text x='415.0' y='228.0' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >되살리기는 0.16로 가장 낮다</text>
<text x='40.0' y='320.0' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >노드 8개: z ← a·z + w·u(선형으로 쌓고 새기), 측정값 x = tanh(g·(z + b)) + 잡음. a·w·b는 노드마다 다르고 g만 바꿨다.</text>
<text x='40.0' y='336.0' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >계산 용량 = 새 데이터에서 (1 − 정규화 오차), 0이면 평균값만 찍는 것과 같고 1이면 완벽. readout은 직선(+상수항).</text>
<text x='40.0' y='352.0' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >전기적 비선형 = 각 노드의 x를 z에 대해 직선으로 맞췄을 때 설명 못 한 몫(잡음 없는 값으로 계산)의 평균.</text>
<text x='40.0' y='368.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >입력 [−1, 1] 균등, 학습 2,950개·시험 1,000개 시점, 측정 잡음 0.01(예시 가정). (Claude가 계산해 그림)</text>
</svg>
