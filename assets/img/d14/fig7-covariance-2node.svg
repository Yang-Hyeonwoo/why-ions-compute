<text x='200.0' y='190.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >가로: 채널 A</text>
<text x='125.0' y='70.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >세로: 채널 B</text>
