<text x='458.0' y='238.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >분산 A 1, D 2, 공분산 1</text>
<text x='458.0' y='255.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >공분산 표 [[1, 1], [1, 2]]</text>
<text x='458.0' y='272.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>고유값 λ</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 2.62, λ</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.38</tspan></text>
<text x='458.0' y='289.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >몫 p = λ ÷ 합: 0.87, 0.13</text>
<text x='458.0' y='310.0' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>참여비 D</tspan><tspan dy='4' font-size='9'>PR</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 ÷ (p</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>² + p</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>²) = 1.29</tspan></text>
<text x='330.0' y='346.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >점 하나 = 한 시각의 (채널 A, 다른 채널) 값, 4개 시각. 옅은 굵은 선분 = 고유벡터 방향, 길이 = 그 방향의 표준편차(±√λ).</text>
<text x='330.0' y='363.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >A = (1, −1, 1, −1). 고유값의 합은 언제나 두 분산의 합(5, 2, 3)과 같다. 분산은 개수 n으로 나눔.</text>
<text x='330.0' y='386.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(Claude가 계산해 그림)</text>
</svg>
