<text x='114.0' y='84.0' font-size='9' fill='#999' text-anchor='end' font-weight='normal' >2</text>
<line x1='90.0' y1='200.0' x2='150.0' y2='80.0' stroke='#c8553d' stroke-width='4' stroke-opacity='0.45' stroke-linecap='round'/>
