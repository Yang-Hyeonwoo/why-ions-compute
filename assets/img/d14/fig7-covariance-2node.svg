<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 396' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<text x='330.0' y='20.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >채널 2개: 공분산 표 → 고유값(방향별 분산) → 참여비 차원 (손 계산)</text>
<text x='120.0' y='46.0' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >A와 B = 2A: 같은 신호의 2배</text>
<line x1='40.0' y1='140.0' x2='200.0' y2='140.0' stroke='#999' stroke-width='1'/>
