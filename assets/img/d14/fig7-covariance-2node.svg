<text x='97.0' y='204.0' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >×2</text>
<text x='28.0' y='238.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >분산 A 1, B 4, 공분산 2</text>
<text x='28.0' y='255.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >공분산 표 [[1, 2], [2, 4]]</text>
<text x='28.0' y='272.0' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>고유값 λ</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 5.00, λ</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.00</tspan></text>
<text x='28.0' y='289.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >몫 p = λ ÷ 합: 1.00, 0.00</text>
<text x='28.0' y='310.0' font-size='11.5' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>참여비 D</tspan><tspan dy='4' font-size='9'>PR</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 ÷ (p</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>² + p</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>²) = 1.00</tspan></text>
<text x='335.0' y='46.0' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >A와 C: 서로 무관한 신호</text>
<line x1='255.0' y1='140.0' x2='415.0' y2='140.0' stroke='#999' stroke-width='1'/>
