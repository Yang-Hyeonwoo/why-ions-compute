<circle cx='365.0' cy='170.0' r='4.5' fill='#13936b'/>
<circle cx='305.0' cy='170.0' r='4.5' fill='#13936b'/>
<text x='243.0' y='238.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >분산 A 1, C 1, 공분산 0</text>
<text x='243.0' y='255.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >공분산 표 [[1, 0], [0, 1]]</text>
<text x='243.0' y='272.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>고유값 λ</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1.00, λ</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1.00</tspan></text>
<text x='243.0' y='289.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >몫 p = λ ÷ 합: 0.50, 0.50</text>
<text x='243.0' y='310.0' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>참여비 D</tspan><tspan dy='4' font-size='9'>PR</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 ÷ (p</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>² + p</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>²) = 2.00</tspan></text>
<text x='550.0' y='46.0' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >A와 D = A + C: 반쯤 겹치는 신호</text>
<line x1='470.0' y1='140.0' x2='630.0' y2='140.0' stroke='#999' stroke-width='1'/>
<line x1='550.0' y1='218.0' x2='550.0' y2='62.0' stroke='#999' stroke-width='1'/>
<text x='630.0' y='190.0' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >가로: 채널 A</text>
<text x='555.0' y='70.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >세로: 채널 D</text>
<line x1='490.0' y1='137.0' x2='490.0' y2='143.0' stroke='#999' stroke-width='1'/>
