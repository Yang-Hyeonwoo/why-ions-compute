<text x='300.0' y='282.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >고유값 하나 = 한 방향으로 퍼진 정도(분산). 참여비 = (고유값 합)² ÷ (고유값 제곱의 합).</text>
<text x='300.0' y='299.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >A는 전극마다 크기만 다른 '같은 응답'이라 사실상 1차원이고, B는 네 방향으로 펼쳐져 있다.</text>
<text x='300.0' y='316.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >각 채널 = 크기 × 원래 신호 + 작은 잡음(표준편차 0.05), 400 표본. (Claude가 계산해 그림)</text>
