<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs><defs><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker></defs>
<text x='300' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >펼친 RNN에서 거꾸로: h(4)가 앞의 상태에 얼마나 민감한가는 통로 배율의 곱</text>
<text x='300' y='44' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >앞으로(순전파): h(t+1) = tanh(0.5·h(t) + u(t)), 입력 1, 0, 0, 0</text>
<rect x='50' y='60' width='80' height='36' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='90' y='83' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(1) = 0.762</text>
<line x1='132' y1='78' x2='188' y2='78' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='160.0' y='72' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >×0.5, tanh</text>
<rect x='190' y='60' width='80' height='36' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='230' y='83' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(2) = 0.363</text>
<line x1='272' y1='78' x2='328' y2='78' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='300.0' y='72' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >×0.5, tanh</text>
<rect x='330' y='60' width='80' height='36' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='370' y='83' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(3) = 0.180</text>
<line x1='412' y1='78' x2='468' y2='78' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='440.0' y='72' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >×0.5, tanh</text>
<rect x='470' y='60' width='80' height='36' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='510' y='83' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(4) = 0.090</text>
<text x='300' y='118' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >거꾸로(역전파): 통로 하나의 배율 = 0.5 × f′, f′ = 1 − (다음 상태)²</text>
<line x1='188' y1='140' x2='132' y2='140' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arrR)'/>
<text x='160.0' y='158' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >× 0.434</text>
<text x='160.0' y='174' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>0.5×(1 − 0.363</tspan><tspan dy='-6' font-size='9'>2</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>)</tspan></text>
<line x1='328' y1='140' x2='272' y2='140' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arrR)'/>
<text x='300.0' y='158' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >× 0.484</text>
<text x='300.0' y='174' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>0.5×(1 − 0.180</tspan><tspan dy='-6' font-size='9'>2</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>)</tspan></text>
<line x1='468' y1='140' x2='412' y2='140' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arrR)'/>
<text x='440.0' y='158' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >× 0.496</text>
<text x='440.0' y='174' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>0.5×(1 − 0.090</tspan><tspan dy='-6' font-size='9'>2</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>)</tspan></text>
<rect x='30' y='192' width='540' height='74' rx='8' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='40' y='208' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >h(4)가 이 상태를 조금 바꿀 때 몇 배로 변하나: 빨강 = 오른쪽부터 배율을 곱해 온 값, 회색 = 0.5만 곱했을 때</text>
<text x='90' y='230' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >0.104</text>
<text x='90' y='252' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >0.125</text>
<text x='230' y='230' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >0.240</text>
<text x='230' y='252' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >0.250</text>
<text x='370' y='230' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >0.496</text>
<text x='370' y='252' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >0.500</text>
<text x='510' y='230' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >1.000</text>
<text x='510' y='252' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >1.000</text>
<text x='300' y='292' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>f′ ≤ 1이라 실제 배율(0.104)은 0.5를 세 번 곱한 0.125보다 작다. 이 곱이 20단계 이어지면 0.5</tspan><tspan dy='-6' font-size='8'>20</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> ≈ 9.5×10</tspan><tspan dy='-6' font-size='8'>−7</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> 이하(그림 6).</tspan></text>
<text x='300' y='312' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모든 숫자는 본문 1차원 예시를 코드로 계산한 값. (Claude가 계산해 그림, 모식도)</text>
</svg>
