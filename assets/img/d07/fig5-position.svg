<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 300' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >RC는 알고리즘, PRC는 그 reservoir를 물리로 바꾼 구현, 뉴로모픽은 그것을 담는 우산</text>
<rect x='20' y='40' width='560' height='230' rx='10' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='34' y='60' font-size='12' fill='#999' text-anchor='start' font-weight='bold' >뉴로모픽 컴퓨팅 (D1의 우산 이름)</text>
<rect x='34' y='72' width='110' height='30' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='89' y='92' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >(가) 아날로그 VLSI</text>
<rect x='154' y='72' width='110' height='30' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='209' y='92' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >(나) 디지털 SNN</text>
<rect x='274' y='72' width='110' height='30' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='329' y='92' font-size='10.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >(다) in-memory</text>
<rect x='34' y='112' width='530' height='146' rx='8' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='48' y='132' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >(라) 물리 컴퓨팅: 재료의 동역학을 계산 자원으로</text>
<rect x='48' y='146' width='210' height='98' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='153' y='166' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >RC (소프트웨어 알고리즘)</text>
<text x='153' y='186' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >ESN·LSM: 고정 reservoir + 학습 readout</text>
<text x='153' y='204' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >컴퓨터 안의 난수 행렬</text>
<text x='153' y='226' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >D8–D12의 수학은 여기</text>
<line x1='264' y1='195' x2='336' y2='195' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='300' y='184' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >reservoir를</text>
<text x='300' y='212' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >물리로 교체</text>
<rect x='342' y='146' width='210' height='98' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.2' />
<text x='447' y='166' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >PRC (물리 reservoir computing)</text>
<text x='447' y='186' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >재료·소자의 동역학이 reservoir</text>
<text x='447' y='204' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >readout은 보통 디지털, 때로 아날로그</text>
<text x='447' y='226' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >이온 소자 RC 논문은 여기</text>
<text x='300' y='288' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 분류는 D1과 같은 이해용 분류이며 겹친다. 조건: PRC가 디지털 RC보다 자원을 더 쓰면 의미가 없다 [Liang 2024, p.202].</text>
</svg>
