<text x='400' y='210' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >w 1.0 → 1.1 (0.1만큼):</text>
<text x='400' y='228' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >L은 9 → 7.84, 변화 −1.16</text>
<text x='400' y='246' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >비율 −1.16 ÷ 0.1 = −11.6</text>
<text x='400' y='264' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >한없이 작게 바꾸면 → 기울기 −12</text>
<circle cx='405' cy='282' r='4.5' fill='#fff' stroke='#c8553d' stroke-width='2'/>
<text x='414' y='286' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >한 걸음 뒤: w = 1.6, L = 3.24</text>
<text x='300' y='308' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >기울기가 음수면 w를 올려야 L이 줄고(빨강), 양수면 내려야 준다(파랑). 그래서 '기울기의 반대쪽으로' 옮긴다.</text>
<text x='300' y='326' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >한 걸음 = 보폭(0.05) × 기울기: w = 1.0 − 0.05×(−12) = 1.6, L은 9 → 3.24.</text>
<text x='300' y='344' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >곡선과 표의 모든 숫자는 코드가 계산했다. (Claude가 계산해 그림)</text>
