<text x='330' y='278' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >①②는 소프트웨어에서도 생기고, ③은 물리 device에서 더해진다. ESN은 내부를 고정해 셋을 한꺼번에 피한다.</text>
