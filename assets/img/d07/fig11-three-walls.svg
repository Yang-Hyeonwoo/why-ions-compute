<text x='116' y='220' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >거슬러 모아야 한다(BPTT)</text>
<text x='330' y='102' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>0.5</tspan><tspan dy='-6' font-size='9'>20</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> ≈ 9.5×10</tspan><tspan dy='-6' font-size='9'>−7</tspan><tspan dy='6' font-size='1'>​</tspan></text>
