<text x='284.2857142857143' y='162' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >물리 영역의 LSM</text>
<text x='284.2857142857143' y='178' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >XOR·음성 인식 시연</text>
