<text x='407.14285714285717' y='162' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >delay-coupled RC</text>
<text x='407.14285714285717' y='178' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >노드 하나 + 시간다중화</text>
<circle cx='468.57142857142856' cy='120' r='5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
