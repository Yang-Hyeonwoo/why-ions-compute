<text x='468.57142857142856' y='80' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >출력층까지 아날로그</text>
<text x='468.57142857142856' y='64' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >물리 reservoir + 물리 readout</text>
<circle cx='530.0' cy='120' r='5' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<line x1='530.0' y1='128' x2='530.0' y2='146' stroke='#d9d9d9' stroke-width='1'/>
