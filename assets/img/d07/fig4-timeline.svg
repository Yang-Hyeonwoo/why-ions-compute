<text x='530.0' y='178' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >예: 양극성 트랜지스터 ESN</text>
<text x='300' y='204' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >녹색 = 알고리즘, 파랑 = 물리 구현. 가로 간격은 연도에 비례하지 않는다(순서만 뜻이 있다).</text>
<text x='300' y='222' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >출처: 2001–2011은 Liang 2024 p.193–194, 2020 전후는 p.201·Fig. 5, 2026은 Zhong 2026.</text>
<text x='300' y='240' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >1990년대 항목은 배경 설명이며 특정 논문을 가리키지 않는다 [미확인]. (Claude가 그림)</text>
