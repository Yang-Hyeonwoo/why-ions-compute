<text x='300' y='308' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 대가: 고정된 난수 reservoir는 과제에 맞춰 내부를 다듬지 못한다 → 표현력은 DNN보다 낮다 [Liang 2024, p.194].</text>
