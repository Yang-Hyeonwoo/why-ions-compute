<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 320' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >순환 신경망(RNN): 같은 W를 매 단계 다시 쓴다 (시간으로 펼친 모습)</text>
<rect x='40' y='88' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='70' y='115' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(1)</text>
<line x1='70' y1='40' x2='70' y2='86' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='70' y='32' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(0) = 1</text>
<text x='76' y='66' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='100' y1='110' x2='163' y2='110' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='132.5' y='104' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='70' y='154' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.762</text>
<rect x='165' y='88' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='195' y='115' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(2)</text>
<line x1='195' y1='40' x2='195' y2='86' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='195' y='32' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(1) = 0</text>
<text x='201' y='66' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='225' y1='110' x2='288' y2='110' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='257.5' y='104' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='195' y='154' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.363</text>
<rect x='290' y='88' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='320' y='115' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(3)</text>
<line x1='320' y1='40' x2='320' y2='86' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='320' y='32' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(2) = 0</text>
<text x='326' y='66' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='350' y1='110' x2='413' y2='110' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='382.5' y='104' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='320' y='154' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.180</text>
<rect x='415' y='88' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='445' y='115' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(4)</text>
<line x1='445' y1='40' x2='445' y2='86' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='445' y='32' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(3) = 0</text>
<text x='451' y='66' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='445' y='154' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.090</text>
<text x='300' y='182' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >예시: h(t+1) = tanh(0.5·h(t) + u(t)), h(0) = 0.  첫 입력 1 뒤에 0만 들어와도 상태에 흔적이 남고, 점점 줄어든다.</text>
<rect x='40' y='205' width='520' height='96' rx='8' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='60' y='228' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >이 구조가 학습을 어렵게 만드는 세 가지</text>
<text x='60' y='250' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >① 어느 한 단계의 오차를 W 탓으로 돌리려면 시간을 거슬러 모든 단계를 지나야 한다 (BPTT).</text>
<text x='60' y='270' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >② 그 길에서 같은 W가 k번 곱해진다 → 기울기가 0으로 꺼지거나(소실) 터진다(폭주). 그림 5·6.</text>
<text x='60' y='290' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >③ (물리 구현) W를 바꾸려면 내부에 손을 대야 하고, 미분 가능한 소자 모형이 있어야 한다.</text>
</svg>
