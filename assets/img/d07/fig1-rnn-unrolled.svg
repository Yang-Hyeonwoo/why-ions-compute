<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 336' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >순환 신경망(RNN): 같은 W를 매 단계 다시 쓴다 (시간으로 펼친 모습)</text>
<rect x='40' y='102' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='70' y='129' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(1)</text>
<line x1='70' y1='54' x2='70' y2='100' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='70' y='46' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(0) = 1</text>
<text x='76' y='80' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='100' y1='124' x2='163' y2='124' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='132.5' y='118' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='70' y='168' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.762</text>
<rect x='165' y='102' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='195' y='129' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(2)</text>
<line x1='195' y1='54' x2='195' y2='100' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='195' y='46' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(1) = 0</text>
<text x='201' y='80' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='225' y1='124' x2='288' y2='124' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='257.5' y='118' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='195' y='168' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.363</text>
<rect x='290' y='102' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='320' y='129' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(3)</text>
<line x1='320' y1='54' x2='320' y2='100' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='320' y='46' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(2) = 0</text>
<text x='326' y='80' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='350' y1='124' x2='413' y2='124' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='382.5' y='118' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >W</text>
<text x='320' y='168' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.180</text>
<rect x='415' y='102' width='60' height='44' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='445' y='129' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >h(4)</text>
<line x1='445' y1='54' x2='445' y2='100' stroke='#e08a3c' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='445' y='46' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >u(3) = 0</text>
<text x='451' y='80' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>W</tspan><tspan dy='4' font-size='9'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='445' y='168' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='normal' >= 0.090</text>
<text x='300' y='196' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >예시: h(t+1) = tanh(0.5·h(t) + u(t)), h(0) = 0. 입력 1 뒤에 0만 와도 흔적이 남아 줄어든다.</text>
<rect x='30' y='216' width='540' height='104' rx='8' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='46' y='238' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >읽는 법</text>
<text x='46' y='258' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >주황 = 입력, 파란 상자 = 상태, 검정 화살표 W = 지금 상태에 곱하는 수(매 단계 같은 0.5).</text>
<text x='46' y='278' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >tanh를 빼면 h(t+1) = 0.5·h(t) + u(t): 이전 상태의 50%를 남기고 새 입력을 더한다.</text>
<text x='46' y='298' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >Day 5–6 LIF의 '다음 = 0.9 × 지금 + 입력'과 같은 꼴이다. 단, RNN의 0.5는 weight다.</text>
</svg>
