<text x='415' y='220' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>k=20: 9.5×10</tspan><tspan dy='-6' font-size='8.5'>−7</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<text x='300' y='296' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >스칼라 예시(인자 = W·f′). 실제 RNN에서는 행렬의 가장 큰 고유값 크기가 대략 이 인자 역할을 한다 [해석].</text>
<text x='300' y='314' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>20단계 전의 영향: 인자 0.5면 9.5×10</tspan><tspan dy='-6' font-size='8'>−7</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>(약 100만 분의 1), 인자 1.5면 3325배. (Claude가 계산해 그림)</tspan></text>
