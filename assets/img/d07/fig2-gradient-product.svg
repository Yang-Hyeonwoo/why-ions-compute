<text x='415' y='88' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' >k=10: 58배</text>
<text x='415' y='104' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' >k=20: 3325배</text>
