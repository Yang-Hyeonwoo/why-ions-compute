<rect x='420' y='45' width='205' height='280' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='432' y='66' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >숫자 (코드 계산)</text>
<text x='432' y='88' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >x(00) = (+0.000, +0.000)</text>
<text x='432' y='107' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='normal' >x(10) = (+0.164, -0.430)</text>
<text x='432' y='126' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='normal' >x(01) = (+0.762, -0.462)</text>
<text x='432' y='145' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' >x(11) = (+0.823, -0.744)</text>
<text x='432' y='168' font-size='11' fill='#7a5bb5' text-anchor='start' font-weight='normal' >x(10)+x(01) = (+0.926, -0.892)</text>
<text x='432' y='186' font-size='11' fill='#7a5bb5' text-anchor='start' font-weight='normal' >→ x(11)과 다르다: 겹침이 깨짐</text>
<text x='432' y='204' font-size='11' fill='#7a5bb5' text-anchor='start' font-weight='normal' >   = 비선형(D10)</text>
<text x='432' y='234' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >네 점이 모두 다른 자리 →</text>
<text x='432' y='252' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >상태가 '최근 두 입력'을 구별한다.</text>
<text x='432' y='276' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >단, {10, 01}과 {00, 11}을 가르는</text>
<text x='432' y='294' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >직선 하나는 없다.</text>
<text x='432' y='312' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >→ D10의 XOR</text>
