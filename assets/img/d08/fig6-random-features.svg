<text x='462' y='237' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >평가 점 201개.</text>
<text x='320' y='312' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >목표(예시) = sin(3u) + 0.5u². 각 곡선 = tanh(a·u + c), a·c는 고정 난수. NMSE = 평균 제곱 오차 ÷ 목표의 분산.</text>
