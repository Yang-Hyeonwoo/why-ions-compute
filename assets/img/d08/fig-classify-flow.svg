<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 360' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >분류 readout 한 번: 위 줄은 답을 내는 길, 아래 줄은 학습할 때만 도는 길</text>
<rect x='12' y='50' width='128' height='112' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='20' y='67' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >① 상태 x (입력)</text>
<text x='20' y='86' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >reservoir가 낸 값</text>
<text x='20' y='102' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >x = (0.8, −0.4)</text>
<text x='20' y='118' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >노드 2개</text>
<rect x='168' y='50' width='156' height='112' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='176' y='67' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >② readout 가중치</text>
<text x='176' y='86' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >종류마다 한 행</text>
<text x='176' y='102' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >A 행: (2.0, −1.0)</text>
<text x='176' y='118' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >B 행: (1.0, −0.5)</text>
<text x='176' y='134' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >C 행: (0.5, 0.75)</text>
<rect x='352' y='50' width='140' height='112' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='360' y='67' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >③ 점수 z</text>
<text x='360' y='86' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >행·x (곱해 더하기)</text>
<text x='360' y='102' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >z = (2.0, 1.0, 0.1)</text>
<text x='360' y='118' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >argmax → 답 A</text>
<rect x='520' y='50' width='168' height='112' rx='6' fill='#fff' stroke='#3d6fb4' stroke-width='1.5' />
<text x='528' y='67' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >④ softmax → 확률 p</text>
<text x='528' y='86' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>e</tspan><tspan dy='-6' font-size='9'>z</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> = (7.389, 2.718, 1.105)</tspan></text>
<text x='528' y='102' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >합 11.212으로 나누기</text>
<text x='528' y='118' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >p = (0.659, 0.242, 0.099)</text>
<text x='528' y='134' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >합 = 1</text>
<line x1='141' y1='106.0' x2='166' y2='106.0' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<line x1='325' y1='106.0' x2='350' y2='106.0' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<line x1='493' y1='106.0' x2='518' y2='106.0' stroke='#444' stroke-width='1.5' marker-end='url(#arr)'/>
<rect x='520' y='222' width='168' height='100' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='528' y='239' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' >⑤ 정답과 비교: 손실</text>
<text x='528' y='258' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >원-핫 정답 y = (1, 0, 0)</text>
<text x='528' y='274' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >교차 엔트로피</text>
<text x='528' y='290' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >L = −ln 0.659 = 0.417</text>
<rect x='312' y='222' width='180' height='100' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='320' y='239' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' >⑥ 점수의 기울기</text>
<text x='320' y='258' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >∂L/∂z = p − y</text>
<text x='320' y='274' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >(−0.341, 0.242, 0.099)</text>
<text x='320' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >음수 = 점수를 올려라(A)</text>
<text x='320' y='306' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >양수 = 내려라(B, C)</text>
<rect x='120' y='222' width='164' height='100' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='128' y='239' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' >⑦ 가중치 한 걸음</text>
<text x='128' y='258' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>행 k ← 행 k − η(p</tspan><tspan dy='4' font-size='9'>k</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> − y</tspan><tspan dy='4' font-size='9'>k</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)x</tspan></text>
<text x='128' y='274' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >η = 0.5 → A 행 (2.14, −1.07)</text>
<text x='128' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>다시 계산: p</tspan><tspan dy='4' font-size='9'>A</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> 0.659 → 0.706</tspan></text>
<text x='128' y='306' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >L 0.417 → 0.348</text>
<line x1='604' y1='163' x2='604' y2='220' stroke='#c8553d' stroke-width='1.5' marker-end='url(#arr)'/>
<line x1='519' y1='272.0' x2='494' y2='272.0' stroke='#c8553d' stroke-width='1.5' marker-end='url(#arr)'/>
<line x1='311' y1='272.0' x2='286' y2='272.0' stroke='#c8553d' stroke-width='1.5' marker-end='url(#arr)'/>
<path d='M200,221 L200,165' stroke='#c8553d' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<text x='208' y='196.0' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >②를 고친다</text>
<text x='12' y='345' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >예시 숫자이며 모두 코드가 계산했다. 위 줄(①→④)만 돌면 답이 나오고, 아래 줄(⑤→⑦)은 학습 때 반복한다.</text>
</svg>
