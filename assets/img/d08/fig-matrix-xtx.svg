<text x='440' y='158' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >X의 노드 1 열이 1행, 노드 2 열이 2행이 된다</text>
<text x='158' y='224' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>(c) X</tspan><tspan dy='-6' font-size='9'>T</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>X (2행 2열)</tspan></text>
<rect x='90' y='236' width='68' height='28' rx='2' fill='#e3ecf8' stroke='#bbb' stroke-width='1' />
<text x='124.0' y='254.0' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >a = 30.0</text>
<rect x='158' y='236' width='68' height='28' rx='2' fill='#efe6f6' stroke='#bbb' stroke-width='1' />
<text x='192.0' y='254.0' font-size='11' fill='#7a5bb5' text-anchor='middle' font-weight='normal' >b = 29.97</text>
<rect x='90' y='264' width='68' height='28' rx='2' fill='#efe6f6' stroke='#bbb' stroke-width='1' />
<text x='124.0' y='282.0' font-size='11' fill='#7a5bb5' text-anchor='middle' font-weight='normal' >b = 29.97</text>
<rect x='158' y='264' width='68' height='28' rx='2' fill='#fbe6d3' stroke='#bbb' stroke-width='1' />
<text x='192.0' y='282.0' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='normal' >d = 29.943</text>
<text x='82' y='312' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >a = (노드 1 열)·(노드 1 열)</text>
<text x='82' y='328' font-size='10' fill='#7a5bb5' text-anchor='start' font-weight='normal' >b = (노드 1 열)·(노드 2 열)</text>
<text x='82' y='344' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >d = (노드 2 열)·(노드 2 열)</text>
<text x='82' y='360' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >(· = 같은 자리끼리 곱해 더하기)</text>
<text x='340' y='224' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>X</tspan><tspan dy='-6' font-size='9'>T</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>y</tspan></text>
<rect x='300' y='236' width='80' height='28' rx='2' fill='#dff3ea' stroke='#bbb' stroke-width='1' />
<text x='340.0' y='254.0' font-size='11' fill='#13936b' text-anchor='middle' font-weight='normal' ><tspan>r</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 30.3</tspan></text>
<rect x='300' y='264' width='80' height='28' rx='2' fill='#dff3ea' stroke='#bbb' stroke-width='1' />
<text x='340.0' y='282.0' font-size='11' fill='#13936b' text-anchor='middle' font-weight='normal' ><tspan>r</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 30.262</tspan></text>
<text x='292' y='312' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >r = 각 노드 열 · 정답</text>
<rect x='420' y='210' width='268' height='166' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='430' y='228' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' ><tspan>(d) 풀기: (X</tspan><tspan dy='-6' font-size='9'>T</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>X) w = X</tspan><tspan dy='-6' font-size='9'>T</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>y</tspan></text>
<text x='430' y='250' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >= 연립방정식 두 개를 한 줄로 쓴 것</text>
<text x='430' y='268' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>'X</tspan><tspan dy='-6' font-size='9'>T</tspan><tspan dy='6' font-size='1'>​</tspan><tspan>X로 나누기' = 역행렬을 곱하기</tspan></text>
<text x='430' y='286' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>D = ad − b</tspan><tspan dy='-6' font-size='9'>2</tspan><tspan dy='6' font-size='1'>​</tspan><tspan> = 0.077  (거의 0)</tspan></text>
<text x='430' y='304' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >→ 1/D ≈ 13: 작은 D로 나누니 커진다</text>
<text x='430' y='322' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >→ w = (4.00, −3.00)</text>
<text x='430' y='340' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >λ = 0.1: a, d에만 +0.1 → D = 6.08</text>
<text x='430' y='358' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >→ w = (0.55, 0.46)</text>
<text x='350' y='404' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >데이터는 4-2의 예시(표본 4개, 노드 2개). 숫자는 모두 코드가 계산했다.</text>
