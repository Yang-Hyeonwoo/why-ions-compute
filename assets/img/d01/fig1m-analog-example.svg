<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 450' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='360.0' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >문턱 아래 트랜지스터로 '곱하고 더하기' — 교육용 예시 회로 (Mead의 실제 회로를 옮긴 것이 아님)</text>
<text x='4' y='40' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(a)</text>
<rect x='20' y='46' width='160' height='128' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='100' y='68' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >① 입력</text>
<text x='100' y='90' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >빛을 받는 광다이오드가</text>
<text x='100' y='108' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>전류 I</tspan><tspan dy='4' font-size='9.5'>in</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 nA를 낸다</tspan></text>
<text x='100' y='126' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >(빛이 세면 전류도 크다)</text>
<line x1='182.0' y1='110.0' x2='193.0' y2='110.0' stroke='#444' stroke-width='1.6' marker-end='url(#a-ink)'/>
<rect x='195' y='46' width='160' height='128' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='275' y='68' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >② 전류 → 전압 (로그)</text>
<text x='275' y='90' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >게이트·드레인을 이은 M1에</text>
<text x='275' y='108' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>I</tspan><tspan dy='4' font-size='9.5'>in</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>이 흐르면 게이트 전압</tspan></text>
<text x='275' y='126' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> ∝ (U</tspan><tspan dy='4' font-size='9.5'>T</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>/κ)·ln I</tspan><tspan dy='4' font-size='9.5'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='275' y='144' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>빛 10배 → V</tspan><tspan dy='4' font-size='9.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> +85 mV</tspan></text>
<line x1='357.0' y1='110.0' x2='368.0' y2='110.0' stroke='#444' stroke-width='1.6' marker-end='url(#a-ink)'/>
<rect x='370' y='46' width='160' height='128' rx='8' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='450' y='68' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >③ 전압 → 전류 (지수)</text>
<text x='450' y='90' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>M2의 게이트 = V</tspan><tspan dy='4' font-size='9.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> + ΔV</tspan></text>
<text x='450' y='108' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>I</tspan><tspan dy='4' font-size='9.5'>out</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = I</tspan><tspan dy='4' font-size='9.5'>in</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> × e의 지수(κΔV/U</tspan><tspan dy='4' font-size='9.5'>T</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)</tspan></text>
<text x='450' y='126' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >ΔV = +85 mV → ×10.0 = 10.0 nA</text>
<text x='450' y='144' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >ΔV = 0 → ×1 (전류 복사)</text>
<line x1='532.0' y1='110.0' x2='543.0' y2='110.0' stroke='#444' stroke-width='1.6' marker-end='url(#a-ink)'/>
<rect x='545' y='46' width='160' height='128' rx='8' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='625' y='68' font-size='12' fill='#c8553d' text-anchor='middle' font-weight='bold' >④ 출력</text>
<text x='625' y='90' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>여러 I</tspan><tspan dy='4' font-size='9.5'>out</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>이 한 선에 모이면</tspan></text>
<text x='625' y='108' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >더해진다(Kirchhoff)</text>
<text x='625' y='126' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >그 합만큼 C의 전하가 변해</text>
<text x='625' y='144' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >선의 전압 = 시간 적분</text>
<text x='20' y='198' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >(b) 회로 모식</text>
<line x1='40' y1='204' x2='100' y2='204' stroke='#444' stroke-width='2'/>
<text x='104' y='208' font-size='10' fill='#444' text-anchor='start' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='70' y1='204' x2='70' y2='215' stroke='#444' stroke-width='1.4'/>
<circle cx='70.0' cy='228.0' r='13' fill='#fff' stroke='#3d6fb4' stroke-width='1.4'/>
<line x1='70.0' y1='219.0' x2='70.0' y2='238.0' stroke='#3d6fb4' stroke-width='1.3' marker-end='url(#a-blue)'/>
<text x='88' y='228' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >광다이오드</text>
<text x='88' y='241' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(빛 → 전류)</text>
<line x1='70' y1='241' x2='70' y2='256' stroke='#444' stroke-width='1.4'/>
<line x1='70' y1='256' x2='220' y2='256' stroke='#444' stroke-width='1.4'/>
<line x1='110.0' y1='266.0' x2='160.0' y2='266.0' stroke='#c8553d' stroke-width='1.3' marker-end='url(#a-red)'/>
<text x='135' y='280' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' ><tspan>I</tspan><tspan dy='4' font-size='9.5'>in</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='212.0' y1='271.0' x2='212.0' y2='301.0' stroke='#13936b' stroke-width='3.2'/>
<line x1='204.0' y1='271.0' x2='204.0' y2='301.0' stroke='#444' stroke-width='1.6'/>
<line x1='186.0' y1='286' x2='204.0' y2='286' stroke='#444' stroke-width='1.4'/>
<line x1='212.0' y1='276.0' x2='220' y2='276.0' stroke='#444' stroke-width='1.4'/>
<line x1='220' y1='276.0' x2='220' y2='256.0' stroke='#444' stroke-width='1.4'/>
<line x1='212.0' y1='296.0' x2='220' y2='296.0' stroke='#444' stroke-width='1.4'/>
<line x1='220' y1='296.0' x2='220' y2='316.0' stroke='#444' stroke-width='1.4'/>
<line x1='186' y1='286' x2='186' y2='256' stroke='#444' stroke-width='1.4'/>
<line x1='186' y1='256' x2='220' y2='256' stroke='#444' stroke-width='1.4'/>
<circle cx='220.0' cy='256.0' r='2.5' fill='#444' stroke='#444' stroke-width='1.2'/>
<line x1='220' y1='316' x2='220' y2='324' stroke='#444' stroke-width='1.4'/><line x1='210' y1='324' x2='230' y2='324' stroke='#444' stroke-width='1.8'/><line x1='214' y1='328' x2='226' y2='328' stroke='#444' stroke-width='1.4'/><line x1='218' y1='332' x2='222' y2='332' stroke='#444' stroke-width='1.2'/>
<text x='236' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >M1</text>
<line x1='186' y1='256' x2='186' y2='236' stroke='#444' stroke-width='1.4'/>
<line x1='186' y1='236' x2='330' y2='236' stroke='#444' stroke-width='1.4'/>
<text x='258' y='230' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<circle cx='345.0' cy='236.0' r='14' fill='#fff' stroke='#e08a3c' stroke-width='1.4'/>
<text x='345' y='240' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >ΔV</text>
<text x='345' y='264' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >가중치 전압</text>
<text x='345' y='276' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(다른 회로가 공급)</text>
<line x1='359' y1='236' x2='400' y2='236' stroke='#444' stroke-width='1.4'/>
<line x1='400' y1='236' x2='400' y2='286' stroke='#444' stroke-width='1.4'/>
<line x1='426.0' y1='271.0' x2='426.0' y2='301.0' stroke='#13936b' stroke-width='3.2'/>
<line x1='418.0' y1='271.0' x2='418.0' y2='301.0' stroke='#444' stroke-width='1.6'/>
<line x1='400.0' y1='286' x2='418.0' y2='286' stroke='#444' stroke-width='1.4'/>
<line x1='426.0' y1='276.0' x2='434' y2='276.0' stroke='#444' stroke-width='1.4'/>
<line x1='434' y1='276.0' x2='434' y2='256.0' stroke='#444' stroke-width='1.4'/>
<line x1='426.0' y1='296.0' x2='434' y2='296.0' stroke='#444' stroke-width='1.4'/>
<line x1='434' y1='296.0' x2='434' y2='316.0' stroke='#444' stroke-width='1.4'/>
<text x='450' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >M2</text>
<line x1='434' y1='316' x2='434' y2='324' stroke='#444' stroke-width='1.4'/><line x1='424' y1='324' x2='444' y2='324' stroke='#444' stroke-width='1.8'/><line x1='428' y1='328' x2='440' y2='328' stroke='#444' stroke-width='1.4'/><line x1='432' y1='332' x2='436' y2='332' stroke='#444' stroke-width='1.2'/>
<line x1='434' y1='256' x2='434' y2='220' stroke='#444' stroke-width='1.4'/>
<line x1='434' y1='220' x2='560' y2='220' stroke='#444' stroke-width='2'/>
<line x1='520.0' y1='212.0' x2='470.0' y2='212.0' stroke='#c8553d' stroke-width='1.4' marker-end='url(#a-red)'/>
<text x='495' y='206' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' ><tspan>I</tspan><tspan dy='4' font-size='9.5'>out</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='565' y='224' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >다른 M2들의 전류도</text>
<text x='565' y='238' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >이 선으로 모인다</text>
<line x1='560' y1='220' x2='560' y2='270' stroke='#444' stroke-width='1.4'/>
<line x1='546' y1='270' x2='574' y2='270' stroke='#444' stroke-width='2.4'/>
<line x1='546' y1='278' x2='574' y2='278' stroke='#444' stroke-width='2.4'/>
<text x='580' y='280' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >C</text>
<line x1='560' y1='278' x2='560' y2='296' stroke='#444' stroke-width='1.4'/>
<text x='565' y='314' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(실제로는 선의 전압을</text>
<text x='565' y='326' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' > 읽는 회로도 필요)</text>
<text x='20' y='372' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >(c) 대가와 한계 (같은 숫자로)</text>
<text x='20' y='390' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >느림: 1 nA로 1 pF을 0.1 V 충전하려면 t = CΔV/I = 100 µs.   온도: 같은 ΔV라도 300 K에서 ×10.0, 330 K에서 ×8.1.</text>
<text x='20' y='406' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >편차: M1과 M2의 기준 전류가 조금만 달라도 배율이 수십 % 틀어질 수 있다.   잡음: 전류가 작을수록 상대적인 흔들림이 커진다.</text>
<text x='20' y='422' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >300 K, κ = 0.7, 두 트랜지스터가 같다고 가정한 이상적 계산. (Claude가 계산해 그림, 모식도)</text>
</svg>
