<text x='442' y='316' font-size='9.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' ><tspan>드레인 쪽은 qV</tspan><tspan dy='4' font-size='9.5'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>만큼 낮다</tspan></text>
<text x='462' y='168' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >무엇이 변하나</text>
<text x='462' y='183' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>를 올리면 채널 영역의 전자 에너지가</tspan></text>
<text x='462' y='198' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >내려간다 → 장벽이 낮아진다.</text>
<text x='462' y='213' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >85 mV 올리면 장벽이 κ×85 ≈ 59 meV 낮아지고</text>
<text x='462' y='228' font-size='10' fill='#13936b' text-anchor='start' font-weight='bold' >넘을 수 있는 전자 수가 약 10.0배가 된다</text>
<text x='462' y='243' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >(300 K, κ = 0.7, kT ≈ 25.85 meV 가정).</text>
<text x='462' y='258' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ></text>
<text x='462' y='273' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >그래서 문턱 아래에서도</text>
<text x='462' y='288' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >넘는 전자가 0이 아니다 → 전류가 작게 흐르고,</text>
<text x='462' y='303' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>에 지수적으로 커진다.</tspan></text>
<text x='462' y='318' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ></text>
<text x='462' y='333' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >방향</text>
<text x='462' y='348' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >전자 이동: 왼쪽 → 오른쪽 (소스 → 드레인)</text>
<text x='462' y='363' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>관습적 전류 I</tspan><tspan dy='4' font-size='9.5'>D</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>: 오른쪽 → 왼쪽</tspan></text>
<text x='340.0' y='398' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 장벽은 산화막(위쪽) 쪽이 아니라 실리콘 표면을 따라 소스와 채널 영역 사이에 있다. 전자가 절연막을 뚫는 그림이 아니다.</text>
<text x='340.0' y='413' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >세로축의 눈금 숫자는 생략(모양만). 소스 쪽 막대 길이는 e의 지수(−E/kT) 꼴로 코드가 계산했다. (Claude가 그림)</text>
