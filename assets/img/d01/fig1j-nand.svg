<text x='360.0' y='436' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>초록 띠 = 이어진 경로. nMOS는 직렬(둘 다 켜져야 GND와 연결), pMOS는 병렬(하나만 켜져도 V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>와 연결).</tspan></text>
<text x='360.0' y='456' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >AND가 필요하면 NAND 출력 Y를 인버터에 한 번 더 넣는다(트랜지스터 4 + 2 = 6개). 모식도. (Claude가 그림, 진리표는 코드가 계산)</text>
