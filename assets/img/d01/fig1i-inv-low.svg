<text x='220.0' y='376' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>pMOS가 켜져 출력 노드가 V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>에 이어지고,</tspan></text>
