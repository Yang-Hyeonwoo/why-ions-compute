<text x='220.0' y='424' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >정지 상태: 이상적으로는 0, 실제로는 꺼진 nMOS의 작은 누설.</text>
<text x='220.0' y='462' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>C</tspan><tspan dy='4' font-size='9.5'>L</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 다음 단의 게이트와 배선이 만드는 부하 정전용량. 모식도. (Claude가 그림)</tspan></text>
