<text x='206' y='284' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0 V</tspan></text>
