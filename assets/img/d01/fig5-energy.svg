<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 270' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >P ∼ f·C·V²: 전압과 주파수가 낮으면 전력이 얼마나 줄까 (C는 같다고 가정)</text>
<text x='160' y='74' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >디지털 회로</text>
<text x='160' y='90' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 1 GHz, V = 1 V</text>
<rect x='170' y='62' width='368.0' height='26' rx='4' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='546.0' y='80' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >상대 전력 1</text>
<text x='160' y='120' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >전압만 낮춤</text>
<text x='160' y='136' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 1 GHz, V = 0.1 V</text>
<rect x='170' y='108' width='288.0' height='26' rx='4' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='466.0' y='126' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >상대 전력 10<tspan dy='-6' font-size='8'>−2</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='160' y='166' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >주파수만 낮춤</text>
<text x='160' y='182' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 100 Hz, V = 1 V</text>
<rect x='170' y='154' width='88.0' height='26' rx='4' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<text x='266.0' y='172' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >상대 전력 10<tspan dy='-6' font-size='8'>−7</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='160' y='212' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >뇌처럼 둘 다</text>
<text x='160' y='228' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 100 Hz, V = 0.1 V</text>
<rect x='170' y='200' width='8.0' height='26' rx='4' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='186.0' y='218' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >상대 전력 10<tspan dy='-6' font-size='8'>−9</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='300' y='256' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >자릿수가 9개 줄어든다. 대신 느리므로 같은 일을 하려면 병렬로 많이 해야 한다. 누설·데이터 이동 에너지는 이 식에 없다.</text>
</svg>
