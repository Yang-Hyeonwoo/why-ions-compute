<line x1='450.0' y1='52' x2='450.0' y2='230' stroke='#eeeeee' stroke-width='1'/>
<text x='450.0' y='244' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>−2</tspan><tspan dy='6' font-size='1'>​</tspan></text>
