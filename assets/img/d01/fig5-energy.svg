<text x='300' y='284' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >전력이 작아진 만큼 일도 느려진다. 같은 작업의 에너지(E = P × 시간)가 줄었는지는 이 식만으로 알 수 없다.</text>
<text x='300' y='300' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >누설·데이터 이동·아날로그 바이어스는 식에 없다. 디지털 CMOS 동적 전력 식이며, 뇌에 그대로 쓰는 식이 아니다.</text>
