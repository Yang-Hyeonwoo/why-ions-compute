<text x='160' y='74' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >기준</text>
<text x='160' y='90' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 1 GHz, V = 1 V</text>
<rect x='170' y='62' width='350.0' height='26' rx='4' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='528.0' y='80' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >1</text>
<text x='160' y='120' font-size='12.5' fill='#444' text-anchor='end' font-weight='bold' >전압만 낮춤</text>
<text x='160' y='136' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >f = 1 GHz, V = 0.1 V</text>
<rect x='170' y='108' width='280.0' height='26' rx='4' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
