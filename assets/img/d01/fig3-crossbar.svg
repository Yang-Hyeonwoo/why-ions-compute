<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 290' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >crossbar에서 행렬–벡터 곱: 곱셈은 Ohm, 덧셈은 Kirchhoff</text>
<line x1='110' y1='68' x2='110' y2='228' stroke='#3d6fb4' stroke-width='2'/>
<text x='110' y='60' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >V1 = 0.1 V</text>
<line x1='220' y1='68' x2='220' y2='228' stroke='#3d6fb4' stroke-width='2'/>
<text x='220' y='60' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >V2 = 0.2 V</text>
<line x1='70' y1='123' x2='280' y2='123' stroke='#e08a3c' stroke-width='2' marker-end='url(#arr)'/>
<text x='286' y='127' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >I1</text>
<line x1='70' y1='193' x2='280' y2='193' stroke='#e08a3c' stroke-width='2' marker-end='url(#arr)'/>
<text x='286' y='197' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >I2</text>
<rect x='96' y='94' width='28' height='22' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='110' y='109' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >G=1</text>
<line x1='110' y1='116' x2='110' y2='123' stroke='#444' stroke-width='1.2'/>
<rect x='96' y='164' width='28' height='22' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='110' y='179' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >G=2</text>
<line x1='110' y1='186' x2='110' y2='193' stroke='#444' stroke-width='1.2'/>
<rect x='206' y='94' width='28' height='22' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='220' y='109' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >G=3</text>
<line x1='220' y1='116' x2='220' y2='123' stroke='#444' stroke-width='1.2'/>
<rect x='206' y='164' width='28' height='22' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='220' y='179' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >G=1</text>
<line x1='220' y1='186' x2='220' y2='193' stroke='#444' stroke-width='1.2'/>
<text x='64' y='128' font-size='11' fill='#e08a3c' text-anchor='end' font-weight='normal' >출력</text>
<text x='64' y='198' font-size='11' fill='#e08a3c' text-anchor='end' font-weight='normal' >출력</text>
<text x='370' y='72' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >각 교차점: 전류 = G × V  (Ohm)</text>
<text x='370' y='94' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >가로줄에서 전류가 더해진다 (Kirchhoff)</text>
<text x='370' y='126' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >I1 = 1×0.1 + 3×0.2 = 0.7 µA</text>
<text x='370' y='148' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >I2 = 2×0.1 + 1×0.2 = 0.4 µA</text>
<text x='370' y='176' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >(G는 µS, V는 V → I는 µA)</text>
<text x='370' y='206' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >가로줄이 1000개면 곱셈·덧셈 수천 번이</text>
<text x='370' y='224' font-size='12' fill='#444' text-anchor='start' font-weight='normal' >전류가 흐르는 한 순간에 끝난다.</text>
<text x='370' y='250' font-size='11.5' fill='#999' text-anchor='start' font-weight='normal' >대신: 전류(아날로그)를 숫자로 바꾸는</text>
<text x='370' y='266' font-size='11.5' fill='#999' text-anchor='start' font-weight='normal' >ADC가 비싸고, 소자 값의 오차가 답에 섞인다.</text>
</svg>
