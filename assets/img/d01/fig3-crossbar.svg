<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 306' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >crossbar에서 행렬–벡터 곱: 곱셈은 Ohm, 덧셈은 Kirchhoff (개념도)</text>
<line x1='95' y1='48' x2='95' y2='190' stroke='#3d6fb4' stroke-width='2.5'/>
<text x='95' y='40' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.1 V</tspan></text>
<line x1='205' y1='48' x2='205' y2='190' stroke='#3d6fb4' stroke-width='2.5'/>
<text x='205' y='40' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.2 V</tspan></text>
<line x1='55' y1='114' x2='275' y2='114' stroke='#e08a3c' stroke-width='2.5' marker-end='url(#arr)'/>
<text x='281' y='118' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' ><tspan>I</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='51' y='118' font-size='10' fill='#e08a3c' text-anchor='end' font-weight='normal' >0 V</text>
<line x1='55' y1='194' x2='275' y2='194' stroke='#e08a3c' stroke-width='2.5' marker-end='url(#arr)'/>
<text x='281' y='198' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' ><tspan>I</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='51' y='198' font-size='10' fill='#e08a3c' text-anchor='end' font-weight='normal' >0 V</text>
<line x1='95' y1='74' x2='121' y2='74' stroke='#444' stroke-width='1.4'/>
<rect x='112' y='80' width='18' height='24' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<line x1='121' y1='74' x2='121' y2='80' stroke='#444' stroke-width='1.4'/>
<line x1='121' y1='104' x2='121' y2='114' stroke='#444' stroke-width='1.4'/>
<circle cx='95' cy='74' r='2.5' fill='#3d6fb4'/>
<circle cx='121' cy='114' r='2.5' fill='#e08a3c'/>
<text x='134' y='95' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >G=1</text>
<line x1='95' y1='154' x2='121' y2='154' stroke='#444' stroke-width='1.4'/>
<rect x='112' y='160' width='18' height='24' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<line x1='121' y1='154' x2='121' y2='160' stroke='#444' stroke-width='1.4'/>
<line x1='121' y1='184' x2='121' y2='194' stroke='#444' stroke-width='1.4'/>
<circle cx='95' cy='154' r='2.5' fill='#3d6fb4'/>
<circle cx='121' cy='194' r='2.5' fill='#e08a3c'/>
<text x='134' y='175' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >G=2</text>
<line x1='205' y1='74' x2='231' y2='74' stroke='#444' stroke-width='1.4'/>
<rect x='222' y='80' width='18' height='24' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<line x1='231' y1='74' x2='231' y2='80' stroke='#444' stroke-width='1.4'/>
<line x1='231' y1='104' x2='231' y2='114' stroke='#444' stroke-width='1.4'/>
<circle cx='205' cy='74' r='2.5' fill='#3d6fb4'/>
<circle cx='231' cy='114' r='2.5' fill='#e08a3c'/>
<text x='244' y='95' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >G=3</text>
<line x1='205' y1='154' x2='231' y2='154' stroke='#444' stroke-width='1.4'/>
<rect x='222' y='160' width='18' height='24' rx='3' fill='#fff' stroke='#444' stroke-width='1.2' />
<line x1='231' y1='154' x2='231' y2='160' stroke='#444' stroke-width='1.4'/>
<line x1='231' y1='184' x2='231' y2='194' stroke='#444' stroke-width='1.4'/>
<circle cx='205' cy='154' r='2.5' fill='#3d6fb4'/>
<circle cx='231' cy='194' r='2.5' fill='#e08a3c'/>
<text x='244' y='175' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >G=1</text>
<text x='360' y='64' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >각 소자: 전류 = G × (V − 0) (Ohm)</text>
<text x='360' y='86' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >가로줄에서 전류가 더해진다 (Kirchhoff)</text>
<text x='360' y='118' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >I1 = 1×0.1 + 3×0.2 = 0.7 µA</text>
<text x='360' y='140' font-size='13' fill='#e08a3c' text-anchor='start' font-weight='bold' >I2 = 2×0.1 + 1×0.2 = 0.4 µA</text>
<text x='360' y='166' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >(G는 µS, V는 V → I는 µA)</text>
<text x='360' y='192' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >성립 조건: 읽기 전압이 소자 양단에 걸리고,</text>
<text x='360' y='207' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >가로줄 전위가 0 V로 유지될 때.</text>
<text x='360' y='222' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >배선 저항·누설·소자 비선형은 무시한 이상적 식.</text>
<text x='360' y='244' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >모든 가로줄이 함께 정착하는 병렬 연산</text>
<text x='360' y='259' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >(정착·읽기 시간이 있다). 다음 단계가</text>
<text x='360' y='274' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >디지털이면 ADC로 숫자로 바꿔야 한다.</text>
<text x='300' y='296' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >개념도: 실제 crossbar는 세로줄과 가로줄이 다른 층에 있고, 교차점마다 소자가 두 층을 잇는다.</text>
</svg>
