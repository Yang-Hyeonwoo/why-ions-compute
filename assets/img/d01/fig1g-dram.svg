<text x='420' y='176' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='bold' >+</text>
<text x='442' y='189' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >C</text>
<text x='420' y='248' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >커패시터 전압 1 V → 조금씩 샘</text>
<line x1='394.0' y1='168.0' x2='334.0' y2='168.0' stroke='#999' stroke-width='1.2' stroke-dasharray='3 2' marker-end='url(#a-gray)'/>
<text x='360' y='182' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >아주 작은 누설</text>
<text x='360.0' y='290' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >스위치를 끄면 전하가 갇힌다.</text>
<text x='360.0' y='305' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >꺼진 트랜지스터의 문턱 아래 전류 등으로</text>
<text x='360.0' y='320' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >조금씩 새서, 수십 ms마다 다시 채운다</text>
<text x='600.0' y='50' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >③ 읽기: 스위치 켜고 비트선과 나눈다</text>
<line x1='520' y1='70' x2='520' y2='250' stroke='#3d6fb4' stroke-width='2.4'/>
<text x='514' y='82' font-size='9.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' >비트선</text>
<text x='526' y='82' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='bold' >0.5 V → 0.55 V</text>
<line x1='550' y1='110' x2='690' y2='110' stroke='#e08a3c' stroke-width='2.2'/>
<text x='690' y='102' font-size='9.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >워드선 높음</text>
<line x1='520' y1='150' x2='570' y2='150' stroke='#444' stroke-width='1.4'/>
<rect x='570' y='138' width='60' height='24' rx='4' fill='#eef9f4' stroke='#13936b' stroke-width='1.4' />
<text x='600' y='154' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >켜짐</text>
