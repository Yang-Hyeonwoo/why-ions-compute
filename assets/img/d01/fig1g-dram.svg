<text x='653' y='176' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='bold' >+</text>
<text x='682' y='189' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >C</text>
<text x='660' y='248' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >커패시터 전압 0.55 V</text>
<line x1='566.0' y1='128.0' x2='528.0' y2='128.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#a-red)'/>
<text x='530' y='122' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >전하 일부가 비트선으로</text>
<text x='600.0' y='290' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >비트선을 0.5 V로 맞춰 두고 스위치를 켠다.</text>
<text x='600.0' y='305' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >셀 20 fF와 비트선 180 fF가 전하를 나눠</text>
<text x='600.0' y='320' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >비트선이 +0.05 V 움직인다 → 증폭기가 '1'로 판정</text>
<text x='360.0' y='354' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >읽으면 셀의 전하가 줄어들어 다시 써 넣는다(새로 고침도 같은 방식). 정전용량 값은 예시이며 전압은 코드가 계산. (Claude가 그림, 모식도)</text>
</svg>
