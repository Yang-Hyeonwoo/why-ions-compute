<text x='450' y='102' font-size='9.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >워드선 낮음</text>
<line x1='280' y1='150' x2='330' y2='150' stroke='#444' stroke-width='1.4'/>
<rect x='330' y='138' width='60' height='24' rx='4' fill='#f3f3f3' stroke='#999' stroke-width='1.4' />
<text x='360' y='154' font-size='10' fill='#999' text-anchor='middle' font-weight='bold' >꺼짐</text>
<line x1='360' y1='110' x2='360' y2='138' stroke='#e08a3c' stroke-width='1.4'/>
