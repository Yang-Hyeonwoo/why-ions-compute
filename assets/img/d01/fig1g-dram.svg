<text x='202' y='189' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >C</text>
<text x='180' y='248' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >커패시터 전압 1 V</text>
<line x1='48.0' y1='128.0' x2='86.0' y2='128.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#a-red)'/>
<text x='50' y='122' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >전류 I</text>
<text x='120.0' y='290' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >비트선을 1 V로 두고 스위치를 켠다.</text>
<text x='120.0' y='305' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >Q = CV = 20 fF × 1 V = 20 fC</text>
<text x='120.0' y='320' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >(전자 약 12.5만 개분의 전하)</text>
<text x='360.0' y='50' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >② 유지: 스위치 끄고 들고 있는다</text>
<line x1='280' y1='70' x2='280' y2='250' stroke='#3d6fb4' stroke-width='2.4'/>
