<text x='360.0' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >DRAM 한 칸(트랜지스터 1개 + 커패시터 1개)이 비트 하나를 저장하는 순서 (단순화한 모식도)</text>
<text x='120.0' y='50' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >① 쓰기: 스위치 켜고 채운다</text>
<line x1='40' y1='70' x2='40' y2='250' stroke='#3d6fb4' stroke-width='2.4'/>
<text x='34' y='82' font-size='9.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' >비트선</text>
<text x='46' y='82' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='bold' >1 V</text>
