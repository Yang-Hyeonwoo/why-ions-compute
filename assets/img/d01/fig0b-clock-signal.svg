<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 342' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='320.0' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >클록: 높은 전압과 낮은 전압이 일정한 간격으로 번갈아 오는 신호(사각파)</text>
<polyline points='120.0,124.0 150.0,124.0 150.0,74.0 202.5,74.0 202.5,124.0 255.0,124.0 255.0,74.0 307.5,74.0 307.5,124.0 360.0,124.0 360.0,74.0 412.5,74.0 412.5,124.0 465.0,124.0 465.0,74.0 517.5,74.0 517.5,124.0 570.0,124.0 590.0,124.0' fill='none' stroke='#3d6fb4' stroke-width='2.4' stroke-linejoin='round'/>
<text x='114' y='78' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' >높음 (예: 0.8 V)</text>
<text x='114' y='128' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' >낮음 (0 V)</text>
<line x1='255' y1='141' x2='255' y2='151' stroke='#444' stroke-width='1.2'/>
<line x1='360' y1='141' x2='360' y2='151' stroke='#444' stroke-width='1.2'/>
<line x1='315.0' y1='146.0' x2='257.0' y2='146.0' stroke='#444' stroke-width='1.2' marker-end='url(#a-ink)'/>
<line x1='315.0' y1='146.0' x2='358.0' y2='146.0' stroke='#444' stroke-width='1.2' marker-end='url(#a-ink)'/>
<text x='315' y='162' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >한 주기 T (높음 한 번 + 낮음 한 번)</text>
<line x1='150.0' y1='56.0' x2='150.0' y2='70.0' stroke='#c8553d' stroke-width='1.4' marker-end='url(#a-red)'/>
<line x1='255.0' y1='56.0' x2='255.0' y2='70.0' stroke='#c8553d' stroke-width='1.4' marker-end='url(#a-red)'/>
<line x1='360.0' y1='56.0' x2='360.0' y2='70.0' stroke='#c8553d' stroke-width='1.4' marker-end='url(#a-red)'/>
<line x1='465.0' y1='56.0' x2='465.0' y2='70.0' stroke='#c8553d' stroke-width='1.4' marker-end='url(#a-red)'/>
<text x='146' y='52' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >↓ 올라가는 가장자리(rising edge): 낮음 → 높음으로 바뀌는 순간. 이 예에서는 이때 R이 값을 붙잡는다</text>
<text x='360' y='180' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >주파수 f = 1/T  ·  1 GHz면 T = 1 ns(10억분의 1초)  ·  2 GHz면 T = 0.5 ns</text>
<rect x='70' y='222' width='150' height='56' rx='6' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='145' y='244' font-size='12.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >레지스터 R</text>
<text x='145' y='262' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >가장자리에서 입력을 붙잡아</text>
<text x='145' y='274' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >다음 가장자리까지 유지</text>
<rect x='320' y='222' width='190' height='56' rx='6' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='415' y='244' font-size='12.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >논리 회로 (예: 덧셈기)</text>
<text x='415' y='262' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >새 값을 만들고 안정되는 데</text>
<text x='415' y='274' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >시간이 걸린다 (지연)</text>
<line x1='220.0' y1='242.0' x2='318.0' y2='242.0' stroke='#444' stroke-width='1.6' marker-end='url(#a-ink)'/>
<text x='269' y='236' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >현재 값</text>
<path d='M510,258 L560,258 L560,306 L40,306 L40,258 L66,258' stroke='#444' stroke-width='1.6' fill='none' marker-end='url(#a-ink)'/>
<text x='300' y='300' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >새 값 (다음 가장자리에서 R로 들어간다)</text>
<line x1='145' y1='196' x2='145' y2='222' stroke='#3d6fb4' stroke-width='1.4' stroke-dasharray='3 2'/>
<text x='152' y='210' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >클록</text>
<text x='320.0' y='336' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 실제 칩에는 레지스터와 논리 회로가 아주 많고, 같은 클록을 나눠 받는다. (Claude가 그림)</text>
</svg>
