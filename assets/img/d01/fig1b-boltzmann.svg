<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 260' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='150' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >트랜지스터 (문턱 아래)</text>
<path d='M30,150 C100,150 110,80 150,80 C190,80 200,150 270,150' stroke='#444' stroke-width='2' fill='none' />
<line x1='40' y1='170' x2='260' y2='170' stroke='#d9d9d9' stroke-width='1'/>
<text x='32' y='184' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >낮은 쪽</text>
<text x='268' y='184' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >높은 쪽</text>
<circle cx='55' cy='142' r='7' fill='#33cc99'/>
<text x='55' y='130' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >전자</text>
<line x1='80' y1='55' x2='220' y2='55' stroke='#999' stroke-width='1.2' stroke-dasharray='4 3' marker-end='url(#arr)'/>
<text x='150' y='48' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >장벽을 넘을 때만 흐른다</text>
<line x1='210' y1='80' x2='210' y2='150' stroke='#c8553d' stroke-width='1' stroke-dasharray='2 2'/>
<text x='216' y='120' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' >장벽 E</text>
<text x='150' y='195' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >넘을 확률 ∝ e<tspan dy='-6' font-size='9'>−E/kT</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='150' y='214' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >게이트 전압이 장벽을 낮춘다</text>
<text x='450' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >신경세포 막의 이온 채널</text>
<path d='M330,150 C400,150 410,80 450,80 C490,80 500,150 570,150' stroke='#444' stroke-width='2' fill='none' />
<line x1='340' y1='170' x2='560' y2='170' stroke='#d9d9d9' stroke-width='1'/>
<text x='332' y='184' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >낮은 쪽</text>
<text x='568' y='184' font-size='10.5' fill='#999' text-anchor='end' font-weight='normal' >높은 쪽</text>
<circle cx='355' cy='142' r='7' fill='#33cc99'/>
<text x='355' y='130' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >이온</text>
<line x1='380' y1='55' x2='520' y2='55' stroke='#999' stroke-width='1.2' stroke-dasharray='4 3' marker-end='url(#arr)'/>
<text x='450' y='48' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >장벽을 넘을 때만 흐른다</text>
<line x1='510' y1='80' x2='510' y2='150' stroke='#c8553d' stroke-width='1' stroke-dasharray='2 2'/>
<text x='516' y='120' font-size='11' fill='#c8553d' text-anchor='start' font-weight='normal' >장벽 E</text>
<text x='450' y='195' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >넘을 확률 ∝ e<tspan dy='-6' font-size='9'>−E/kT</tspan><tspan dy='6' font-size='1'> </tspan></text>
<text x='450' y='214' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >막전위가 장벽을 낮춘다</text>
<text x='300' y='245' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >같은 볼츠만 분포 → 둘 다 '전압에 지수적인 전류'. 닮은 것은 우연이 아니라 같은 물리다.</text>
</svg>
