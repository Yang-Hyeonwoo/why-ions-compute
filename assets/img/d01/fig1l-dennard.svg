<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 420' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='360.0' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >한 세대 축소(κ = 1.4)에서 무엇이 어떻게 변하나: 이상적 규칙 vs 전압을 거의 못 줄일 때</text>
<rect x='290' y='40' width='160' height='26' rx='4' fill='#eef9f4' stroke='none' stroke-width='1.2' />
<rect x='470' y='40' width='190' height='26' rx='4' fill='#fbeeec' stroke='none' stroke-width='1.2' />
<text x='20' y='58' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >양</text>
<text x='370' y='58' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >이상적 (Dennard 1974)</text>
<text x='565' y='58' font-size='11' fill='#c8553d' text-anchor='middle' font-weight='bold' >전압 고정 모형 (Claude)</text>
<rect x='14' y='70' width='700' height='23' rx='2' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20' y='86' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >치수: 게이트 길이 L, 폭 W, 산화막 두께</text>
<text x='340' y='86' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='400' y='86' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='530' y='86' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='630' y='86' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='20' y='111' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >기판 도핑 농도</text>
<text x='340' y='111' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >κ</text>
<text x='400' y='111' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×1.40</text>
<text x='530' y='111' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >κ (단순화)</text>
<text x='630' y='111' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.40</text>
<rect x='14' y='120' width='700' height='23' rx='2' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20' y='136' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>공급전압 V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='340' y='136' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='400' y='136' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='530' y='136' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >≈ 1 (거의 그대로)</text>
<text x='630' y='136' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.00</text>
<text x='20' y='161' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>문턱전압 V</tspan><tspan dy='4' font-size='9.5'>th</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='340' y='161' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='400' y='161' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='530' y='161' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >≈ 1 (거의 그대로)</text>
<text x='630' y='161' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.00</text>
<rect x='14' y='170' width='700' height='23' rx='2' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20' y='186' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >정전용량 C</text>
<text x='340' y='186' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='400' y='186' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='530' y='186' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='630' y='186' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='20' y='211' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >지연(신호가 안정되는 시간)</text>
<text x='340' y='211' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ</text>
<text x='400' y='211' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.71</text>
<text x='530' y='211' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >1/κ (가정)</text>
<text x='630' y='211' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×0.71</text>
<rect x='14' y='220' width='700' height='23' rx='2' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20' y='236' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >클록 f (지연의 역수만큼 올림)</text>
<text x='340' y='236' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >κ</text>
<text x='400' y='236' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×1.40</text>
<text x='530' y='236' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >κ (가정)</text>
<text x='630' y='236' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.40</text>
<text x='20' y='261' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >소자 하나의 동적 전력 ∝ C·V²·f</text>
<text x='340' y='261' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1/κ²</text>
<text x='400' y='261' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×0.51</text>
<text x='530' y='261' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >1</text>
<text x='630' y='261' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.00</text>
<rect x='14' y='270' width='700' height='23' rx='2' fill='#fafafa' stroke='none' stroke-width='1.2' />
<text x='20' y='286' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >같은 면적에 들어가는 소자 수</text>
<text x='340' y='286' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >κ²</text>
<text x='400' y='286' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×1.96</text>
<text x='530' y='286' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >κ²</text>
<text x='630' y='286' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.96</text>
<text x='20' y='311' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >면적당 전력(전력 밀도)</text>
<text x='340' y='311' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >1</text>
<text x='400' y='311' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' >×1.00</text>
<text x='530' y='311' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >κ²</text>
<text x='630' y='311' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >×1.96</text>
<text x='20' y='342' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >왼쪽 열: Dennard 외 1974의 Table I(p.265) 규칙(치수·전압 1/κ, 도핑 κ → 전류·정전용량·지연 1/κ, 회로당 전력 1/κ², 전력 밀도 1).</text>
<text x='20' y='357' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >클록 f를 지연의 역수(κ배)로 올린다는 줄은 Claude가 더한 가정. 이 논문도 문턱 아래 특성은 축소되지 않는다고 적는다(p.259).</text>
<text x='20' y='376' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >오른쪽 열: 전압만 그대로 두고 나머지는 왼쪽과 같다고 놓은 단순 모형. 전력 밀도가 한 세대에 ×1.96, 네 세대면 ×15.</text>
<text x='20' y='391' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >실제 공정은 이 두 열 사이 어딘가이며, 세대별 실제 값은 이 그림이 다루지 않는다. (Claude가 계산해 그림)</text>
</svg>
