<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 332' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >트랜지스터 단면 (모식도): 게이트 전압이 소스–드레인 사이의 채널을 여닫는다</text>
<text x='150' y='50' font-size='12.5' fill='#999' text-anchor='middle' font-weight='bold' >게이트 전압 0 V — 채널 없음</text>
<rect x='20' y='150' width='260' height='100' rx='0' fill='#f4f4f4' stroke='#d9d9d9' stroke-width='1.2' />
<text x='150' y='240' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >반도체 몸체(실리콘 기판)</text>
<rect x='28' y='150' width='62' height='34' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='59.0' y='172' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >소스</text>
<rect x='210' y='150' width='62' height='34' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='241.0' y='172' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >드레인</text>
<line x1='59.0' y1='150' x2='59.0' y2='124' stroke='#444' stroke-width='1.4'/>
<line x1='241.0' y1='150' x2='241.0' y2='124' stroke='#444' stroke-width='1.4'/>
<text x='59.0' y='118' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >S</text>
<text x='241.0' y='118' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >D</text>
<rect x='94' y='142' width='112' height='8' rx='0' fill='#fff7e6' stroke='#e08a3c' stroke-width='1' />
<rect x='94' y='114' width='112' height='28' rx='3' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='150' y='133' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='bold' >게이트</text>
<text x='150' y='106' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >얇은 절연막 (전류가 못 지나감)</text>
<line x1='150' y1='114' x2='150' y2='92' stroke='#444' stroke-width='1.4'/>
<text x='156' y='90' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >G: 0 V</text>
<line x1='94' y1='155' x2='206' y2='155' stroke='#999' stroke-width='1.2' stroke-dasharray='3 3'/>
<text x='150' y='202' font-size='10' fill='#999' text-anchor='middle' font-weight='bold' >길이 없음: 전류 거의 0</text>
<text x='150' y='218' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(문턱 아래의 아주 작은 누설만 흐른다)</text>
<text x='150' y='268' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>소스와 드레인 사이에는 따로 전압을 걸어 둔다: V</tspan><tspan dy='4' font-size='9'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='450' y='50' font-size='12.5' fill='#13936b' text-anchor='middle' font-weight='bold' >게이트 전압이 문턱 위 — 채널 열림</text>
<rect x='320' y='150' width='260' height='100' rx='0' fill='#f4f4f4' stroke='#d9d9d9' stroke-width='1.2' />
<text x='450' y='240' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >반도체 몸체(실리콘 기판)</text>
<rect x='328' y='150' width='62' height='34' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='359.0' y='172' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >소스</text>
<rect x='510' y='150' width='62' height='34' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='541.0' y='172' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >드레인</text>
<line x1='359.0' y1='150' x2='359.0' y2='124' stroke='#444' stroke-width='1.4'/>
<line x1='541.0' y1='150' x2='541.0' y2='124' stroke='#444' stroke-width='1.4'/>
<text x='359.0' y='118' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >S</text>
<text x='541.0' y='118' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >D</text>
<rect x='394' y='142' width='112' height='8' rx='0' fill='#fff7e6' stroke='#e08a3c' stroke-width='1' />
<rect x='394' y='114' width='112' height='28' rx='3' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='450' y='133' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='bold' >게이트</text>
<text x='450' y='106' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >얇은 절연막 (전류가 못 지나감)</text>
<line x1='450' y1='114' x2='450' y2='92' stroke='#444' stroke-width='1.4'/>
<text x='456' y='90' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >G: 문턱 위 전압</text>
<rect x='394' y='150' width='112' height='10' rx='0' fill='#b9ead8' stroke='none' stroke-width='1.2' />
<line x1='384' y1='155' x2='516' y2='155' stroke='#13936b' stroke-width='2.2' marker-end='url(#arr)'/>
<text x='450' y='202' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >채널: 전자가 모여 길이 생김</text>
<text x='450' y='218' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' ><tspan>소스 → 드레인으로 전류 I</tspan><tspan dy='4' font-size='9'>D</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='450' y='268' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>소스와 드레인 사이에는 따로 전압을 걸어 둔다: V</tspan><tspan dy='4' font-size='9'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='300' y='300' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >게이트는 절연막 위에 있어 전류를 내지 않고 전압만 건다. 그 전압이 아래 반도체에 전자를 끌어모아 '길(채널)'을 만든다.</text>
<text x='300' y='318' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >n형 트랜지스터 기준. 실제 소자는 수십 nm 크기이며 층이 더 많다. (Claude가 그림, 모식도)</text>
</svg>
