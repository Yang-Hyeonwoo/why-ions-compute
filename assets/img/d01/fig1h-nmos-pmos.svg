<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 400' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='360.0' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >nMOS와 pMOS: 운반하는 전하가 다르고, 켜지는 조건은 각자 '자기 소스' 기준</text>
<text x='185.0' y='50' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >(a) nMOS (n채널)</text>
<rect x='30' y='110' width='310' height='80' rx='0' fill='#fbeeec' stroke='#ccc' stroke-width='1.2' />
<text x='185.0' y='182' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >p형 기판</text>
<rect x='40' y='110' width='70' height='30' rx='3' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='75' y='130' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >n⁺ 소스</text>
<rect x='260' y='110' width='70' height='30' rx='3' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='295' y='130' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >n⁺ 드레인</text>
<rect x='116' y='102' width='138' height='8' rx='0' fill='#fff7e6' stroke='#e08a3c' stroke-width='1' />
<rect x='116' y='78' width='138' height='24' rx='3' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='185.0' y='95' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='normal' >게이트</text>
<circle cx='124.0' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='141.4' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='158.9' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='176.3' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='193.7' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='211.1' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='228.6' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<circle cx='246.0' cy='115.0' r='2.6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='0.5'/>
<text x='185.0' y='134' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >켜졌을 때 채널: 전자 ●</text>
<text x='185.0' y='222' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >소스 = GND(0 V)에 연결</text>
<text x='185.0' y='239' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' ><tspan>게이트가 소스보다 V</tspan><tspan dy='4' font-size='9.5'>th</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>(예: 0.4 V) 이상 높으면 켜짐</tspan></text>
<line x1='92.0' y1='285.0' x2='92.0' y2='315.0' stroke='#13936b' stroke-width='3.2'/>
<line x1='84.0' y1='285.0' x2='84.0' y2='315.0' stroke='#444' stroke-width='1.6'/>
<line x1='66.0' y1='300' x2='84.0' y2='300' stroke='#444' stroke-width='1.4'/>
<line x1='92.0' y1='290.0' x2='100' y2='290.0' stroke='#444' stroke-width='1.4'/>
<line x1='100' y1='290.0' x2='100' y2='270.0' stroke='#444' stroke-width='1.4'/>
<line x1='92.0' y1='310.0' x2='100' y2='310.0' stroke='#444' stroke-width='1.4'/>
<line x1='100' y1='310.0' x2='100' y2='330.0' stroke='#444' stroke-width='1.4'/>
<text x='60' y='304' font-size='10' fill='#444' text-anchor='end' font-weight='normal' >G</text>
<text x='106' y='276' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >D</text>
<text x='106' y='330' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >S → GND</text>
<text x='160' y='298' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>입력 1 V: V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 − 0 = +1 V → 켜짐</tspan></text>
<text x='160' y='314' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>입력 0 V: V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0 − 0 = 0 V → 꺼짐</tspan></text>
<text x='535.0' y='50' font-size='13' fill='#c8553d' text-anchor='middle' font-weight='bold' >(b) pMOS (p채널)</text>
<rect x='380' y='110' width='310' height='80' rx='0' fill='#f2f6fc' stroke='#ccc' stroke-width='1.2' />
<text x='535.0' y='182' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >n형 우물(n-well)</text>
<rect x='390' y='110' width='70' height='30' rx='3' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='425' y='130' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >p⁺ 소스</text>
<rect x='610' y='110' width='70' height='30' rx='3' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='645' y='130' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >p⁺ 드레인</text>
<rect x='466' y='102' width='138' height='8' rx='0' fill='#fff7e6' stroke='#e08a3c' stroke-width='1' />
<rect x='466' y='78' width='138' height='24' rx='3' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='535.0' y='95' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='normal' >게이트</text>
<circle cx='474.0' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='491.4' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='508.9' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='526.3' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='543.7' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='561.1' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='578.6' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<circle cx='596.0' cy='115.0' r='3.6' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='535.0' y='134' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >켜졌을 때 채널: 정공 ⊕</text>
<text x='535.0' y='222' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>소스 = V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>(1 V)에 연결</tspan></text>
<text x='535.0' y='239' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >게이트가 소스보다 0.4 V 이상 낮으면 켜짐</text>
<line x1='442.0' y1='285.0' x2='442.0' y2='315.0' stroke='#13936b' stroke-width='3.2'/>
<line x1='434.0' y1='285.0' x2='434.0' y2='315.0' stroke='#444' stroke-width='1.6'/>
<circle cx='430.0' cy='300.0' r='3.2' fill='#fff' stroke='#444' stroke-width='1.3'/>
<line x1='416.0' y1='300' x2='426.5' y2='300' stroke='#444' stroke-width='1.4'/>
<line x1='442.0' y1='290.0' x2='450' y2='290.0' stroke='#444' stroke-width='1.4'/>
<line x1='450' y1='290.0' x2='450' y2='270.0' stroke='#444' stroke-width='1.4'/>
<line x1='442.0' y1='310.0' x2='450' y2='310.0' stroke='#444' stroke-width='1.4'/>
<line x1='450' y1='310.0' x2='450' y2='330.0' stroke='#444' stroke-width='1.4'/>
<text x='410' y='304' font-size='10' fill='#444' text-anchor='end' font-weight='normal' >G</text>
<text x='456' y='276' font-size='10' fill='#444' text-anchor='start' font-weight='normal' ><tspan>S → V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='456' y='330' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >D</text>
<text x='510' y='298' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>입력 0 V: V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0 − 1 = −1 V → 켜짐</tspan></text>
<text x='510' y='314' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>입력 1 V: V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 − 1 = 0 V → 꺼짐</tspan></text>
<text x='360.0' y='362' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >정공: 전자가 하나 빠진 빈자리. 이웃 전자가 빈자리로 옮겨 가면 빈자리는 반대쪽으로 움직여, 양(+)전하가 움직이는 것처럼 행동한다.</text>
<text x='360.0' y='378' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>pMOS 기호의 작은 동그라미 = '게이트가 낮을 때 켜짐'. 문턱 크기 0.4 V, V</tspan><tspan dy='4' font-size='9.5'>DD</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1 V는 예시 값. (Claude가 그림, 모식도)</tspan></text>
</svg>
