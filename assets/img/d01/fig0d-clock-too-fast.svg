<text x='320.0' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >박자가 너무 빠르면: 새 값이 안정되기 전에 가장자리가 온다</text>
<text x='30' y='50' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >T = 0.3 ns (약 3.3 GHz) &lt; 논리 회로 지연 0.4 ns</text>
<text x='30' y='66' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >클록</text>
<text x='30' y='116' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >논리 회로 출력</text>
<text x='30' y='164' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >레지스터 R</text>
<polyline points='36.0,92.0 36.0,92.0 36.0,76.0 58.5,76.0 58.5,92.0 81.0,92.0 81.0,76.0 103.5,76.0 103.5,92.0 126.0,92.0 126.0,76.0 148.5,76.0 148.5,92.0 171.0,92.0 171.0,76.0 193.5,76.0 193.5,92.0 216.0,92.0' fill='none' stroke='#3d6fb4' stroke-width='1.8' stroke-linejoin='round'/>
