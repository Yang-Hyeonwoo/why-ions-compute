<rect x='36.0' y='171' width='45.0' height='22' rx='3' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1' />
<text x='58.5' y='186' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >0</text>
<rect x='81.0' y='171' width='45.0' height='22' rx='3' fill='#fbe3df' stroke='#c8553d' stroke-width='1' />
<text x='103.5' y='186' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >?</text>
<line x1='81.0' y1='72' x2='81.0' y2='194' stroke='#c8553d' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='36' y1='212' x2='216.0' y2='212' stroke='#999' stroke-width='1'/>
<line x1='36.0' y1='209' x2='36.0' y2='215' stroke='#999' stroke-width='1'/>
<text x='36.0' y='227' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0</text>
<line x1='111.0' y1='209' x2='111.0' y2='215' stroke='#999' stroke-width='1'/>
<text x='111.0' y='227' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0.5</text>
<line x1='186.0' y1='209' x2='186.0' y2='215' stroke='#999' stroke-width='1'/>
<text x='186.0' y='227' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1</text>
<text x='216.0' y='240' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >시간 (ns)</text>
<text x='300' y='92' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >첫 가장자리(0.3 ns)에 출력은 아직 '바뀌는 중'이다.</text>
<text x='300' y='110' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >R이 무엇을 붙잡을지 알 수 없다: 옛 값, 새 값,</text>
<text x='300' y='128' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >또는 비트마다 섞인 값(그림의 '?').</text>
<text x='300' y='156' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >그래서 설계자는 '가장 느린 경로의 지연 + 여유'보다</text>
<text x='300' y='174' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >주기 T를 길게 잡는다. 그 안에서만 결과가 보장된다.</text>
<text x='300' y='202' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >(여유: 레지스터가 값을 받는 데 필요한 시간,</text>
<text x='300' y='218' font-size='10' fill='#999' text-anchor='start' font-weight='normal' > 클록이 칩 곳곳에 도착하는 시각의 차이, 온도·전압 변동)</text>
<text x='320.0' y='292' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도. 지연 0.4 ns는 예시 값. (Claude가 그림)</text>
</svg>
