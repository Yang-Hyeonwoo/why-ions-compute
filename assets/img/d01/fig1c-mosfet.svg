<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 470' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='360.0' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >n채널 MOSFET 단면 (모식도): 다섯 부분, 네 단자, 두 개의 전압</text>
<rect x='60' y='160' width='500' height='180' rx='0' fill='#fbeeec' stroke='#e3b8ae' stroke-width='1.2' />
<path d='M80,160 L80,200 Q80,212 92,212 L198,212 Q210,212 210,200 L210,160 Z' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.3'/>
<text x='145.0' y='182' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >소스 (n⁺ 영역)</text>
<text x='145.0' y='200' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >움직이는 전자가 아주 많음</text>
<path d='M410,160 L410,200 Q410,212 422,212 L528,212 Q540,212 540,200 L540,160 Z' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.3'/>
<text x='475.0' y='182' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >드레인 (n⁺ 영역)</text>
<text x='475.0' y='200' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >움직이는 전자가 아주 많음</text>
<rect x='204' y='150' width='212' height='10' rx='0' fill='#fff7e6' stroke='#e08a3c' stroke-width='1' />
<rect x='204' y='114' width='212' height='36' rx='3' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='310.0' y='137' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >게이트 전극</text>
<line x1='406' y1='155' x2='586' y2='155' stroke='#999' stroke-width='1'/>
<text x='590' y='146' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >게이트 산화막</text>
<text x='590' y='160' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >= 절연층(두께 수 nm)</text>
<text x='590' y='174' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >전류가 거의 못 지나감</text>
<rect x='210' y='161' width='200' height='9' rx='0' fill='none' stroke='#13936b' stroke-width='1.2' stroke-dasharray='3 2'/>
<text x='310.0' y='186' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >채널이 생기는 자리</text>
<text x='310.0' y='200' font-size='9.5' fill='#13936b' text-anchor='middle' font-weight='normal' >(산화막 바로 아래 실리콘 표면)</text>
<line x1='145.0' y1='160' x2='145.0' y2='90' stroke='#444' stroke-width='1.4'/>
<text x='145.0' y='70' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >S (소스)</text>
<text x='145.0' y='84' font-size='10' fill='#8a5cb8' text-anchor='middle' font-weight='normal' >기준 0 V</text>
<line x1='475.0' y1='160' x2='475.0' y2='90' stroke='#444' stroke-width='1.4'/>
<text x='475.0' y='70' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >D (드레인)</text>
<text x='475.0' y='84' font-size='10' fill='#8a5cb8' text-anchor='middle' font-weight='normal' ><tspan>전압 V</tspan><tspan dy='4' font-size='9.5'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='310.0' y1='114' x2='310.0' y2='68' stroke='#444' stroke-width='1.4'/>
<text x='310.0' y='48' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >G (게이트)</text>
<text x='310.0' y='62' font-size='10' fill='#8a5cb8' text-anchor='middle' font-weight='normal' ><tspan>전압 V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<line x1='165.0' y1='234.0' x2='455.0' y2='234.0' stroke='#3d6fb4' stroke-width='2' marker-end='url(#a-blue)'/>
<text x='310.0' y='250' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >전자 이동 e⁻: 소스 → 드레인</text>
<line x1='455.0' y1='270.0' x2='165.0' y2='270.0' stroke='#c8553d' stroke-width='2' marker-end='url(#a-red)'/>
<text x='310.0' y='286' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' ><tspan>관습적 전류 I</tspan><tspan dy='4' font-size='9.5'>D</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>: 드레인 → 소스 (전자와 반대 방향)</tspan></text>
<circle cx='100.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='100' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<circle cx='170.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='170' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<circle cx='240.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='240' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<circle cx='380.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='380' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<circle cx='450.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='450' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<circle cx='520.0' cy='300.0' r='5' fill='none' stroke='#c8553d' stroke-width='0.9'/>
<text x='520' y='303.5' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >+</text>
<text x='310.0' y='330' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >p형 실리콘 기판(몸체, body): 정공(⊕)이 많고, 움직이는 전자는 아주 적다(0은 아님)</text>
<line x1='530' y1='340' x2='530' y2='356' stroke='#444' stroke-width='1.4'/>
<text x='538' y='354' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >B (몸체): 보통 소스와 함께 0 V</text>
<line x1='380.0' y1='146.0' x2='380.0' y2='168.0' stroke='#8a5cb8' stroke-width='1.4' stroke-dasharray='2 2' marker-end='url(#a-purple)'/>
<text x='386.0' y='108' font-size='9.5' fill='#8a5cb8' text-anchor='start' font-weight='bold' >게이트 누설</text>
<text x='60' y='386' font-size='10.5' fill='#8a5cb8' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>GS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 게이트 전압 − 소스 전압: 게이트 아래 표면에 전자가 얼마나 모이는지(= 장벽 높이)를 정한다. 수도꼭지의 '손잡이'.</tspan></text>
<text x='60' y='404' font-size='10.5' fill='#8a5cb8' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='9.5'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 드레인 전압 − 소스 전압: 모인 전자를 드레인 쪽으로 끌어당긴다. V</tspan><tspan dy='4' font-size='9.5'>DS</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0이면 채널이 있어도 알짜 전류는 0.</tspan></text>
<text x='60' y='426' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >게이트 누설(보라 점선): 아주 얇은 산화막을 양자 터널링으로 지나는 작은 전류. 게이트 → 실리콘의 세로 경로라서,</text>
<text x='60' y='442' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >소스 → 드레인의 가로 경로로 흐르는 '문턱 아래 전류'와는 다른 현상이다.</text>
<text x='360.0' y='462' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >모식도: 크기 비율은 실제와 다르다(실제 게이트 길이는 수십 nm 이하). (Claude가 그림)</text>
</svg>
