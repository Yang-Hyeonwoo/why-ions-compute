<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 292' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >'뉴로모픽'이라는 우산 아래의 줄기들 (이해를 위한 분류, 서로 겹친다)</text>
<rect x='20' y='56' width='270' height='80' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='32' y='80' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='bold' >(가) 아날로그 VLSI</text>
<text x='32' y='100' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >회로의 물리로 신경 동역학 재현</text>
<text x='32' y='120' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >silicon retina, BrainScaleS-2</text>
<rect x='310' y='56' width='270' height='80' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='322' y='80' font-size='13.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(나) 디지털 SNN 칩</text>
<text x='322' y='100' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >소자는 그대로, 구조를 뇌처럼</text>
<text x='322' y='120' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >TrueNorth, Loihi, SpiNNaker</text>
<rect x='20' y='156' width='270' height='80' rx='8' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='32' y='180' font-size='13.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >(다) In-memory computing</text>
<text x='32' y='200' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >메모리 배열 안에서 행렬 곱</text>
<text x='32' y='220' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >PCM·RRAM crossbar</text>
<rect x='310' y='156' width='270' height='80' rx='8' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='322' y='180' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='bold' >(라) 물리 컴퓨팅 (PRC)</text>
<text x='322' y='200' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' >재료의 동역학을 계산 자원으로</text>
<text x='322' y='220' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >휘발성 memristor, 이온 소자</text>
<line x1='290' y1='96' x2='310' y2='96' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='155' y1='136' x2='155' y2='156' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='445' y1='136' x2='445' y2='156' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='290' y1='196' x2='310' y2='196' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<text x='300' y='258' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >(마) 회색지대: 시냅스 현상(PPF, STP/LTP, STDP)을 소자 하나에서 재현 — 아직 '계산'이 아니라 부품 후보</text>
<text x='300' y='278' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >예: Liang 2024의 RC 시스템 예시는 (라)의 reservoir + (다)의 crossbar를 한 시스템에 넣는다</text>
</svg>
