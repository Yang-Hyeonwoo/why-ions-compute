<text x='524' y='90' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='556' y='90' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='616' y='90' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0+0 = 0</text>
<text x='450' y='114' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='482' y='114' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='524' y='114' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='556' y='114' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='616' y='114' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0+1 = 1</text>
<text x='450' y='138' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='482' y='138' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='524' y='138' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='556' y='138' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='616' y='138' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1+0 = 1</text>
<text x='450' y='162' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='482' y='162' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='524' y='162' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='556' y='162' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
<text x='616' y='162' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1+1 = 2</text>
<text x='550' y='198' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >두 자리 'CS'를 이진수로 읽으면 A+B</text>
<text x='550' y='213' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >예: 1+1 → C=1, S=0 → 10₂ = 2</text>
<rect x='20' y='270' width='150' height='24' rx='5' fill='#f7f7f7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='95.0' y='286' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >반가산기(1자리, 2입력)</text>
<line x1='172.0' y1='282.0' x2='184.0' y2='282.0' stroke='#999' stroke-width='1.2' marker-end='url(#a-gray)'/>
<rect x='186' y='270' width='150' height='24' rx='5' fill='#f7f7f7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='261.0' y='286' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >전가산기(아랫자리 C까지 3입력)</text>
<line x1='338.0' y1='282.0' x2='350.0' y2='282.0' stroke='#999' stroke-width='1.2' marker-end='url(#a-gray)'/>
<rect x='352' y='270' width='150' height='24' rx='5' fill='#f7f7f7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='427.0' y='286' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >n비트 덧셈기(전가산기 n개 이음)</text>
<line x1='504.0' y1='282.0' x2='516.0' y2='282.0' stroke='#999' stroke-width='1.2' marker-end='url(#a-gray)'/>
<rect x='518' y='270' width='150' height='24' rx='5' fill='#f7f7f7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='593.0' y='286' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >곱셈기(자리 옮겨 더하기 반복)</text>
<text x='340.0' y='322' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >XOR·AND도 실제로는 CMOS 트랜지스터로 만든 게이트다. 진리표는 코드가 계산. 모식도. (Claude가 그림)</text>
