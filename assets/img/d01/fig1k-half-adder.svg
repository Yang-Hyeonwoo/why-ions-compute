<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='a-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='a-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='a-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3d6fb4'/></marker><marker id='a-mint' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker><marker id='a-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='a-gray' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker><marker id='a-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a5cb8'/></marker><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='6' stroke='#bbb' stroke-width='2'/></pattern></defs>
<text x='340.0' y='20' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >논리에서 덧셈으로: 1비트 반가산기 (합 S = XOR, 자리올림 C = AND)</text>
<text x='10' y='58' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(a)</text>
<text x='408' y='62' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(b)</text>
<text x='20' y='260' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(c)</text>
<text x='40' y='92' font-size='13' fill='#8a5cb8' text-anchor='start' font-weight='bold' >A</text>
<text x='40' y='162' font-size='13' fill='#8a5cb8' text-anchor='start' font-weight='bold' >B</text>
<line x1='56' y1='88' x2='110' y2='88' stroke='#444' stroke-width='1.4'/>
<line x1='56' y1='158' x2='110' y2='158' stroke='#444' stroke-width='1.4'/>
