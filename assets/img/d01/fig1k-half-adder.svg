<line x1='94' y1='228' x2='150' y2='228' stroke='#444' stroke-width='1.4'/>
<line x1='110' y1='88' x2='150' y2='88' stroke='#444' stroke-width='1.4'/>
<line x1='110' y1='158' x2='150' y2='128' stroke='#444' stroke-width='1.4'/>
<rect x='150' y='70' width='110' height='76' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='205' y='102' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >XOR</text>
<text x='205' y='120' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >둘이 다르면 1</text>
<rect x='150' y='180' width='110' height='66' rx='8' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='205' y='208' font-size='13' fill='#e08a3c' text-anchor='middle' font-weight='bold' >AND</text>
<text x='205' y='226' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >둘 다 1이면 1</text>
<line x1='260.0' y1='108.0' x2='300.0' y2='108.0' stroke='#444' stroke-width='1.4' marker-end='url(#a-ink)'/>
<line x1='260.0' y1='213.0' x2='300.0' y2='213.0' stroke='#444' stroke-width='1.4' marker-end='url(#a-ink)'/>
<text x='306' y='104' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >합 S</text>
<text x='306' y='120' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(이 자리의 숫자)</text>
<text x='306' y='209' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >자리올림 C</text>
<text x='306' y='225' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(윗자리로 넘길 1)</text>
<text x='450' y='62' font-size='11' fill='#8a5cb8' text-anchor='middle' font-weight='bold' >A</text>
<text x='482' y='62' font-size='11' fill='#8a5cb8' text-anchor='middle' font-weight='bold' >B</text>
<text x='524' y='62' font-size='11' fill='#e08a3c' text-anchor='middle' font-weight='bold' >C</text>
<text x='556' y='62' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >S</text>
<text x='616' y='62' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >뜻</text>
<line x1='434' y1='68' x2='670' y2='68' stroke='#444' stroke-width='1'/>
<text x='450' y='90' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0</text>
