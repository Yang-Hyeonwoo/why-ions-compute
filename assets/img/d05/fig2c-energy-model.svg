<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 452' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='360.0' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >한 번의 에너지 × 1초당 횟수 + 대기 전력 = 평균 전력 (MCU 예, 모식도)</text>
<text x='14' y='46' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >a. MCU 하나의 5 ms: 샘플이 올 때마다 잠깐 깨어 일하고 다시 잠든다</text>
<text x='102' y='76' font-size='10.5' fill='#c8553d' text-anchor='end' font-weight='bold' >동작 2.4 mW</text>
<text x='102' y='146' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' >잠 1.2 µW</text>
<text x='102' y='162' font-size='9' fill='#999' text-anchor='end' font-weight='normal' >(세로 눈금 없음)</text>
<polyline points='110.0,142.0 168.0,142.0 168.0,72.0 180.0,72.0 180.0,142.0 284.0,142.0 284.0,72.0 296.0,72.0 296.0,142.0 400.0,142.0 400.0,72.0 412.0,72.0 412.0,142.0 516.0,142.0 516.0,72.0 528.0,72.0 528.0,142.0 632.0,142.0 632.0,72.0 644.0,72.0 644.0,142.0 690.0,142.0' fill='none' stroke='#444' stroke-width='1.8' stroke-linejoin='round'/>
<rect x='168.0' y='72' width='12' height='70' rx='0' fill='#f6d7cf' stroke='none' stroke-width='1.2' />
<rect x='284.0' y='72' width='12' height='70' rx='0' fill='#f6d7cf' stroke='none' stroke-width='1.2' />
<rect x='400.0' y='72' width='12' height='70' rx='0' fill='#f6d7cf' stroke='none' stroke-width='1.2' />
<rect x='516.0' y='72' width='12' height='70' rx='0' fill='#f6d7cf' stroke='none' stroke-width='1.2' />
<rect x='632.0' y='72' width='12' height='70' rx='0' fill='#f6d7cf' stroke='none' stroke-width='1.2' />
<polyline points='110.0,142.0 168.0,142.0 168.0,72.0 180.0,72.0 180.0,142.0 284.0,142.0 284.0,72.0 296.0,72.0 296.0,142.0 400.0,142.0 400.0,72.0 412.0,72.0 412.0,142.0 516.0,142.0 516.0,72.0 528.0,72.0 528.0,142.0 632.0,142.0 632.0,72.0 644.0,72.0 644.0,142.0 690.0,142.0' fill='none' stroke='#444' stroke-width='1.8' stroke-linejoin='round'/>
<text x='186.0' y='84' font-size='10' fill='#c8553d' text-anchor='start' font-weight='bold' >깨어 일함: 약 8.3 µs</text>
<text x='186.0' y='98' font-size='9' fill='#999' text-anchor='start' font-weight='normal' >(그림은 폭을 과장)</text>
<line x1='410.0' y1='64' x2='518.0' y2='64' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<line x1='518.0' y1='64' x2='410.0' y2='64' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='464.0' y='59' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >1 ms마다 한 번 (1,000번/s)</text>
<text x='306.0' y='132' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >나머지 시간은 잠</text>
<line x1='110' y1='160' x2='690' y2='160' stroke='#999' stroke-width='1'/>
<line x1='110.0' y1='160' x2='110.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='110.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0 ms</text>
<line x1='226.0' y1='160' x2='226.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='226.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1 ms</text>
<line x1='342.0' y1='160' x2='342.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='342.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >2 ms</text>
<line x1='458.0' y1='160' x2='458.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='458.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >3 ms</text>
<line x1='574.0' y1='160' x2='574.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='574.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >4 ms</text>
<line x1='690.0' y1='160' x2='690.0' y2='164' stroke='#999' stroke-width='1'/>
<text x='690.0' y='176' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >5 ms</text>
<text x='690' y='155' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >시간 →</text>
<text x='24' y='200' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >① 한 번의 에너지 = 2.4 mW × 8.3 µs ≈ 20 nJ   (= 0.3 nJ/박자 × 약 67박자)</text>
<text x='24' y='220' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >② 일하는 몫 = 한 번의 에너지 × 1초당 횟수 = 20 nJ × 1,000/s = 20 µW</text>
<text x='24' y='240' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >③ 깨어 있는 시간 비율(duty cycle) = 8.3 µs × 1,000/s ≈ 0.83%   → 잠든 비율 ≈ 99.2%</text>
<text x='24' y='260' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >④ 대기 몫 = 1.2 µW × 99.2% ≈ 1.2 µW.   그래서 평균 전력 ≈ 20 + 1.2 ≈ 21 µW</text>
<line x1='14' y1='278' x2='706' y2='278' stroke='#d9d9d9' stroke-width='1'/>
<text x='14' y='296' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >b. 네 고리의 '한 번의 에너지' — 모형의 가정값(파랑)과 그 근거 자릿수(검정)</text>
<rect x='18' y='306' width='150' height='92' rx='4' fill='#fafafa' stroke='#d9d9d9' stroke-width='1' />
<text x='93.0' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >① 센서+증폭기</text>
<text x='93.0' y='348' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >늘 켜짐: W로 셈</text>
<text x='93.0' y='370' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >이 모형에서는 뺌</text>
<text x='93.0' y='386' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >(세 경우 같다고 봄)</text>
<rect x='196' y='306' width='150' height='92' rx='4' fill='#fafafa' stroke='#d9d9d9' stroke-width='1' />
<text x='271.0' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >② ADC 변환 1번</text>
<text x='271.0' y='348' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >1 nJ (가정)</text>
<text x='271.0' y='370' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >145 µA × 3 V</text>
<text x='271.0' y='386' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >× 약 3.9 µs ≈ 1.7 nJ</text>
<rect x='374' y='306' width='150' height='92' rx='4' fill='#fafafa' stroke='#d9d9d9' stroke-width='1' />
<text x='449.0' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >③ MCU 샘플 1개</text>
<text x='449.0' y='348' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >20 nJ (가정)</text>
<text x='449.0' y='370' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >0.3 nJ/박자</text>
<text x='449.0' y='386' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >× 약 67박자 (a의 ①)</text>
<rect x='552' y='306' width='150' height='92' rx='4' fill='#fafafa' stroke='#d9d9d9' stroke-width='1' />
<text x='627.0' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >④ 무선 1 bit</text>
<text x='627.0' y='348' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >50 nJ (가정)</text>
<text x='627.0' y='370' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >전파를 내는 동안 ≈ 16 nJ</text>
<text x='627.0' y='386' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >실측 시스템 ≈ 400 nJ</text>
<text x='360.0' y='420' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >근거: TI MSP430FR5969 데이터시트(ADC·MCU, 3 V), Nordic nRF52832 제품 안내서(무선 칩), Siekkinen et al. 2012(무선 실측).</text>
<text x='360.0' y='438' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >8 MHz 클록과 '샘플 하나에 약 67박자'는 예제 가정이다. 칩·설정·프로그램마다 값이 다르다.</text>
</svg>
