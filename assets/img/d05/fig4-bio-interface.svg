<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 300' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >생체 인터페이스: 응용이 요구하는 것 ↔ 이온 device가 주는 것 ↔ 전자 device의 자리</text>
<text x='60' y='48' font-size='11' fill='#999' text-anchor='middle' font-weight='bold' >요구</text>
<text x='200' y='48' font-size='11' fill='#999' text-anchor='middle' font-weight='bold' >생체 쪽</text>
<text x='370' y='48' font-size='11' fill='#999' text-anchor='middle' font-weight='bold' >이온 device</text>
<text x='520' y='48' font-size='11' fill='#999' text-anchor='middle' font-weight='bold' >전자 device</text>
<line x1='14' y1='54' x2='586' y2='54' stroke='#d9d9d9' stroke-width='1'/>
<text x='60' y='76' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >신호 언어</text>
<text x='200' y='76' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >이온 전류, ~100 mV, ms–s</text>
<text x='370' y='76' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >이온이 운반자. 같은 언어</text>
<text x='520' y='76' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >전자 device: 변환 필요</text>
<line x1='14' y1='88' x2='586' y2='88' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='110' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >환경</text>
<text x='200' y='110' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >물, 염, 37 °C, pH 변화</text>
<text x='370' y='110' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >수계에서 동작(안정성은 과제)</text>
<text x='520' y='110' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >CMOS: 봉지 필수</text>
<line x1='14' y1='122' x2='586' y2='122' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='144' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >기계적 성질</text>
<text x='200' y='144' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >연하고 움직이는 조직</text>
<text x='370' y='144' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >하이드로겔·엘라스토머, 자가치유</text>
<text x='520' y='144' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실리콘: 딱딱함</text>
<line x1='14' y1='156' x2='586' y2='156' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='178' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >시간척도</text>
<text x='200' y='178' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >생체 신호 >1 ms</text>
<text x='370' y='178' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >이온 이완 µs–s와 겹침</text>
<text x='520' y='178' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >전자: ns, 메모리로 보완</text>
<line x1='14' y1='190' x2='586' y2='190' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='212' font-size='10' fill='#13936b' text-anchor='middle' font-weight='bold' >정밀도 요구</text>
<text x='200' y='212' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >분류·임계 판단 수준</text>
<text x='370' y='212' font-size='10' fill='#13936b' text-anchor='middle' font-weight='normal' >근사 계산으로 충분할 수 있음</text>
<text x='520' y='212' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >고정밀은 불필요할 수도</text>
<line x1='14' y1='224' x2='586' y2='224' stroke='#f0f0f0' stroke-width='1'/>
<text x='300' y='254' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >Aluru 2026의 제안: 처음에는 CMOS와 경쟁하지 말고 BMI·환경·농식품처럼 화학·생체 적합성이 필요한 곳에 집중.</text>
<text x='300' y='270' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >'같은 언어'가 곧 '더 낫다'는 아니다. 안정성(탈수·이온 누출)과 이온–전자 변환 효율이 조건이다.</text>
<text x='300' y='286' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >(Wang 2025 CSR p.329, Zhu 2025 p.14 — 두 리뷰 모두 이온과 전자의 분업·통합을 말한다.)</text>
</svg>
