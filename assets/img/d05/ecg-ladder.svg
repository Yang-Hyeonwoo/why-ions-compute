<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 738 284' width='100%' style='max-width:738px' font-family='Pretendard, Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#1f2937'>
<defs><marker id='a' viewBox='0 0 10 10' refX='8.5' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0,0.6 L10,5 L0,9.4 z' fill='#6b7280'/></marker></defs>
<rect x='8.0' y='8.0' width='722.0' height='36.0' rx='8' fill='#f7f8fa' stroke='none' stroke-width='1.2'/>
<circle cx='28.0' cy='26.0' r='11' fill='#0f8a63' stroke='none' stroke-width='0'/>
<text x='28.0' y='30.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>1</text>
<text x='48.0' y='31.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>실시간으로 하나씩</text>
<rect x='265.6' y='15.8' width='75.9' height='20.4' rx='10.2' fill='#e3f4ec' stroke='none' stroke-width='0'/><text x='303.6' y='30.3' font-size='12' fill='#0f8a63' text-anchor='middle' font-weight='600'>예(조건부)</text>
<text x='359.2' y='31.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>수 초 안에 경고해야 하니 오래 모을 수 없다</text>
<circle cx='28.0' cy='66.0' r='11' fill='#c96f1a' stroke='none' stroke-width='0'/>
<text x='28.0' y='70.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>2</text>
<text x='48.0' y='71.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>희소 · 대기 전력</text>
<rect x='265.6' y='55.8' width='38.0' height='20.4' rx='10.2' fill='#fdf0e1' stroke='none' stroke-width='0'/><text x='284.6' y='70.3' font-size='12' fill='#c96f1a' text-anchor='middle' font-weight='600'>모름</text>
<text x='359.2' y='71.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>드문 것은 '이상 박동'이라는 사건. 앞단 대기 전력을 재야 한다</text>
<rect x='8.0' y='88.0' width='722.0' height='36.0' rx='8' fill='#f7f8fa' stroke='none' stroke-width='1.2'/>
<circle cx='28.0' cy='106.0' r='11' fill='#0f8a63' stroke='none' stroke-width='0'/>
<text x='28.0' y='110.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>3</text>
<text x='48.0' y='111.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>근사를 견딤</text>
<rect x='265.6' y='95.8' width='75.9' height='20.4' rx='10.2' fill='#e3f4ec' stroke='none' stroke-width='0'/><text x='303.6' y='110.3' font-size='12' fill='#0f8a63' text-anchor='middle' font-weight='600'>예(조건부)</text>
<text x='359.2' y='111.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>정상/이상 분류라 놓침·오경보 목표 안이면 된다</text>
<circle cx='28.0' cy='146.0' r='11' fill='#c96f1a' stroke='none' stroke-width='0'/>
<text x='28.0' y='150.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>4</text>
<text x='48.0' y='151.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>τ가 박동 간격(1 s)과 맞음</text>
<rect x='265.6' y='135.8' width='53.6' height='20.4' rx='10.2' fill='#fdf0e1' stroke='none' stroke-width='0'/><text x='292.4' y='150.3' font-size='12' fill='#c96f1a' text-anchor='middle' font-weight='600'>재야 앎</text>
<text x='359.2' y='151.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>τ ≈ 0.5 s면 예, ms면 아니오</text>
<rect x='8.0' y='168.0' width='722.0' height='36.0' rx='8' fill='#f7f8fa' stroke='none' stroke-width='1.2'/>
<circle cx='28.0' cy='186.0' r='11' fill='#c96f1a' stroke='none' stroke-width='0'/>
<text x='28.0' y='190.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>5</text>
<text x='48.0' y='191.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>다음 부품이 아날로그 · 변환 드묾</text>
<rect x='265.6' y='175.8' width='77.6' height='20.4' rx='10.2' fill='#fdf0e1' stroke='none' stroke-width='0'/><text x='304.4' y='190.3' font-size='12' fill='#c96f1a' text-anchor='middle' font-weight='600'>설계에 달림</text>
<text x='359.2' y='191.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>사건 때만 ADC를 깨우는 설계면 예</text>
<circle cx='28.0' cy='226.0' r='11' fill='#c96f1a' stroke='none' stroke-width='0'/>
<text x='28.0' y='230.5' font-size='12' fill='#fff' text-anchor='middle' font-weight='700'>6</text>
<text x='48.0' y='231.0' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>MCU + 작은 신경망보다 나음</text>
<rect x='265.6' y='215.8' width='38.0' height='20.4' rx='10.2' fill='#fdf0e1' stroke='none' stroke-width='0'/><text x='284.6' y='230.3' font-size='12' fill='#c96f1a' text-anchor='middle' font-weight='600'>모름</text>
<text x='359.2' y='231.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>아래 전력 계산과 경쟁자 계산이 있어야 답한다</text>
<text x='14.0' y='270.0' font-size='12.5' fill='#1f2937' text-anchor='start' font-weight='700'>첫 '모름'은 2번: 사건을 골라낼 앞단을 얼마나 작은 대기 전력으로 늘 켜 둘 수 있나.</text>
</svg>
