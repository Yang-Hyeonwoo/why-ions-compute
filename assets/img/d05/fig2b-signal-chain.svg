<text x='271' y='87' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >1 ms마다 한 점을 읽음</text>
<text x='271' y='182' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >1.234 V → 숫자 1234</text>
<text x='414' y='100' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >… 1198</text>
<text x='414' y='117' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >1229</text>
<text x='414' y='134' font-size='10.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >1234</text>
<text x='414' y='151' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >1310 …</text>
<line x1='448' y1='126' x2='466' y2='126' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='468' y='104' width='48' height='44' rx='4' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='492' y='122' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >정상</text>
<text x='492' y='139' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >/ 사건!</text>
<text x='449' y='168' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >최근 값 저장·거르기·</text>
<text x='449' y='182' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >문턱 비교 (작은 NN도 가능)</text>
<text x='627' y='92' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >1234를 12 bit로:</text>
<text x='627' y='110' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >0100 1101 0010</text>
<path d='M614.0,140.0 A10,10 0 0 1 624.0,150.0' fill='none' stroke='#999' stroke-width='1.3'/>
<path d='M614.0,132.0 A18,18 0 0 1 632.0,150.0' fill='none' stroke='#999' stroke-width='1.3'/>
<path d='M614.0,124.0 A26,26 0 0 1 640.0,150.0' fill='none' stroke='#999' stroke-width='1.3'/>
<line x1='614' y1='150' x2='614' y2='168' stroke='#444' stroke-width='1.6'/>
<text x='627' y='182' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >원시: 샘플당 12 bit / 사건: 16 bit</text>
<text x='93.0' y='208' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >출력: 연속 전압</text>
<text x='271.0' y='208' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >출력: 12 bit 숫자</text>
<text x='449.0' y='208' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >출력: 판정(또는 숫자)</text>
<text x='627.0' y='208' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >출력: 전파</text>
<line x1='14' y1='220' x2='706' y2='220' stroke='#d9d9d9' stroke-width='1'/>
<text x='14' y='238' font-size='11' fill='#999' text-anchor='start' font-weight='bold' >한 번의 일에 드는 에너지 — 모형의 가정값과 그 근거(자릿수)</text>
<text x='93.0' y='260' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >이 모형에서는 뺌</text>
<text x='93.0' y='278' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >(세 시나리오에서 같다고 봄)</text>
<text x='271.0' y='260' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >변환 1번 = 1 nJ (가정)</text>
<text x='271.0' y='278' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >데이터시트 예: 145 µA × 3 V</text>
<text x='271.0' y='294' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >× 약 3.9 µs ≈ 1.7 nJ</text>
<text x='449.0' y='260' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >샘플 1개 = 20 nJ (가정)</text>
<text x='449.0' y='278' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >= 0.3 nJ/사이클 × 약 67 사이클</text>
<text x='449.0' y='294' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >(100 µA/MHz × 3 V)</text>
<text x='627.0' y='260' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >1 bit = 50 nJ (가정)</text>
<text x='627.0' y='278' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >전파를 내는 동안만 ≈ 16 nJ/bit</text>
<text x='627.0' y='294' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >실측 시스템 ≈ 400 nJ/bit</text>
<text x='360.0' y='326' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >근거: TI MSP430FR5969 데이터시트(ADC·MCU), Nordic nRF52832 제품 안내서(무선 칩), Siekkinen et al. 2012(무선 실측).</text>
<text x='360.0' y='344' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >가정값은 이 근거로 자릿수만 맞춘 것이며 칩·설정마다 다르다. 파형은 모양만 흉내 낸 것으로 측정값이 아니다.</text>
</svg>
