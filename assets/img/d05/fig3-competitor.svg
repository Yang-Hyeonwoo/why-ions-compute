<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 352' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >진짜 경쟁자: 저전력 MCU + 작은 신경망. 항목별로 누가 유리한가 (조건부)</text>
<text x='60' y='48' font-size='11' fill='#999' text-anchor='middle' font-weight='bold' >항목</text>
<text x='240' y='48' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >MCU + 작은 NN</text>
<text x='460' y='48' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' >뉴로모픽·physical RC 소자</text>
<line x1='14' y1='54' x2='586' y2='54' stroke='#d9d9d9' stroke-width='1'/>
<text x='60' y='76' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >프로그램 가능성</text>
<text x='240' y='76' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >소프트웨어 교체로 기능 변경</text>
<text x='460' y='76' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >소자·회로 재설계 또는 readout만 재학습</text>
<line x1='14' y1='88' x2='586' y2='88' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='110' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >정밀도·재현성</text>
<text x='240' y='110' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >비트 정확, 소자 편차 없음</text>
<text x='460' y='110' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >잡음·편차 감수, 보정 필요</text>
<line x1='14' y1='122' x2='586' y2='122' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='144' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >성숙도·도구</text>
<text x='240' y='144' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >컴파일러·라이브러리·공급망 완비</text>
<text x='460' y='144' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >표준 벤치마크·툴체인 미성숙</text>
<line x1='14' y1='156' x2='586' y2='156' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='178' font-size='10.5' fill='#999' text-anchor='middle' font-weight='bold' >대기 전력</text>
<text x='240' y='178' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >슬립 µW급 (예: 1.2 µW)</text>
<text x='460' y='178' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >설계에 따라 다름. 바이어스·누설 이온 전류</text>
<line x1='14' y1='190' x2='586' y2='190' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='212' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >실시간 시계열(배치 1)</text>
<text x='240' y='212' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >샘플마다 가중치·이력을 메모리에서</text>
<text x='460' y='212' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >소자 상태가 이력을 담음 (τ 정합 시)</text>
<line x1='14' y1='224' x2='586' y2='224' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='246' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >변환 비용</text>
<text x='240' y='246' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >ADC 필수(디지털)</text>
<text x='460' y='246' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >다음 단계가 아날로그면 변환 생략 가능</text>
<line x1='14' y1='258' x2='586' y2='258' stroke='#f0f0f0' stroke-width='1'/>
<text x='60' y='280' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='bold' >생체·수계·연성 환경</text>
<text x='240' y='280' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >물을 막는 봉지 필요, 딱딱함</text>
<text x='460' y='280' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >이온·물·연성 재료와 같은 언어 (조건부)</text>
<line x1='14' y1='292' x2='586' y2='292' stroke='#f0f0f0' stroke-width='1'/>
<text x='300' y='322' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >파란 항목은 MCU가, 초록 항목은 조건이 맞을 때 뉴로모픽 쪽이 유리하다. 회색은 설계에 달렸다.</text>
<text x='300' y='338' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >'디지털 RC보다 자원을 더 쓰는 physical RC는 의미가 없다'(Liang 2024, p.202)를 MCU까지 넓혀 읽은 표다 [해석].</text>
</svg>
