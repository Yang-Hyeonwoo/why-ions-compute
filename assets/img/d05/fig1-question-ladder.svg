<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 340' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >'적합한 문제'를 가르는 질문 사다리 (Day 3–8의 조건을 순서대로)</text>
<rect x='20' y='44' width='300' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='66' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >1. 입력이 한 번에 하나씩, 실시간으로 오나?</text>
<line x1='320' y1='61' x2='340' y2='61' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='65' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아니오 → 묶어서(배치) 가중치를 재사용하면 된다 (Day 3–4)</text>
<line x1='170' y1='78' x2='170' y2='90' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='176' y='88' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예</text>
<rect x='20' y='90' width='300' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='112' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >2. 입력이 희소하고 대기 전력을 작게 둘 수 있나?</text>
<line x1='320' y1='107' x2='340' y2='107' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='111' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아니오 → 사건 구동의 이득이 작다 (Day 5–6)</text>
<line x1='170' y1='124' x2='170' y2='136' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='176' y='134' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예</text>
<rect x='20' y='136' width='300' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='158' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >3. 과제가 근사·편차·잡음을 견디나?</text>
<line x1='320' y1='153' x2='340' y2='153' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='157' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아니오 → ADC·보정 비용이 이득을 먹는다 (Day 7–8)</text>
<line x1='170' y1='170' x2='170' y2='182' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='176' y='180' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예</text>
<rect x='20' y='182' width='300' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='204' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >4. 소자 τ가 신호 시간척도와 겹치나?</text>
<line x1='320' y1='199' x2='340' y2='199' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='203' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아니오 → 시간 동역학은 지연이거나 망각이다 (Day 5–6)</text>
<line x1='170' y1='216' x2='170' y2='228' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='176' y='226' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예</text>
<rect x='20' y='228' width='300' height='34' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='250' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >5. 다음 단계가 아날로그이거나 변환이 드문가?</text>
<line x1='320' y1='245' x2='340' y2='245' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='249' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >아니오 → 주변회로가 최대 70% (Day 7–8)</text>
<line x1='170' y1='262' x2='170' y2='274' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='176' y='272' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >예</text>
<rect x='20' y='274' width='300' height='34' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='30' y='296' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='bold' >6. 저전력 MCU + 작은 NN보다 시스템 전체로 나은가?</text>
<line x1='320' y1='291' x2='340' y2='291' stroke='#999' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='345' y='295' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >모름 → 이것이 Day 9의 질문이고 Day 31–32의 숙제</text>
<text x='300' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >다섯 '예'를 지나야 여섯째 질문에 이른다. 여섯째의 답이 '아니오'면 뉴로모픽이 아니라 MCU를 쓴다.</text>
</svg>
