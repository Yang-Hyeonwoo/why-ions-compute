<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 306' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >적합·부적합의 지도 (이해용 분류, 경계는 조건에 따라 움직인다)</text>
<rect x='20' y='44' width='270' height='46' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='61' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >실시간 시계열, 희소, 근사 허용, 아날로그</text>
<text x='30' y='75' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >다음 단계</text>
<text x='280' y='84' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >적합 후보</text>
<rect x='310' y='44' width='270' height='46' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='320' y='66' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >배치 가능, 데이터센터, 큰 모델 학습</text>
<text x='570' y='84' font-size='10' fill='#c8553d' text-anchor='end' font-weight='bold' >부적합 (재사용이 벽을 누름)</text>
<rect x='20' y='102' width='270' height='46' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='30' y='124' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >정확한 산술·회계·암호</text>
<text x='280' y='142' font-size='10' fill='#c8553d' text-anchor='end' font-weight='bold' >부적합 (근사 불가)</text>
<rect x='310' y='102' width='270' height='46' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='320' y='124' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >자주 바뀌는 기능, 범용 소프트웨어</text>
<text x='570' y='142' font-size='10' fill='#c8553d' text-anchor='end' font-weight='bold' >부적합 (프로그램 가능성)</text>
<rect x='20' y='160' width='270' height='46' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='182' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >생체 인터페이스, 수계·연성 환경</text>
<text x='280' y='200' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >적합 후보 (안정성 조건)</text>
<rect x='310' y='160' width='270' height='46' rx='6' fill='#fff' stroke='#c8553d' stroke-width='1.5' />
<text x='320' y='182' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >정밀 수치 시뮬레이션</text>
<text x='570' y='200' font-size='10' fill='#c8553d' text-anchor='end' font-weight='bold' >부적합 (정밀도)</text>
<rect x='20' y='218' width='270' height='46' rx='6' fill='#fff' stroke='#13936b' stroke-width='1.5' />
<text x='30' y='235' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >상시 대기 감지(always-on), 희소</text>
<text x='30' y='249' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >사건</text>
<text x='280' y='258' font-size='10' fill='#13936b' text-anchor='end' font-weight='bold' >적합 후보 (대기 전력 조건)</text>
<rect x='310' y='218' width='270' height='46' rx='6' fill='#fff' stroke='#e08a3c' stroke-width='1.5' />
<text x='320' y='240' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >영상 전체를 매 프레임 고정밀 처리</text>
<text x='570' y='258' font-size='10' fill='#e08a3c' text-anchor='end' font-weight='bold' >조건부 (희소하지 않음)</text>
<text x='300' y='292' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >'적합 후보'는 사다리의 앞 다섯 질문을 통과했다는 뜻이고, MCU + 작은 신경망과의 비교는 아직 남아 있다.</text>
</svg>
