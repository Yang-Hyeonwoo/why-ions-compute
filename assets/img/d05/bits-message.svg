<text x='14.0' y='108.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>0 또는 1 하나 = 1 bit. 12 bit ADC의 숫자 하나는 0/1 열두 개(0–4,095를 나타냄).</text>
<text x='14.0' y='128.0' font-size='12' fill='#6b7280' text-anchor='start' font-weight='400'>무선 칩은 이 0과 1을 하나씩 전파에 싣는다 → 에너지는 보내는 bit 수에 비례.</text>
