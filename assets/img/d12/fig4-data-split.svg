<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 286' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<text x='450' y='26' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >esn.py가 4,000단계를 쓰는 순서: 섞지 않고 시간 순서대로 자른다</text>
<rect x='40' y='60' width='20.5' height='46' rx='2' fill='#f2f2f2' stroke='#999' stroke-width='1.4' />
<text x='42' y='126' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >0</text>
<rect x='60.5' y='60' width='307.5' height='46' rx='2' fill='#e8f0fb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='214.25' y='80' font-size='12.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >학습</text>
<text x='214.25' y='98' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >1,500단계</text>
<text x='62.5' y='126' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >100</text>
<text x='214.25' y='148' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >λ 후보마다 readout을 푼다</text>
<rect x='368.0' y='60' width='102.5' height='46' rx='2' fill='#f1ecfa' stroke='#7a5bb5' stroke-width='1.4' />
<text x='419.25' y='80' font-size='12.5' fill='#7a5bb5' text-anchor='middle' font-weight='bold' >검증</text>
<text x='419.25' y='98' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >500단계</text>
<text x='370.0' y='126' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >1,600</text>
<text x='419.25' y='148' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >규제 세기 λ를 고른다</text>
<rect x='470.5' y='60' width='389.5' height='46' rx='2' fill='#e9f7f1' stroke='#13936b' stroke-width='1.4' />
<text x='665.25' y='80' font-size='12.5' fill='#13936b' text-anchor='middle' font-weight='bold' >시험</text>
<text x='665.25' y='98' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >1,900단계</text>
<text x='472.5' y='126' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >2,100</text>
<text x='665.25' y='148' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >성적을 한 번만 잰다</text>
<text x='858' y='126' font-size='12' fill='#999' text-anchor='end' font-weight='normal' >4,000</text>
<text x='44' y='50' font-size='12' fill='#999' text-anchor='start' font-weight='normal' >버림 100</text>
<line x1='70' y1='52' x2='46' y2='62' stroke='#999' stroke-width='1'/>
<path d='M60.5,160 L60.5,168 L470.5,168 L470.5,160' stroke='#444' stroke-width='1.3' fill='none' />
<text x='265.5' y='186' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >학습 + 검증 2,000단계 = 출력 첫 줄의 'train 2000'</text>
<text x='265.5' y='203' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >λ를 고른 뒤, 최종 readout은 이 구간 전체로 다시 푼다</text>
<text x='450' y='232' font-size='12.5' fill='#444' text-anchor='middle' font-weight='normal' >왜 섞지 않나: 상태가 과거를 담고 있어서, 섞으면 학습과 시험이 이웃한 순간을 나눠 가져 성적이 부풀려진다.</text>
<text x='450' y='254' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >시험 구간은 λ 고르기에도 쓰지 않는다. 고르는 일은 검증 구간이 맡는다.</text>
<text x='450' y='273' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >(단계 수는 esn.py의 설정값, Claude가 그림)</text>
</svg>
