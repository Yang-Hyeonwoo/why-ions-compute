<text x='330' y='318' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>곡선은 reservoir seed 1의 MC</tspan><tspan dy='4' font-size='8'>k</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>(k = 1–60), 오른쪽 MC는 seed 1–3 평균(k = 1–200의 합). Claude의 시뮬레이션(tools/esn.py).</tspan></text>
<text x='330' y='334' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >선형 reservoir는 50단계 가까이 거의 1을 유지하고, tanh는 입력이 클수록 일찍 떨어진다.</text>
