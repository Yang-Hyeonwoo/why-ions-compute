<text x='493' y='81' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >MC = 17.9 (3개 평균)</text>
<text x='493' y='95' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >0.5 아래로 처음: k = 19</text>
