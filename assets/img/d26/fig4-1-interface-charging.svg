<text x='370' y='285' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >1 mm² × 10 µF/cm² → C = 0.1 µF  ·  1 V면 ½CV² = 50 nJ  ·  20 mV면 20 pJ   [가정값, Claude 계산]</text>
