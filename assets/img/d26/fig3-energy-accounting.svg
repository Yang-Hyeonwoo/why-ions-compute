<text x='320' y='324' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='normal' >가정: 계면 용량 10 µF/cm²(대표값 약 20의 절반), 1 mm²에 1 V를 한 번 충전하면 ½CV² = 50 nJ, 20 mV면 20 pJ.</text>
<text x='320' y='342' font-size='10.4' fill='#444' text-anchor='middle' font-weight='normal' >fJ 숫자는 µV–mV 자극·pA 전류에서 나온다. 과제에서 쓰는 ±1 V 펄스, 측정 장비, readout은 대개 경계 밖이다. [해석]</text>
<text x='320' y='358' font-size='9.8' fill='#999' text-anchor='middle' font-weight='normal' >단위가 다른 숫자(Pei 2026의 면적당 값, Zhong 2022의 시스템 전력 22 µW)는 이 축에 놓지 않았다.</text>
