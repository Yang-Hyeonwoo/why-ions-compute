<text x='40' y='220' font-size='10.2' fill='#999' text-anchor='end' font-weight='normal' >제어</text>
<text x='20' y='386' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >행에 전압을 걸고 열에서 전류를 잰다(그림 5와 같은 방향). 1T1R이면 게이트 선 구동 회로도 행마다 하나씩(N개) 더 붙는다.</text>
<text x='20' y='403' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >둘레(가장자리)의 회로는 N에, 칸은 N²에 비례한다. ADC·MCU는 하나지만 차례로 쓰므로 한 번 다 읽는 변환 횟수와 시간이 N에 비례한다.</text>
<text x='470' y='56' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(b) N × N 배열에서 필요한 수</text>
<text x='640' y='80' font-size='10.2' fill='#999' text-anchor='middle' font-weight='bold' >N = 4</text>
<text x='700' y='80' font-size='10.2' fill='#999' text-anchor='middle' font-weight='bold' >N = 100</text>
<text x='752' y='80' font-size='10.2' fill='#999' text-anchor='middle' font-weight='bold' >N = 1,000</text>
<line x1='470' y1='87' x2='768' y2='87' stroke='#d9d9d9' stroke-width='1'/>
<text x='470' y='106' font-size='10.2' fill='#13936b' text-anchor='start' font-weight='normal' >device (N²)</text>
<text x='640' y='106' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >16</text>
<text x='700' y='106' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >10<tspan dy='-4.0' font-size='8.8'>4</tspan><tspan dy='4.0' font-size='1'>​</tspan></text>
<text x='752' y='106' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >10<tspan dy='-4.0' font-size='8.8'>6</tspan><tspan dy='4.0' font-size='1'>​</tspan></text>
<text x='470' y='128' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >선 (2N)</text>
<text x='640' y='128' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >8</text>
<text x='700' y='128' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >200</text>
<text x='752' y='128' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >2,000</text>
<text x='470' y='150' font-size='10.2' fill='#3d6fb4' text-anchor='start' font-weight='normal' >행 드라이버 (N)</text>
<text x='640' y='150' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >4</text>
<text x='700' y='150' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >100</text>
<text x='752' y='150' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1,000</text>
<text x='470' y='172' font-size='10.2' fill='#e08a3c' text-anchor='start' font-weight='normal' >열 TIA (N)</text>
<text x='640' y='172' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >4</text>
<text x='700' y='172' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >100</text>
<text x='752' y='172' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1,000</text>
<text x='470' y='194' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >ADC (공유)</text>
<text x='640' y='194' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='700' y='194' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='752' y='194' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='470' y='216' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >다 읽는 데 변환 (N번)</text>
<text x='640' y='216' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >4</text>
<text x='700' y='216' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >100</text>
<text x='752' y='216' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1,000</text>
<text x='470' y='238' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >변환 에너지 (1 nJ/회)</text>
<text x='640' y='238' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >4 nJ</text>
<text x='700' y='238' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >0.1 µJ</text>
<text x='752' y='238' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1 µJ</text>
<text x='470' y='260' font-size='10.2' fill='#3d6fb4' text-anchor='start' font-weight='normal' >MCU (공유)</text>
<text x='640' y='260' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='700' y='260' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='752' y='260' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1</text>
<text x='470' y='282' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >먼 칸의 IR drop *</text>
<text x='640' y='282' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >0.02 mV</text>
<text x='700' y='282' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >10 mV</text>
<text x='752' y='282' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >≈ 1 V</text>
<line x1='470' y1='292' x2='768' y2='292' stroke='#d9d9d9' stroke-width='1'/>
<text x='470' y='308' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >칸 하나가 나눠 지는 둘레 회로: N ÷ N² = 1/N.</text>
<text x='470' y='323' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >* Day 7–8의 모형: 한 줄에 N칸, 칸마다 1 µA, 칸 사이</text>
<text x='470' y='336' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >배선 2 Ω. 0.1 V로 읽는다면 N = 1,000은 그대로</text>
<text x='470' y='349' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >성립할 수 없다. 변환 에너지는 Day 31–32의 가정값.</text>
