<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 392' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='620' height='392' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker></defs>
<text x='310' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >병목을 네 계층에 놓기 (이해용 분류, 서로 겹친다)</text>
<rect x='20' y='42' width='580' height='72' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='34' y='68' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >소자</text>
<text x='34' y='88' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >한 소자가 내는 것</text>
<text x='170' y='62' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 시간척도: 겔 소자 τ가 0.05–4000 s에 흩어짐 (그림 3)</text>
<text x='170' y='81' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 소자 간 편차: 교차점 전압 560 ± 60 mV (Guo 2026)</text>
<text x='170' y='100' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 탈수로 17시간 동안 전류 감소 (Guo 2026), 내구 10² 회 (Aluru 표 1)</text>
<line x1='310' y1='114' x2='310' y2='124' stroke='#999' stroke-width='1'/>
<rect x='20' y='124' width='580' height='72' rx='8' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='34' y='150' font-size='15' fill='#3d6fb4' text-anchor='start' font-weight='bold' >회로·배열</text>
<text x='34' y='170' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >소자 여러 개 + 배선</text>
<text x='170' y='144' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 이온 배열은 3×3 사용·10×10 수율 시험 수준 (Guo 2026)</text>
<text x='170' y='163' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 수동 crossbar의 sneak path·선택 소자는 논의되지 않음</text>
<text x='170' y='182' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 연성 이온 소재를 단단한 CMOS에 붙이고 봉지하기 (Roadmap)</text>
<line x1='310' y1='196' x2='310' y2='206' stroke='#999' stroke-width='1'/>
<rect x='20' y='206' width='580' height='72' rx='8' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='34' y='232' font-size='15' fill='#e08a3c' text-anchor='start' font-weight='bold' >시스템</text>
<text x='34' y='252' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >센서부터 판정까지</text>
<text x='170' y='226' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· readout·마스크·전처리가 컴퓨터 소프트웨어 (Pei, Guo, Lee)</text>
<text x='170' y='245' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 에너지 경계가 소자뿐 (Zhou 2026이 명시), 장비 전력은 경계 밖</text>
<text x='170' y='264' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 이온→전자 변환이 지연·손실·왜곡을 더함 (Roadmap)</text>
<line x1='310' y1='278' x2='310' y2='288' stroke='#999' stroke-width='1'/>
<rect x='20' y='288' width='580' height='72' rx='8' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='34' y='314' font-size='15' fill='#c8553d' text-anchor='start' font-weight='bold' >응용</text>
<text x='34' y='334' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >무엇을 얼마나 잘해야 하나</text>
<text x='170' y='308' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 과제 시간척도와 τ의 정합: 자연 신호는 > 1 ms (Liang)</text>
<text x='170' y='327' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 원시 입력 기준선이 없어 이득의 크기를 모름 (D25)</text>
<text x='170' y='346' font-size='10.8' fill='#444' text-anchor='start' font-weight='normal' >· 재보정 주기·정답 데이터가 응용에서 허용되나 (D18)</text>
<text x='310' y='378' font-size='10.8' fill='#999' text-anchor='middle' font-weight='normal' >아래 계층의 병목을 풀어도 위 계층이 막히면 응용은 열리지 않는다. 소재 연구는 주로 '소자' 칸을 바꾼다. [해석]</text>
</svg>
