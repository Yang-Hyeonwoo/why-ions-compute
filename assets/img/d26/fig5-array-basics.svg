<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 480' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='780' height='480' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker><marker id='arr-c13936b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker></defs>
<text x='380' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >배열(array)의 기초: 선을 나눠 쓰면 선이 줄지만, 엉뚱한 길로도 전류가 샌다 (모식도)</text>
<text x='380' y='40' font-size='10.2' fill='#999' text-anchor='middle' font-weight='normal' >읽는 순서 (a) → (b) → (c) · 이 그림은 row(행) = 입력(V 걸기), column(열) = 출력(I 재기). Day 7–8 그림과 방향이 반대</text>
<text x='30' y='54' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(a) device 하나 = 선 두 개</text>
<line x1='50' y1='110' x2='100' y2='110' stroke='#444' stroke-width='2'/>
<rect x='107.0' y='105.0' width='16' height='10' rx='2' fill='#fff' stroke='#13936b' stroke-width='1.6' />
<line x1='130' y1='110' x2='180' y2='110' stroke='#444' stroke-width='2'/>
<text x='50' y='100' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >V 걸기</text>
<text x='180' y='100' font-size='10.2' fill='#444' text-anchor='end' font-weight='normal' >I 재기</text>
<text x='30' y='150' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >device마다 선 2개씩 따로 뽑으면</text>
<text x='38' y='168' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >3×3 = 9개 → 선 18개</text>
<text x='38' y='184' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >10×10 = 100개 → 선 200개</text>
<text x='38' y='200' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >100×100 = 10,000개 → 선 20,000개</text>
<text x='30' y='224' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >crossbar로 선을 나눠 쓰면</text>
<text x='38' y='242' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >3×3 → 선 6개 (가로 3 + 세로 3)</text>
<text x='38' y='258' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >10×10 → 선 20개 (가로 10 + 세로 10)</text>
<text x='38' y='274' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' >100×100 → 선 200개 (가로 100 + 세로 100)</text>
<text x='260' y='54' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(b) 3×3 crossbar: 가운데 칸(행 2, 열 2)을 읽을 때</text>
<line x1='290' y1='100' x2='490' y2='100' stroke='#444' stroke-width='1.6'/>
<text x='284' y='104' font-size='10.2' fill='#444' text-anchor='end' font-weight='normal' >행1</text>
