<text x='284' y='148' font-size='11' fill='#3d6fb4' text-anchor='end' font-weight='bold' >V</text>
<text x='392' y='278' font-size='10.2' fill='#e08a3c' text-anchor='middle' font-weight='normal' >여기서 I를 잰다</text>
<text x='502' y='96' font-size='10.2' fill='#13936b' text-anchor='start' font-weight='bold' >초록 실선: 읽으려는 길</text>
<text x='502' y='110' font-size='10.2' fill='#13936b' text-anchor='start' font-weight='normal' >행2 → device(2,2) → 열2</text>
<text x='502' y='132' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='bold' >빨간 점선: sneak path</text>
<text x='502' y='146' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >행2 → (2,1) → 열1 → (1,1)</text>
<text x='502' y='159' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='normal' >→ 행1 → (1,2) → 열2</text>
<text x='502' y='180' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >옆 device 셋을 거친 전류가</text>
<text x='502' y='193' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >읽는 전류에 섞인다</text>
<text x='30' y='304' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >(c) 해결책 하나: 칸마다 스위치(트랜지스터)를 하나씩 — 1T1R</text>
<text x='30' y='320' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >(b)의 열 2에 붙은 세 칸만 옆으로 눕혀 그렸다: 위의 짧은 선이 행 1–3(입력), 아래 가로선이 열 2(출력)</text>
<line x1='70' y1='432' x2='422' y2='432' stroke='#444' stroke-width='1.6'/>
<text x='428' y='436' font-size='10.2' fill='#e08a3c' text-anchor='start' font-weight='normal' >열 2 = 출력선(I를 잰다)</text>
<line x1='70' y1='407' x2='422' y2='407' stroke='#3d6fb4' stroke-width='1.2' stroke-dasharray='4 3'/>
<text x='428' y='411' font-size='10.2' fill='#3d6fb4' text-anchor='start' font-weight='normal' >게이트 선: 읽는 칸만 켠다</text>
<line x1='100' y1='344' x2='100' y2='362' stroke='#444' stroke-width='1.6'/>
