<rect x='326' y='398' width='28' height='18' rx='3' fill='#f2f2f2' stroke='#999' stroke-width='1.2' />
<text x='340' y='411' font-size='10.2' fill='#999' text-anchor='middle' font-weight='bold' >T</text>
<line x1='340' y1='416' x2='340' y2='422' stroke='#999' stroke-width='1.4'/>
<text x='356' y='426' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >끊김</text>
<text x='354' y='373' font-size='10.2' fill='#13936b' text-anchor='start' font-weight='normal' >device</text>
<text x='80' y='452' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >트랜지스터(T) = 전압으로 여닫는 스위치. 읽는 칸의 T만 켜면 다른 칸을 거치는 길이 끊긴다.</text>
<text x='80' y='467' font-size='10.2' fill='#999' text-anchor='start' font-weight='normal' >대가: 칸마다 트랜지스터 1개(면적·공정), 그리고 T를 켜고 끄는 게이트 선이 하나 더 필요하다.</text>
</svg>
