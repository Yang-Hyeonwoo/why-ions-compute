<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 372' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='600' height='372' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker></defs>
<text x='300' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >장부에 넣기 전에: 이것은 진짜 병목인가</text>
<rect x='24' y='42' width='552' height='60' rx='7' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='38' y='62' font-size='12.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q1. 응용이 실제로 그 spec을 요구하나?</text>
<text x='38' y='79' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >요구에 숫자와 출처가 있나 (예: 자연 신호와 맞물리려면 τ > 1 ms, Liang p.198)</text>
<text x='38' y='95' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >없으면 → '아직 모르는 것'으로</text>
<line x1='300' y1='102' x2='300' y2='112' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='24' y='112' width='552' height='60' rx='7' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='38' y='132' font-size='12.5' fill='#13936b' text-anchor='start' font-weight='bold' >Q2. 메커니즘의 한계인가, 공정·측정의 한계인가?</text>
<text x='38' y='149' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >예: τ ~ L²/D(메커니즘) vs 겔 탈수·봉지(공정) vs 장비·배선(측정)</text>
<text x='38' y='165' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >공정·측정이면 → 다른 기술로 풀 수 있는 병목</text>
<line x1='300' y1='172' x2='300' y2='182' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='24' y='182' width='552' height='60' rx='7' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='38' y='202' font-size='12.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >Q3. 전자·광학 대안이 이미 그 spec을 내나?</text>
<text x='38' y='219' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >예: ms–s τ는 HfO₂ 2단자 device(0.92–123 ms)·저항–capacitor 회로도 낸다</text>
<text x='38' y='235' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >이미 내면 → 병목이 아니라 '경쟁에서 지는 줄'</text>
<line x1='300' y1='242' x2='300' y2='252' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='24' y='252' width='552' height='60' rx='7' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='38' y='272' font-size='12.5' fill='#13936b' text-anchor='start' font-weight='bold' >Q4. 내가 고분자 설계로 바꿀 수 있는 계층인가?</text>
<text x='38' y='289' font-size='10.3' fill='#444' text-anchor='start' font-weight='normal' >device 계층이면 가능, 배열·시스템 계층이면 회로·공정과 협업 필요</text>
<text x='38' y='305' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >아니면 → 장부에 두되 '다른 계층의 병목'으로 표시</text>
<rect x='100' y='324' width='400' height='34' rx='7' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='300' y='345' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >네 질문을 거친 줄만 '응용 요구 vs 메커니즘 허용' 장부의 병목이 된다</text>
</svg>
