<text x='560.0' y='214.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >그림은 역방향(p쪽 −, n쪽 +): 접합이 빈다</text>
<text x='560.0' y='230.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >순방향(p쪽 +, n쪽 −)이면 접합에 쌓인다</text>
<text x='560.0' y='248.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >→ 정류 + 기억(D20)</text>
<line x1='20.0' y1='262.0' x2='660.0' y2='262.0' stroke='#d9d9d9' stroke-width='1'/>
<text x='120.0' y='282.0' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>양이온 수송수 t</tspan><tspan baseline-shift='sub' font-size='8'>+</tspan><tspan> ≈ 0.49</tspan></text>
<text x='120.0' y='298.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(10 mM KCl 물의 값, 거의 반반)</text>
<text x='340.0' y='282.0' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>t</tspan><tspan baseline-shift='sub' font-size='8'>+</tspan><tspan> ≈ 1 (0.5 M 겔·10 mM: 0.9996)</tspan></text>
<text x='340.0' y='298.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(전류를 거의 양이온만 나른다)</text>
<text x='560.0' y='282.0' font-size='11' fill='#13936b' text-anchor='middle' font-weight='bold' ><tspan>p쪽 t</tspan><tspan baseline-shift='sub' font-size='8'>+</tspan><tspan> ≈ 1 | n쪽 t</tspan><tspan baseline-shift='sub' font-size='8'>+</tspan><tspan> ≈ 0</tspan></text>
<text x='560.0' y='298.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(수송수가 접합에서 뛴다 → 그림 2)</text>
<text x='340.0' y='324.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >②와 ③의 핵심은 '고정 전하가 공이온을 배제한다'(Donnan 배제)는 것이다. 바깥 염이 진해지면 배제가 약해진다(그림 3).</text>
<text x='340.0' y='342.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >네모 = 사슬에 고정된 전하, 동그라미 = 움직이는 이온, 짙은 막대 = 전극. 크기·개수는 보기용. (Claude가 그림, 모식도)</text>
