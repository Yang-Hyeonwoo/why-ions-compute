<text x='350.0' y='436.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >경계에 쌓이는 염의 속도 = δ × I/F, δ = (전류가 들어오는 쪽 t₊ − 나가는 쪽 t₊),  1 µA ÷ F = 10.4 pmol/s. 1가 염, 확산은 무시.</text>
<text x='350.0' y='456.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >KCl 겔의 t₊ = 0.49(물속 값), 고정 전하 겔은 공이온이 없다고 둔 이상값 1과 0. (Claude가 계산해 그림, 모식도)</text>
