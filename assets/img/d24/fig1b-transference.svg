<text x='560.0' y='286.0' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >δ = +1.00</text>
<text x='560.0' y='303.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' >쌓인다(축적)</text>
