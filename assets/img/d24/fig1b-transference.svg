<text x='350.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >수송수가 바뀌는 경계에서만 이온이 쌓이거나 빈다 (같은 전류 1 µA, 모식도·계산)</text>
<text x='350.0' y='42.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >화살표 길이 = 1초에 경계로 오가는 이온의 양(전류 I/F의 몇 배인가). 빨강 = 양이온, 파랑 = 음이온</text>
<text x='20.0' y='74.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >(가) 같은 이온겔끼리</text>
<rect x='60.0' y='82.0' width='240.0' height='58.0' rx='0' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
