<text x='255.0' y='294.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >바깥 염 농도</text>
<text x='34.0' y='155.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' transform='rotate(-90 34 155.0)'>공이온 배제 (바깥 ÷ 겔 속)</text>
<text x='445.0' y='62.0' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >고정 전하 0.5 M 겔에서</text>
<text x='445.0' y='84.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >10 mM: 공이온 0.2 mM</text>
<text x='445.0' y='100.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >  → 바깥의 1/50, t₊ = 0.9996</text>
<text x='445.0' y='116.0' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >  Donnan 퍼텐셜 −101 mV</text>
<text x='445.0' y='138.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >150 mM: 공이온 42 mM</text>
<text x='445.0' y='154.0' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >  → 바깥의 1/3.6, t₊ = 0.93</text>
<text x='445.0' y='170.0' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >  Donnan 퍼텐셜 −33 mV</text>
<text x='445.0' y='198.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >겔 속 공이온이 약 208배로 는다.</text>
<text x='445.0' y='214.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >역방향 바닥 전류를 나르는 것이</text>
<text x='445.0' y='230.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >공이온이라 정류가 약해질 수 있다 [해석]</text>
<text x='445.0' y='256.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >이상 Donnan(활동도 1, 25 °C) 계산.</text>
<text x='445.0' y='272.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >실제 겔은 이온쌍·팽윤이 섞인다.</text>
<text x='330.0' y='308.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실험실의 10 mM 측정을 체액(약 150 mM)에 그대로 옮길 수 없다는 뜻이다. (Claude가 계산해 그림)</text>
