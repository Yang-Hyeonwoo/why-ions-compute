<text x='343' y='246' font-size='9.5' fill='#7a5bb5' text-anchor='middle' font-weight='normal' >보라 평면: z₃ = (z₁ + z₂ − 0.5)/2</text>
<text x='343' y='260' font-size='9.5' fill='#444' text-anchor='middle' font-weight='normal' >빨강 두 점은 평면 아래, 파랑 두 점은 평면 위</text>
