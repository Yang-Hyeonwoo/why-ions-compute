<text x='340.0' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >특징 하나를 더하는 것의 모습: 셋째 숫자 z₃ = u₁·u₂를 '높이'로 주면 평면 하나가 XOR을 가른다</text>
