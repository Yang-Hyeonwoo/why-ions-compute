<text x='430' y='329' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >1</text>
<text x='560' y='329' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >1 (정답)</text>
<text x='30' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >10</text>
<text x='95' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >0</text>
<text x='205' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >0.25</text>
<text x='335' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >아래</text>
<text x='430' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >1</text>
<text x='560' y='348' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >1 (정답)</text>
