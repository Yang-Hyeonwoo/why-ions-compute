<text x='95' y='367' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >1</text>
<text x='205' y='367' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >0.75</text>
