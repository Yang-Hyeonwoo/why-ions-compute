<text x='503' y='92' font-size='10' fill='#c8553d' text-anchor='end' font-weight='bold' >01</text>
<circle cx='632' cy='220' r='6' fill='#c8553d' stroke='#c8553d' stroke-width='1.4'/>
<text x='641' y='236' font-size='10' fill='#c8553d' text-anchor='start' font-weight='bold' >10</text>
<circle cx='632' cy='100' r='6' fill='#3d6fb4' stroke='#3d6fb4' stroke-width='1.4'/>
<text x='641' y='92' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='bold' >11</text>
<text x='567' y='248' font-size='9.5' fill='#7a5bb5' text-anchor='middle' font-weight='normal' >경계 = u₁ = 0.5와 u₂ = 0.5, 직선 두 개</text>
<text x='567' y='262' font-size='9.5' fill='#7a5bb5' text-anchor='middle' font-weight='normal' >(u₁ − 0.5)(u₂ − 0.5) = 0</text>
<rect x='12' y='274' width='658' height='118' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='30' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >점</text>
<text x='95' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >점의 높이 z₃</text>
<text x='205' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >그 자리의 평면 높이</text>
<text x='335' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >점은 평면의</text>
<text x='430' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >y = z₁ + z₂ − 2z₃</text>
<text x='560' y='290' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >0.5 기준 읽기</text>
