<text x='335' y='310' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >위</text>
<text x='430' y='310' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >0</text>
<text x='560' y='310' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >0 (정답)</text>
<text x='30' y='329' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >01</text>
<text x='95' y='329' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >0</text>
