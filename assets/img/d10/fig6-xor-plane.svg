<text x='340.0' y='422' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >평면보다 아래 = y &gt; 0.5 = 1, 위 = y &lt; 0.5 = 0. readout은 3차원에서 여전히 '평면'(곱해 더하기)이고, 휜 것은 셋째 특징 z₃이다.</text>
<text x='340.0' y='440' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >3차원은 비스듬히 그린 투영, 보라 짧은 막대 = 각 점 바로 위·아래의 평면 높이. 숫자는 코드가 계산했다. (Claude가 계산해 그림)</text>
