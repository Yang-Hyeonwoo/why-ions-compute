<text x='330' y='268' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >빨강 = XOR 1 (01, 10), 파랑 = XOR 0 (00, 11). 아래 숫자는 00, 01, 10, 11 순서의 최소제곱 readout 출력(0.5보다 크면 1로 읽음).</text>
<text x='330' y='286' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >(b)의 셋째 특징은 앞의 둘을 더한 것이라 점들이 한 평면 위에 놓이고, readout은 (a)와 똑같이 모두 0.50을 낸다.</text>
<text x='330' y='304' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >(c)는 출력 0, 1, 1, 0으로 XOR을 정확히 낸다. 숫자는 코드가 계산했다. (Claude가 계산해 그림, 3차원은 비스듬히 그린 투영)</text>
