<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 312' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='340.0' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >겹침 원리: 따로 넣은 효과의 합 f(1) + f(2)와 함께 넣은 효과 f(3)이 같은가</text>
