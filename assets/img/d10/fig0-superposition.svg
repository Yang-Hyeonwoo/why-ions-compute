<text x='215.0' y='96.14285714285714' font-size='11' fill='#444' text-anchor='middle' font-weight='bold' >6</text>
<text x='215.0' y='255' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >f(1)+f(2)</text>
