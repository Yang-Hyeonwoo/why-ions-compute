<text x='340.0' y='304' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >막대 높이는 패널마다 눈금이 다르다(왼쪽 0–7, 오른쪽 0–2). 숫자는 코드가 계산했다.</text>
