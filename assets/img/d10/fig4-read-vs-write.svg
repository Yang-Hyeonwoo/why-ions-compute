<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 330' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='330' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >휜 I–V 곡선이 곧 쓸모 있는 비선형은 아니다: 읽을 때의 휨과 상태가 바뀔 때의 휨</text>
<rect x='50' y='50' width='180' height='160' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='8' y='46' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >(a)</text>
<text x='46' y='60' font-size='10' fill='#999' text-anchor='end' font-weight='normal' >I</text>
<line x1='50' y1='130.0' x2='230' y2='130.0' stroke='#eee' stroke-width='1'/>
<line x1='140.0' y1='50' x2='140.0' y2='210' stroke='#eee' stroke-width='1'/>
