<text x='340.0' y='308' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >readout y = w₀ + w₁u₁ + w₂u₂를 0.5 기준으로 읽는 것 = 평면에 직선 하나 긋기(Day 13–14). (Claude가 그림, 모식도)</text>
