<text x='10' y='150' font-size='9.5' fill='#7a5bb5' text-anchor='start' font-weight='normal' ><tspan>한 바퀴 도는 데 T</tspan><tspan dy='4' font-size='9'>D</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = Nθ 걸린다.</tspan></text>
<text x='10' y='170' font-size='9.5' fill='#7a5bb5' text-anchor='start' font-weight='normal' >칸 j에서 읽은 값은 정확히 한 입력 단계 뒤 같은 칸 j로 돌아와 그 칸의 새 입력에 더해진다(자기 과거를 받음).</text>
<text x='10' y='184' font-size='9.5' fill='#7a5bb5' text-anchor='start' font-weight='normal' >이온·memristor device 방식은 이 고리 없이 device 자체의 느린 이완으로 과거를 잇기도 한다. 아래 ③은 고리 없는 경우.</text>
