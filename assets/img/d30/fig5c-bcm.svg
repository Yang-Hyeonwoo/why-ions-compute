<text x='514.0' y='72.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >Δw ∝ y·(y − θ)</text>
<text x='514.0' y='102.0' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='bold' >초록: θ = 1 (처음)</text>
<text x='514.0' y='124.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >y = 1.3 → +0.39 (강화)</text>
<text x='514.0' y='154.0' font-size='13.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >주황: θ = 1.6 (활동이 오래 높았던 뒤)</text>
<text x='514.0' y='176.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >y = 1.3 → −0.39 (약화)</text>
<text x='514.0' y='208.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >곡선의 바닥(약화가 가장 강함)은</text>
<text x='514.0' y='228.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >y = θ/2: θ = 1.6이면 y = 0.8에서 −0.64</text>
<text x='514.0' y='258.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >색 점: 문턱 θ (Δw = 0인 곳)</text>
