<text x='380.0' y='44.0' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >가로축: 단어 수(로그 눈금, 눈금 한 칸 = 1,000배). 최근 1,024 단어를 고리처럼 보관한다고 가정</text>
<text x='240.0' y='82.0' font-size='11.5' fill='#444' text-anchor='end' font-weight='normal' >이온(Aluru 표) · 창 없이 매 단어</text>
