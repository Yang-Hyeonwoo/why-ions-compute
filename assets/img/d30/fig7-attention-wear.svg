<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 268' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='760' height='268' fill='#fff'/>
