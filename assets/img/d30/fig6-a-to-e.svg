<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 474' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='474' fill='#fff'/>
<text x='500.0' y='28.0' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >A–E 고쳐 쓰기: 초안의 막연한 말이 무엇으로 바뀌는가 (예시, 모식도)</text>
<rect x='20.0' y='70.0' width='960.0' height='34.0' rx='4' fill='#f3f3f3' stroke='#d9d9d9' stroke-width='1.2' />
<text x='30.0' y='93.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >칸</text>
<text x='150.0' y='93.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >막연한 초안</text>
<text x='340.0' y='93.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >고친 것 (예시 A, 이온겔 drift)</text>
<text x='810.0' y='93.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >무엇이 바뀌었나</text>
<rect x='20.0' y='104.0' width='960.0' height='66.0' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='0.8' />
<text x='30.0' y='142.0' font-size='14' fill='#7a5aa6' text-anchor='start' font-weight='bold' >A 문제</text>
<text x='150.0' y='131.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >"이온겔 device의</text>
<text x='150.0' y='153.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >안정성을 높인다"</text>
<text x='340.0' y='131.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >drift가 용매 증발에서 오는지, 설계로 줄여 같은 readout을</text>
<text x='340.0' y='153.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >1주 이상 쓸 수 있는지 잰 연구를 찾지 못했다</text>
<text x='810.0' y='142.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >주제 → 한 문장의 빈칸</text>
<rect x='20.0' y='170.0' width='960.0' height='66.0' rx='0' fill='#fafafa' stroke='#d9d9d9' stroke-width='0.8' />
<text x='30.0' y='208.0' font-size='14' fill='#7a5aa6' text-anchor='start' font-weight='bold' >B 왜 지금·나</text>
<text x='150.0' y='197.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >(초안에 없음,</text>
<text x='150.0' y='219.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >"중요하다"만)</text>
<text x='340.0' y='197.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >장부의 '재보정 주기 vs drift' 줄. 지금 약 2.5 h, 요구 1주(약 67배).</text>
<text x='340.0' y='219.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >나는 조성을 바꿀 수 있고 24 h 측정 장비가 있다</text>
<text x='810.0' y='208.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >장부의 줄 + 숫자 + 내 자원</text>
<rect x='20.0' y='236.0' width='960.0' height='66.0' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='0.8' />
<text x='30.0' y='274.0' font-size='14' fill='#7a5aa6' text-anchor='start' font-weight='bold' >C 가설·예측</text>
<text x='150.0' y='263.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >"새 이온겔은</text>
<text x='150.0' y='285.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >안정적일 것이다"</text>
<text x='340.0' y='263.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >증발이 원인이면 무게와 응답이 함께 변하고, 비휘발 겔의</text>
<text x='340.0' y='285.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >drift는 10배 이상 준다. 틀리면: 무게는 그대로인데 응답 변화</text>
<text x='810.0' y='274.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >틀릴 수 있게</text>
<rect x='20.0' y='302.0' width='960.0' height='66.0' rx='0' fill='#fafafa' stroke='#d9d9d9' stroke-width='0.8' />
<text x='30.0' y='340.0' font-size='14' fill='#7a5aa6' text-anchor='start' font-weight='bold' >D 검증·기각</text>
<text x='150.0' y='329.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >"장기 안정성을</text>
<text x='150.0' y='351.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >측정한다"</text>
<text x='340.0' y='329.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >겔 7개 + 비휘발 겔 7개, 24 h 측정(사다리 2–3단). 성공 10배 이상 감소,</text>
<text x='340.0' y='351.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >기각 3배 미만 또는 무게와 무관한 drift. 기준선: 같은 두께의 지금 겔</text>
<text x='810.0' y='340.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >숫자·기준선·낮은 단</text>
<rect x='20.0' y='368.0' width='960.0' height='66.0' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='0.8' />
<text x='30.0' y='406.0' font-size='14' fill='#7a5aa6' text-anchor='start' font-weight='bold' >E 바꾸는 것</text>
<text x='150.0' y='395.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >"실용적인 이온</text>
<text x='150.0' y='417.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >device를 만든다"</text>
<text x='340.0' y='395.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >성공: 논문들이 drift 원인을 용매량으로 보고·설계한다.</text>
<text x='340.0' y='417.0' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >실패: drift 보정은 회로·소프트웨어로 맡기는 것이 정당해진다</text>
<text x='810.0' y='406.0' font-size='13' fill='#13936b' text-anchor='start' font-weight='bold' >다른 사람의 다음 행동</text>
<text x='20.0' y='460.0' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >예시는 쓰는 방법을 보이는 것이지 추천 연구가 아니다. 숫자는 '최소 검증 실험'에서 쓴 예시 값이다.</text>
</svg>
