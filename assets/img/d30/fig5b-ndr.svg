<text x='476.0' y='100.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >0–100 nA: 전압이 0 → 0.97 V로 오른다</text>
<text x='476.0' y='120.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >(보통 저항처럼 양의 기울기, ≈9.7 MΩ)</text>
