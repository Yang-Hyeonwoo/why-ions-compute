<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 700' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='700' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28.0' font-size='17' fill='#444' text-anchor='middle' font-weight='bold' >결정의 흐름: 기준을 먼저 대조하고, 그다음 결정을 적는다 (모식도)</text>
<rect x='240.0' y='46.0' width='520.0' height='74.0' rx='10' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.5' />
<text x='500.0' y='74.0' font-size='15' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >① 접는 기준 장부(앞 Day들에서 적은 후보)를 한 줄씩 대조</text>
<text x='500.0' y='100.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >줄마다: 통과 / 걸림 / 모름 + 근거(쪽수 또는 측정)</text>
<line x1='500.0' y1='120.0' x2='500.0' y2='150.0' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<polygon points='500,152.0 720.0,206 500,260.0 280.0,206' fill='#fff7ec' stroke='#e08a3c' stroke-width='1.6'/>
<text x='500.0' y='201.0' font-size='14.5' fill='#444' text-anchor='middle' font-weight='bold' >② 치명 기준(방향 전체를</text>
<text x='500.0' y='222.0' font-size='14.5' fill='#444' text-anchor='middle' font-weight='bold' >무너뜨리는 줄)이 '걸림'인가?</text>
<line x1='720.0' y1='206.0' x2='786.0' y2='206.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='753.0' y='196.0' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >예</text>
<rect x='790.0' y='156.0' width='196.0' height='100.0' rx='10' fill='#fbecea' stroke='#c8553d' stroke-width='1.5' />
<text x='888.0' y='184.0' font-size='17' fill='#c8553d' text-anchor='middle' font-weight='bold' >접는다</text>
<text x='888.0' y='208.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >또는 역할을 바꿔 좁힌다</text>
<text x='888.0' y='232.0' font-size='13.5' fill='#999' text-anchor='middle' font-weight='normal' >(예: 계산 → 계면·감지)</text>
<line x1='500.0' y1='260.0' x2='500.0' y2='300.0' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='512.0' y='286.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >아니요</text>
<polygon points='500,302.0 720.0,354 500,406.0 280.0,354' fill='#fff7ec' stroke='#e08a3c' stroke-width='1.6'/>
<text x='500.0' y='350.0' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >③ '모름'이 남았나?</text>
<text x='500.0' y='372.0' font-size='13.5' fill='#999' text-anchor='middle' font-weight='normal' >(잰 값을 폴더 문헌에서 찾지 못한 칸)</text>
<line x1='280.0' y1='354.0' x2='224.0' y2='354.0' stroke='#13936b' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='252.0' y='344.0' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >아니요</text>
<rect x='14.0' y='312.0' width='206.0' height='84.0' rx='10' fill='#eaf6f0' stroke='#13936b' stroke-width='1.5' />
<text x='117.0' y='346.0' font-size='17' fill='#13936b' text-anchor='middle' font-weight='bold' >한다</text>
<text x='117.0' y='372.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >A–E로 연구문제 한 개</text>
<line x1='500.0' y1='406.0' x2='500.0' y2='450.0' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='512.0' y='434.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >예</text>
<polygon points='500,452.0 740.0,508 500,564.0 260.0,508' fill='#fff7ec' stroke='#e08a3c' stroke-width='1.6'/>
<text x='500.0' y='503.0' font-size='14.5' fill='#444' text-anchor='middle' font-weight='bold' >④ 각 '모름'을 최소 검증 실험으로</text>
<text x='500.0' y='524.0' font-size='14.5' fill='#444' text-anchor='middle' font-weight='bold' >정해 둔 기간 안에 판정할 수 있나?</text>
<line x1='260.0' y1='508.0' x2='224.0' y2='508.0' stroke='#13936b' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='242.0' y='498.0' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >예</text>
<rect x='14.0' y='456.0' width='206.0' height='104.0' rx='10' fill='#eaf6f0' stroke='#13936b' stroke-width='1.5' />
<text x='117.0' y='486.0' font-size='17' fill='#13936b' text-anchor='middle' font-weight='bold' >좁혀서 한다</text>
<text x='117.0' y='512.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >판정 실험 + 기각 조건</text>
<text x='117.0' y='536.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >+ 다시 결정할 날짜</text>
<line x1='740.0' y1='508.0' x2='786.0' y2='508.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='764.0' y='498.0' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >아니요</text>
<rect x='790.0' y='456.0' width='196.0' height='104.0' rx='10' fill='#fbecea' stroke='#c8553d' stroke-width='1.5' />
<text x='888.0' y='486.0' font-size='17' fill='#c8553d' text-anchor='middle' font-weight='bold' >좁히거나 접는다</text>
<text x='888.0' y='512.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >판정할 수 없는 가정 위에</text>
<text x='888.0' y='536.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >연구를 세우지 않는다</text>
<rect x='40.0' y='584.0' width='920.0' height='100.0' rx='8' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='500.0' y='610.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >칸에 넣지 않는 것: 이미 쓴 시간·돈(매몰 비용), 남이 이 방향을 한다는 소문,</text>
<text x='500.0' y='634.0' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >결론을 정해 두고 고른 근거</text>
<text x='500.0' y='664.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >'모름'은 '통과'가 아니다. 결정은 영원하지 않다: 다시 볼 날짜를 함께 적는다.</text>
</svg>
