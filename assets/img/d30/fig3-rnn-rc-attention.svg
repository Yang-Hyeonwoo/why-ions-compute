<text x='20.0' y='715.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >상태 갱신 1번 = 노드 N개 갱신(밀집 ESN이면 곱셈 N²번, 물리 RC면 이완 + 읽기 N번).</text>
<text x='20.0' y='736.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >차원(d, N)·층과 갈래 수·정밀도·메모리(어텐션은 단어 n개의 k와 v를 보관)·전처리를 맞추기 전에는</text>
<text x='20.0' y='757.0' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >연산량·에너지 비교가 아니다. 막대는 n에 따른 증가 방식만 비교한다.</text>
