<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 640' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='640' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28.0' font-size='17' fill='#444' text-anchor='middle' font-weight='bold' >어텐션 한 번을 작은 숫자로: '먹었다'가 문장의 어느 단어를 볼지 정하기</text>
<text x='500.0' y='50.0' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' >(장난감 숫자)</text>
<text x='20.0' y='63.0' font-size='16' fill='#222' text-anchor='start' font-weight='bold' >(a)</text>
<rect x='20.0' y='66.0' width='310.0' height='104.0' rx='10' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.2' />
<text x='36.0' y='92.0' font-size='15' fill='#7a5aa6' text-anchor='start' font-weight='bold' >① '먹었다'의 질문 q</text>
<text x='36.0' y='120.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >q = (0, 2)</text>
<text x='36.0' y='146.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >"무엇을?"을 찾는 목록</text>
<text x='360.0' y='86.0' font-size='15' fill='#3d6fb4' text-anchor='start' font-weight='bold' >② 단어마다 꼬리표 k와 점수 = q · k</text>
<text x='360.0' y='106.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >(같은 자리끼리 곱해 더하기)</text>
<rect x='360.0' y='116.0' width='620.0' height='30.0' rx='6' fill='#eef3fb' stroke='none' stroke-width='1.2' />
<text x='372.0' y='137.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >나는</text>
<text x='452.0' y='137.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >k = (1, 0)</text>
<text x='600.0' y='137.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >점수 = 0×1 + 2×0 = 0</text>
<rect x='360.0' y='152.0' width='620.0' height='30.0' rx='6' fill='#eef3fb' stroke='none' stroke-width='1.2' />
<text x='372.0' y='173.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >사과를</text>
<text x='452.0' y='173.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >k = (0, 1)</text>
<text x='600.0' y='173.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >점수 = 0×0 + 2×1 = 2</text>
<rect x='360.0' y='188.0' width='620.0' height='30.0' rx='6' fill='#eef3fb' stroke='none' stroke-width='1.2' />
<text x='372.0' y='209.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >먹었다</text>
<text x='452.0' y='209.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >k = (0.5, 0.5)</text>
<text x='600.0' y='209.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >점수 = 0×0.5 + 2×0.5 = 1</text>
<text x='20.0' y='250.0' font-size='15' fill='#13936b' text-anchor='start' font-weight='bold' >③ softmax: 점수 → 무게 (0–1, 합 1)</text>
<text x='30.0' y='286.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >나는</text>
<text x='104.0' y='286.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' ><tspan font-size='14'>e</tspan><tspan dy='-8' font-size='13'>0</tspan><tspan dy='8' font-size='14'> = 1.000</tspan></text>
<text x='240.0' y='286.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >÷ 11.107 = 0.090</text>
<rect x='390.0' y='271.0' width='18.0' height='20.0' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='416.0' y='286.0' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >9.0%</text>
<text x='30.0' y='326.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >사과를</text>
<text x='104.0' y='326.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' ><tspan font-size='14'>e</tspan><tspan dy='-8' font-size='13'>2</tspan><tspan dy='8' font-size='14'> = 7.389</tspan></text>
<text x='240.0' y='326.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >÷ 11.107 = 0.665</text>
<rect x='390.0' y='311.0' width='133.0' height='20.0' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='531.0' y='326.0' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >66.5%</text>
<text x='30.0' y='366.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >먹었다</text>
<text x='104.0' y='366.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' ><tspan font-size='14'>e</tspan><tspan dy='-8' font-size='13'>1</tspan><tspan dy='8' font-size='14'> = 2.718</tspan></text>
<text x='240.0' y='366.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >÷ 11.107 = 0.245</text>
<rect x='390.0' y='351.0' width='48.9' height='20.0' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='446.9' y='366.0' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >24.5%</text>
<text x='30.0' y='398.0' font-size='14' fill='#999' text-anchor='start' font-weight='normal' >합: 1.000 + 7.389 + 2.718 = 11.107</text>
<text x='20.0' y='438.0' font-size='15' fill='#e08a3c' text-anchor='start' font-weight='bold' >④ 무게로 내용 v를 섞는다(가중합) → '먹었다'의 새 숫자 목록</text>
<text x='30.0' y='464.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >0.090 × 나는의 v (1, 0, 0)</text>
<text x='30.0' y='488.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >0.665 × 사과를의 v (0, 1, 0)</text>
<text x='30.0' y='512.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >0.245 × 먹었다의 v (0, 0, 1)</text>
<text x='30.0' y='544.0' font-size='15' fill='#e08a3c' text-anchor='start' font-weight='bold' >= (0.090, 0.665, 0.245)</text>
<text x='30.0' y='570.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >새 목록의 66.5%가 '사과를'의 내용이다. '먹었다'가 목적어를 '보고' 온 것이다.</text>
<text x='640.0' y='230.0' font-size='16' fill='#222' text-anchor='start' font-weight='bold' >(b)</text>
<rect x='640.0' y='236.0' width='345.0' height='290.0' rx='10' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='654.0' y='262.0' font-size='15' fill='#444' text-anchor='start' font-weight='bold' >언어 모델이 마지막에 하는 일</text>
<text x='654.0' y='284.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >(예시 점수)</text>
<text x='654.0' y='308.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >'나는 사과를 ___' 다음 단어 후보의</text>
<text x='654.0' y='328.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >점수 → softmax</text>
<text x='656.0' y='362.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >먹었다</text>
<text x='720.0' y='362.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >점수 +2</text>
<rect x='790.0' y='348.0' width='91.7' height='20.0' rx='3' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='887.7' y='363.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >70.5%</text>
<text x='656.0' y='404.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >샀다</text>
<text x='720.0' y='404.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >점수 +1</text>
<rect x='790.0' y='390.0' width='33.7' height='20.0' rx='3' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='829.7' y='405.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >25.9%</text>
<text x='656.0' y='446.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >달렸다</text>
<text x='720.0' y='446.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >점수 −1</text>
<rect x='790.0' y='432.0' width='4.6' height='20.0' rx='3' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='800.6' y='447.0' font-size='14' fill='#3d6fb4' text-anchor='start' font-weight='bold' >3.5%</text>
<text x='654.0' y='486.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >확률대로 하나를 골라 붙이고,</text>
<text x='654.0' y='508.0' font-size='14' fill='#444' text-anchor='start' font-weight='normal' >다시 처음부터 반복한다</text>
<text x='20.0' y='604.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >실제 모델: 목록 길이는 수백–1만 남짓(모델마다 다름). 질문·꼬리표·내용은 학습한 weight 표로 만들고,</text>
<text x='20.0' y='626.0' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >점수를 √(목록 길이)로 나눈 뒤 softmax (Vaswani 2017, 3.2.1절)</text>
</svg>
