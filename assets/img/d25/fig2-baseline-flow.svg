<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 362' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='600' height='362' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >'baseline 있음?' 칸을 채우는 순서</text>
<rect x='190' y='40' width='220' height='46' rx='7' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='300.0' y='59' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >그 논문은 무엇과 비교했나?</text>
<text x='300.0' y='75' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >(아무것도 없으면 '없음'이라고 쓴다)</text>
<line x1='300' y1='86' x2='300' y2='104' stroke='#444' stroke-width='1.2'/>
<line x1='300' y1='104' x2='106' y2='122' stroke='#444' stroke-width='1' marker-end='url(#arr)'/>
<rect x='16' y='122' width='180' height='60' rx='7' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='106.0' y='141' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >같은 알고리즘의 디지털 RC</text>
<text x='106.0' y='157' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >Zhong 2022: 96.6% vs 98.2%</text>
<text x='106.0' y='171' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >→ 하드웨어 손실을 잰다</text>
<line x1='300' y1='104' x2='300' y2='122' stroke='#444' stroke-width='1' marker-end='url(#arr)'/>
<rect x='210' y='122' width='180' height='60' rx='7' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='300.0' y='141' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >원시 입력 + 같은 readout</text>
<text x='300.0' y='157' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >Zhou 2026: 처리 없음 58%</text>
<text x='300.0' y='171' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >vs 시공간 처리 85%</text>
<line x1='300' y1='104' x2='494' y2='122' stroke='#444' stroke-width='1' marker-end='url(#arr)'/>
<rect x='404' y='122' width='180' height='60' rx='7' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='494.0' y='141' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >다른 논문의 숫자</text>
<text x='494.0' y='157' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >Guo 2026: 89.5% vs 88–91%,</text>
<text x='494.0' y='171' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >86.2% (조건이 다름)</text>
<rect x='90' y='214' width='420' height='46' rx='7' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='300.0' y='233' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >같은 readout · 같은 입력 차원 · 같은 데이터 분할인가?</text>
<text x='300.0' y='249' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >예: Lee 2026 (AFM)은 같은 신경망 readout이지만 입력 개수가 440 vs 110 → △</text>
<line x1='106' y1='182' x2='300' y2='214' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='300' y1='182' x2='300' y2='214' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='494' y1='182' x2='300' y2='214' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='300' y1='260' x2='300' y2='280' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='50' y='282' width='230' height='46' rx='7' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='165.0' y='301' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >소자의 기여를 가를 수 있다</text>
<text x='165.0' y='317' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >표에는 '있음 (무엇과)'</text>
<rect x='320' y='282' width='230' height='46' rx='7' fill='#fbeeec' stroke='#c8553d' stroke-width='1.2' />
<text x='435.0' y='301' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >가를 수 없다</text>
<text x='435.0' y='317' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >표에는 '△ (어디가 다른지)' 또는 '없음'</text>
<text x='300' y='350' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >'비교 대상이 있다'와 '소자가 무엇을 보탰는지 입증됐다'는 다른 말이다. 둘째 질문까지 통과해야 2단이다.</text>
</svg>
