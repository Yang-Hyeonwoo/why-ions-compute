<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 352' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='780' height='352' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='390.0' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >한 줄을 데이터가 지나가는 순서로: 어디까지가 device에서 잰 것인가</text>
<text x='66.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >① device</text>
<text x='196.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >② 입력</text>
<text x='326.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >③ 상태</text>
<text x='456.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >④ readout</text>
<text x='586.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >⑤ 점수</text>
<text x='716.0' y='48' font-size='11.5' fill='#444' text-anchor='middle' font-weight='bold' >⑥ baseline</text>
<text x='8' y='74' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >(a) Zhong 2022 (비이온 산화물, 심전도 부정맥 판별) — 시험 박동마다 하드웨어로 inference</text>
<rect x='8' y='84' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='66.0' y='103' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >동적 memristor</text>
<text x='66.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >24개</text>
<text x='66.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(Ti/TiOₓ/Pd)</text>
<line x1='125' y1='115.0' x2='136' y2='115.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='138' y='84' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='196.0' y='103' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >박동 1개 = 50 시점</text>
<text x='196.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(72 Hz로 다시 뽑음)</text>
<text x='196.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >마스크 5칸 → 전압</text>
<line x1='255' y1='115.0' x2='266' y2='115.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='268' y='84' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='326.0' y='103' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >시점마다</text>
<text x='326.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >24 × 5 = 120개</text>
<text x='326.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >출력을 회로가 읽음</text>
<line x1='385' y1='115.0' x2='396' y2='115.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='398' y='84' width='116' height='62' rx='6' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.6' />
<text x='456.0' y='103' font-size='10.6' fill='#e08a3c' text-anchor='middle' font-weight='bold' >weight는 PC가 계산</text>
<text x='456.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >→ 1T1R 배열에 씀</text>
<text x='456.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >곱셈·합은 회로</text>
<line x1='515' y1='115.0' x2='526' y2='115.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='528' y='84' width='116' height='62' rx='6' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='586.0' y='103' font-size='10.6' fill='#999' text-anchor='middle' font-weight='bold' >96.6%</text>
<text x='586.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >시험 박동 9,000개</text>
<text x='586.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >문턱으로 판정</text>
<line x1='645' y1='115.0' x2='656' y2='115.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='658' y='84' width='116' height='62' rx='6' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='716.0' y='103' font-size='10.6' fill='#999' text-anchor='middle' font-weight='bold' >디지털 RC 98.2%</text>
<text x='716.0' y='119' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(하드웨어 손실)</text>
<text x='716.0' y='135' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >원시 입력 기준선 ✗</text>
<text x='8' y='166' font-size='10.2' fill='#13936b' text-anchor='start' font-weight='bold' >inference는 시험 박동마다 device·회로를 실제로 통과 (weight를 정하는 학습만 PC)</text>
<text x='8' y='196' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >(b) Lee 2026 (AFM) (이온 하이드로겔, MNIST) — 16가지 조각만 device로 재고 나머지는 컴퓨터</text>
<rect x='8' y='206' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='66.0' y='225' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >하이드로겔 접합</text>
<text x='66.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1개</text>
<text x='66.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(10 mM KCl)</text>
<line x1='125' y1='237.0' x2='136' y2='237.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='138' y='206' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='196.0' y='225' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >4-bit 조각 16가지</text>
<text x='196.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >1 → +1 V, 0 → −1 V</text>
<text x='196.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >펄스당 1 s</text>
<line x1='255' y1='237.0' x2='266' y2='237.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='268' y='206' width='116' height='62' rx='6' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='326.0' y='225' font-size='10.6' fill='#13936b' text-anchor='middle' font-weight='bold' >4번째 펄스 뒤 전류</text>
<text x='326.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >16단계 (실측)</text>
<text x='326.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >→ 표로 씀 [해석]</text>
<line x1='385' y1='237.0' x2='396' y2='237.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='398' y='206' width='116' height='62' rx='6' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.6' />
<text x='456.0' y='225' font-size='10.6' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >그림 = 조각 110개</text>
<text x='456.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >→ 표에서 값 찾기</text>
<text x='456.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >→ 은닉층 3개 MLP</text>
<line x1='515' y1='237.0' x2='526' y2='237.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='528' y='206' width='116' height='62' rx='6' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='586.0' y='225' font-size='10.6' fill='#999' text-anchor='middle' font-weight='bold' >98.94%</text>
<text x='586.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >5겹 교차검증</text>
<text x='586.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(컴퓨터 계산)</text>
<line x1='645' y1='237.0' x2='656' y2='237.0' stroke='#444' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='658' y='206' width='116' height='62' rx='6' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='716.0' y='225' font-size='10.6' fill='#999' text-anchor='middle' font-weight='bold' >같은 MLP에</text>
<text x='716.0' y='241' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >0·1 440개 입력</text>
<text x='716.0' y='257' font-size='10.2' fill='#444' text-anchor='middle' font-weight='normal' >(그래프로만, △)</text>
<line x1='391.0' y1='198' x2='391.0' y2='276' stroke='#c8553d' stroke-width='1.6' stroke-dasharray='5 3'/>
<text x='395.0' y='288' font-size='10.2' fill='#c8553d' text-anchor='start' font-weight='bold' >여기서부터 컴퓨터 계산 (측정한 16개 값을 다시 씀)</text>
<rect x='8' y='308' width='16' height='12' rx='2' fill='#eef9f4' stroke='#13936b' stroke-width='1.6' />
<text x='30' y='318' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >device·회로에서 실제로 일어남(실측)</text>
<rect x='232' y='308' width='16' height='12' rx='2' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.6' />
<text x='254' y='318' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >학습은 컴퓨터, inference는 회로</text>
<rect x='410' y='308' width='16' height='12' rx='2' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.6' />
<text x='432' y='318' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >컴퓨터 안에서 계산</text>
<rect x='560' y='308' width='16' height='12' rx='2' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='582' y='318' font-size='10.2' fill='#444' text-anchor='start' font-weight='normal' >결과·비교 대상</text>
<text x='390.0' y='340' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >같은 '정확도 %' 칸이라도 초록 상자가 어디까지 이어지는지가 다르다. 그 차이를 표의 '시연한 기능' 칸에 적는다.</text>
</svg>
