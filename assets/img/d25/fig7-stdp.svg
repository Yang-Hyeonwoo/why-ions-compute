<text x='360.0' y='388' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >모형: Δt &gt; 0이면 Δw = +A·e<tspan dy='-6' font-size='9'>−Δt/τ</tspan><tspan dy='6' font-size='1'> </tspan>, Δt &lt; 0이면 Δw = −A·e<tspan dy='-6' font-size='9'>Δt/τ</tspan><tspan dy='6' font-size='1'> </tspan>.  A = 0.10(교육용), τ = 20 ms(창의 폭), 처음 w = 0.50.</text>
<text x='360.0' y='406' font-size='10.2' fill='#999' text-anchor='middle' font-weight='normal' >실제 측정에서는 강화·약화의 크기와 창 폭이 서로 다르고, 시냅스마다 다르다.</text>
<text x='360.0' y='422' font-size='10.2' fill='#999' text-anchor='middle' font-weight='normal' >이온 device 논문에서는 Δt가 수 s 단위인 경우가 있다(Chen 2025 Fig. 3d의 가로축은 −15 ~ +15 s).</text>
