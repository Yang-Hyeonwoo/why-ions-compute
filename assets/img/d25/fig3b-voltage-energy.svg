<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 250' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='640' height='250' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320' y='22' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >fJ 숫자는 입력 전압에 달려 있다: 에너지 ∝ 전압²(저항이 같다면)</text>
<line x1='60' y1='120' x2='600' y2='120' stroke='#b9c0cc' stroke-width='1.4'/>
<line x1='60.0' y1='115' x2='60.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='60.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹⁷ J</text>
<line x1='150.0' y1='115' x2='150.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='150.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹⁵ J</text>
<line x1='240.0' y1='115' x2='240.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='240.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹³ J</text>
<line x1='330.0' y1='115' x2='330.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='330.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻¹¹ J</text>
<line x1='420.0' y1='115' x2='420.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='420.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁹ J</text>
<line x1='510.0' y1='115' x2='510.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='510.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁷ J</text>
<line x1='600.0' y1='115' x2='600.0' y2='125' stroke='#b9c0cc' stroke-width='1.2'/>
<text x='600.0' y='142' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >10⁻⁵ J</text>
<circle cx='99.1' cy='120.0' r='8' fill='#13936b' stroke='none'/>
<text x='99.11542738789393' y='80' font-size='13' fill='#13936b' text-anchor='middle' font-weight='bold' >0.074 fJ</text>
<text x='99.11542738789393' y='98' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >−10 µV 자극 (Chen 2024, p.6)</text>
<circle cx='549.1' cy='120.0' r='8' fill='#c8553d' stroke='none'/>
<text x='549.115427387894' y='80' font-size='13' fill='#c8553d' text-anchor='middle' font-weight='bold' >약 0.7 µJ</text>
<text x='549.115427387894' y='98' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >같은 device에 ±1 V라면 (어림)</text>
<path d='M111.1,154.0 Q324.1,200.0 537.1,154.0' fill='none' stroke='#444' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='324.115427387894' y='194' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >전압 10⁵배 → 에너지 약 10¹⁰배</text>
<text x='320' y='228' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >이온 device의 전류는 전압에 정비례하지 않으므로 자릿수 감각이다. 읽기 회로·readout은 둘 다 빠져 있다.</text>
<text x='320' y='245' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >(Claude가 계산해 그림)</text>
</svg>
