<text x='310' y='448' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >0단 5편 · 1단 7편 · 2단 1편 · 3단 0편. 각 논문을 '가장 높이 오른 계단'에 한 번만 놓았다.</text>
<text x='310' y='466' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >초록 글자 = 이온 소자, 회색 = 비교용 비이온 소자. 판정 기준은 D18 체크리스트(A1·D1·E1·F1·F2).</text>
