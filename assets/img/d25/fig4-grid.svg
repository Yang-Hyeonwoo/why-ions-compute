<text x='310' y='342' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >과제가 있는 8편 중 원시 입력 기준선(같은 readout)을 보인 것은 1편이고, 그 숫자도 소자 모형 시뮬레이션이다.</text>
<text x='310' y='358' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >readout까지 회로로 추론한 것은 1편, 비교용 비이온 소자(Zhong 2022)뿐이다. Zhou 2026의 회로 추론은 4패턴 소과제. [해석]</text>
