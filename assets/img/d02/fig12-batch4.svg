<text x='30' y='300' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >연산: 벡터마다 8 op × 4 = 32 op.   가중치 이동: 16 byte 한 번(칩 안에 남아 있는 동안).   입력 4 × 8 = 32 byte, 출력 4 × 8 = 32 byte.</text>
<text x='30' y='318' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >같은 W를 네 번 쓰므로 가중치 한 byte당 연산이 4배가 된다. W가 칩 안에 남아 있지 못하면 매번 다시 가져와 이득이 사라진다.</text>
<text x='30' y='336' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >입력 벡터 값은 예시. 출력은 코드가 계산 (Claude가 그림)</text>
