<line x1='92' y1='240' x2='248' y2='240' stroke='#3d6fb4' stroke-width='2.2'/>
<circle cx='170.0' cy='130.0' r='10' fill='#fff' stroke='#e08a3c' stroke-width='1.5'/>
<text x='170.0' y='134.5' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >①</text>
<circle cx='138.8' cy='207.0' r='10' fill='#fff' stroke='#e08a3c' stroke-width='1.5'/>
<text x='138.8' y='211.5' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >②</text>
<circle cx='138.8' cy='163.0' r='10' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<text x='138.8' y='167.5' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >③</text>
<circle cx='170.0' cy='240.0' r='10' fill='#fff' stroke='#3d6fb4' stroke-width='1.5'/>
<text x='170.0' y='244.5' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >④</text>
<circle cx='70' cy='130' r='22' fill='#f4faf7' stroke='#13936b' stroke-width='1.6'/>
<text x='70' y='135' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>u</tspan><tspan dy='4' font-size='10'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<circle cx='70' cy='240' r='22' fill='#f4faf7' stroke='#13936b' stroke-width='1.6'/>
<text x='70' y='245' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' ><tspan>u</tspan><tspan dy='4' font-size='10'>2</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<circle cx='270' cy='130' r='22' fill='#fff' stroke='#e08a3c' stroke-width='1.8'/>
<text x='270' y='135' font-size='15' fill='#e08a3c' text-anchor='middle' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='10'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<circle cx='270' cy='240' r='22' fill='#fff' stroke='#3d6fb4' stroke-width='1.8'/>
<text x='270' y='245' font-size='15' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='10'>2</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='12' y='50' font-size='13' fill='#444' text-anchor='start' font-weight='bold' >(a)</text>
<text x='300' y='50' font-size='13' fill='#444' text-anchor='start' font-weight='bold' >(b)</text>
<text x='70' y='72' font-size='12' fill='#13936b' text-anchor='middle' font-weight='bold' >입력 벡터 u</text>
<text x='70' y='88' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >샘플 1개 = 숫자 2개</text>
<text x='270' y='72' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >출력 벡터 y</text>
<text x='270' y='88' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >숫자 2개</text>
<text x='318' y='72' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >선마다 가중치 하나</text>
<text x='318' y='104' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>① u</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → y</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> : W[1,1] = 1</tspan></text>
<text x='318' y='138' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>② u</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → y</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> : W[1,2] = 3</tspan></text>
<text x='318' y='172' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>③ u</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → y</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> : W[2,1] = 2</tspan></text>
<text x='318' y='206' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>④ u</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → y</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> : W[2,2] = 0.5</tspan></text>
<line x1='322' y1='240' x2='600' y2='204' stroke='#999' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='322' y='262' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >같은 번호의 칸으로 옮겨 적기 →</text>
<text x='606' y='72' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >가중치 행렬 W</text>
<text x='573.0' y='88' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' ><tspan>열 1 (u</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)</tspan></text>
<text x='639.0' y='88' font-size='10.5' fill='#13936b' text-anchor='middle' font-weight='normal' ><tspan>열 2 (u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)</tspan></text>
<text x='532' y='126.0' font-size='10.5' fill='#e08a3c' text-anchor='end' font-weight='normal' ><tspan>행 1 (y</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)</tspan></text>
<rect x='542' y='98' width='62' height='48' rx='4' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.2' />
<text x='573.0' y='120' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='573.0' y='137' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >① W[1,1]</text>
<rect x='608' y='98' width='62' height='48' rx='4' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.2' />
<text x='639.0' y='120' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >3</text>
<text x='639.0' y='137' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >② W[1,2]</text>
<text x='532' y='178.0' font-size='10.5' fill='#3d6fb4' text-anchor='end' font-weight='normal' ><tspan>행 2 (y</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)</tspan></text>
<rect x='542' y='150' width='62' height='48' rx='4' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.2' />
<text x='573.0' y='172' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >2</text>
<text x='573.0' y='189' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >③ W[2,1]</text>
<rect x='608' y='150' width='62' height='48' rx='4' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.2' />
<text x='639.0' y='172' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >0.5</text>
<text x='639.0' y='189' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >④ W[2,2]</text>
<text x='30' y='296' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >읽는 법: 행 하나 = 출력 하나로 들어오는 선들(주황 = 출력 1, 파랑 = 출력 2). 열 하나 = 입력 하나에서 나가는 선들. 위치는 W[행, 열].</text>
<text x='30' y='314' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >모든 출력이 모든 입력과 이어진 '완전연결'이라 선 수 = 입력 수 × 출력 수 = 2 × 2 = 4. 가중치 값은 예시이고 3구간 손계산과 같다.</text>
<text x='30' y='332' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >모식도 (Claude가 그림)</text>
</svg>
