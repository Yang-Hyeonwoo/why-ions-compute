<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 344' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >입력 2개 → 출력 2개: 연결선 4개 = 가중치 4개 = 2×2 표</text>
<line x1='92' y1='130' x2='248' y2='130' stroke='#e08a3c' stroke-width='2.2'/>
