<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 362' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >곱셈(보라)과 덧셈(초록) 따라가기: 0에서 시작해 MAC 4번 = 8 op</text>
<text x='24' y='96' font-size='12.5' fill='#e08a3c' text-anchor='start' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='10'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> 만들기</tspan></text>
<rect x='110' y='76' width='72' height='34' rx='4' fill='#fafafa' stroke='#999' stroke-width='1.2' />
<text x='146' y='98' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >누적 0</text>
<line x1='184' y1='93' x2='326' y2='93' stroke='#999' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='192' y='70' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >MAC 1</text>
<rect x='192' y='74' width='128' height='22' rx='4' fill='#f3edfa' stroke='#7a4fb5' stroke-width='1.1' />
<text x='256' y='89' font-size='11.5' fill='#7a4fb5' text-anchor='middle' font-weight='normal' >곱셈 1×2 = 2</text>
<rect x='192' y='102' width='128' height='22' rx='4' fill='#ecf8f3' stroke='#13936b' stroke-width='1.1' />
<text x='256' y='117' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='normal' >덧셈 0 + 2 = 2</text>
<rect x='330' y='76' width='72' height='34' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.4' />
<text x='366' y='98' font-size='13' fill='#e08a3c' text-anchor='middle' font-weight='bold' >2</text>
<line x1='404' y1='93' x2='546' y2='93' stroke='#999' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='412' y='70' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >MAC 2</text>
<rect x='412' y='74' width='128' height='22' rx='4' fill='#f3edfa' stroke='#7a4fb5' stroke-width='1.1' />
<text x='476' y='89' font-size='11.5' fill='#7a4fb5' text-anchor='middle' font-weight='normal' >곱셈 3×1 = 3</text>
<rect x='412' y='102' width='128' height='22' rx='4' fill='#ecf8f3' stroke='#13936b' stroke-width='1.1' />
<text x='476' y='117' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='normal' >덧셈 2 + 3 = 5</text>
<rect x='550' y='76' width='72' height='34' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.4' />
<text x='586' y='98' font-size='13' fill='#e08a3c' text-anchor='middle' font-weight='bold' >5</text>
<text x='24' y='200' font-size='12.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='10'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> 만들기</tspan></text>
<rect x='110' y='180' width='72' height='34' rx='4' fill='#fafafa' stroke='#999' stroke-width='1.2' />
<text x='146' y='202' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >누적 0</text>
<line x1='184' y1='197' x2='326' y2='197' stroke='#999' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='192' y='174' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >MAC 3</text>
<rect x='192' y='178' width='128' height='22' rx='4' fill='#f3edfa' stroke='#7a4fb5' stroke-width='1.1' />
<text x='256' y='193' font-size='11.5' fill='#7a4fb5' text-anchor='middle' font-weight='normal' >곱셈 2×2 = 4</text>
<rect x='192' y='206' width='128' height='22' rx='4' fill='#ecf8f3' stroke='#13936b' stroke-width='1.1' />
<text x='256' y='221' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='normal' >덧셈 0 + 4 = 4</text>
<rect x='330' y='180' width='72' height='34' rx='4' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='366' y='202' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >4</text>
<line x1='404' y1='197' x2='546' y2='197' stroke='#999' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='412' y='174' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >MAC 4</text>
<rect x='412' y='178' width='128' height='22' rx='4' fill='#f3edfa' stroke='#7a4fb5' stroke-width='1.1' />
<text x='476' y='193' font-size='11.5' fill='#7a4fb5' text-anchor='middle' font-weight='normal' >곱셈 0.5×1 = 0.5</text>
<rect x='412' y='206' width='128' height='22' rx='4' fill='#ecf8f3' stroke='#13936b' stroke-width='1.1' />
<text x='476' y='221' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='normal' >덧셈 4 + 0.5 = 4.5</text>
<rect x='550' y='180' width='72' height='34' rx='4' fill='#fff' stroke='#3d6fb4' stroke-width='1.4' />
<text x='586' y='202' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >4.5</text>
<text x='24' y='272' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >세기: 곱셈 4번(보라) + 덧셈 4번(초록) = 8 op = MAC 4번   (1 MAC = 곱셈 1 + 덧셈 1 = 2 op)</text>
<text x='24' y='294' font-size='11' fill='#444' text-anchor='start' font-weight='normal' ><tspan>식 y</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1×2 + 3×1에는 + 기호가 하나뿐이다. 맨 앞의 '0 +'(누적의 첫 덧셈)를 적지 않았기 때문이다.</tspan></text>
<text x='24' y='312' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >그래서 기호를 세면 곱셈 4 + 덧셈 2 = 6, 0부터 누적하면 8. 이 교재는 하드웨어처럼 0부터 누적해 1 MAC = 2 op로 센다.</text>
<text x='24' y='330' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >입력이 N개면 출력 하나에 2N op(0부터) 또는 2N−1(기호). N = 1,000이면 2,000 vs 1,999, 차이 0.05%.</text>
<text x='24' y='350' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >입력 u = (2, 1), weight는 그림 5의 표. 모식도 (Claude가 그림)</text>
</svg>
