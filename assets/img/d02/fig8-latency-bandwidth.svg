<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 380' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320' y='22' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >가져오기 시간 ≈ 지연 + (양 ÷ 대역폭): 무엇이 시간을 정하나 (예시 값)</text>
<text x='30' y='50' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >① 작은 요청: 값 하나 (4 byte)</text>
<text x='190' y='81' font-size='11' fill='#444' text-anchor='end' font-weight='normal' >길 1배: 10 byte/ns</text>
<rect x='200' y='68' width='316.66666666666674' height='20' rx='0' fill='#cfcfcf' stroke='none' stroke-width='1.2' />
<rect x='516.6666666666667' y='68' width='1.2666666666666515' height='20' rx='0' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='523.9333333333334' y='83' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >합계 100.4 ns</text>
<text x='358.33333333333337' y='82' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >지연 100 ns</text>
<text x='190' y='115' font-size='11' fill='#444' text-anchor='end' font-weight='normal' >길 2배: 20 byte/ns</text>
<rect x='200' y='102' width='316.66666666666674' height='20' rx='0' fill='#cfcfcf' stroke='none' stroke-width='1.2' />
<rect x='516.6666666666667' y='102' width='1.0' height='20' rx='0' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='523.6666666666667' y='117' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >합계 100.2 ns</text>
<text x='358.33333333333337' y='116' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >지연 100 ns</text>
<line x1='200' y1='134' x2='580' y2='134' stroke='#999' stroke-width='1'/>
<line x1='200.0' y1='134' x2='200.0' y2='138' stroke='#999' stroke-width='1'/>
<text x='200.0' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0</text>
<line x1='263.3333333333333' y1='134' x2='263.3333333333333' y2='138' stroke='#999' stroke-width='1'/>
<text x='263.3333333333333' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >20</text>
<line x1='326.6666666666667' y1='134' x2='326.6666666666667' y2='138' stroke='#999' stroke-width='1'/>
<text x='326.6666666666667' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >40</text>
<line x1='390.0' y1='134' x2='390.0' y2='138' stroke='#999' stroke-width='1'/>
<text x='390.0' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >60</text>
<line x1='453.33333333333337' y1='134' x2='453.33333333333337' y2='138' stroke='#999' stroke-width='1'/>
<text x='453.33333333333337' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >80</text>
<line x1='516.6666666666667' y1='134' x2='516.6666666666667' y2='138' stroke='#999' stroke-width='1'/>
<text x='516.6666666666667' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >100</text>
<line x1='580.0' y1='134' x2='580.0' y2='138' stroke='#999' stroke-width='1'/>
<text x='580.0' y='149' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >120</text>
<text x='588' y='149' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >ns</text>
<text x='30' y='168' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >지연(회색)이 거의 전부: 길을 2배로 넓혀도 100.4 → 100.2 ns. 전송 몫(0.4 ns, 0.2 ns)은 너무 짧아 거의 안 보인다.</text>
<text x='30' y='200' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >② 큰 요청: 숫자 100만 개 (4 MB, 숫자 하나 4 byte)</text>
<text x='190' y='231' font-size='11' fill='#444' text-anchor='end' font-weight='normal' >길 1배: 10 byte/ns</text>
<rect x='200' y='218' width='0.09047619047618127' height='20' rx='0' fill='#cfcfcf' stroke='none' stroke-width='1.2' />
<rect x='200.09047619047618' y='218' width='361.904761904762' height='20' rx='0' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='567.9952380952382' y='233' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >합계 400.1 µs</text>
<text x='381.0428571428572' y='232' font-size='10.5' fill='#fff' text-anchor='middle' font-weight='normal' >양 ÷ 대역폭 = 400 µs</text>
<text x='190' y='265' font-size='11' fill='#444' text-anchor='end' font-weight='normal' >길 2배: 20 byte/ns</text>
<rect x='200' y='252' width='0.09047619047618127' height='20' rx='0' fill='#cfcfcf' stroke='none' stroke-width='1.2' />
<rect x='200.09047619047618' y='252' width='180.95238095238096' height='20' rx='0' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='387.04285714285714' y='267' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >합계 200.1 µs</text>
<text x='290.56666666666666' y='266' font-size='10.5' fill='#fff' text-anchor='middle' font-weight='normal' >양 ÷ 대역폭 = 200 µs</text>
<line x1='200' y1='284' x2='580' y2='284' stroke='#999' stroke-width='1'/>
<line x1='200.0' y1='284' x2='200.0' y2='288' stroke='#999' stroke-width='1'/>
<text x='200.0' y='299' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >0</text>
<line x1='290.4761904761905' y1='284' x2='290.4761904761905' y2='288' stroke='#999' stroke-width='1'/>
<text x='290.4761904761905' y='299' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >100</text>
<line x1='380.95238095238096' y1='284' x2='380.95238095238096' y2='288' stroke='#999' stroke-width='1'/>
<text x='380.95238095238096' y='299' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >200</text>
<line x1='471.42857142857144' y1='284' x2='471.42857142857144' y2='288' stroke='#999' stroke-width='1'/>
<text x='471.42857142857144' y='299' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >300</text>
<line x1='561.9047619047619' y1='284' x2='561.9047619047619' y2='288' stroke='#999' stroke-width='1'/>
<text x='561.9047619047619' y='299' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >400</text>
<text x='588' y='299' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >µs</text>
<text x='30' y='318' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >전송이 거의 전부: 길을 2배로 넓히면 400.1 → 200.1 µs. 지연 100 ns는 0.1 µs라 이 눈금에서는 안 보인다.</text>
<text x='320' y='352' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >가정: 지연 100 ns, 대역폭 10 byte/ns(= 10 GB/s)는 예시 값이며 특정 제품의 값이 아니다. 요청 하나를 보내고 다 받을 때까지만 센다.</text>
<text x='320' y='368' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실제 칩은 여러 요청을 겹쳐 보내 지연을 숨기기도 한다(1-1구간 실습의 '겹쳐 진행' 가정). (Claude가 계산해 그림)</text>
</svg>
