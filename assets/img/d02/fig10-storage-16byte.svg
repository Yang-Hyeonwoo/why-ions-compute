<rect x='354' y='112' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='360' y='124' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >7</text>
