<rect x='430' y='158' width='72' height='34' rx='3' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.1' />
<text x='436' y='170' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >12</text>
