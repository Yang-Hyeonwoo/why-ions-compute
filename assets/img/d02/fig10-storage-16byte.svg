<rect x='430' y='112' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='436' y='124' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >8</text>
<text x='466.0' y='135' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<text x='514' y='134' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >= 4 byte</text>
<text x='186' y='180' font-size='12.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' >③ W[2,1] = 2</text>
<rect x='202' y='158' width='72' height='34' rx='3' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.1' />
