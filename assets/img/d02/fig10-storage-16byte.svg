<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 336' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >weight 4개를 저장하면: 숫자 하나 = 4 byte 칸, 4개 × 4 byte = 16 byte</text>
<text x='350' y='44' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >이 예제의 약속: 숫자 하나를 32 bit = 4 byte 형식으로 저장한다 (1 byte = 8 bit)</text>
<text x='186' y='88' font-size='12.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >① W[1,1] = 1</text>
<rect x='202' y='66' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='208' y='78' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >1</text>
<text x='238.0' y='89' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<rect x='278' y='66' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='284' y='78' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >2</text>
<text x='314.0' y='89' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<rect x='354' y='66' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='360' y='78' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >3</text>
<text x='390.0' y='89' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<rect x='430' y='66' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='436' y='78' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >4</text>
<text x='466.0' y='89' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<text x='514' y='88' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >= 4 byte</text>
<text x='186' y='134' font-size='12.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >② W[1,2] = 3</text>
<rect x='202' y='112' width='72' height='34' rx='3' fill='#fff3e6' stroke='#e08a3c' stroke-width='1.1' />
<text x='208' y='124' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >5</text>
