<text x='514' y='180' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >= 4 byte</text>
<text x='186' y='226' font-size='12.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' >④ W[2,2] = 0.5</text>
<rect x='202' y='204' width='72' height='34' rx='3' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.1' />
<text x='208' y='216' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >13</text>
<text x='238.0' y='227' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<rect x='278' y='204' width='72' height='34' rx='3' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.1' />
