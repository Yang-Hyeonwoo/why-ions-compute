<text x='360' y='216' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >15</text>
<text x='390.0' y='227' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<rect x='430' y='204' width='72' height='34' rx='3' fill='#eaf1fb' stroke='#3d6fb4' stroke-width='1.1' />
<text x='436' y='216' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >16</text>
<text x='466.0' y='227' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >1 byte</text>
<text x='514' y='226' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >= 4 byte</text>
<text x='350' y='262' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >칸을 1부터 세면 16개 → 16 byte (= 128 bit)</text>
<text x='30' y='288' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >값이 1이든 3이든 0.5든 칸 수는 같다: 칸 수는 값의 크기가 아니라 미리 정한 저장 형식(여기서는 32 bit)이 정한다.</text>
<text x='30' y='306' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >형식이 바뀌면 칸 수도 바뀐다: 16 bit 형식이면 숫자 하나 2 byte → 8 byte, 8 bit 형식이면 1 byte → 4 byte.</text>
<text x='30' y='324' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >모식도. 실제 메모리 안에서 네 숫자가 놓이는 순서와 주소는 다루지 않는다 (Claude가 그림)</text>
