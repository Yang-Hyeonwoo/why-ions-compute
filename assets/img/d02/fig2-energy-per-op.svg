<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 354' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >한 번 계산하기 vs 한 번 가져오기: 에너지 (pJ, 로그 눈금)</text>
<text x='190' y='67' font-size='12' fill='#444' text-anchor='end' font-weight='normal' >32-bit 정수 덧셈</text>
<rect x='200' y='53' width='34.0' height='24' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='240.0' y='70' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >0.1 pJ</text>
<text x='190' y='107' font-size='12' fill='#444' text-anchor='end' font-weight='normal' >32-bit 부동소수 곱셈</text>
<rect x='200' y='93' width='140.63771723655566' height='24' rx='3' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='346.63771723655566' y='110' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >3.7 pJ</text>
<text x='190' y='147' font-size='12' fill='#444' text-anchor='end' font-weight='normal' >캐시 읽기 (32 kB, 64 bit)</text>
<rect x='200' y='133' width='190.47003970515073' height='24' rx='3' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='396.4700397051507' y='150' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >20 pJ</text>
<text x='190' y='187' font-size='12' fill='#444' text-anchor='end' font-weight='normal' >캐시 읽기 (1 MB, 64 bit)</text>
<rect x='200' y='173' width='238.0' height='24' rx='3' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='444.0' y='190' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >100 pJ</text>
<text x='190' y='227' font-size='12' fill='#444' text-anchor='end' font-weight='normal' >DRAM 읽기 (64 bit)</text>
<rect x='200' y='213' width='313.74814795686495' height='24' rx='3' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<text x='519.748147956865' y='230' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >1.3 nJ</text>
<line x1='200' y1='254' x2='540' y2='254' stroke='#999' stroke-width='1'/>
<line x1='234.0' y1='254' x2='234.0' y2='258' stroke='#999' stroke-width='1'/>
<text x='234.0' y='270' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>−1</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<line x1='302.0' y1='254' x2='302.0' y2='258' stroke='#999' stroke-width='1'/>
<text x='302.0' y='270' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>0</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<line x1='370.0' y1='254' x2='370.0' y2='258' stroke='#999' stroke-width='1'/>
<text x='370.0' y='270' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>1</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<line x1='438.0' y1='254' x2='438.0' y2='258' stroke='#999' stroke-width='1'/>
<text x='438.0' y='270' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<line x1='506.0' y1='254' x2='506.0' y2='258' stroke='#999' stroke-width='1'/>
<text x='506.0' y='270' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>3</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<text x='370.0' y='286' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >에너지 [pJ] — 로그 눈금: 눈금 한 칸이 10배, 막대가 한 칸 길면 10배 많은 에너지</text>
<text x='300' y='308' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >DRAM 읽기 ÷ 정수 덧셈 ≈ 13,000배 (코드에서 계산). 덧셈 자체보다 '값을 멀리서 가져오는 일'이 자릿수로 비싸다.</text>
<text x='300' y='326' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >수치는 Horowitz(ISSCC 2014) Fig. 1.1.9의 45 nm·0.9 V 값. 메모리는 64 bit 읽기, DRAM은 1.3–2.6 nJ 중 하한.</text>
<text x='300' y='342' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >폴더 밖 문헌이지만 값과 조건은 원문 PDF와 대조했다. 공정이 바뀌면 값도 바뀌므로 자릿수 순서만 볼 것.</text>
</svg>
