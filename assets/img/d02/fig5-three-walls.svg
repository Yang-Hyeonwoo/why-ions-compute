<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 321' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >에너지와 시간은 어디로 가나: 세 가지 벽 (이해를 위한 분류, 서로 겹친다)</text>
<rect x='20' y='40' width='180' height='231' rx='8' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='30' y='62' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >① 데이터 이동 (memory wall)</text>
<line x1='30' y1='108' x2='190' y2='108' stroke='#d9d9d9' stroke-width='1'/>
<text x='30' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >값이 연산기에서 멀리 있을</text>
<text x='30' y='97' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >때의 이동량·대역폭·지연</text>
<text x='30' y='126' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='30' y='150' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >in-memory(다): weight가 있는</text>
<text x='30' y='165' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >곳에서 곱·합</text>
<text x='30' y='189' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >SNN 칩(나): 코어마다 로컬</text>
<text x='30' y='204' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >메모리</text>
<text x='30' y='228' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >physical reservoir(라):</text>
<text x='30' y='243' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >과거 입력을 상태에 담는다</text>
<rect x='210' y='40' width='180' height='231' rx='8' fill='#fff' stroke='#c8553d' stroke-width='1.6' />
<text x='220' y='62' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >② 전력밀도 (Dennard 종말)</text>
<line x1='220' y1='108' x2='380' y2='108' stroke='#d9d9d9' stroke-width='1'/>
<text x='220' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >V를 못 내려 f를 못 올림. 코어</text>
<text x='220' y='97' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >수로 대체</text>
<text x='220' y='126' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='220' y='150' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >낮은 V·낮은 f + 병렬 (뇌의</text>
<text x='220' y='165' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >방식)</text>
<text x='220' y='189' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >아날로그(가): 지수함수를</text>
<text x='220' y='204' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >device로</text>
<text x='220' y='228' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >사건 구동(event-driven):</text>
<text x='220' y='243' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >활동률 α를 낮춤</text>
<rect x='400' y='40' width='180' height='231' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='410' y='62' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >③ 정밀도의 비용</text>
<line x1='410' y1='108' x2='570' y2='108' stroke='#d9d9d9' stroke-width='1'/>
<text x='410' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >비트 수가 많을수록</text>
<text x='410' y='97' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >회로·ADC·검증 비용이 커진다</text>
<text x='410' y='126' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='410' y='150' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >근사 계산(아날로그 weight)</text>
<text x='410' y='174' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >필요한 만큼만 정밀하게</text>
<text x='410' y='198' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >대신 오차·편차를 감수 (Day 7–8)</text>
<text x='300' y='293' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >무엇을 잃는지(정밀도, 프로그램 가능성, peripheral circuits)는 Day 5–9에서 조건별로 따진다.</text>
<text x='300' y='309' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >분류 모식도 (Claude가 그림)</text>
</svg>
