<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 306' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >에너지와 시간은 어디로 가나: 세 가지 벽 (이해를 위한 분류, 서로 겹친다)</text>
<rect x='20' y='40' width='180' height='230' rx='8' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='30' y='62' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' >① 데이터 이동 (memory wall)</text>
<text x='30' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >값이 연산기에서 멀리 있을 때의</text>
<text x='30' y='98' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >이동량·대역폭·지연</text>
<line x1='30' y1='110' x2='190' y2='110' stroke='#d9d9d9' stroke-width='1'/>
<text x='30' y='128' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='30' y='150' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >in-memory(다): 가중치가 있는</text>
<text x='30' y='165' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >곳에서 곱·합</text>
<text x='30' y='186' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >SNN 칩(나): 코어마다 로컬 메모리</text>
<text x='30' y='222' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >물리 RC(라): 과거 입력을 상태에</text>
<text x='30' y='237' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >담는다</text>
<rect x='210' y='40' width='180' height='230' rx='8' fill='#fff' stroke='#c8553d' stroke-width='1.6' />
<text x='220' y='62' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >② 전력밀도 (Dennard 종말)</text>
<text x='220' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >V를 못 내려 f를 못 올림. 코어 수로</text>
<text x='220' y='98' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >대체</text>
<line x1='220' y1='110' x2='380' y2='110' stroke='#d9d9d9' stroke-width='1'/>
<text x='220' y='128' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='220' y='150' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >낮은 V·낮은 f + 병렬 (뇌의 방식)</text>
<text x='220' y='186' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >아날로그(가): 지수함수를 소자로</text>
<text x='220' y='222' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >event-driven: 활동률 α를</text>
<text x='220' y='237' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' >낮춤</text>
<rect x='400' y='40' width='180' height='230' rx='8' fill='#fff' stroke='#3d6fb4' stroke-width='1.6' />
<text x='410' y='62' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' >③ 정밀도의 값</text>
<text x='410' y='82' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >비트 수만큼 회로·ADC·검증 비용이 든다</text>
<line x1='410' y1='110' x2='570' y2='110' stroke='#d9d9d9' stroke-width='1'/>
<text x='410' y='128' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >뉴로모픽 쪽의 대응</text>
<text x='410' y='150' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >근사 계산(아날로그 가중치)</text>
<text x='410' y='186' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >필요한 만큼만 정밀하게</text>
<text x='410' y='222' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >대신 오차·편차를 감수 (D4)</text>
<text x='300' y='292' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >어느 벽을 줄이는 대신 무엇을 잃는지(정밀도, 프로그램 가능성, 주변회로)는 D3–D5에서 조건별로 따진다.</text>
</svg>
