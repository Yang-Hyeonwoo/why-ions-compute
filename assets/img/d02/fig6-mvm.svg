<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 252' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-c999' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#999'/></marker></defs>
<text x='320' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >행렬–벡터 곱: 행 하나 × 입력 벡터 = 출력 숫자 하나</text>
<text x='60' y='58' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >weight 표 W (2행 2열)</text>
<text x='118' y='80' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >입력 1</text>
<text x='178' y='80' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >입력 2</text>
<text x='60' y='118' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >출력 1 행</text>
<rect x='100' y='92' width='50' height='40' rx='4' fill='#ffe9c7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='125' y='112' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='125' y='127' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >W[1,1]</text>
<rect x='160' y='92' width='50' height='40' rx='4' fill='#ffe9c7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='185' y='112' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >3</text>
<text x='185' y='127' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >W[1,2]</text>
<text x='60' y='164' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >출력 2 행</text>
<rect x='100' y='138' width='50' height='40' rx='4' fill='#d9ecff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='125' y='158' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >2</text>
<text x='125' y='173' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >W[2,1]</text>
<rect x='160' y='138' width='50' height='40' rx='4' fill='#d9ecff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='185' y='158' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >0.5</text>
<text x='185' y='173' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >W[2,2]</text>
<text x='260' y='58' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >입력 벡터 u</text>
<text x='260' y='74' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(샘플 1개)</text>
<rect x='260' y='92' width='50' height='40' rx='4' fill='#f4faf7' stroke='#33cc99' stroke-width='1.2' />
<text x='285' y='112' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >2</text>
<text x='285' y='125' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>u</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<rect x='260' y='138' width='50' height='40' rx='4' fill='#f4faf7' stroke='#33cc99' stroke-width='1.2' />
<text x='285' y='158' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='285' y='171' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='360' y='58' font-size='11' fill='#999' text-anchor='start' font-weight='normal' >계산 (같은 자리끼리 곱해서 더한다)</text>
<rect x='360' y='92' width='250' height='40' rx='4' fill='#ffe9c7' stroke='#d9d9d9' stroke-width='1.2' />
<text x='370' y='117' font-size='12.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>y</tspan><tspan dy='4' font-size='9.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1×2 + 3×1 = 5</tspan></text>
<line x1='315' y1='112' x2='358' y2='112' stroke='#999' stroke-width='1.1' marker-end='url(#arr-c999)'/>
<rect x='360' y='138' width='250' height='40' rx='4' fill='#d9ecff' stroke='#d9d9d9' stroke-width='1.2' />
<text x='370' y='163' font-size='12.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>y</tspan><tspan dy='4' font-size='9.5'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 2×2 + 0.5×1 = 4.5</tspan></text>
<line x1='315' y1='158' x2='358' y2='158' stroke='#999' stroke-width='1.1' marker-end='url(#arr-c999)'/>
<text x='60' y='202' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >읽는 법: 출력 1은 W의 1행(주황)과 u를 자리끼리 곱해 더한 것. 출력 2는 2행(파랑)과 u로 같은 일을 한다.</text>
<text x='60' y='220' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >식에 보이는 기호는 곱셈 4개, + 2개. 0부터 누적해 세면 MAC 4번 = 8 op (그림 8). 행·열이 1000개씩이면 MAC 100만 번.</text>
<text x='60' y='238' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >숫자는 예시이며 코드가 계산했다 (Claude가 그림)</text>
</svg>
