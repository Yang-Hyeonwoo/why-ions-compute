<line x1='80' y1='125.15151515151514' x2='560' y2='125.15151515151514' stroke='#f0f0f0' stroke-width='1'/>
<text x='74' y='129.15151515151513' font-size='10' fill='#999' text-anchor='end' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>2</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<line x1='80' y1='62.72727272727272' x2='560' y2='62.72727272727272' stroke='#f0f0f0' stroke-width='1'/>
<text x='74' y='66.72727272727272' font-size='10' fill='#999' text-anchor='end' font-weight='normal' ><tspan>10</tspan><tspan dy='-6' font-size='8'>3</tspan><tspan dy='6' font-size='1'>​</tspan></text>
<text x='80.0' y='266' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >1</text>
<text x='176.0' y='266' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >4</text>
<text x='272.0' y='266' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >16</text>
