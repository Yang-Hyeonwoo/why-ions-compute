<text x='300' y='20' font-size='12.5' fill='#444' text-anchor='middle' font-weight='bold' >같은 가중치를 몇 번 재사용하나(배치 B)에 따라 MAC 1회당 에너지가 달라진다 (모형 계산)</text>
