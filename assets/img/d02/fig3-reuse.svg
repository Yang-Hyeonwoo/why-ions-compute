<text x='560.0' y='266' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >1024</text>
<text x='320.0' y='284' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >가중치 하나를 재사용하는 횟수 B (입력 개수 = 배치)</text>
<text x='14' y='147.0' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' transform='rotate(-90 14 147.0)'>MAC 1회당 에너지 (pJ, 로그)</text>
<line x1='80' y1='212.416861147406' x2='560' y2='212.416861147406' stroke='#13936b' stroke-width='1.6' stroke-dasharray='5 3'/>
<text x='204.0782000346155' y='226.416861147406' font-size='11' fill='#13936b' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >연산만: 4 pJ (B와 무관)</text>
<polyline points='80.0,55.6 128.0,74.4 176.0,93.2 224.0,112.0 272.0,130.8 320.0,149.6 368.0,168.4 416.0,187.2 464.0,205.9 512.0,224.7 560.0,243.5' fill='none' stroke='#e08a3c' stroke-width='2.2' stroke-linejoin='round'/>
<polyline points='80.0,55.5 128.0,74.2 176.0,92.9 224.0,111.3 272.0,129.5 320.0,147.0 368.0,163.5 416.0,178.2 464.0,190.2 512.0,199.1 560.0,204.9' fill='none' stroke='#444' stroke-width='2.2' stroke-linejoin='round'/>
<text x='132.0' y='66.40601470653687' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >이동(DRAM)만: 1300/B pJ</text>
<text x='398.9050971091868' y='163.19015824123503' font-size='11' fill='#444' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >합계</text>
<line x1='480.52620357995926' y1='44' x2='480.52620357995926' y2='250' stroke='#c8553d' stroke-width='1' stroke-dasharray='3 3'/>
<text x='484.52620357995926' y='58' font-size='10.5' fill='#c8553d' text-anchor='start' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >B ≈ 325에서 이동 = 연산</text>
<text x='300' y='306' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >B = 1(추론 한 건)이면 MAC당 1,304 pJ 중 99.7%가 이동. 배치·캐시 재사용은 이 곡선을 오른쪽으로 민다.</text>
<text x='300' y='324' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >모형 가정: 가중치 1개마다 DRAM 읽기 1회, 입력·부분합은 가까운 곳에. 수치는 그림 2의 Horowitz 값(원문 대조)을 단순화.</text>
</svg>
