<text x='320' y='326' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >연산기에 가까울수록 작고 빠르다: 레지스터 → 캐시 → RAM → SSD 순으로 멀어지며 커지고 느려진다</text>
<text x='320' y='344' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >CPU와 GPU는 둘 다 '계산하는 곳'이고, 둘 다 값은 떨어진 메모리에서 가져온다. 다른 점은 연산기의 수만이 아니라</text>
<text x='320' y='360' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >지휘 방식(코어마다 다른 일 / 수천 개가 같은 일)과 메모리 구성(전용 메모리, 캐시 크기)도 다르다.</text>
<text x='320' y='378' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >별도 카드는 한 예다. 노트북·휴대폰에는 CPU 칩 안에 들어가 RAM을 함께 쓰는 GPU도 많다.</text>
<text x='320' y='394' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >화살표는 기능 모식도이고 실제 배선이 아니다. 크기·위치도 설명용이다 (Claude가 그림)</text>
