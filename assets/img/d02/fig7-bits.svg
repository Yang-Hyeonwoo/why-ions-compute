<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 212' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<text x='300' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >비트: 전압이 높으면 1, 낮으면 0 — 선 4개로 숫자 하나</text>
<rect x='54' y='52' width='72' height='54' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='90' y='74' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >0 V</text>
<text x='90' y='96' font-size='20' fill='#444' text-anchor='middle' font-weight='bold' >0</text>
<text x='90' y='126' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >자리값 8</text>
<line x1='90' y1='106' x2='90' y2='112' stroke='#d9d9d9' stroke-width='1.4'/>
<rect x='174' y='52' width='72' height='54' rx='6' fill='#f4faf7' stroke='#13936b' stroke-width='1.2' />
<text x='210' y='74' font-size='12' fill='#13936b' text-anchor='middle' font-weight='normal' >1 V</text>
<text x='210' y='96' font-size='20' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='210' y='126' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >자리값 4</text>
<line x1='210' y1='106' x2='210' y2='112' stroke='#d9d9d9' stroke-width='1.4'/>
<rect x='294' y='52' width='72' height='54' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='330' y='74' font-size='12' fill='#999' text-anchor='middle' font-weight='normal' >0 V</text>
<text x='330' y='96' font-size='20' fill='#444' text-anchor='middle' font-weight='bold' >0</text>
<text x='330' y='126' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >자리값 2</text>
<line x1='330' y1='106' x2='330' y2='112' stroke='#d9d9d9' stroke-width='1.4'/>
<rect x='414' y='52' width='72' height='54' rx='6' fill='#f4faf7' stroke='#13936b' stroke-width='1.2' />
<text x='450' y='74' font-size='12' fill='#13936b' text-anchor='middle' font-weight='normal' >1 V</text>
<text x='450' y='96' font-size='20' fill='#444' text-anchor='middle' font-weight='bold' >1</text>
<text x='450' y='126' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >자리값 1</text>
<line x1='450' y1='106' x2='450' y2='112' stroke='#d9d9d9' stroke-width='1.4'/>
<text x='300' y='160' font-size='14' fill='#444' text-anchor='middle' font-weight='normal' >0101  =  0×8 + 1×4 + 0×2 + 1×1  =  5</text>
<text x='300' y='184' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >선이 8개면 0–255, 32개면 약 43억 가지. 소수(실수) 하나는 보통 32개(32 bit)로 적는다.</text>
<text x='300' y='200' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >실제 칩의 '높은 전압'은 1 V 안팎이고 공정마다 다르다 (모식도)</text>
</svg>
