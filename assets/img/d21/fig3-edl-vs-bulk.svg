<line x1='311.0' y1='154.0' x2='311.0' y2='214.0' stroke='#999' stroke-width='1' stroke-dasharray='2 3'/>
<text x='61.0' y='260.0' font-size='10.5' fill='#7a5fb0' text-anchor='middle' font-weight='normal' ><tspan>C = ε/λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan></text>
<text x='61.0' y='276.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>판 간격 λ</tspan><tspan dy='2.9' font-size='8.8'>D</tspan><tspan dy='-2.9' font-size='1'>​</tspan></text>
<text x='186.0' y='260.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >R = L/σ</text>
<text x='186.0' y='276.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >길이 L의 전해질</text>
<text x='311.0' y='260.0' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' ><tspan>C = ε/λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan></text>
<text x='311.0' y='276.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>판 간격 λ</tspan><tspan dy='2.9' font-size='8.8'>D</tspan><tspan dy='-2.9' font-size='1'>​</tspan></text>
<text x='186.0' y='300.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >1 cm², 10 mM, L = 1 mm: R ≈ 67 Ω, 계면 하나 C ≈ 23 µF</text>
<text x='4.0' y='66.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(a)</text>
<text x='4.0' y='204.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(b)</text>
<text x='342.0' y='62.0' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >(c)</text>
<text x='372.0' y='62.0' font-size='12' fill='#3d6fb4' text-anchor='start' font-weight='bold' ><tspan>① 계면 충전: τ</tspan><tspan dy='3.6' font-size='9.4'>c</tspan><tspan dy='-3.6' font-size='1'>​</tspan><tspan> ≈ R·C</tspan></text>
<text x='372.0' y='82.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>= (L/σ)·(ε/λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>) = λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>·L/D</tspan></text>
<text x='372.0' y='100.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>10 mM, L = 1 mm, D = 2×10⁻⁹ → τ</tspan><tspan dy='3.1' font-size='8.8'>c</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan> ≈ 1.5 ms</tspan></text>
<text x='372.0' y='118.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >이온 하나: 약 3 nm를 2 µm/s로 → 1.5 ms</text>
<text x='372.0' y='152.0' font-size='12' fill='#e08a3c' text-anchor='start' font-weight='bold' ><tspan>② 덩어리 확산: τ</tspan><tspan dy='3.6' font-size='9.4'>diff</tspan><tspan dy='-3.6' font-size='1'>​</tspan><tspan> ≈ L²/D</tspan></text>
<text x='372.0' y='172.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >셀 전체의 농도를 바꾸려면 이온이 L을 건너야 한다</text>
<text x='372.0' y='190.0' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>같은 조건 → τ</tspan><tspan dy='3.1' font-size='8.8'>diff</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan> ≈ 500 s</tspan></text>
<text x='372.0' y='226.0' font-size='12' fill='#444' text-anchor='start' font-weight='bold' ><tspan>③ 두 시간의 비: τ</tspan><tspan dy='3.6' font-size='9.4'>c</tspan><tspan dy='-3.6' font-size='1'>​</tspan><tspan> / τ</tspan><tspan dy='3.6' font-size='9.4'>diff</tspan><tspan dy='-3.6' font-size='1'>​</tspan><tspan> = λ</tspan><tspan dy='3.6' font-size='9.4'>D</tspan><tspan dy='-3.6' font-size='1'>​</tspan><tspan> / L</tspan></text>
<text x='372.0' y='246.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >= 3.0 nm / 1 mm ≈ 3.0×10⁻⁶</text>
<text x='372.0' y='274.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >L은 R에만 들어간다(길이 2배 → 저항 2배).</text>
<text x='372.0' y='292.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>C는 L과 무관하다: 판 간격이 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>이기 때문.</tspan></text>
<text x='372.0' y='310.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >면적은 R(÷면적)과 C(×면적)에서 지워진다.</text>
<text x='372.0' y='330.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' ><tspan>그래서 L² 대신 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>·L.</tspan></text>
<text x='345.0' y='352.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>선형(작은 전압) 어림. 계면 두 개가 직렬이면 C가 절반이라 τ</tspan><tspan dy='3.0' font-size='8.8'>c</tspan><tspan dy='-3.0' font-size='1'>​</tspan><tspan>도 절반(앞의 수는 생략). (Claude가 계산해 그림, 모식도)</tspan></text>
</svg>
