<text x='186.0' y='144.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' ><tspan>덩어리 전체의 이온이 한꺼번에 조금씩(≈ λ</tspan><tspan dy='3.0' font-size='8.8'>D</tspan><tspan dy='-3.0' font-size='1'>​</tspan><tspan>) 움직인다</tspan></text>
<line x1='56.0' y1='166.0' x2='316.0' y2='166.0' stroke='#444' stroke-width='1.2'/>
<line x1='56.0' y1='160.0' x2='56.0' y2='172.0' stroke='#444' stroke-width='1.2'/>
<line x1='316.0' y1='160.0' x2='316.0' y2='172.0' stroke='#444' stroke-width='1.2'/>
<text x='186.0' y='182.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >셀 길이 L</text>
<text x='186.0' y='200.0' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >같은 셀의 등가회로</text>
<line x1='26.0' y1='230.0' x2='57.0' y2='230.0' stroke='#444' stroke-width='1.4'/>
<line x1='57.0' y1='218.0' x2='57.0' y2='242.0' stroke='#7a5fb0' stroke-width='2.4'/>
