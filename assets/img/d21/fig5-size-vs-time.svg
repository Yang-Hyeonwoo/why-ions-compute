<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 290' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='320.0' y='22.0' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >폴더 device: 크기를 바꿨을 때 시간이 L²만큼 바뀌었나?</text>
<text x='20.0' y='78.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >Zhang 2024 (ACS Nano) 겔 기억 시간</text>
<text x='20.0' y='96.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >L 1.5 → 4.3 mm [p.15029]</text>
<rect x='230.0' y='66.0' width='119.3' height='16.0' rx='3' fill='#cfe3f7' stroke='#3d6fb4' stroke-width='1.2' />
<text x='355.3' y='79.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >L² 비 8.2배 (시간 ∝ L²라면 기대)</text>
<rect x='230.0' y='88.0' width='169.6' height='16.0' rx='3' fill='#fbe3cf' stroke='#e08a3c' stroke-width='1.2' />
<text x='405.6' y='101.0' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >측정 시간 비 20배</text>
<text x='20.0' y='168.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >Dobashi 2022 압전이온 응답 시간</text>
<text x='20.0' y='186.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >두께 0.2 → 1 mm [p.505]</text>
<rect x='230.0' y='156.0' width='182.3' height='16.0' rx='3' fill='#cfe3f7' stroke='#3d6fb4' stroke-width='1.2' />
<text x='418.3' y='169.0' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='normal' >L² 비 25.0배 (시간 ∝ L²라면 기대)</text>
<rect x='230.0' y='178.0' width='289.7' height='16.0' rx='3' fill='#fbe3cf' stroke='#e08a3c' stroke-width='1.2' />
<text x='525.7' y='191.0' font-size='10' fill='#e08a3c' text-anchor='start' font-weight='normal' >측정 시간 비 167배</text>
<line x1='230.0' y1='52.0' x2='230.0' y2='240.0' stroke='#eee' stroke-width='1' stroke-dasharray='3 3'/>
<text x='230.0' y='252.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >1배</text>
<line x1='360.4' y1='52.0' x2='360.4' y2='240.0' stroke='#eee' stroke-width='1' stroke-dasharray='3 3'/>
<text x='360.4' y='252.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >10배</text>
<line x1='490.8' y1='52.0' x2='490.8' y2='240.0' stroke='#eee' stroke-width='1' stroke-dasharray='3 3'/>
<text x='490.8' y='252.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >100배</text>
<text x='320.0' y='272.0' font-size='10.3' fill='#444' text-anchor='middle' font-weight='normal' >두 경우 모두 시간이 크기 비의 제곱보다 더 크게 바뀌었다: 크기가 중요하지만, 크기 하나로 다 설명되지는 않는다.</text>
<text x='320.0' y='288.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >막대 길이는 로그 눈금. 숫자는 원문 보고값으로 코드가 비를 계산했다. (Claude가 그림)</text>
