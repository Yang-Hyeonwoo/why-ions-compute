<text x='470.0' y='124.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>가 원자 크기(~0.3 nm)에</tspan></text>
<text x='470.0' y='142.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >가까워지면 이 식은 맞지 않는다:</text>
<text x='470.0' y='160.0' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >진한 염, 이온액체·이온겔</text>
