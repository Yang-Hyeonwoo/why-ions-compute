<text x='470.0' y='212.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >유전율 ε가 작은 매질(고분자)은</text>
<text x='470.0' y='230.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>같은 농도에서 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>가 더 짧다</tspan></text>
