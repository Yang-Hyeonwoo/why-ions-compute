<text x='40.0' y='294.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >L이 10배 → τ 100배.  D가 10배 → τ 1/10.  표 안에서 L은 10⁵배(10 nm → 1 mm), D는 10³배 범위다.</text>
<text x='40.0' y='312.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >D 범위: 물·하이드로겔 10⁻¹⁰–10⁻⁸ [Wang 2025 (Chem. Soc. Rev.), p.315]; 10⁻¹²은 무용매 고분자 쪽 예시값.</text>
<text x='40.0' y='328.0' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >앞에 붙는 수(1/2, 1/4, 1/π² 등)는 기하에 따라 다르며 여기서는 생략했다(자릿수 어림).</text>
