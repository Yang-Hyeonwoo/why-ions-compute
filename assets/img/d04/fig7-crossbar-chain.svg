<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 470' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >crossbar의 생김새와 신호의 길: 숫자 → 전압 → 전류 → 숫자 (그림 1의 예제, 모식도)</text>
<text x='130' y='46' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>입력 u</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 2</tspan></text>
<rect x='104' y='54' width='52' height='24' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='130' y='70' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >DAC</text>
<line x1='130' y1='78' x2='130' y2='285' stroke='#3d6fb4' stroke-width='2.2'/>
<text x='136' y='98' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.2 V</tspan></text>
<text x='270' y='46' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>입력 u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1</tspan></text>
<rect x='244' y='54' width='52' height='24' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='270' y='70' font-size='10.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >DAC</text>
<line x1='270' y1='78' x2='270' y2='285' stroke='#3d6fb4' stroke-width='2.2'/>
<text x='276' y='98' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>V</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.1 V</tspan></text>
<text x='4' y='46' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(a)</text>
<text x='26' y='64' font-size='10' fill='#3d6fb4' text-anchor='start' font-weight='bold' >① 숫자 → 전압</text>
<text x='26' y='78' font-size='9' fill='#999' text-anchor='start' font-weight='normal' >(1 → 0.1 V)</text>
<text x='96' y='297' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >column = 입력선(아래층)</text>
<line x1='60' y1='175' x2='440' y2='175' stroke='#e08a3c' stroke-width='2.4'/>
<text x='60' y='167' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >row 1</text>
<rect x='113' y='162' width='34' height='26' rx='5' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='130' y='174' font-size='9.5' fill='#444' text-anchor='middle' font-weight='bold' >1 µS</text>
<text x='130' y='184' font-size='8.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>11</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<line x1='150' y1='157' x2='192' y2='157' stroke='#13936b' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='171' y='152' font-size='9' fill='#13936b' text-anchor='middle' font-weight='normal' >0.2 µA</text>
<rect x='253' y='162' width='34' height='26' rx='5' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='270' y='174' font-size='9.5' fill='#444' text-anchor='middle' font-weight='bold' >3 µS</text>
<text x='270' y='184' font-size='8.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>12</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<line x1='290' y1='157' x2='332' y2='157' stroke='#13936b' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='311' y='152' font-size='9' fill='#13936b' text-anchor='middle' font-weight='normal' >0.3 µA</text>
<line x1='60' y1='255' x2='440' y2='255' stroke='#e08a3c' stroke-width='2.4'/>
<text x='60' y='247' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >row 2</text>
<rect x='113' y='242' width='34' height='26' rx='5' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='130' y='254' font-size='9.5' fill='#444' text-anchor='middle' font-weight='bold' >2 µS</text>
<text x='130' y='264' font-size='8.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>21</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<line x1='150' y1='237' x2='192' y2='237' stroke='#13936b' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='171' y='232' font-size='9' fill='#13936b' text-anchor='middle' font-weight='normal' >0.4 µA</text>
<rect x='253' y='242' width='34' height='26' rx='5' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='270' y='254' font-size='9.5' fill='#444' text-anchor='middle' font-weight='bold' >0.5 µS</text>
<text x='270' y='264' font-size='8.5' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>22</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<line x1='290' y1='237' x2='332' y2='237' stroke='#13936b' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='311' y='232' font-size='9' fill='#13936b' text-anchor='middle' font-weight='normal' >0.05 µA</text>
<text x='26' y='140' font-size='10' fill='#13936b' text-anchor='start' font-weight='bold' >② 교차점마다 Ohm:</text>
<text x='26' y='154' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >I = G × V</text>
<text x='60' y='319' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >row = 출력선(위층). device는 두 선이 겹치는 자리에 끼어 있다.</text>
<text x='395' y='191' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >합 0.50 µA</text>
<path d='M440,159 L476,175 L440,191 Z' fill='#fff' stroke='#444' stroke-width='1.4'/>
<text x='452' y='179' font-size='8' fill='#444' text-anchor='middle' font-weight='normal' >TIA</text>
<line x1='476' y1='175' x2='500' y2='175' stroke='#444' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='488' y='169' font-size='9' fill='#444' text-anchor='middle' font-weight='normal' >0.50 V</text>
<rect x='502' y='163' width='44' height='24' rx='4' fill='#fdf0ee' stroke='#c8553d' stroke-width='1.2' />
<text x='524' y='179' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >ADC</text>
<line x1='546' y1='175' x2='566' y2='175' stroke='#444' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='570' y='179' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >50</text>
<text x='596' y='179' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>→ y</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 5</tspan></text>
<text x='395' y='271' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >합 0.45 µA</text>
<path d='M440,239 L476,255 L440,271 Z' fill='#fff' stroke='#444' stroke-width='1.4'/>
<text x='452' y='259' font-size='8' fill='#444' text-anchor='middle' font-weight='normal' >TIA</text>
<line x1='476' y1='255' x2='500' y2='255' stroke='#444' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='488' y='249' font-size='9' fill='#444' text-anchor='middle' font-weight='normal' >0.45 V</text>
<rect x='502' y='243' width='44' height='24' rx='4' fill='#fdf0ee' stroke='#c8553d' stroke-width='1.2' />
<text x='524' y='259' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >ADC</text>
<line x1='546' y1='255' x2='566' y2='255' stroke='#444' stroke-width='1.3' marker-end='url(#arr)'/>
<text x='570' y='259' font-size='12' fill='#444' text-anchor='start' font-weight='bold' >45</text>
<text x='596' y='259' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>→ y</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 4.5</tspan></text>
<text x='395' y='130' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >③ row에서 합쳐짐</text>
<text x='395' y='144' font-size='9' fill='#e08a3c' text-anchor='middle' font-weight='normal' >(Kirchhoff)</text>
<text x='472' y='104' font-size='10' fill='#444' text-anchor='middle' font-weight='bold' >④ TIA</text>
<text x='472' y='118' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >0 V로 유지,</text>
<text x='472' y='130' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >전류 → 전압</text>
<text x='472' y='142' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>R</tspan><tspan dy='3' font-size='7'>f</tspan><tspan dy='-3' font-size='1'>​</tspan><tspan> = 1 MΩ</tspan></text>
<text x='560' y='104' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >⑤ ADC</text>
<text x='560' y='118' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >전압 → 숫자</text>
<text x='560' y='130' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >8 bit, 한 칸 10 mV</text>
<text x='640' y='118' font-size='9.5' fill='#13936b' text-anchor='middle' font-weight='bold' >⑥ 눈금 되돌리기</text>
<text x='640' y='130' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >(디지털 계산)</text>
<rect x='20' y='340' width='300' height='118' rx='6' fill='#fafafa' stroke='#d9d9d9' stroke-width='1.2' />
<text x='30' y='358' font-size='10.5' fill='#222' text-anchor='start' font-weight='bold' >(b) 교차점 하나를 옆에서 본 모습 (단면)</text>
<rect x='50' y='374' width='200' height='10' rx='1' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<text x='256' y='383' font-size='9' fill='#e08a3c' text-anchor='start' font-weight='normal' >row</text>
<text x='256' y='395' font-size='8.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >(0 V 유지)</text>
<rect x='73' y='384' width='44' height='26' rx='2' fill='#e9e3f5' stroke='#7a68a8' stroke-width='1.2' />
<text x='95' y='401' font-size='8.5' fill='#5a4a8a' text-anchor='middle' font-weight='normal' >device 층</text>
<rect x='73' y='410' width='44' height='14' rx='1' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='95' y='438' font-size='8.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >column 1 단면</text>
<line x1='65' y1='420' x2='65' y2='388' stroke='#c8553d' stroke-width='1.4' marker-end='url(#arr)'/>
<rect x='178' y='384' width='44' height='26' rx='2' fill='#e9e3f5' stroke='#7a68a8' stroke-width='1.2' />
<text x='200' y='401' font-size='8.5' fill='#5a4a8a' text-anchor='middle' font-weight='normal' >device 층</text>
<rect x='178' y='410' width='44' height='14' rx='1' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='200' y='438' font-size='8.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >column 2 단면</text>
<line x1='170' y1='420' x2='170' y2='388' stroke='#c8553d' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='30' y='452' font-size='8.5' fill='#c8553d' text-anchor='start' font-weight='normal' >빨간 화살표: 관습적 전류 방향(높은 전위 → 낮은 전위)</text>
<text x='345' y='354' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >① DAC: 숫자를 그에 비례하는 전압으로 (입력 1 → 0.1 V)</text>
<text x='345' y='372' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >② 교차점: Ohm, 전류 = conductance × (column 전압 − 0 V)</text>
<text x='345' y='390' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >③ row: 흘러든 전류가 한 선에서 더해짐(Kirchhoff)</text>
<text x='345' y='408' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >④ TIA: row 전위를 0 V로 유지하며 전류를 전압으로</text>
<text x='345' y='426' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' >⑤ ADC: 전압을 가장 가까운 단계의 숫자로</text>
<text x='345' y='444' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >⑥ 출력 1 = 0.1 V × 1 µS × 1 MΩ = 0.1 V = ADC 10칸</text>
<text x='345' y='464' font-size='9' fill='#999' text-anchor='start' font-weight='normal' >눈금·저항 값은 계산이 맞아떨어지게 고른 가정값이다.</text>
</svg>
