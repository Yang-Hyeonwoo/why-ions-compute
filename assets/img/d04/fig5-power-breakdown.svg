<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 188' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='12' fill='#444' text-anchor='middle' font-weight='bold' >crossbar 시스템에서 전력은 어디로 가나 (모식도: 비율은 예시, 70%는 Roadmap p.8130의 상한)</text>
<rect x='40' y='60' width='156.0' height='40' rx='0' fill='#13936b' stroke='none' stroke-width='1.2' />
<text x='118.0' y='85' font-size='11' fill='#fff' text-anchor='middle' font-weight='bold' >30%</text>
<text x='118.0' y='118' font-size='9.5' fill='#13936b' text-anchor='middle' font-weight='normal' >배열(소자+배선)</text>
<rect x='196.0' y='60' width='234.0' height='40' rx='0' fill='#c8553d' stroke='none' stroke-width='1.2' />
<text x='313.0' y='85' font-size='11' fill='#fff' text-anchor='middle' font-weight='bold' >45%</text>
<text x='313.0' y='118' font-size='9.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >ADC/DAC</text>
<rect x='430.0' y='60' width='78.0' height='40' rx='0' fill='#e08a3c' stroke='none' stroke-width='1.2' />
<text x='469.0' y='85' font-size='11' fill='#fff' text-anchor='middle' font-weight='bold' >15%</text>
<text x='469.0' y='118' font-size='9.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >드라이버·제어</text>
<rect x='508.0' y='60' width='52.0' height='40' rx='0' fill='#3d6fb4' stroke='none' stroke-width='1.2' />
<text x='534.0' y='85' font-size='11' fill='#fff' text-anchor='middle' font-weight='bold' >10%</text>
<text x='534.0' y='132' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >배열 간 전송</text>
<text x='300' y='156' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >이 예시에서 주변회로(ADC/DAC + 드라이버·제어 + 전송) = 70%. Roadmap은 주변회로가 '최대 70%'에 이를 수 있다고 쓴다.</text>
<text x='300' y='174' font-size='10.5' fill='#999' text-anchor='middle' font-weight='normal' >소자 하나의 fJ는 초록 막대의 일부일 뿐이다. 비율은 시스템 규모·정밀도·배열 크기에 따라 크게 달라진다 [해석].</text>
</svg>
