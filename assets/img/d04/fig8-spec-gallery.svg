<text x='350' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >시냅스 소자의 사양: 곡선이 어떻게 생겼고, 학습 규칙은 왜 신경 쓰나 (모식도)</text>
<rect x='6' y='38' width='344' height='142' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='16' y='56' font-size='11' fill='#444' text-anchor='start' font-weight='bold' >학습 규칙이 소자에 주는 명령</text>
