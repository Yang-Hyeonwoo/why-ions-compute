<text x='156' y='93' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >'조금 올려(+)·내려(−)'를 계산</text>
<text x='156' y='108' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >→ 소자에는 강화(+)·억제(−)</text>
<text x='156' y='123' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >   펄스 몇 번으로 전달된다.</text>
<text x='156' y='138' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >아래 일곱 칸은 이 전달이</text>
<text x='156' y='153' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >얼마나 정확한지를 본다.</text>
