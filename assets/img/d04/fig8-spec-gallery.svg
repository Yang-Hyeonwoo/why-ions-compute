<text x='506' y='78' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >구별되는 전도도 단계의 수.</text>
<text x='506' y='93' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >봉우리가 겹치지 않아야</text>
<text x='506' y='108' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >한 단계로 센다.</text>
<text x='506' y='123' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >학습: 한 단계보다 작은</text>
<text x='506' y='138' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='normal' >'조금'은 반영되지 않는다.</text>
