<text x='134' y='440.88235294117646' font-size='9' fill='#7a4fa3' text-anchor='end' font-weight='bold' >−0.25</text>
<text x='156' y='374' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >올림·내림 펄스의 ΔG 크기가</text>
<text x='156' y='389' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >같은가 (예: +0.1, −0.15).</text>
<text x='156' y='404' font-size='9.5' fill='#7a4fa3' text-anchor='start' font-weight='normal' >학습: +와 −를 같은 수만큼</text>
<text x='156' y='419' font-size='9.5' fill='#7a4fa3' text-anchor='start' font-weight='normal' >받아도 제자리로 오지 않고</text>
<text x='156' y='434' font-size='9.5' fill='#7a4fa3' text-anchor='start' font-weight='normal' >한쪽으로 쏠린다.</text>
<rect x='356' y='334' width='344' height='142' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
