<text x='506' y='374' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >써 둔 G가 시간이 지나도</text>
<text x='506' y='389' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >남는가. 필요한 기간은 과제가</text>
<text x='506' y='404' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >정한다 (5구간).</text>
<text x='506' y='419' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >학습: 다음 갱신·사용 전에</text>
<text x='506' y='434' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >배운 값이 흐려진다.</text>
<rect x='6' y='482' width='344' height='142' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='16' y='500' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' >⑥ 내구성 (endurance)</text>
