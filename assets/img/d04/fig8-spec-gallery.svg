<text x='142' y='272' font-size='9' fill='#13936b' text-anchor='end' font-weight='normal' >I = G·V</text>
<text x='90' y='222' font-size='9' fill='#c8553d' text-anchor='end' font-weight='normal' >휘어짐</text>
<text x='156' y='226' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >같은 G에서 전류가 전압에</text>
<text x='156' y='241' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >비례하나 (작은 읽기 전압).</text>
<text x='156' y='256' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >곱셈 I = G·V가 틀리면 출력이</text>
<text x='156' y='271' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >틀리고, 그 출력으로 계산한</text>
<text x='156' y='286' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >갱신 명령도 틀린다.</text>
<rect x='356' y='186' width='344' height='142' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='366' y='204' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >③ 갱신 선형성 (update linearity)</text>
<line x1='378' y1='300' x2='494' y2='300' stroke='#999' stroke-width='1.1'/>
<line x1='378' y1='300' x2='378' y2='216' stroke='#999' stroke-width='1.1'/>
