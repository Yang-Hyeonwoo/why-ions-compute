<text x='492' y='270' font-size='9' fill='#999' text-anchor='end' font-weight='normal' >이상</text>
<text x='422' y='222' font-size='9' fill='#13936b' text-anchor='start' font-weight='normal' >실제: 포화</text>
<text x='506' y='226' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >펄스 하나마다 ΔG가 같은가.</text>
<text x='506' y='241' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >실제는 위로 갈수록 덜 변한다.</text>
<text x='506' y='256' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >학습: 같은 '+1'이 지금 G가</text>
<text x='506' y='271' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >어디냐에 따라 다른 양이 된다.</text>
<rect x='6' y='334' width='344' height='142' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='16' y='352' font-size='11' fill='#7a4fa3' text-anchor='start' font-weight='bold' >④ 대칭성 (symmetry)</text>
