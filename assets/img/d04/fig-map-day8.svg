<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 368' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='22' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >오늘 나오는 개념은 한 회로의 부품이 아니라, 서로 다른 장면이다</text>
<rect x='10' y='44' width='222' height='106' rx='6' fill='#fbfbfb' stroke='#3d6fb4' stroke-width='1.4' />
<text x='20' y='62' font-size='11' fill='#3d6fb4' text-anchor='start' font-weight='bold' >① crossbar read (Day 7)</text>
<text x='20' y='78' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >입력 voltage × device conductance</text>
<text x='20' y='92' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >→ row current (곱하고 더하기)</text>
<text x='20' y='106' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >필요한 성질: read linearity,</text>
<text x='20' y='120' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >settling time</text>
<line x1='232' y1='70' x2='286' y2='70' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<line x1='232' y1='124' x2='286' y2='124' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<text x='260' y='95' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >둘 중</text>
<text x='260' y='106' font-size='9' fill='#999' text-anchor='middle' font-weight='normal' >하나</text>
<rect x='290' y='44' width='400' height='50' rx='6' fill='#fbfbfb' stroke='#e08a3c' stroke-width='1.4' />
<text x='300' y='62' font-size='11' fill='#e08a3c' text-anchor='start' font-weight='bold' >② ADC: row current → 숫자</text>
<text x='300' y='78' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >필요: 다음 단계가 digital(컴퓨터)일 때. 다음이 analog 회로면 없어도 된다.</text>
<rect x='290' y='100' width='400' height='50' rx='6' fill='#fbfbfb' stroke='#13936b' stroke-width='1.4' />
<text x='300' y='118' font-size='11' fill='#13936b' text-anchor='start' font-weight='bold' >③ LIF neuron: row current → spike (구간 3)</text>
<text x='300' y='134' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >필요: spiking neural network(SNN)를 만들 때만. 그 밖의 장면에는 없다.</text>
<rect x='10' y='172' width='680' height='52' rx='6' fill='#fbfbfb' stroke='#c8553d' stroke-width='1.4' />
<text x='20' y='190' font-size='11' fill='#c8553d' text-anchor='start' font-weight='bold' >④ write: device의 conductance 바꾸기 (구간 4–5)</text>
<text x='20' y='206' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >weight를 한 번 써 둘 때(inference-only) 또는 매 단계 고칠 때(on-chip training). ①의 계산(read) 중에는 하지 않는다.</text>
<line x1='120' y1='172' x2='120' y2='152' stroke='#c8553d' stroke-width='1.4' stroke-dasharray='4 3' marker-end='url(#arr)'/>
<text x='126' y='166' font-size='9' fill='#c8553d' text-anchor='start' font-weight='normal' >weight를 정함</text>
<rect x='10' y='246' width='680' height='90' rx='6' fill='#fbfbfb' stroke='#7a4fa3' stroke-width='1.4' />
<text x='20' y='264' font-size='11' fill='#7a4fa3' text-anchor='start' font-weight='bold' >⑤ physical reservoir computing (Day 11–18): 또 다른 장면</text>
<text x='20' y='280' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >입력 신호 → 소재의 동역학(쌓이고 천천히 잊음, nonlinear 반응) → 소재의 state를 read → readout만 training.</text>
<text x='20' y='294' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >①의 weight 저장도, ④의 write도, ③의 LIF도 필수가 아니다.</text>
<text x='20' y='308' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >대신 소재에는 '적당히 짧은 retention'과 'nonlinear 반응'이 필요하다(구간 5의 셋째 열).</text>
<text x='350' y='358' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >한 Day에 같이 나오지만 한 회로에 모두 들어가는 것이 아니다. 장면마다 무엇이 필요한지만 기억하면 된다.</text>
</svg>
