<text x='350' y='286' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >성립 조건: 읽기 전압이 소자 양단에 그대로 걸리고 가로줄이 0 V로 유지될 것. 배선의 RC와 증폭기의 반응 속도는 무시한 가장 단순한 모형.</text>
