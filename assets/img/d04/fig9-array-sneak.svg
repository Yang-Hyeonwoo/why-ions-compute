<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 326' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<defs><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c8553d'/></marker></defs>
<text x='350' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >격자로 묶는 이유와 그 대가 (그림 1·2와 같은 방향: column = 입력, row = 출력, 모식도)</text>
<rect x='6' y='32' width='250' height='246' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='14' y='54' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(a)</text>
<text x='44' y='54' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >선을 나눠 쓰면 선이 준다</text>
<line x1='70' y1='72' x2='70' y2='150' stroke='#3d6fb4' stroke-width='2'/>
<line x1='120' y1='72' x2='120' y2='150' stroke='#3d6fb4' stroke-width='2'/>
<line x1='48' y1='92' x2='142' y2='92' stroke='#e08a3c' stroke-width='2'/>
<line x1='48' y1='132' x2='142' y2='132' stroke='#e08a3c' stroke-width='2'/>
<rect x='63' y='87' width='14' height='10' rx='2' fill='#fff' stroke='#444' stroke-width='1.2' />
<rect x='63' y='127' width='14' height='10' rx='2' fill='#fff' stroke='#444' stroke-width='1.2' />
<rect x='113' y='87' width='14' height='10' rx='2' fill='#fff' stroke='#444' stroke-width='1.2' />
<rect x='113' y='127' width='14' height='10' rx='2' fill='#fff' stroke='#444' stroke-width='1.2' />
<text x='152' y='100' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >device 4개</text>
<text x='152' y='115' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >선 4개</text>
<text x='152' y='130' font-size='9' fill='#999' text-anchor='start' font-weight='normal' >(세로 2 + 가로 2)</text>
<text x='18' y='178' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >device마다 선 2개를 따로 뽑으면</text>
<text x='26' y='194' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >2×2: device 4개 → 선 8개</text>
<text x='26' y='210' font-size='10' fill='#c8553d' text-anchor='start' font-weight='normal' >100×100: device 10,000개 → 선 20,000개</text>
<text x='18' y='234' font-size='10' fill='#444' text-anchor='start' font-weight='bold' >crossbar로 선을 나눠 쓰면</text>
<text x='26' y='250' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >2×2: 선 4개 (세로 2 + 가로 2)</text>
<text x='26' y='266' font-size='10' fill='#13936b' text-anchor='start' font-weight='normal' >100×100: 선 200개 (세로 100 + 가로 100)</text>
<text x='268' y='54' font-size='13.5' fill='#222' text-anchor='start' font-weight='bold' >(b)</text>
<text x='298' y='54' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' ><tspan>칸 하나(G</tspan><tspan dy='4' font-size='8'>22</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>)만 읽을 때 새는 길</tspan></text>
<line x1='340' y1='84' x2='340' y2='258' stroke='#9bb3d6' stroke-width='1.5'/>
<text x='340' y='272' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >column 1</text>
<line x1='410' y1='84' x2='410' y2='258' stroke='#3d6fb4' stroke-width='2.2'/>
<text x='410' y='272' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >column 2</text>
<line x1='480' y1='84' x2='480' y2='258' stroke='#9bb3d6' stroke-width='1.5'/>
<text x='480' y='272' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >column 3</text>
<line x1='306' y1='112' x2='520' y2='112' stroke='#efc49c' stroke-width='1.5'/>
<text x='302' y='116' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >row 1</text>
<line x1='306' y1='172' x2='520' y2='172' stroke='#e08a3c' stroke-width='2.2'/>
<text x='302' y='176' font-size='9.5' fill='#e08a3c' text-anchor='end' font-weight='normal' >row 2</text>
<line x1='306' y1='232' x2='520' y2='232' stroke='#efc49c' stroke-width='1.5'/>
<text x='302' y='236' font-size='9.5' fill='#999' text-anchor='end' font-weight='normal' >row 3</text>
<text x='410' y='76' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >읽기 전압 V</text>
<text x='524' y='168' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >여기서</text>
<text x='524' y='181' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >I를 잰다</text>
<polyline points='403.0,86.0 403.0,105.0 333.0,105.0 333.0,179.0 508.0,179.0' fill='none' stroke='#c8553d' stroke-width='2' stroke-dasharray='6 3' marker-end='url(#arrR)'/>
<polyline points='417.0,86.0 417.0,165.0 508.0,165.0' fill='none' stroke='#13936b' stroke-width='2.2' marker-end='url(#arr)'/>
<rect x='330' y='105' width='20' height='14' rx='2' fill='#fff' stroke='#c8553d' stroke-width='1.8' />
<text x='352' y='130' font-size='9' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>11</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<rect x='400' y='105' width='20' height='14' rx='2' fill='#fff' stroke='#c8553d' stroke-width='1.8' />
<text x='422' y='130' font-size='9' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>12</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<rect x='470' y='105' width='20' height='14' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.8' />
<rect x='330' y='165' width='20' height='14' rx='2' fill='#fff' stroke='#c8553d' stroke-width='1.8' />
<text x='352' y='190' font-size='9' fill='#c8553d' text-anchor='start' font-weight='bold' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>21</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<rect x='400' y='165' width='20' height='14' rx='2' fill='#fff' stroke='#13936b' stroke-width='1.8' />
<text x='422' y='190' font-size='9' fill='#13936b' text-anchor='start' font-weight='bold' ><tspan>G</tspan><tspan dy='3' font-size='7.5'>22</tspan><tspan dy='-3' font-size='1'>​</tspan></text>
<rect x='470' y='165' width='20' height='14' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.8' />
<rect x='330' y='225' width='20' height='14' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.8' />
<rect x='400' y='225' width='20' height='14' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.8' />
<rect x='470' y='225' width='20' height='14' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.8' />
<text x='572' y='92' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='bold' >초록 실선: 읽으려는 길</text>
<text x='572' y='107' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>column 2 → G</tspan><tspan dy='3' font-size='7'>22</tspan><tspan dy='-3' font-size='1'>​</tspan><tspan> → row 2</tspan></text>
<text x='572' y='137' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='bold' >빨간 점선: sneak path</text>
<text x='572' y='152' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>column 2 → G</tspan><tspan dy='3' font-size='7'>12</tspan><tspan dy='-3' font-size='1'>​</tspan><tspan> → row 1</tspan></text>
<text x='572' y='167' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>→ G</tspan><tspan dy='3' font-size='7'>11</tspan><tspan dy='-3' font-size='1'>​</tspan><tspan> → column 1</tspan></text>
<text x='572' y='182' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='normal' ><tspan>→ G</tspan><tspan dy='3' font-size='7'>21</tspan><tspan dy='-3' font-size='1'>​</tspan><tspan> → row 2</tspan></text>
<text x='572' y='212' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >device 셋을 거친 전류가</text>
<text x='572' y='227' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >읽는 전류에 섞인다.</text>
<text x='572' y='242' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >나머지 선은 떠 있다</text>
<text x='572' y='257' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >(아무 데도 잇지 않음).</text>
<text x='350' y='302' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >(b)는 칸 하나만 읽거나 쓰는 상황이다. 모든 column에 입력 전압을 걸고 모든 row를 0 V로 유지하는 행렬–벡터 곱에서는</text>
<text x='350' y='316' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >선마다 전위가 정해져 있어 이 길이 따로 생기지 않는다(IR drop으로 전위가 어긋난 만큼만 섞인다). 막는 방법(1T1R)은 기초 4.</text>
</svg>
