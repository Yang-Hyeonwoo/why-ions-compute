<text x='502.5' y='216' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >억제 펄스 →</text>
<text x='445.0' y='234' font-size='10.5' fill='#e08a3c' text-anchor='middle' font-weight='normal' >첫 펄스 ΔG = 0.128, 20번째 ΔG = 0.012 (약 11배, 전체를 1로 둘 때)</text>
<text x='445.0' y='250' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >→ '조금 올려'가 위치에 따라 다른 양이 되어 학습이 흔들린다</text>
<text x='300' y='282' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >추론 전용(학습된 가중치를 배치)에는 왼쪽만, 소자 내 학습에는 둘 다 필요하다. 모형 곡선이며 특정 소자의 측정값이 아니다.</text>
