<text x='519.75' y='141.2' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='normal' >실제: 포화·비대칭</text>
<line x1='445.0' y1='50' x2='445.0' y2='200' stroke='#999' stroke-width='1' stroke-dasharray='3 3'/>
