<text x='203.33333333333334' y='130.0' font-size='10' fill='#c8553d' text-anchor='end' font-weight='normal' >I = G·V·(1+aV²)</text>
<text x='165.0' y='216' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >읽기 전압 V (0–0.3 V)</text>
<text x='165.0' y='234' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >V=0.3 V에서 곱셈 오차 180%, V=0.1 V면 20%</text>
<text x='165.0' y='250' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >→ 작은 읽기 전압(의사 선형 영역)을 쓰는 이유</text>
<rect x='330' y='50' width='230' height='150' rx='0' fill='#fff' stroke='#d9d9d9' stroke-width='1.2' />
