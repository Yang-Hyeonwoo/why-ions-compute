<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 372' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='350' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >같은 2×2 예제를 a. 표로 계산하고, b. 전선과 소자로 계산한다 (D2 3구간의 예제)</text>
<rect x='10' y='34' width='300' height='282' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='22' y='54' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >a. 표로 (D2 3-2의 손계산)</text>
<text x='95.0' y='74' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>u</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 2</tspan></text>
<text x='95.0' y='88' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >열 1</text>
<text x='145.0' y='74' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1</tspan></text>
<text x='145.0' y='88' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >열 2</text>
<text x='62' y='118' font-size='9.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >행 1</text>
<rect x='73' y='99' width='44' height='28' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='95.0' y='118' font-size='12.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >1</text>
<rect x='123' y='99' width='44' height='28' rx='4' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='145.0' y='118' font-size='12.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >3</text>
<text x='62' y='152' font-size='9.5' fill='#7a4fa3' text-anchor='end' font-weight='bold' >행 2</text>
<rect x='73' y='133' width='44' height='28' rx='4' fill='#fff' stroke='#7a4fa3' stroke-width='1.6' />
<text x='95.0' y='152' font-size='12.5' fill='#7a4fa3' text-anchor='middle' font-weight='bold' >2</text>
<rect x='123' y='133' width='44' height='28' rx='4' fill='#fff' stroke='#7a4fa3' stroke-width='1.6' />
<text x='145.0' y='152' font-size='12.5' fill='#7a4fa3' text-anchor='middle' font-weight='bold' >0.5</text>
<text x='120' y='180' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >가중치 행렬 W (행 = 출력, 열 = 입력)</text>
<text x='22' y='210' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='8.5'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 1×2 + 3×1 = 2 + 3 = 5</tspan></text>
<text x='22' y='236' font-size='11.5' fill='#7a4fa3' text-anchor='start' font-weight='bold' ><tspan>y</tspan><tspan dy='4' font-size='8.5'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 2×2 + 0.5×1 = 4 + 0.5 = 4.5</tspan></text>
<text x='22' y='268' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >행 하나와 입력 벡터를 같은 자리끼리 곱해 더하면</text>
<text x='22' y='282' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >출력 하나. 곱셈 4번, 출력 2개.</text>
<text x='22' y='302' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>예: W[1,2] = 3은 입력 u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>가 출력 y</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>에 곱해지는 가중치</tspan></text>
<rect x='320' y='34' width='370' height='282' rx='6' fill='#fbfbfb' stroke='#d9d9d9' stroke-width='1.2' />
<text x='332' y='54' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >b. 전선과 소자로 (crossbar)</text>
<text x='430' y='74' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >세로줄 1</text>
<text x='430' y='89' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.2 V</tspan></text>
<line x1='430' y1='95' x2='430' y2='262' stroke='#3d6fb4' stroke-width='2.2'/>
<text x='570' y='74' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >세로줄 2</text>
<text x='570' y='89' font-size='11' fill='#3d6fb4' text-anchor='middle' font-weight='bold' ><tspan>V</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 0.1 V</tspan></text>
<line x1='570' y1='95' x2='570' y2='262' stroke='#3d6fb4' stroke-width='2.2'/>
<line x1='345' y1='140' x2='675' y2='140' stroke='#e08a3c' stroke-width='2.4'/>
<text x='345' y='132' font-size='9.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >가로줄 1</text>
<rect x='408' y='127' width='44' height='26' rx='5' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='430' y='144' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >1 µS</text>
<text x='456' y='120' font-size='9' fill='#13936b' text-anchor='start' font-weight='bold' >1×0.2 = 0.2 µA</text>
<line x1='456' y1='126' x2='492' y2='126' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='548' y='127' width='44' height='26' rx='5' fill='#fff' stroke='#e08a3c' stroke-width='1.6' />
<text x='570' y='144' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >3 µS</text>
<text x='596' y='120' font-size='9' fill='#13936b' text-anchor='start' font-weight='bold' >3×0.1 = 0.3 µA</text>
<line x1='596' y1='126' x2='632' y2='126' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='675' y='158' font-size='10.5' fill='#e08a3c' text-anchor='end' font-weight='bold' >합 0.5 µA</text>
<line x1='345' y1='228' x2='675' y2='228' stroke='#7a4fa3' stroke-width='2.4'/>
<text x='345' y='220' font-size='9.5' fill='#7a4fa3' text-anchor='start' font-weight='bold' >가로줄 2</text>
<rect x='408' y='215' width='44' height='26' rx='5' fill='#fff' stroke='#7a4fa3' stroke-width='1.6' />
<text x='430' y='232' font-size='10' fill='#7a4fa3' text-anchor='middle' font-weight='bold' >2 µS</text>
<text x='456' y='208' font-size='9' fill='#13936b' text-anchor='start' font-weight='bold' >2×0.2 = 0.4 µA</text>
<line x1='456' y1='214' x2='492' y2='214' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<rect x='548' y='215' width='44' height='26' rx='5' fill='#fff' stroke='#7a4fa3' stroke-width='1.6' />
<text x='570' y='232' font-size='10' fill='#7a4fa3' text-anchor='middle' font-weight='bold' >0.5 µS</text>
<text x='596' y='208' font-size='9' fill='#13936b' text-anchor='start' font-weight='bold' >0.5×0.1 = 0.05 µA</text>
<line x1='596' y1='214' x2='632' y2='214' stroke='#13936b' stroke-width='1.2' marker-end='url(#arr)'/>
<text x='675' y='246' font-size='10.5' fill='#7a4fa3' text-anchor='end' font-weight='bold' >합 0.45 µA</text>
<text x='345' y='276' font-size='9.5' fill='#13936b' text-anchor='start' font-weight='normal' >초록: 소자마다 Ohm, 전류 = 전도도 × 전압 (µS × V = µA)</text>
<text x='345' y='290' font-size='9.5' fill='#444' text-anchor='start' font-weight='normal' >합: 한 가로줄로 흘러든 전류가 더해짐 (Kirchhoff). 가로줄은 0 V로 붙들림 가정</text>
<text x='20' y='340' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >대응:</text>
<text x='60' y='340' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' ><tspan>입력 u</tspan><tspan dy='4' font-size='8'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → 세로줄 전압 V</tspan><tspan dy='4' font-size='8'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> (1 → 0.1 V)</tspan></text>
<text x='285' y='340' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>가중치 W[j,i] → 교차점 전도도 G</tspan><tspan dy='4' font-size='8'>ji</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> (1 → 1 µS)</tspan></text>
<text x='530' y='340' font-size='10.5' fill='#e08a3c' text-anchor='start' font-weight='normal' ><tspan>출력 y</tspan><tspan dy='4' font-size='8'>j</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → 가로줄 전류 I</tspan><tspan dy='4' font-size='8'>j</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='20' y='360' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>그래서 가로줄 전류 = 출력 × 0.1 µA: 0.5 µA ↔ y</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 5,  0.45 µA ↔ y</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = 4.5.  눈금(0.1 V, 1 µS)은 계산이 쉽게 고른 가정값이다.</tspan></text>
</svg>
