<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 314' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='300' y='20' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >벡터는 숫자 목록, 행렬은 숫자 표, 행렬–벡터 곱은 '행마다 곱해서 더하기'</text>
<text x='40' y='56' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >입력 벡터 u (숫자 2개의 목록)</text>
<rect x='40' y='64' width='40' height='28' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='60' y='83' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >5</text>
<text x='60' y='106' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>u</tspan><tspan dy='4' font-size='8'>1</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<rect x='84' y='64' width='40' height='28' rx='4' fill='#f2f6fc' stroke='#3d6fb4' stroke-width='1.2' />
<text x='104' y='83' font-size='12' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >10</text>
<text x='104' y='106' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' ><tspan>u</tspan><tspan dy='4' font-size='8'>2</tspan><tspan dy='-4' font-size='1'>​</tspan></text>
<text x='220' y='56' font-size='11.5' fill='#e08a3c' text-anchor='start' font-weight='bold' >가중치 행렬 W (2행 × 2열의 표)</text>
<rect x='220' y='64' width='40' height='28' rx='4' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='240' y='83' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >2</text>
<rect x='264' y='64' width='40' height='28' rx='4' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='284' y='83' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >1</text>
<rect x='220' y='96' width='40' height='28' rx='4' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='240' y='115' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >3</text>
<rect x='264' y='96' width='40' height='28' rx='4' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.2' />
<text x='284' y='115' font-size='12' fill='#e08a3c' text-anchor='middle' font-weight='bold' >4</text>
<text x='316' y='83' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >← 1행</text>
<text x='316' y='115' font-size='10' fill='#999' text-anchor='start' font-weight='normal' >← 2행</text>
<text x='240' y='136' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >1열</text>
<text x='284' y='136' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >2열</text>
<text x='220' y='156' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >W의 (1행, 2열) 원소 = 1 : 입력 2가 출력 1에 미치는 가중치</text>
<text x='40' y='190' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >계산 순서 (출력 하나에 한 행씩)</text>
<text x='40' y='212' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>출력 y</tspan><tspan dy='4' font-size='9'>1</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = (1행) · u = 2×5 + 1×10 = 10 + 10 = 20</tspan></text>
<text x='40' y='234' font-size='11.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>출력 y</tspan><tspan dy='4' font-size='9'>2</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = (2행) · u = 3×5 + 4×10 = 15 + 40 = 55</tspan></text>
<text x='40' y='262' font-size='11' fill='#444' text-anchor='start' font-weight='normal' ><tspan>일반식: y</tspan><tspan dy='4' font-size='8.5'>j</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> = Σ</tspan><tspan dy='4' font-size='8.5'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> W</tspan><tspan dy='4' font-size='8.5'>ji</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> · u</tspan><tspan dy='4' font-size='8.5'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan>   (j = 출력 번호, i = 입력 번호. 같은 j의 행을 따라 곱하고 모두 더한다)</tspan></text>
<text x='40' y='284' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' ><tspan>crossbar에서는 u</tspan><tspan dy='4' font-size='8'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → 세로줄 전압 V</tspan><tspan dy='4' font-size='8'>i</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> [V], W</tspan><tspan dy='4' font-size='8'>ji</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → 교차점 전도도 G</tspan><tspan dy='4' font-size='8'>ji</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> [S], y</tspan><tspan dy='4' font-size='8'>j</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> → 가로줄 전류 I</tspan><tspan dy='4' font-size='8'>j</tspan><tspan dy='-4' font-size='1'>​</tspan><tspan> [A]</tspan></text>
<text x='40' y='300' font-size='10.5' fill='#999' text-anchor='start' font-weight='normal' >같은 계산을 전압·전도도·전류로 바꿔 놓은 것뿐이다. 숫자는 예시.</text>
</svg>
