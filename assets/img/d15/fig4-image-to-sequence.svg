<text x='30.0' y='340.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >device 모형: x ← d·x + (1−d)·u, 관측값 = tanh(1.5·x), d = 0.8. 행의 순서(위→아래)는 실험자가 정한 것이고 그림 자체에는 시간이 없다.</text>
<text x='30.0' y='356.0' font-size='9.5' fill='#999' text-anchor='start' font-weight='normal' >마지막 상태만 쓰면 readout은 숫자 5개를, 모든 시점을 쓰면 35개(= 픽셀 수)를 본다. (Claude가 그림, 모식도 + 계산)</text>
