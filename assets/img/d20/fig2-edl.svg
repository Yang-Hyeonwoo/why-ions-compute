<text x='120.0' y='268.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >전극 전하 0.</text>
<text x='120.0' y='284.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >어디서나 + 수 = − 수</text>
<text x='350.0' y='268.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >상태 x = 계면 전하 Q</text>
<text x='350.0' y='284.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >(전극의 −, 바로 앞 K⁺ 한 겹)</text>
<text x='580.0' y='268.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >이온층이 흩어지며 Q가 줄어든다.</text>
<text x='580.0' y='284.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >τ ≈ RC (열린 회로면 오래 남기도 함)</text>
<text x='20.0' y='314.0' font-size='11' fill='#444' text-anchor='start' font-weight='bold' ><tspan>디바이 길이 λ</tspan><tspan dy='3.3' font-size='8.8'>D</tspan><tspan dy='-3.3' font-size='1'>​</tspan><tspan> = 표면 전하의 영향이 이온에 가려 거의 사라지는 거리 (물속 1:1 염, 25 °C, 코드 계산)</tspan></text>
<text x='30.0' y='333.0' font-size='11' fill='#13936b' text-anchor='start' font-weight='normal' >1 mM 9.62 nm · 10 mM 3.04 nm · 100 mM 0.96 nm · 1 M 0.30 nm</text>
<text x='20.0' y='356.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >예시 τ: 10 mM KCl, 전극 1 cm², 간격 1 cm → R ≈ 667 Ω; 계면 10 µF/cm² 두 개 직렬 → τ ≈ RC ≈ 3.3 ms (가정값 계산)</text>
<text x='20.0' y='375.0' font-size='10.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >전자가 계면을 건너는 반응(패러데이 반응)이 없으면 충전·방전은 가역적이고, 방전 길이 열려 있으면 휘발성이다.</text>
<text x='350.0' y='400.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >이온 배치는 보기용이다. 실제 EDL은 전극에 붙은 조밀층(Stern 층)과 퍼진 확산층으로 나뉜다. (Claude가 계산해 그림, 모식도)</text>
