<text x='320.0' y='458.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >방향은 음전하 원뿔형 나노포어의 보고(He et al., J. Am. Chem. Soc. 2009)를 따랐다. 쌓임·빔의 원리는 3구간의 접합과 같다.</text>
<text x='40.0' y='480.0' font-size='10.5' fill='#13936b' text-anchor='start' font-weight='normal' ><tspan>λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan> (물, 25 °C, 1:1 염, 코드 계산) →  1 mM: 9.6 nm · 10 mM: 3.0 nm · 100 mM: 1.0 nm · 1 M: 0.3 nm</tspan></text>
<text x='40.0' y='498.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' ><tspan>예: Jiao 2026의 채널 높이 11 nm는 1 mM에서는 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>와 같은 자릿수, 1 M에서는 λ</tspan><tspan dy='3.1' font-size='8.8'>D</tspan><tspan dy='-3.1' font-size='1'>​</tspan><tspan>의 약 36배다.</tspan></text>
<text x='320.0' y='520.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >벽 전하는 음(−)으로 그렸다. 실제 크기 비율과 다르다. (Claude가 그림, 모식도)</text>
