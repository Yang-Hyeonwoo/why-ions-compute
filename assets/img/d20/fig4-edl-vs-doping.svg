<text x='120.0' y='272.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >채널 고분자에 정공이 거의 없다</text>
<text x='120.0' y='287.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >→ 전류 작음</text>
<text x='350.0' y='272.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >음이온이 표면(EDL)·비정질·결정 근처로</text>
<text x='350.0' y='287.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >들어가고, 같은 수의 정공이 생긴다 → 전류 큼</text>
<text x='580.0' y='272.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >τ₁ 표면 EDL이 먼저 흩어지고, τ₂ 비정질의</text>
<text x='580.0' y='287.0' font-size='9.8' fill='#444' text-anchor='middle' font-weight='normal' >이온이 빠지고, τ₃ 깊은 이온은 천천히 → 전류가 남음</text>
<circle cx='40.0' cy='314.0' r='5.5' fill='#3d6fb4' stroke='none'/><text x='40.0' y='317.5' font-size='9' fill='#fff' text-anchor='middle' font-weight='normal' >−</text>
<text x='52.0' y='318.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >음이온(예: FSI⁻)</text>
<circle cx='180.0' cy='314.0' r='5.5' fill='#c8553d' stroke='none'/><text x='180.0' y='317.5' font-size='9' fill='#fff' text-anchor='middle' font-weight='normal' >+</text>
<text x='192.0' y='318.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >양이온(전해질)</text>
<circle cx='310.0' cy='314.0' r='5' fill='#fff' stroke='#c8553d' stroke-width='1.5'/><text x='310.0' y='317.2' font-size='8.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >+</text>
<text x='322.0' y='318.0' font-size='10' fill='#444' text-anchor='start' font-weight='normal' >정공: 고분자 사슬에 생긴 양전하(전류를 나름)</text>
<text x='20.0' y='344.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='bold' >상태 x = 고분자 안에 들어간 음이온의 양(= 그 전하를 맞추는 정공의 수). 정공이 많을수록 채널 전류가 크다.</text>
<text x='20.0' y='364.0' font-size='10.5' fill='#444' text-anchor='start' font-weight='normal' >D19의 PEDOT:PSS(공핍형: 양이온을 넣어 정공을 없앰)와 반대로, 여기서는 음이온을 넣어 정공을 만든다(축적형).</text>
<text x='20.0' y='384.0' font-size='9.8' fill='#999' text-anchor='start' font-weight='normal' >τ₁·τ₂·τ₃를 EDL·비정질·결정 영역에 짝짓는 것은 Lee 2024 (AFM) p.3, Lee 2025 (structure) p.4 저자들의 해석이다.</text>
<text x='350.0' y='410.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >이온·정공의 수와 위치, 전류 막대 길이는 보기용이다. (Claude가 그림, 모식도)</text>
