<text x='394.0' y='132.0' font-size='9.5' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >Cl⁻</text>
<line x1='284.0' y1='166.0' x2='252.0' y2='166.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='268.0' y='180.0' font-size='10.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >e⁻</text>
<text x='374.0' y='202.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >Ag + Cl⁻ → AgCl + e⁻</text>
<text x='360.0' y='254.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >은 원자가 전자 하나를 전극에 내주고</text>
<text x='360.0' y='269.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >Ag⁺가 되어 Cl⁻와 붙는다 = 산화</text>
<text x='360.0' y='288.0' font-size='10' fill='#c8553d' text-anchor='middle' font-weight='bold' >→ 물질의 화학 상태가 바뀐다</text>
<text x='580.0' y='52.0' font-size='11.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >(c) 전기화학 도핑: 고분자가 산화된다</text>
<rect x='474.0' y='70.0' width='38.0' height='152.0' rx='0' fill='#d4d4d4' stroke='#999' stroke-width='1.2' />
<text x='493.0' y='236.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >금속 접점</text>
