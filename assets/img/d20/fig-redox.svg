<text x='350.0' y='22.0' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >전자가 계면을 건너는가: EDL · 전극 반응 · 고분자 도핑 (모식도)</text>
<text x='120.0' y='52.0' font-size='11.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >(a) 비패러데이: 이온만 모인다</text>
