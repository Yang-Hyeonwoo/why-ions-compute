<text x='632.0' y='100.0' font-size='9.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >A⁻ 들어옴</text>
<line x1='588.0' y1='196.0' x2='484.0' y2='196.0' stroke='#c8553d' stroke-width='1.6' marker-end='url(#arr)'/>
<text x='518.0' y='212.0' font-size='9.5' fill='#c8553d' text-anchor='start' font-weight='bold' >e⁻ (사슬 → 접점)</text>
<text x='590.0' y='254.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >사슬이 전자를 잃어 정공(+)이 생기고</text>
<text x='590.0' y='269.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >음이온 A⁻가 들어와 전하를 맞춘다</text>
<text x='590.0' y='288.0' font-size='10' fill='#e08a3c' text-anchor='middle' font-weight='bold' >→ 정공 수(전류)가 바뀐다</text>
<text x='350.0' y='330.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='bold' >산화 = 전자를 잃음 · 환원 = 전자를 얻음(같은 반응의 반대 방향).</text>
<text x='350.0' y='350.0' font-size='10.5' fill='#444' text-anchor='middle' font-weight='normal' >전자가 계면을 건너 물질이 바뀌면 패러데이 과정, 이온이 모였다 흩어지기만 하면 비패러데이 과정이다.</text>
<text x='350.0' y='370.0' font-size='10' fill='#999' text-anchor='middle' font-weight='normal' >(c)는 (b)와 같은 산화이고, 바뀐 것이 고분자 사슬의 전자 수(정공 수)라는 점이 다르다.</text>
<text x='350.0' y='392.0' font-size='9.5' fill='#999' text-anchor='middle' font-weight='normal' >원자·이온의 수와 위치는 보기용이다. (Claude가 그림, 모식도)</text>
</svg>
