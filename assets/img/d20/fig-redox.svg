<text x='130.0' y='254.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >금속 쪽 전자(−)와 용액 쪽 K⁺가</text>
<text x='130.0' y='269.0' font-size='10' fill='#444' text-anchor='middle' font-weight='normal' >마주 볼 뿐, 계면을 건너지 않는다</text>
<text x='130.0' y='288.0' font-size='10' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >→ 축전기처럼 충전·방전</text>
<text x='350.0' y='52.0' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >(b) 패러데이: 전자가 건너간다</text>
