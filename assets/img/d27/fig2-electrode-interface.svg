<text x='303' y='77' font-size='11' fill='#56627a' text-anchor='middle' font-weight='normal' >(전자가 운반)</text>
<text x='230' y='106' font-size='11.5' fill='#3d6fb4' text-anchor='start' font-weight='bold' >① 축전 방식</text>
<text x='230' y='124' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >이온이 계면에 모였다</text>
<text x='230' y='140' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >흩어지며 전극 쪽 전자를</text>
<text x='230' y='156' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >밀고 당긴다. 전하는</text>
<text x='230' y='172' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >계면을 건너지 않는다</text>
<text x='230' y='188' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >= capacitor(EDL)</text>
<text x='230' y='220' font-size='11.5' fill='#13936b' text-anchor='start' font-weight='bold' >② 반응 방식</text>
<text x='230' y='238' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >전극 표면의 화학 반응이</text>
<text x='230' y='254' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >전자를 주고받는다</text>
<text x='230' y='270' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >AgCl + e⁻ ⇌ Ag + Cl⁻</text>
<text x='230' y='286' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >(Ag/AgCl 전극)</text>
<text x='418' y='56' font-size='11.5' fill='#444' text-anchor='start' font-weight='bold' >등가회로</text>
<text x='418' y='72' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >(전기 회로로 바꿔 그린 것)</text>
