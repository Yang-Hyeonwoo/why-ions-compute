<text x='14' y='641' font-size='11' fill='#444' text-anchor='start' font-weight='normal' >반대로 µV에서 동작하는 device는 증폭 없이 받을 수 있지만, 같은 크기의 잡음에도 흔들린다. [해석]</text>
