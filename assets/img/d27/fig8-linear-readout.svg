<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 350' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='660' height='350' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='330' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >상태 두 개짜리 readout: 곱해서 더한 값의 부호가 직선 하나로 갈린다</text>
<polygon points='70,300 320,50 70,50' fill='#fbeff0'/>
<polygon points='70,300 320,300 320,50' fill='#eaf6f0'/>
<line x1='70' y1='300' x2='320' y2='300' stroke='#999' stroke-width='1'/>
<line x1='70' y1='300' x2='70' y2='50' stroke='#999' stroke-width='1'/>
<text x='70' y='318' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >0</text>
<text x='62' y='304' font-size='11' fill='#999' text-anchor='end' font-weight='normal' >0</text>
<text x='195.0' y='318' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >0.5</text>
<text x='62' y='179.0' font-size='11' fill='#999' text-anchor='end' font-weight='normal' >0.5</text>
<text x='320' y='318' font-size='11' fill='#999' text-anchor='middle' font-weight='normal' >1</text>
<text x='62' y='54' font-size='11' fill='#999' text-anchor='end' font-weight='normal' >1</text>
<text x='195.0' y='336' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' >상태 1 (x₁)</text>
<text x='30' y='175.0' font-size='12' fill='#444' text-anchor='middle' font-weight='normal' transform='rotate(-90 30 175.0)'>상태 2 (x₂)</text>
<line x1='70' y1='300' x2='320' y2='50' stroke='#3d6fb4' stroke-width='2' stroke-dasharray='6 4'/>
<text x='302.5' y='54.5' font-size='11.5' fill='#3d6fb4' text-anchor='end' font-weight='bold' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >y = 0</text>
<text x='85.0' y='70.0' font-size='12' fill='#c8553d' text-anchor='start' font-weight='bold' >y &gt; 0 → 이상</text>
<text x='305.0' y='285.0' font-size='12' fill='#13936b' text-anchor='end' font-weight='bold' >y &lt; 0 → 정상</text>
<circle cx='270.0' cy='250.0' r='7' fill='#13936b'/>
<text x='270.0' y='236.0' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >정상 (0.8, 0.2)</text>
<circle cx='145.0' cy='125.0' r='7' fill='#c8553d'/>
<text x='145.0' y='111.0' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='normal' stroke='#fff' stroke-width='4' paint-order='stroke' stroke-linejoin='round' >이상 (0.3, 0.7)</text>
<rect x='360' y='60' width='270' height='196' rx='12' fill='#f7f9fc' stroke='#dde3ec' stroke-width='1.2' />
<text x='376' y='92' font-size='12.5' fill='#444' text-anchor='start' font-weight='bold' >weight w = (−1, 1), b = 0</text>
<text x='376' y='122' font-size='12.5' fill='#13936b' text-anchor='start' font-weight='normal' >정상: y = −0.8 + 0.2 = −0.6</text>
<text x='376' y='152' font-size='12.5' fill='#c8553d' text-anchor='start' font-weight='normal' >이상: y = −0.3 + 0.7 = +0.4</text>
<text x='376' y='182' font-size='12.5' fill='#444' text-anchor='start' font-weight='normal' >문턱 0과 비교 → 둘이 갈린다</text>
<text x='376' y='212' font-size='12.5' fill='#3d6fb4' text-anchor='start' font-weight='normal' >경계 y = 0은 직선 x₂ = x₁</text>
<text x='376' y='246' font-size='11.5' fill='#999' text-anchor='start' font-weight='normal' >상태가 120개여도 하는 일은 같다</text>
</svg>
