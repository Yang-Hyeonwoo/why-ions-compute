<text x='28' y='326' font-size='11.8' fill='#444' text-anchor='start' font-weight='normal' >MCU readout이면 곱셈·덧셈을 하는 짧은 프로그램(펌웨어)이 돈다. crossbar readout이면 곱셈·덧셈은 물리, 순서 제어만 MCU.</text>
<text x='28' y='344' font-size='11.8' fill='#13936b' text-anchor='start' font-weight='normal' >어느 쪽이든 학습(기울기 계산·회귀)은 하지 않는다. 같은 w를 반복해 쓸 뿐이다.</text>
