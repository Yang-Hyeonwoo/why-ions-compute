<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 258' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='720' height='258' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='360' y='26' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >증폭 두 단을 이으면: 배율은 곱하고, dB는 더한다</text>
<rect x='28' y='76' width='104' height='40' rx='20' fill='#eaf6f0' stroke='#13936b' stroke-width='1.2' />
<text x='80' y='102' font-size='15' fill='#13936b' text-anchor='middle' font-weight='bold' >1 mV</text>
<text x='80' y='138' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >전극에서 잡힌 신호</text>
<rect x='308' y='76' width='104' height='40' rx='20' fill='#eaf6f0' stroke='#13936b' stroke-width='1.2' />
<text x='360' y='102' font-size='15' fill='#13936b' text-anchor='middle' font-weight='bold' >10 mV</text>
<text x='360' y='138' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >앞단을 지난 신호</text>
<rect x='588' y='76' width='104' height='40' rx='20' fill='#eaf6f0' stroke='#13936b' stroke-width='1.2' />
<text x='640' y='102' font-size='15' fill='#13936b' text-anchor='middle' font-weight='bold' >1 V</text>
<text x='640' y='138' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >device를 구동할 크기</text>
<path d='M192,70 L250,96 L192,122 Z' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.6' stroke-linejoin='round'/>
<text x='220' y='60' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >앞단 증폭</text>
<text x='220' y='142' font-size='12.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >×10 = 20 dB</text>
<line x1='134' y1='96' x2='190' y2='96' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<line x1='251' y1='96' x2='306' y2='96' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<path d='M472,70 L530,96 L472,122 Z' fill='#eef3fb' stroke='#3d6fb4' stroke-width='1.6' stroke-linejoin='round'/>
<text x='500' y='60' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >뒷단 증폭</text>
<text x='500' y='142' font-size='12.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >×100 = 40 dB</text>
<line x1='414' y1='96' x2='470' y2='96' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<line x1='531' y1='96' x2='586' y2='96' stroke='#444' stroke-width='1.4' marker-end='url(#arr)'/>
<rect x='40' y='168' width='640' height='50' rx='12' fill='#f7f9fc' stroke='#dde3ec' stroke-width='1.2' />
<text x='200' y='199' font-size='13' fill='#444' text-anchor='middle' font-weight='bold' >배율: 10 × 100 = 1,000배</text>
<text x='360' y='199' font-size='14' fill='#999' text-anchor='middle' font-weight='normal' >=</text>
<text x='520' y='199' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >dB: 20 + 40 = 60 dB</text>
<text x='360' y='244' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >줄이는 쪽은 음수: 0.1배 = −20 dB, 0.71배 ≈ −3 dB (dB = 20 × log₁₀ 배율)</text>
</svg>
