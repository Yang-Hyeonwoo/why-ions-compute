<path d='M330,130 L330,138 L820,138 L820,130' fill='none' stroke='#13936b' stroke-width='1.6'/>
<text x='575.0' y='160' font-size='13.5' fill='#13936b' text-anchor='middle' font-weight='bold' >고리 1이 성립한 8번 안에서만 고리 2를 센다 → 7번</text>
<rect x='822' y='70' width='126' height='176' rx='8' fill='none' stroke='#c8553d' stroke-width='1.4' stroke-dasharray='5 4'/>
<text x='20' y='372' font-size='13' fill='#c8553d' text-anchor='start' font-weight='normal' >빨간 점선: 같은 원인(예: 두께를 잘못 잼)이 두 고리를 함께 무너뜨린 경우. 두께는 D 어림과 τ 예측에 모두 들어간다.</text>
<text x='20' y='396' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='bold' >따로 물으면: P(1) = 8/10 = 0.8, P(2) = 7/10 = 0.7 → 0.8 × 0.7 = 0.56  (실제 '둘 다' 0.7보다 낮다)</text>
<text x='20' y='420' font-size='13.5' fill='#13936b' text-anchor='start' font-weight='bold' >조건부로 물으면: P(2 | 1) = 8번 중 7번 = 0.875 → 0.8 × 0.875 = 0.70  (실제와 같다: 연쇄 법칙)</text>
<text x='20' y='444' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >P(1과 2) = P(1) × P(2 | 1).  세로 막대 '|'는 '~가 성립했다고 치면'. 독립일 때만 P(2 | 1) = P(2)라서 따로 매긴 값의 곱이 맞다.</text>
</svg>
