<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 740 244' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='740' height='244' fill='#fff'/>
<text x='370' y='24' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >예측을 숫자로 쓰면, 결과가 어디에 떨어지느냐로 가설의 운명이 갈린다</text>
<line x1='225.0' y1='60' x2='225.0' y2='140' stroke='#c8553d' stroke-width='1.4' stroke-dasharray='4 3'/>
<text x='225.0' y='54' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >τ₁ = 2.0 s (1 mol%)</text>
<line x1='515.0' y1='60' x2='515.0' y2='140' stroke='#13936b' stroke-width='1.4' stroke-dasharray='4 3'/>
<text x='515.0' y='54' font-size='11.5' fill='#13936b' text-anchor='middle' font-weight='bold' >예측 τ₅ = 4.0 s</text>
<rect x='181.5' y='70' width='87.0' height='52' rx='8' fill='#fbe3dd' stroke='none' stroke-width='1.2' />
<text x='225.0' y='92' font-size='12.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >반증 구간</text>
<text x='225.0' y='111' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >가설이 틀림</text>
<rect x='268.5' y='70' width='159.5' height='52' rx='8' fill='#eeeeee' stroke='none' stroke-width='1.2' />
<text x='348.25' y='92' font-size='12.5' fill='#999' text-anchor='middle' font-weight='bold' >회색 지대</text>
<text x='348.25' y='111' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >할 일을 미리 정함</text>
<rect x='428.0' y='70' width='174.0' height='52' rx='8' fill='#e3f4ec' stroke='none' stroke-width='1.2' />
<text x='515.0' y='92' font-size='12.5' fill='#13936b' text-anchor='middle' font-weight='bold' >예측대로</text>
<text x='515.0' y='111' font-size='11' fill='#444' text-anchor='middle' font-weight='normal' >가설이 살아남음</text>
<line x1='80.0' y1='140' x2='660.0' y2='140' stroke='#999' stroke-width='1'/>
<line x1='80.0' y1='140' x2='80.0' y2='146' stroke='#999' stroke-width='1'/>
<text x='80.0' y='162' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >1</text>
<line x1='225.0' y1='140' x2='225.0' y2='146' stroke='#999' stroke-width='1'/>
<text x='225.0' y='162' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >2</text>
<line x1='370.0' y1='140' x2='370.0' y2='146' stroke='#999' stroke-width='1'/>
<text x='370.0' y='162' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >3</text>
<line x1='515.0' y1='140' x2='515.0' y2='146' stroke='#999' stroke-width='1'/>
<text x='515.0' y='162' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >4</text>
<line x1='660.0' y1='140' x2='660.0' y2='146' stroke='#999' stroke-width='1'/>
<text x='660.0' y='162' font-size='11.5' fill='#999' text-anchor='middle' font-weight='normal' >5</text>
<text x='660.0' y='180' font-size='11' fill='#999' text-anchor='end' font-weight='normal' >5 mol%에서 잰 τ₅ (s), 반복 흔들림 ±15% [가정]</text>
<rect x='80.0' y='194' width='580.0' height='34' rx='8' fill='#f3f3f3' stroke='none' stroke-width='1.2' />
<text x='370.0' y='216' font-size='11.5' fill='#444' text-anchor='middle' font-weight='normal' >반증할 수 없는 문장("유리할 수 있다"): 어느 결과가 나와도 살아남는다 → 배우는 것이 없다</text>
</svg>
