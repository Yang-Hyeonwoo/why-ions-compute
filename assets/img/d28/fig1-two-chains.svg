<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker><marker id='arr-ce08a3c' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#e08a3c'/></marker><marker id='arr-c13936b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#13936b'/></marker></defs>
<text x='500.0' y='28' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >가설의 두 사슬: '왜 필요한가'와 '왜 그렇게 되는가' (예시 가설, 모식도)</text>
<text x='245.0' y='58' font-size='14' fill='#e08a3c' text-anchor='middle' font-weight='bold' >① 왜 필요한가 (병목 장부에서)</text>
<rect x='50' y='74' width='390' height='62' rx='9' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.4' />
<text x='64' y='99' font-size='14' fill='#e08a3c' text-anchor='start' font-weight='bold' >응용</text>
<text x='64' y='121' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >피부 위 심전도 패치(Day 51–52)</text>
<line x1='100' y1='138' x2='100' y2='168' stroke='#e08a3c' stroke-width='1.8' marker-end='url(#arr-ce08a3c)'/>
<rect x='116' y='143' width='62' height='21' rx='10' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='147' y='158' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >해석</text>
<text x='188' y='158' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.9 [가정]</text>
<rect x='50' y='170' width='390' height='62' rx='9' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.4' />
<text x='64' y='195' font-size='14' fill='#e08a3c' text-anchor='start' font-weight='bold' >요구</text>
<text x='64' y='217' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >readout을 날마다 다시 학습할 수 없다</text>
<line x1='100' y1='234' x2='100' y2='264' stroke='#e08a3c' stroke-width='1.8' marker-end='url(#arr-ce08a3c)'/>
<rect x='116' y='239' width='62' height='21' rx='10' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='147' y='254' font-size='13' fill='#13936b' text-anchor='middle' font-weight='bold' >확인</text>
<text x='188' y='254' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.9 [가정]</text>
<rect x='50' y='266' width='390' height='62' rx='9' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.4' />
<text x='64' y='291' font-size='14' fill='#e08a3c' text-anchor='start' font-weight='bold' >병목</text>
<text x='64' y='313' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >τ·응답 크기의 drift(Day 33–34·Day 49–50)</text>
<line x1='100' y1='330' x2='100' y2='360' stroke='#e08a3c' stroke-width='1.8' marker-end='url(#arr-ce08a3c)'/>
<rect x='116' y='335' width='62' height='21' rx='10' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='147' y='350' font-size='13' fill='#e08a3c' text-anchor='middle' font-weight='bold' >가설</text>
<text x='188' y='350' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.7 [가정]</text>
<rect x='50' y='362' width='390' height='62' rx='9' fill='#fdf4ec' stroke='#e08a3c' stroke-width='1.4' />
<text x='64' y='387' font-size='14' fill='#e08a3c' text-anchor='start' font-weight='bold' >필요한 값</text>
<text x='64' y='409' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >재보정 주기 ≥ 1주 [가정]</text>
<text x='245.0' y='446' font-size='13.5' fill='#e08a3c' text-anchor='middle' font-weight='bold' >고리 셋이 모두 성립(독립 가정): 0.9 × 0.9 × 0.7 = 0.57</text>
<text x='755.0' y='58' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >② 왜 그렇게 되는가 (Phase 4의 이온 물리에서)</text>
<rect x='560' y='74' width='390' height='62' rx='9' fill='#eef9f4' stroke='#13936b' stroke-width='1.4' />
<text x='574' y='99' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >설계 손잡이</text>
<text x='574' y='121' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >비휘발 용매 + 가교 밀도</text>
<line x1='610' y1='138' x2='610' y2='168' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<rect x='626' y='143' width='62' height='21' rx='10' fill='#fff' stroke='#c8553d' stroke-width='1.2' />
<text x='657' y='158' font-size='13' fill='#c8553d' text-anchor='middle' font-weight='bold' >미확인</text>
<text x='698' y='158' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.6 [가정]</text>
<rect x='560' y='170' width='390' height='62' rx='9' fill='#eef9f4' stroke='#13936b' stroke-width='1.4' />
<text x='574' y='195' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >이온 동역학</text>
<text x='574' y='217' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >용매량·이온 농도 → D 유지</text>
<line x1='610' y1='234' x2='610' y2='264' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<rect x='626' y='239' width='62' height='21' rx='10' fill='#fff' stroke='#13936b' stroke-width='1.2' />
<text x='657' y='254' font-size='13' fill='#13936b' text-anchor='middle' font-weight='bold' >확인</text>
<text x='698' y='254' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.9 [가정]</text>
<rect x='560' y='266' width='390' height='62' rx='9' fill='#eef9f4' stroke='#13936b' stroke-width='1.4' />
<text x='574' y='291' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >device 응답</text>
<text x='574' y='313' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >τ·응답 크기가 하루에 덜 변함</text>
<line x1='610' y1='330' x2='610' y2='360' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<rect x='626' y='335' width='62' height='21' rx='10' fill='#fff' stroke='#e08a3c' stroke-width='1.2' />
<text x='657' y='350' font-size='13' fill='#e08a3c' text-anchor='middle' font-weight='bold' >가설</text>
<text x='698' y='350' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >이 고리가 성립할 믿음 p = 0.6 [가정]</text>
<rect x='560' y='362' width='390' height='62' rx='9' fill='#eef9f4' stroke='#13936b' stroke-width='1.4' />
<text x='574' y='387' font-size='14' fill='#13936b' text-anchor='start' font-weight='bold' >계산 지표</text>
<text x='574' y='409' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >같은 readout의 정확도 유지 기간</text>
<text x='755.0' y='446' font-size='13.5' fill='#13936b' text-anchor='middle' font-weight='bold' >고리 셋이 모두 성립(독립 가정): 0.6 × 0.9 × 0.6 = 0.32</text>
<rect x='190' y='500' width='620' height='96' rx='12' fill='#f3eefa' stroke='#7a5aa6' stroke-width='2' />
<text x='500.0' y='526' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >가설 (한 문장, 틀릴 수 있게)</text>
<text x='500.0' y='552' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >"비휘발 용매 + 가교로 설계한 이온겔은 같은 readout을</text>
<text x='500.0' y='574' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >다시 학습하지 않고 쓸 수 있는 기간을 1일에서 1주 이상으로 늘린다"</text>
<line x1='245' y1='458' x2='245' y2='497' stroke='#e08a3c' stroke-width='1.8' marker-end='url(#arr-ce08a3c)'/>
<line x1='755' y1='458' x2='755' y2='497' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<text x='500.0' y='624' font-size='13' fill='#444' text-anchor='middle' font-weight='normal' >두 사슬 전체: 0.57 × 0.32 ≈ 0.18. p는 주관적 예시 믿음 값이고, 곱은 고리들이 서로 독립이라는 단순화를 전제한다.</text>
<text x='500.0' y='645' font-size='13' fill='#999' text-anchor='middle' font-weight='normal' >(각 p를 '앞 고리가 성립한다면'의 조건부 믿음으로 매기면 독립 가정 없이도 곱이 맞다.)</text>
<text x='500.0' y='666' font-size='13' fill='#444' text-anchor='middle' font-weight='normal' >고리가 길수록 전체 믿음은 곱으로 줄어든다. 믿음이 가장 낮은 고리(p = 0.6, 오른쪽 사슬)부터 시험한다.</text>
<text x='500.0' y='687' font-size='13' fill='#999' text-anchor='middle' font-weight='normal' >태그(교재 전체와 같은 뜻): 확인 = 원문·식·출처로 뒷받침, 해석 = 근거에 기댄 판단, 가설 = 방향은 있고 시험이 남음, 미확인 = 근거를 찾지 못함</text>
</svg>
