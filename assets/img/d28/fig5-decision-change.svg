<text x='500.0' y='28' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >'중요하다' = 맞을 때와 틀릴 때 다음 일이 달라진다 (예시, 모식도)</text>
<rect x='20' y='50' width='300' height='46' rx='10' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.5' />
<text x='170.0' y='79' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >A: drift를 설계로 줄인다</text>
<line x1='170.0' y1='98' x2='90' y2='168' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<text x='54' y='140' font-size='13.5' fill='#13936b' text-anchor='middle' font-weight='bold' >맞으면</text>
<rect x='20' y='172' width='140' height='74' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='90' y='202' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >패치형 응용으로</text>
<text x='90' y='226' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >device 수를 늘린다</text>
<line x1='170.0' y1='98' x2='250' y2='168' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr-cc8553d)'/>
<text x='286' y='140' font-size='13.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >틀리면</text>
<rect x='180' y='172' width='140' height='74' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.2' />
<text x='250' y='202' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >응용을 좁히거나</text>
<text x='250' y='226' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >drift 보정은 회로로</text>
<text x='170.0' y='282' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >→ 결정이 바뀐다: 지금 시험할 가치</text>
<rect x='350' y='50' width='300' height='46' rx='10' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.5' />
<text x='500.0' y='79' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >B: 생리 식염수에서 정류가 남는다</text>
<line x1='500.0' y1='98' x2='420' y2='168' stroke='#13936b' stroke-width='1.8' marker-end='url(#arr-c13936b)'/>
<text x='384' y='140' font-size='13.5' fill='#13936b' text-anchor='middle' font-weight='bold' >맞으면</text>
<rect x='350' y='172' width='140' height='74' rx='8' fill='#eef9f4' stroke='#13936b' stroke-width='1.2' />
<text x='420' y='202' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >몸 안 응용</text>
<text x='420' y='226' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >쪽으로 간다</text>
<line x1='500.0' y1='98' x2='580' y2='168' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr-cc8553d)'/>
<text x='616' y='140' font-size='13.5' fill='#c8553d' text-anchor='middle' font-weight='bold' >틀리면</text>
<rect x='510' y='172' width='140' height='74' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.2' />
<text x='580' y='202' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >피부 위·체외</text>
<text x='580' y='226' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >응용으로 좁힌다</text>
<text x='500.0' y='282' font-size='14' fill='#13936b' text-anchor='middle' font-weight='bold' >→ 결정이 바뀐다: 지금 시험할 가치</text>
<rect x='680' y='50' width='300' height='46' rx='10' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.5' />
<text x='830.0' y='79' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >D: 이온 device는 유리하다</text>
<line x1='770' y1='98' x2='820.0' y2='168' stroke='#999' stroke-width='1.8' marker-end='url(#arr-c999)'/>
<line x1='890' y1='98' x2='840.0' y2='168' stroke='#999' stroke-width='1.8' marker-end='url(#arr-c999)'/>
<text x='742' y='140' font-size='13.5' fill='#999' text-anchor='middle' font-weight='bold' >맞으면</text>
<text x='918' y='140' font-size='13.5' fill='#999' text-anchor='middle' font-weight='bold' >틀리면</text>
<rect x='730' y='172' width='200' height='74' rx='8' fill='#f6f6f6' stroke='#999' stroke-width='1.2' />
<text x='830.0' y='202' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >지금 하던 것을 계속</text>
<text x='830.0' y='226' font-size='13.5' fill='#999' text-anchor='middle' font-weight='normal' >('아직 덜 최적화')</text>
<text x='830.0' y='282' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >→ 결정이 그대로: 지금은 아니다</text>
<line x1='20' y1='312' x2='980' y2='312' stroke='#d9d9d9' stroke-width='1'/>
<text x='20' y='340' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >확신이 0.95인 가설은 시험해도 대개 '역시 그렇다'로 끝나 결정이 거의 안 바뀐다.</text>
<text x='20' y='364' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >결정을 바꿀 여지가 가장 큰 것은 정말로 모르는(대략 0.3–0.7) 가설이다. [해석, 규칙이 아니라 감각]</text>
</svg>
