<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 520' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='520' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >가교제를 늘리면 함수율도 변한다: 경로 둘과, 떼어 내는 설계 (예시 값)</text>
<text x='20' y='62' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >왜 섞이나: τ를 길게 만드는 경로가 둘</text>
<rect x='20' y='180' width='120' height='64' rx='9' fill='#f6f6f6' stroke='#999' stroke-width='1.4' />
<text x='80' y='207' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >가교제</text>
<text x='80' y='229' font-size='13.5' fill='#444' text-anchor='middle' font-weight='normal' >1 → 5 mol%</text>
<rect x='180' y='84' width='180' height='64' rx='9' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.4' />
<text x='270' y='111' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >사슬 운동성 ↓</text>
<text x='270' y='133' font-size='13' fill='#7a5aa6' text-anchor='middle' font-weight='normal' >가설이 말한 경로</text>
<rect x='180' y='274' width='180' height='76' rx='9' fill='#fbeeea' stroke='#c8553d' stroke-width='1.4' />
<text x='270' y='300' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >팽윤 ↓ → 함수율</text>
<text x='270' y='320' font-size='13.5' fill='#c8553d' text-anchor='middle' font-weight='normal' >90% → 80%</text>
<text x='270' y='340' font-size='13' fill='#c8553d' text-anchor='middle' font-weight='normal' >함께 움직인 경로</text>
<rect x='400' y='180' width='64' height='64' rx='9' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='432' y='218' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >D ↓</text>
<rect x='496' y='180' width='64' height='64' rx='9' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='528' y='218' font-size='15' fill='#444' text-anchor='middle' font-weight='bold' >τ ↑</text>
<line x1='140' y1='200' x2='178' y2='132' stroke='#7a5aa6' stroke-width='1.8' marker-end='url(#arr)'/>
<line x1='140' y1='224' x2='178' y2='292' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr)'/>
<line x1='360' y1='120' x2='398' y2='196' stroke='#7a5aa6' stroke-width='1.8' marker-end='url(#arr)'/>
<line x1='360' y1='306' x2='398' y2='230' stroke='#c8553d' stroke-width='1.8' marker-end='url(#arr)'/>
<line x1='464' y1='212' x2='494' y2='212' stroke='#444' stroke-width='1.8' marker-end='url(#arr)'/>
<text x='20' y='384' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >1 mol%와 5 mol% 두 시료만 비교하면, τ가 길어진 것은</text>
<text x='20' y='404' font-size='13' fill='#444' text-anchor='start' font-weight='normal' >두 경로 어느 쪽으로도 설명된다. 팽윤이 줄면 두께도 준다(④).</text>
<text x='600' y='62' font-size='14' fill='#444' text-anchor='start' font-weight='bold' >떼어 내는 설계: 함수율을 맞춘 칸을 하나 더</text>
<text x='750.0' y='98' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >함수율 90%</text>
<text x='914.0' y='98' font-size='13.5' fill='#444' text-anchor='middle' font-weight='bold' >함수율 80%</text>
<text x='678' y='155.0' font-size='13.5' fill='#444' text-anchor='end' font-weight='bold' >가교 1 mol%</text>
<text x='678' y='275.0' font-size='13.5' fill='#444' text-anchor='end' font-weight='bold' >가교 5 mol%</text>
<rect x='690' y='110' width='120' height='80' rx='8' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='750.0' y='144' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >τ = 2.0 s</text>
<text x='750.0' y='166' font-size='13' fill='#999' text-anchor='middle' font-weight='normal' >원래 시료</text>
<rect x='854' y='110' width='120' height='80' rx='8' fill='#eef3fa' stroke='#3d6fb4' stroke-width='1.4' />
<text x='914.0' y='144' font-size='14' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >τ = 3.0 s</text>
<text x='914.0' y='166' font-size='13' fill='#3d6fb4' text-anchor='middle' font-weight='normal' >새 비교 시료</text>
<rect x='854' y='230' width='120' height='80' rx='8' fill='#fff' stroke='#444' stroke-width='1.4' />
<text x='914.0' y='264' font-size='14' fill='#444' text-anchor='middle' font-weight='bold' >τ = 3.2 s</text>
<text x='914.0' y='286' font-size='13' fill='#999' text-anchor='middle' font-weight='normal' >원래 시료</text>
<rect x='690' y='230' width='120' height='80' rx='8' fill='#f6f6f6' stroke='#999' stroke-width='1.4' />
<text x='750.0' y='264' font-size='14' fill='#999' text-anchor='middle' font-weight='bold' >만들기</text>
<text x='750.0' y='286' font-size='13' fill='#999' text-anchor='middle' font-weight='normal' >어려움</text>
<line x1='812' y1='150.0' x2='852' y2='150.0' stroke='#3d6fb4' stroke-width='2' marker-end='url(#arr)'/>
<line x1='914.0' y1='192' x2='914.0' y2='228' stroke='#7a5aa6' stroke-width='2' marker-end='url(#arr)'/>
<line x1='804' y1='192' x2='848' y2='240' stroke='#c8553d' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#arr)'/>
<text x='832.0' y='136.0' font-size='14' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >가</text>
<text x='932.0' y='215.0' font-size='14' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >나</text>
<text x='814' y='256' font-size='14' fill='#c8553d' text-anchor='middle' font-weight='bold' >다</text>
<line x1='20' y1='422' x2='980' y2='422' stroke='#d9d9d9' stroke-width='1'/>
<text x='20' y='440' font-size='13' fill='#3d6fb4' text-anchor='start' font-weight='bold' >가 (같은 행, 가교 1 mol%): 함수율만 바뀜 → 3.0 ÷ 2.0 = 1.5배. Mackie–Meares 모형의 예상(1.51배)과 같게 나왔다고 둔 결과 예.</text>
<text x='20' y='464' font-size='13' fill='#7a5aa6' text-anchor='start' font-weight='bold' >나 (같은 열, 함수율 80%): 가교만 바뀜 → 3.2 ÷ 3.0 ≈ 1.07배. 반복 흔들림 ±15% 안이라 '사슬 운동성 경로'는 이 해상도에서 보이지 않는다.</text>
<text x='20' y='488' font-size='13' fill='#c8553d' text-anchor='start' font-weight='bold' >다 (대각선, 원래 비교): 둘 다 바뀜 → 3.2 ÷ 2.0 = 1.6배 ≈ 1.5 × 1.07. 원래 비교만으로는 두 몫을 가를 수 없다.</text>
<text x='20' y='510' font-size='13' fill='#999' text-anchor='start' font-weight='normal' >두께는 모든 시료에서 재서 같게 맞췄다고 둔다. 모든 숫자는 셈을 보이기 위한 예시 값이다.</text>
</svg>
