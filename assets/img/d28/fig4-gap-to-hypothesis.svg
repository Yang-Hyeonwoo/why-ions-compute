<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 380' width='100%' font-family='Noto Sans KR, Malgun Gothic, sans-serif' font-size='13' fill='#444'>
<rect x='0' y='0' width='1000' height='380' fill='#fff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444'/></marker></defs>
<text x='500.0' y='28' font-size='16' fill='#444' text-anchor='middle' font-weight='bold' >후보는 빈칸에서: 빈칸 → 질문 → 가설 (예시 B, 모식도)</text>
<rect x='20' y='62' width='270' height='176' rx='10' fill='#f6f6f6' stroke='#999' stroke-width='1.6' />
<text x='34' y='90' font-size='15' fill='#999' text-anchor='start' font-weight='bold' >① 빈칸</text>
<text x='34' y='122' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >D27 교차표: 몸 안 '동작 환경' 칸</text>
<text x='34' y='149' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >= 가능성 있으나 미확인</text>
<text x='34' y='176' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >장부: 고정 전하의 해리·선택성이</text>
<text x='34' y='203' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >염 농도·pH에 의존 — 측정 없음</text>
<rect x='40' y='252' width='230' height='30' rx='15' fill='#fff' stroke='#999' stroke-width='1.2' />
<text x='155.0' y='272' font-size='13.5' fill='#999' text-anchor='middle' font-weight='bold' >어느 날·어느 칸이 비었나</text>
<rect x='365' y='62' width='270' height='176' rx='10' fill='#eef3fa' stroke='#3d6fb4' stroke-width='1.6' />
<text x='379' y='90' font-size='15' fill='#3d6fb4' text-anchor='start' font-weight='bold' >② 질문 (방향은 아직 없음)</text>
<text x='379' y='122' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >생리 식염수(약 150 mM)·pH 7.4에서</text>
<text x='379' y='149' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >폴리전해질 이종접합의 정류와</text>
<text x='379' y='176' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >고갈 기억은 얼마나 남는가?</text>
<text x='379' y='203' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >답의 방향은 아직 열려 있다</text>
<rect x='385' y='252' width='230' height='30' rx='15' fill='#fff' stroke='#3d6fb4' stroke-width='1.2' />
<text x='500.0' y='272' font-size='13.5' fill='#3d6fb4' text-anchor='middle' font-weight='bold' >+ 잴 양(정류·기억)과 조건</text>
<rect x='710' y='62' width='270' height='176' rx='10' fill='#f3eefa' stroke='#7a5aa6' stroke-width='1.6' />
<text x='724' y='90' font-size='15' fill='#7a5aa6' text-anchor='start' font-weight='bold' >③ 가설 (틀릴 수 있게)</text>
<text x='724' y='122' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >고정 전하를 바깥 염의 몇 배로 설계한</text>
<text x='724' y='149' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >접합은 150 mM에서도 정류비를</text>
<text x='724' y='176' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >10 mM 값의 절반 이상 유지한다.</text>
<text x='724' y='203' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >왜: Donnan 배제 = 고정 전하 ÷ 바깥 염</text>
<rect x='730' y='252' width='230' height='30' rx='15' fill='#fff' stroke='#7a5aa6' stroke-width='1.2' />
<text x='845.0' y='272' font-size='13.5' fill='#7a5aa6' text-anchor='middle' font-weight='bold' >+ 방향 + 메커니즘 + 숫자</text>
<line x1='294' y1='150.0' x2='361' y2='150.0' stroke='#444' stroke-width='2' marker-end='url(#arr)'/>
<text x='327.5' y='140.0' font-size='13' fill='#444' text-anchor='middle' font-weight='normal' >질문으로</text>
<line x1='639' y1='150.0' x2='706' y2='150.0' stroke='#444' stroke-width='2' marker-end='url(#arr)'/>
<text x='672.5' y='140.0' font-size='13' fill='#444' text-anchor='middle' font-weight='normal' >가설로</text>
<rect x='710' y='304' width='270' height='52' rx='8' fill='#fbeeea' stroke='#c8553d' stroke-width='1.2' />
<text x='724' y='326' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='bold' >틀렸다면: 고정 전하를 늘려도</text>
<text x='724' y='346' font-size='13.5' fill='#c8553d' text-anchor='start' font-weight='bold' >150 mM에서 정류비 ≈ 1 → 반증 가능</text>
<text x='20' y='326' font-size='13.5' fill='#444' text-anchor='start' font-weight='normal' >가설에서만 '무엇을 바꾸면 무엇이, 왜'가 생긴다.</text>
<text x='20' y='346' font-size='13.5' fill='#999' text-anchor='start' font-weight='normal' >숫자(몇 배, 절반)는 방법을 보이는 예시다.</text>
</svg>
